<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Zoom Background</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100vw;height:100vh;overflow:hidden;}
  body{
    background: linear-gradient(135deg, #F4F1EE 0%, #E8E0D5 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: 'Poppins', -apple-system, sans-serif;
    position:relative;
  }
  .deco-1{
    position:absolute;
    top:-200px;
    right:-200px;
    width:600px;
    height:600px;
    background: radial-gradient(circle, rgba(82,183,136,0.15) 0%, transparent 70%);
    border-radius:50%;
  }
  .deco-2{
    position:absolute;
    bottom:-300px;
    left:-300px;
    width:800px;
    height:800px;
    background: radial-gradient(circle, rgba(140,123,128,0.12) 0%, transparent 70%);
    border-radius:50%;
  }
  .corner{
    position:absolute;
    bottom:60px;
    left:60px;
    display:flex;
    align-items:center;
    gap:18px;
    z-index:2;
  }
  .corner img{
    height:64px;
    width:auto;
  }
  .corner-text{
    border-left:2px solid rgba(140,123,128,0.4);
    padding-left:18px;
    line-height:1.3;
  }
  .corner-name{
    font-size:18px;
    font-weight:700;
    color:#2D2A28;
    letter-spacing:-0.01em;
  }
  .corner-role{
    font-size:13px;
    color:#8C7B80;
    font-weight:500;
    margin-top:2px;
    letter-spacing:.02em;
  }
  .url{
    position:absolute;
    bottom:60px;
    right:60px;
    font-size:13px;
    color:#8C7B80;
    font-weight:600;
    letter-spacing:.05em;
    z-index:2;
  }
</style>
</head>
<body>
  <div class="deco-1"></div>
  <div class="deco-2"></div>

  <div class="corner">
    <img src="logo-horizontal.png" alt="Pathway">
    <div class="corner-text">
      <div class="corner-name">Micaela Jairedin</div>
      <div class="corner-role">Career Coach</div>
    </div>
  </div>

  <div class="url">pathwaycareercoach.com</div>
</body>
</html>
