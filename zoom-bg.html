<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Zoom Background</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100vw;height:100vh;overflow:hidden;}
  body{
    background: #FFFFFF;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: 'Poppins', -apple-system, sans-serif;
    position:relative;
  }

  /* Líneas decorativas sutiles para que no quede plano */
  .deco{
    position:absolute;
    border-radius:50%;
    pointer-events:none;
  }
  .deco-1{
    top:-300px;
    right:-300px;
    width:700px;
    height:700px;
    background: radial-gradient(circle, rgba(82,183,136,0.08) 0%, transparent 70%);
  }
  .deco-2{
    bottom:-400px;
    left:-400px;
    width:900px;
    height:900px;
    background: radial-gradient(circle, rgba(140,123,128,0.05) 0%, transparent 70%);
  }

  /* Branding esquina inferior izquierda */
  .corner{
    position:absolute;
    bottom:60px;
    left:60px;
    display:flex;
    align-items:center;
    gap:18px;
    z-index:2;
  }
  .corner img{
    height:56px;
    width:auto;
  }
  .corner-text{
    border-left:2px solid rgba(140,123,128,0.3);
    padding-left:18px;
    line-height:1.3;
  }
  .corner-name{
    font-size:17px;
    font-weight:700;
    color:#2D2A28;
    letter-spacing:-0.01em;
  }
  .corner-role{
    font-size:12px;
    color:#8C7B80;
    font-weight:500;
    margin-top:3px;
    letter-spacing:.04em;
    text-transform:uppercase;
  }

  /* URL esquina inferior derecha */
  .url{
    position:absolute;
    bottom:60px;
    right:60px;
    font-size:13px;
    color:#8C7B80;
    font-weight:600;
    letter-spacing:.05em;
    z-index:2;
  }
</style>
</head>
<body>
  <div class="deco deco-1"></div>
  <div class="deco deco-2"></div>

  <div class="corner">
    <img src="logo-horizontal.png" alt="Pathway">
    <div class="corner-text">
      <div class="corner-name">Micaela Jairedin</div>
      <div class="corner-role">Career Coach</div>
    </div>
  </div>

  <div class="url">pathwaycareercoach.com</div>
</body>
</html>
