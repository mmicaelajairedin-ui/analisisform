<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reserva tu sesión · Pathway</title>
<link rel="icon" href="/favicon-app.svg?v=6" type="image/svg+xml">
<meta name="theme-color" content="#2D6A4F">
<meta name="robots" content="noindex">
<!-- Observabilidad: registra en client_errors los guardados que fallan (POST a
     citas / send-email). Antes una reserva que no se guardaba era invisible;
     ahora queda el rastro para diagnosticar "no le llegó / no se agendó". -->
<script src="/pw-observe.js"></script>
<!-- Event bus del Pathway OS (define window.pwEmit; inerte hasta que se llama). -->
<script src="/pw-events.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bosque:#1B4332; --bosque2:#2D6A4F; --sendero:#52B788; --carbon:#1B2E26;
    --niebla:#FAFDF9; --niebla2:#F0F5EF; --soft:#5A6A60; --muted:#9AA8A0;
    --borde:rgba(45,106,79,.14); --serif:'Fraunces',Georgia,serif; --sans:'Inter',-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--sans);background:
    radial-gradient(120% 60% at 50% 0%, #EEF6EE 0%, var(--niebla) 55%) no-repeat, var(--niebla);
    color:var(--carbon);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:26px 16px 70px;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:470px;width:100%;}
  /* Desktop: tarjeta horizontal (info a la izquierda, reserva a la derecha).
     Móvil: apilado vertical (lo de siempre). */
  @media(min-width:760px){ .wrap{max-width:980px;} }
  /* Pantallas simples (cargando / gracias / error) quedan angostas y centradas */
  .card:not(.book-card){max-width:480px;margin-left:auto;margin-right:auto;}
  .brand{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px;}
  .brand svg{width:28px;height:28px;}
  .brand-word{font-family:var(--serif);font-size:23px;font-weight:600;color:var(--carbon);letter-spacing:-.5px;}
  .card{background:#fff;border:1px solid var(--borde);border-radius:20px;box-shadow:0 14px 46px rgba(20,55,38,.09);padding:0 0 18px;overflow:hidden;display:flex;flex-direction:column;}
  .card.two-col{padding:0;}
  .hd{background:linear-gradient(160deg,#2D6A4F 0%,#1B4332 100%);padding:22px 20px;text-align:center;color:#fff;position:relative;}
  .hd .av{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.9);box-shadow:0 6px 20px rgba(0,0,0,.18);margin:0 auto 11px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;background:#3C7A5C;color:#fff;font-family:var(--serif);}
  .hd h1{font-family:var(--serif);font-size:22px;font-weight:500;letter-spacing:-.4px;line-height:1.15;}
  /* Bloque de dudas dentro del panel verde (no queda la foto sola) */
  .hd .help{margin:16px 0 0;padding:15px 0 0;border:none;border-top:1px solid rgba(255,255,255,.22);border-radius:0;background:transparent;text-align:left;}
  .hd .help h4{color:#fff;font-size:13px;font-weight:700;margin-bottom:4px;}
  .hd .help p{color:rgba(255,255,255,.82);font-size:11.5px;line-height:1.45;margin-bottom:10px;}
  .hd .help-btns{flex-direction:column;gap:7px;}
  .hd .help-btns a{width:100%;min-width:0;}
  .hd .hb-ghost{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.32);color:#fff;}
  .hd .hb-ghost:hover{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.55);}
  .hd .hb-green{background:#fff;color:var(--bosque);}
  .hd .hb-green:hover{background:#eef5ef;}
  .hd .type-pill{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.16);backdrop-filter:blur(4px);border-radius:100px;padding:5px 12px;font-size:12px;font-weight:600;margin-top:10px;}
  .hd .type-pill .cdot{width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.22);}
  .body{padding:18px 22px 0;}
  .lbl{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;display:flex;align-items:center;gap:6px;}
  .lbl:first-child{margin-top:2px;}
  .days{display:flex;gap:8px;overflow-x:auto;padding-bottom:5px;scrollbar-width:thin;}
  .day{flex-shrink:0;width:56px;height:54px;border:1.5px solid var(--borde);border-radius:13px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;transition:all .13s;}
  .day:hover{border-color:var(--sendero);transform:translateY(-2px);}
  .day.on{background:var(--bosque);border-color:var(--bosque);color:#fff;box-shadow:0 6px 16px rgba(27,67,50,.24);}
  .day .dn{font-size:9px;text-transform:uppercase;letter-spacing:.3px;opacity:.65;font-weight:700;}
  .day .dd{font-size:18px;font-weight:700;line-height:1.1;}
  .day .dm{font-size:8.5px;text-transform:uppercase;letter-spacing:.3px;font-weight:700;opacity:.6;}
  .slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .slot{border:1.5px solid var(--borde);border-radius:10px;background:#fff;padding:9px 4px;font-size:13px;font-weight:600;cursor:pointer;transition:all .13s;color:var(--carbon);font-family:inherit;}
  .slot:hover{border-color:var(--sendero);}
  .slot.on{background:var(--bosque);border-color:var(--bosque);color:#fff;box-shadow:0 6px 16px rgba(27,67,50,.2);}
  .more{grid-column:1/-1;text-align:center;background:none;border:none;color:var(--bosque2);font-size:12.5px;font-weight:700;cursor:pointer;padding:8px;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:5px;}
  .more:hover{text-decoration:underline;}
  .field{margin-bottom:7px;}
  .field label{display:block;font-size:12px;font-weight:600;margin-bottom:3px;color:var(--carbon);}
  .field input{width:100%;padding:8px 11px;border:1.5px solid var(--borde);border-radius:10px;font-size:13.5px;font-family:inherit;outline:none;transition:border-color .13s;background:var(--niebla);}
  .field input:focus{border-color:var(--sendero);background:#fff;}
  .field select{width:100%;padding:8px 11px;border:1.5px solid var(--borde);border-radius:10px;font-size:13.5px;font-family:inherit;outline:none;transition:border-color .13s;background:var(--niebla);color:var(--carbon);cursor:pointer;}
  .field select:focus{border-color:var(--sendero);background:#fff;}
  /* Preguntas personalizadas del coach (armadas por cada coach en su panel). */
  .qfield{margin-top:11px;}
  .qlab{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:var(--carbon);line-height:1.4;}
  .qlab .req{color:#C0756E;}
  .qfield textarea{width:100%;padding:8px 11px;border:1.5px solid var(--borde);border-radius:10px;font-size:13.5px;font-family:inherit;outline:none;background:var(--niebla);resize:vertical;min-height:56px;box-sizing:border-box;}
  .qfield textarea:focus{border-color:var(--sendero);background:#fff;}
  .qradios{display:flex;flex-direction:column;gap:6px;}
  .qradio{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--carbon);border:1.5px solid var(--borde);border-radius:10px;padding:8px 11px;background:var(--niebla);cursor:pointer;transition:border-color .13s,background .13s;}
  .qradio:has(input:checked){border-color:var(--sendero);background:rgba(82,183,136,.12);font-weight:600;}
  .qradio input{width:16px;height:16px;accent-color:var(--sendero);flex-shrink:0;margin:0;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:11px 16px;border-radius:11px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;border:none;text-decoration:none;transition:all .16s;}
  .btn-primary{background:var(--bosque);color:#fff;margin-top:6px;box-shadow:0 8px 22px rgba(27,67,50,.22);}
  .btn-primary:hover{background:#153726;transform:translateY(-1px);}
  .btn-primary:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none;}
  .msg{font-size:13px;margin-top:10px;text-align:center;color:#C0756E;min-height:16px;font-weight:600;}
  .help{margin:14px 22px 4px;padding:12px 15px;border:1px dashed var(--borde);border-radius:13px;background:var(--niebla2);}
  .help h4{font-size:13px;font-weight:700;margin-bottom:3px;color:var(--carbon);}
  .help p{font-size:12px;color:var(--soft);line-height:1.45;margin-bottom:9px;}
  .help-btns{display:flex;gap:9px;flex-wrap:wrap;}
  .help-btns a{flex:1;min-width:130px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 12px;border-radius:11px;font-size:13px;font-weight:600;text-decoration:none;transition:all .13s;}
  .hb-ghost{background:#fff;border:1.5px solid var(--borde);color:var(--carbon);}
  .hb-ghost:hover{border-color:var(--sendero);}
  .hb-green{background:var(--bosque2);color:#fff;}
  .hb-green:hover{background:var(--bosque);}
  .who-row{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:4px;}
  .who-pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--borde);border-radius:100px;padding:5px 13px 5px 5px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--carbon);transition:all .13s;}
  .who-pill:hover{border-color:var(--sendero);}
  .who-pill.on{border-color:var(--bosque);background:var(--niebla2);box-shadow:0 0 0 1px var(--bosque);}
  .foot{text-align:center;font-size:11px;color:var(--muted);margin-top:14px;}
  .ok-ico{width:64px;height:64px;border-radius:50%;background:rgba(82,183,136,.16);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 16px;}
  .spin{width:28px;height:28px;border:3px solid rgba(45,106,79,.2);border-top-color:var(--bosque2);border-radius:50%;animation:s .8s linear infinite;margin:40px auto;}
  @keyframes s{to{transform:rotate(360deg)}}
  .center{text-align:center;padding:34px 26px;}
  .center h1{font-family:var(--serif);font-size:24px;font-weight:500;margin-bottom:8px;}
  .center .sub{font-size:13.5px;color:var(--soft);line-height:1.6;}
  .center .hint{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.5;}
  /* ===== Diseño reserva: info (blanco) · reserva ===== */
  .card.book-card{padding:0;display:block;}
  .book{display:grid;grid-template-columns:344px 1fr;}
  /* Col izquierda: info (blanca) */
  .bk-people{background:var(--niebla);padding:24px 22px;border-right:1px solid var(--borde);display:flex;flex-direction:column;}
  .bk-people .t{font-size:15px;font-weight:700;line-height:1.25;margin-bottom:3px;color:var(--carbon);}
  .bk-people .s{font-size:12px;color:var(--soft);margin-bottom:15px;line-height:1.4;}
  .pcard{display:flex;align-items:center;gap:11px;background:#fff;border:1.5px solid var(--borde);border-radius:14px;padding:11px 12px;margin-bottom:9px;cursor:pointer;transition:all .13s;text-align:left;width:100%;font-family:inherit;color:var(--carbon);}
  .pcard:hover{border-color:var(--sendero);}
  .pcard.on{border-color:var(--bosque2);background:#F3F9F4;box-shadow:0 0 0 1px var(--bosque2);}
  .pcard .pradio{width:18px;height:18px;border-radius:50%;border:2px solid var(--borde);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .pcard.on .pradio{border-color:var(--bosque2);}
  .pcard.on .pradio::after{content:'';width:9px;height:9px;border-radius:50%;background:var(--bosque2);}
  .pcard img,.pcard .pini{width:46px;height:46px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#3C7A5C;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--serif);font-size:18px;}
  .pcard .pn{font-size:13.5px;font-weight:700;line-height:1.15;color:var(--carbon);}
  .pcard .pr{font-size:11px;color:var(--bosque2);font-weight:600;margin-top:1px;}
  .pcard .pmeta{font-size:10.5px;color:var(--muted);margin-top:2px;}
  .pcard .pstars{color:#E5A93C;font-size:10px;letter-spacing:.5px;}
  .pcard .pstars b{color:var(--soft);font-weight:700;margin-left:3px;}
  .pcard .pbadge{display:inline-block;font-size:9.5px;font-weight:700;color:var(--bosque2);background:rgba(82,183,136,.15);border-radius:20px;padding:2px 8px;margin-top:6px;}
  .bk-learn{margin-top:17px;}
  .bk-learn h5{font-size:12.5px;font-weight:700;margin-bottom:9px;color:var(--carbon);}
  .bk-learn ul{list-style:none;}
  .bk-learn li{font-size:12px;color:var(--soft);margin-bottom:7px;display:flex;gap:8px;align-items:flex-start;line-height:1.35;}
  .bk-learn li .ck{color:var(--sendero);font-weight:800;flex-shrink:0;}
  .bk-mock{display:flex;gap:11px;align-items:center;background:#fff;border:1px solid var(--borde);border-radius:13px;padding:11px;margin-top:17px;}
  .bk-mock .mk-img{width:66px;height:48px;border-radius:8px;background:linear-gradient(135deg,#2D6A4F,#1B4332);flex-shrink:0;position:relative;overflow:hidden;box-shadow:inset 0 0 0 3px rgba(255,255,255,.12);}
  .bk-mock .mk-img::before{content:'';position:absolute;left:6px;top:7px;right:22px;height:4px;border-radius:2px;background:rgba(255,255,255,.5);box-shadow:0 8px 0 rgba(255,255,255,.28),0 16px 0 rgba(255,255,255,.28);}
  .bk-mock .mk-img::after{content:'';position:absolute;right:6px;top:7px;width:11px;bottom:7px;border-radius:3px;background:rgba(82,183,136,.6);}
  .bk-mock .mk-t{font-size:11.5px;font-weight:700;color:var(--carbon);line-height:1.2;}
  .bk-mock .mk-s{font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.3;}
  .bk-proof{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:16px;}
  .bk-proof .av-row{display:flex;}
  .bk-proof .av-row span{width:26px;height:26px;border-radius:50%;border:2px solid var(--niebla);background:#3C7A5C;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-left:-8px;font-family:var(--serif);}
  .bk-proof .av-row span:first-child{margin-left:0;}
  .bk-proof .pt{font-size:11px;color:var(--soft);line-height:1.35;}
  .bk-proof .pt b{color:var(--carbon);}
  .bk-proof .stars{color:#E5A93C;font-size:11px;}
  .bk-icons{display:flex;gap:9px;margin-top:15px;}
  .bk-icons a{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--borde);background:#fff;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;transition:all .13s;color:var(--bosque2);font-size:15px;}
  .bk-icons a:hover{border-color:var(--sendero);background:#fff;transform:translateY(-1px);}
  .bk-icons svg{width:16px;height:16px;fill:var(--bosque2);}
  /* Datos de la sesión (duración · formato · precio) en la columna izquierda,
     para que la columna derecha (el flujo de reserva) no quede tan apretada. */
  .bk-about{margin-top:16px;background:#fff;border:1px solid var(--borde);border-radius:13px;padding:13px 15px;display:flex;flex-direction:column;gap:10px;}
  .bk-about-row{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--soft);line-height:1.3;}
  .bk-about-row .ico{font-size:15px;flex-shrink:0;line-height:1;}
  .bk-about-row b{color:var(--carbon);font-weight:700;}
  /* Col derecha: reserva */
  .bk-main{padding:24px 30px 26px;min-width:0;}
  .bk-steps2{display:flex;align-items:flex-start;margin-bottom:18px;}
  .bk-steps2 .stp{display:flex;flex-direction:column;align-items:center;flex-shrink:0;text-align:center;width:74px;}
  .bk-steps2 .num{width:23px;height:23px;border-radius:50%;background:#E4ECE7;color:var(--muted);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .bk-steps2 .stp.on .num{background:var(--bosque2);color:#fff;}
  .bk-steps2 .lab{font-size:11px;font-weight:700;color:var(--carbon);margin-top:6px;}
  .bk-steps2 .stp:not(.on) .lab{color:var(--muted);}
  .bk-steps2 .sub{font-size:9.5px;color:var(--muted);margin-top:1px;}
  .bk-steps2 .line{flex:1;height:2px;background:#E4ECE7;margin-top:13px;}
  .bk-main h2{font-family:var(--serif);font-size:21px;font-weight:500;line-height:1.16;margin-bottom:12px;letter-spacing:-.4px;}
  .bk-form2{display:grid;grid-template-columns:1fr 1fr;gap:11px 12px;}
  .bk-form2 .full{grid-column:1/-1;}
  .bk-secure{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11.5px;color:var(--muted);margin-top:8px;}
  @media(max-width:820px){ .book{grid-template-columns:1fr;} .bk-people{border-right:none;border-bottom:1px solid var(--borde);} .bk-form2{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="36.2,35.2 52.8,54.3 52.8,81.8 7.4,81.8" fill="#215C44"/><polygon points="67.9,45.8 92.6,81.8 43.1,81.8" fill="#267A54"/><circle cx="75.4" cy="27.8" r="10.3" fill="#F8CA45"/></svg><span class="brand-word">pathway<span style="color:#52B788">.</span></span></div>
  <div class="card" id="card"><div class="spin"></div></div>
  <div class="foot">Reservas con Pathway · pathwaycareercoach.com</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
var SB='https://api.pathwaycareercoach.com';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkeG5yc25qZHZ0cWh4dW54bndqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNDk5MzksImV4cCI6MjA5MDcyNTkzOX0.t82X1x-PDgFDGYhKC7YXoRKhga9I8Hjet60QUYvtZLU';

function qp(k){ try{ return new URLSearchParams(location.search).get(k); }catch(e){ return null; } }

// ── Idioma ES/EN ─────────────────────────────────────────────────────────────
// La página de reservas la abren clientes/leads que pueden ser de habla inglesa.

  LANG=(_ql==='en'||_ql==='es')?_ql:(_sl==='en'||_sl==='es'?_sl:(_nl==='es'?'es':'en'));
  if(_ql==='en'||_ql==='es'){ try{ localStorage.setItem('pw_lang',LANG); }catch(e){} }
}catch(e){ LANG='es'; }
if(LANG!=='en') LANG='es';
try{ document.documentElement.lang=LANG; }catch(e){}
var T={
  es:{
    foot:'Reservas con Pathway · pathwaycareercoach.com',
    minVideo:'{n} minutos de videollamada', online:'Online, por videollamada', gratis:'Totalmente gratis',
    elegirQuien:'Elige con quién quieres hablar', reservaCon:'Reserva con {name}',
    subMulti:'Cada especialista puede ayudarte desde su experiencia.', subSingle:'Elige el día y la hora que te queden bien.',

    disponibilidad:'Disponibilidad', sinHorarios:'No hay horarios que te queden bien en tu zona por ahora. Escríbele a {name} y coordinan uno directamente.', escribirWA:'Escribir por WhatsApp',
    elegirDia:'Elige el día', elegirHorario:'Elige el horario', tusDatos:'Cuéntanos tus datos',
    phName:'Nombre y apellido', phEmail:'Tu email', phTel:'WhatsApp (opcional, para el recordatorio)',

function slotList(){
  var out=[], disp=DISP||{from:'09:00',to:'18:00'};
  var f=_hm(disp.from||'09:00'), t=_hm(disp.to||'18:00'), step=Math.max(DUR,15);
  // "Hasta 00:00" (medianoche) o una franja que cruza la medianoche: la hora de
  // fin es menor o igual que la de inicio → tratarla como fin del día (+24 h),
  // si no el bucle no genera ningún horario y la página sale vacía.
  if(t<=f) t+=1440;
  for(var m=f; m+DUR<=t; m+=step){ var mm=m%1440; out.push(('0'+Math.floor(mm/60)).slice(-2)+':'+('0'+(mm%60)).slice(-2)); }
  return out;
}

// UTC (con Z): así el evento de Google del coach cae en el MISMO instante que se
// guarda en `citas` (start.toISOString()). Sin la Z, Google lo interpretaba en la
// zona del coach y el evento quedaba corrido respecto de la reserva.
function fmt(x){ function p(n){return('0'+n).slice(-2);} return x.getUTCFullYear()+p(x.getUTCMonth()+1)+p(x.getUTCDate())+'T'+p(x.getUTCHours())+p(x.getUTCMinutes())+'00Z'; }
function fechaLinda(x){ return x.toLocaleDateString(_langLoc(),{weekday:'long',day:'numeric',month:'long'})+' · '+('0'+x.getHours()).slice(-2)+':'+('0'+x.getMinutes()).slice(-2)+' h'; }
// Nombre corto de una zona ("America/Argentina/Buenos_Aires" → "Buenos Aires").
function _tzShort(tz){ try{ return (''+(tz||'')).split('/').pop().replace(/_/g,' '); }catch(e){ return ''+(tz||''); } }
// Fecha+hora de un instante EN una zona concreta (para mostrarle a cada uno SU
// hora, no la del otro). Evita el clásico "el cliente cree que es a las 21 y el
// coach a las 9" cuando están en zonas distintas.
function fechaEnTz(x,tz){
  if(!tz) return fechaLinda(x);
  try{
    // Fecha en español + hora en AM/PM (inequívoca): "lunes 27 de julio · 1:00 PM".
    var f=new Intl.DateTimeFormat(_langLoc(),{timeZone:tz,weekday:'long',day:'numeric',month:'long'});
    var t=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'numeric',minute:'2-digit',hour12:true});
    return f.format(x)+' · '+t.format(x);
  }catch(e){ return fechaLinda(x); }
}

// Render de las preguntas que armó el coach (cero por defecto: si no cargó
// ninguna, no se muestra nada). Tipos: corto, largo, opciones (radios), tel.
function qFields(){
  var qs=(TYPE && Object.prototype.toString.call(TYPE.questions)==='[object Array]')?TYPE.questions:[];
  if(!qs.length) return '';
  return qs.map(function(q,i){
    var req=q.req?" <span class='req'>*</span>":"";
    var lab="<label class='qlab'>"+esc(q.q||'')+req+"</label>";
    var t=q.type||'corto', bodyH='';
    if(t==='largo') bodyH="<textarea id='q-"+i+"'></textarea>";
    else if(t==='opciones'){ var opts=(Object.prototype.toString.call(q.opts)==='[object Array]'?q.opts:[]);
      bodyH="<div class='qradios'>"+opts.map(function(o){ return "<label class='qradio'><input type='radio' name='q-"+i+"' value=\""+esc(o)+"\"><span>"+esc(o)+"</span></label>"; }).join("")+"</div>";
    }
    else bodyH="<input id='q-"+i+"' type='"+(t==='tel'?'tel':'text')+"'>";
    return "<div class='qfield'>"+lab+bodyH+"</div>";
  }).join("");
}
// Junta las respuestas y valida las obligatorias. Devuelve {answers:[{q,a}], missing}.
function collectAnswers(){
  var qs=(TYPE && Object.prototype.toString.call(TYPE.questions)==='[object Array]')?TYPE.questions:[];
  var out=[], missing=null;
  for(var i=0;i<qs.length;i++){ var q=qs[i], t=q.type||'corto', a='';
    if(t==='opciones'){ var s=document.querySelector('input[name="q-'+i+'"]:checked'); a=s?s.value:''; }
    else { var el=$('q-'+i); a=el?(''+el.value).trim():''; }
    if(q.req && !a && missing===null) missing=(q.q||('Pregunta '+(i+1)));
    if(a) out.push({q:(q.q||('Pregunta '+(i+1))), a:a});
  }
  return {answers:out, missing:missing};
}
function confirmar(){
  var name=($('f-name').value||'').trim(), email=($('f-email').value||'').trim().toLowerCase();
  var tel=($('f-tel')&&$('f-tel').value||'').trim();
  var origen='';
  var confirmBtn=$('confirm');
  // La reserva se guarda con la zona ELEGIDA en el selector (VIEWER_TZ), no la del
  // dispositivo — así si el visitante corrigió su zona, queda la correcta.
  var vtz=VIEWER_TZ||''; try{ if(!vtz) vtz=Intl.DateTimeFormat().resolvedOptions().timeZone||''; }catch(e){}
  if(!name){ $('msg').textContent=t('valNombre'); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ $('msg').textContent=t('valEmail'); return; }
  if(sel.ms==null){ $('msg').textContent=t('valDiaHora'); return; }
  // MEDIO FIX: Deshabilitar botón ANTES de enviar para prevenir doble-submit
  if(confirmBtn) confirmBtn.disabled=true;
  var start=new Date(sel.ms);
  var end=new Date(start.getTime()+DUR*60000);
  // Preguntas del coach: validamos obligatorias y armamos las respuestas.
  var _qa=collectAnswers();
  if(_qa.missing){
    $('msg').textContent=tf('valFalta',{q:_qa.missing});
    if(confirmBtn) confirmBtn.disabled=false;
    return;
  }
  var answers=_qa.answers;
  var answersJson=answers.length?JSON.stringify(answers):'';
  var answersTxt=answers.map(function(x){ return x.q+': '+x.a; }).join('\n');
  // Atribución de canal SIN pregunta fija del sistema: si el coach agregó una
  // pregunta del estilo "de dónde nos conocés / cómo me encontraste", usamos su
  // respuesta como 'origen' para que las Métricas ("Por dónde llegan") sigan
  // funcionando. Si no la agregó, origen queda vacío (sin default impuesto).
  answers.forEach(function(x){ if(!origen && /d[oó]nde.*conoc|c[oó]mo.*(encontr|lleg|conoc)|how did you (find|hear)/i.test(x.q||'')) origen=x.a; });
  var tlabel=TYPE.label||(LANG==='en'?'Session':'Sesión');
  // Cada uno ve SU hora (no la del otro). fechaCli = hora local de quien reserva;
  // fechaCoach = misma reunión en la zona del coach. Si las zonas difieren, cada
  // email muestra también la hora del otro, con la ciudad, para que nadie se
  // confunda (evita "el cliente cree las 21 y el coach las 9").
  var _coTz=_coachTz(), fechaCli=fechaEnTz(start,vtz), fechaCoach=fechaEnTz(start,_coTz);
  var _F={ cli:fechaCli, coach:fechaCoach, cliTz:_tzShort(vtz), coTz:_tzShort(_coTz), diff:(!!_coTz && !!vtz && _coTz!==vtz) };
  var fechaTxt=fechaCli;
  var title=tlabel+' · '+name+' con '+FIRST;
  // Link determinista a la Sala de Pathway (sala.html): mismo room que en el panel del coach.
  // Patrón: Pathway-<coach_id>-<start_ms>. Coach y cliente entran a la MISMA sala.
  // Cliente también recibe start/dur para el gate (cuenta regresiva, ya terminó, abre 5 min antes).
  var _coachId=(CID||qp('c')||'');
  var _startMs=start.getTime();
  var _dur=(DUR||60); // minutos (default 60 si no está configurado)
  var _room=(_coachId?'Pathway-'+_coachId+'-'+_startMs:'');
  var _link=''; // JULIO 2026: usar solo Google Meet (auto-generado), no sala.html
  var _kind=((CUR&&/^(admin|empleado)$/.test(String(CUR.rol||"")))||TEAM)?'demo_pathway':'primera_llamada';
  // render?action=TEMPLATE (no /r/eventedit): así Google SÍ pre-carga el link en el
  // detalle ANTES de guardar (location + description). El link va PRIMERO en el
  // detalle para que se vea claro.
  var gurl='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+
    '&dates='+fmt(start)+'/'+fmt(end)+'&location='+encodeURIComponent(_link)+'&details='+encodeURIComponent((LANG==='en'?'Join the video call with this link:\n':'Entra a la videollamada por este link:\n')+_link+(LANG==='en'?'\n\nBooked via Pathway · ':'\n\nReserva desde Pathway · ')+name+(answersTxt?('\n\n'+answersTxt):''));
  // OJO: NO agregamos '&add=' (no invitamos a nadie). Si invitáramos, Google le
  // mandaría un email de invitación que puede traer su Meet automático → dos links.
  // Cada persona agrega el evento a SU propio calendario al tocar el botón.

  var _cid=(CID||qp('c')), _iso=start.toISOString();
  // Token único de la reserva → link para cancelar/reprogramar (va en el email).
  var _tk=_tok(), _manage=location.origin+'/gestionar-cita.html?t='+_tk;
  // Invitación de calendario (.ics) con SOLO nuestro link (sin Meet de Google).
  var _ics=_icsBuild(title, +start, +end, _link, _tk);
  // Guarda la cita. Reintenta SIN 'respuestas' si esa columna todavía no existe
  // en la base (así la reserva nunca se pierde por falta de la migración).
  var _postCita=function(withResp){
    var b={ coach_id:_cid, nombre:name, email:email, tipo:tlabel, inicio:_iso, telefono:tel, cliente_tz:vtz, token:_tk, origen:origen };
    // Idioma del cliente → así el RECORDATORIO automático (que se manda después,
    // del lado servidor) sale en el mismo idioma que la reserva. Va con 'withResp'
    // para que, si la columna citas.lang aún no existe, el reintento la omita.
    if(withResp) b.lang=LANG;
    if(withResp && answersJson) b.respuestas=answersJson;
    // kind viaja con el reintento 'withResp': si la columna citas.kind todavía no
    // existe en la base, el reintento (withResp=false) la omite → la reserva nunca se pierde.
    if(withResp) b.kind=_kind;
    return fetch(SB+'/rest/v1/citas',{ method:'POST', headers:{ apikey:KEY, Authorization:'Bearer '+KEY, 'content-type':'application/json', Prefer:'return=representation' }, body:JSON.stringify(b) })
      .then(function(r){ if(r && !r.ok && withResp) return _postCita(false); return r; })
      .catch(function(){ if(withResp) return _postCita(false); });
  };
  var _commit=function(){
    // 1) Guarda la cita y ESPERA el resultado. Antes era fire-and-forget: si el
    //    INSERT fallaba (red, body raro), igual salía "¡Reserva enviada!" sin fila
    //    en la base → no aparecía en el panel, sin recordatorios. Ahora se verifica
    //    (_postCita ya reintenta una vez) y se avisa suave si no quedó guardada.
    var _finish=function(saved, citaId){
      // CAMBIO CRÍTICO: marcar slot como tomado INMEDIATAMENTE (no esperar confirmación)
      // para prevenir que otro cliente lo reserve en la ventana de latencia
      TAKEN[start.getTime()]=true;
      // Obtener Zoom link del coach, sino Google Meet
      var _sendEmail=function(link){
        sendEmails(name, email, tlabel, _F, gurl, _manage, origen, answers, link||'', _ics.b64);
      };
      if(saved && citaId){
        // Fallback: Pathway white-label video room (deterministic: mismo room coach + cliente)
        var _fallbackSalaUrl = (function(){
          var ms = _iso ? new Date(_iso).getTime() : Date.now();
          var room = "Pathway-" + _cid + "-" + ms;
          return "https://pathwaycareercoach.com/sala.html?room=" + encodeURIComponent(room);
        })();
        // 1) Obtener Zoom link del coach
        fetch(SB+'/rest/v1/usuarios?id=eq.'+encodeURIComponent(_cid)+'&select=configuracion&limit=1',{ headers:{apikey:KEY} })
          .then(function(r){ return r.ok?r.json():[]; })
          .then(function(rows){
            var zoomLink = (Array.isArray(rows) && rows[0] && rows[0].configuracion && rows[0].configuracion.zoom_url) ? rows[0].configuracion.zoom_url : '';
            if(zoomLink){
              _sendEmail(zoomLink); // Usar Zoom link
            } else {
              // 2) Si no hay Zoom, intentar Google Meet
              fetch(SB+'/functions/v1/sync-cita-to-gcal',{ method:'POST', headers:{ 'content-type':'application/json', apikey:KEY, Authorization:'Bearer '+KEY }, body:JSON.stringify({ cita_id:citaId }), timeout:15000 })
                .then(function(r){ return r.ok?r.json():{ok:false}; })
                .then(function(d){
                  var meetLink=(d && d.ok && d.hangoutLink)?d.hangoutLink:'';
                  // 3) Si no hay Google Meet, usar Pathway Sala como fallback garantizado
                  _sendEmail(meetLink || _fallbackSalaUrl);
                })
                .catch(function(err){
                  console.warn('Google Calendar sync falló:', err);
                  _sendEmail(_fallbackSalaUrl); // Fallback a la Sala de Pathway
                  try{ fetch(SB+'/functions/v1/telemetria', { method:'POST', headers:{ 'content-type':'application/json' }, body:JSON.stringify({ kind:'gcal_sync_error', cita_id:citaId, error:String(err) }) }).catch(function(){}); }catch(e){}
                });
            }
          })
          .catch(function(err){
            console.warn('Error obtaining Zoom link:', err);
            _sendEmail(_fallbackSalaUrl); // Fallback a la Sala de Pathway
          });
      } else {
        sendEmails(name, email, tlabel, _F, gurl, _manage, origen, answers, _link, _ics.b64);
      }
      // 1b) Si viene de "reprogramar" (gestionar-cita manda &reprog=<token viejo>),
      //     recién AHORA que la nueva quedó guardada cancelamos la vieja → el cliente
      //     nunca se queda sin turno si abandonaba a mitad.
      // return=representation + verificación + reintento: si la vieja NO se cancela,
      // el cliente quedaba con DOS turnos activos (bloqueaba el slot + recordatorios
      // con el link viejo). return=minimal ocultaba 0 filas escritas.
      try{ var _rp=qp('reprog'); if(saved && _rp){
        var _cancelOld=function(n){ return fetch(SB+'/rest/v1/citas?token=eq.'+encodeURIComponent(_rp),{ method:'PATCH', headers:{ apikey:KEY, Authorization:'Bearer '+KEY, 'content-type':'application/json', Prefer:'return=representation' }, body:JSON.stringify({ estado:'cancelada' }) }).then(function(r){ return r.ok?r.json():[]; }).then(function(a){ if((!a||!a.length)&&n>0) return _cancelOld(n-1); return a; }).catch(function(){ if(n>0) return _cancelOld(n-1); return []; }); };
        _cancelOld(2);
      } }catch(e){}
      // 1c) MARKETPLACE ("busco coach", mp=1): el sistema detecta el email y lo marca
      //     como cliente 'pathway' (comisión) DESDE la reserva — no solo al pagar. Crea
      //     el candidato si no existe (ignore-duplicates) y estampa origen='pathway'
      //     acotado a ESTE coach. Best-effort: si la columna origen no existe, no rompe.
      try{ if(qp('mp')==='1' && email){ var _mpe=(''+email).toLowerCase().trim();
        fetch(SB+'/rest/v1/candidatos',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'content-type':'application/json',Prefer:'return=minimal,resolution=ignore-duplicates'},body:JSON.stringify({email:_mpe,nombre:name,coach_id:_cid,origen:'pathway',activo:false})}).catch(function(){});
        fetch(SB+'/rest/v1/candidatos?email=eq.'+encodeURIComponent(_mpe)+'&coach_id=eq.'+encodeURIComponent(_cid),{method:'PATCH',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'content-type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({origen:'pathway'})}).catch(function(){});
      } }catch(e){}
      // OS Core: se agendó la llamada/sesión (conversión del embudo de llamada).
      // Solo si realmente quedó guardada. Best-effort, nunca frena la confirmación.
      try{ if(saved && window.pwEmit) pwEmit("CallBooked",{dominio:"Coaching",entidad_tipo:"cita",entidad_id:(""+(email||"")).toLowerCase().slice(0,80),payload:{tipo:tlabel,kind:_kind,origen:origen,coach_id:_cid}}); }catch(e){}
      ok(name, start, gurl, saved);
    };
    var _p; try{ _p=_postCita(true); }catch(e){ _p=null; }
    if(_p && _p.then){
      _p.then(function(r){
        var ok=!!(r && r.ok);
        if(ok && r.json){ return r.json().then(function(rows){ var cid=null; if(Array.isArray(rows) && rows[0]) cid=rows[0].id; _finish(true, cid); }).catch(function(){ _finish(true); }); }
        _finish(ok);
      }).catch(function(){ _finish(false); });
    } else { _finish(false); }
  };
  // Re-chequeo anti doble-booking JUSTO antes de confirmar: si el hueco se ocupó
  // recién (otra persona reservó mientras), no confirmamos y pedimos elegir otro.
  $('msg').textContent=t('confirmando');
  fetch(SB+'/rest/v1/citas?coach_id=eq.'+encodeURIComponent(_cid)+'&inicio=eq.'+encodeURIComponent(_iso)+'&estado=neq.cancelada&select=id')
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(ex){
      if(ex && ex.length){
        $('msg').textContent=t('ocupadoJusto');
        TAKEN[start.getTime()]=true;
        sel.ms=null;
        renderPicker();
        if(confirmBtn) confirmBtn.disabled=false;
        return;
      }
      _commit();
    })
    .catch(function(){
      if(confirmBtn) confirmBtn.disabled=false;
      _commit();
    }); // si no pudimos verificar, seguimos best-effort
}

// Token aleatorio para el link de gestionar la cita (cancelar/reprogramar).
function _tok(){ try{ var a=new Uint8Array(16); crypto.getRandomValues(a); return Array.prototype.map.call(a,function(b){return ('0'+b.toString(16)).slice(-2);}).join(''); }catch(e){ return (Date.now().toString(36)+Math.random().toString(36).slice(2,10)); } }
// Invitación de calendario (.ics) — se agrega a CUALQUIER calendario (Google/
// Apple/Outlook) con SOLO nuestro link, SIN el Meet que Google pega solo. Es la
// forma limpia de "agregar al calendario" sin que queden dos links.
function _icsBuild(title, startMs, endMs, link, tk){
  function z(n){ return ('0'+n).slice(-2); }
  function utc(d){ d=new Date(d); return d.getUTCFullYear()+z(d.getUTCMonth()+1)+z(d.getUTCDate())+'T'+z(d.getUTCHours())+z(d.getUTCMinutes())+z(d.getUTCSeconds())+'Z'; }
  function e(s){ return (''+(s||'')).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }
  var raw=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Pathway//Reserva//ES','CALSCALE:GREGORIAN','METHOD:PUBLISH','BEGIN:VEVENT',
    'UID:'+(tk||utc(Date.now()))+'@pathwaycareercoach.com','DTSTAMP:'+utc(Date.now()),'DTSTART:'+utc(startMs),'DTEND:'+utc(endMs),
    'SUMMARY:'+e(title),'DESCRIPTION:'+e(tf('icsDesc',{link:link})),'LOCATION:'+e(link),'END:VEVENT','END:VCALENDAR'].join('\r\n');
  var b64=''; try{ b64=btoa(unescape(encodeURIComponent(raw))); }catch(_e){}
  return { raw:raw, b64:b64, url:'data:text/calendar;charset=utf-8,'+encodeURIComponent(raw) };
}

      '<p style="background:#F0F5EF;border-radius:10px;padding:12px 14px"><span style="font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:#7A8A80;font-weight:700">Cuándo'+(F.diff?' · tu hora ('+esc(F.coTz)+')':'')+'</span><br><strong style="text-transform:capitalize">'+esc(F.coach)+'</strong></p>'+
      _coachCliLine+
      '<p style="font-size:14px">Contacto: <a href="mailto:'+esc(email)+'">'+esc(email)+'</a></p>'+
      (origen?('<p style="font-size:14px">Te encontró por: <strong>'+esc(origen)+'</strong></p>'):'')+
      ((answers&&answers.length)?('<div style="background:#F0F5EF;border-radius:10px;padding:12px 14px;margin:12px 0"><div style="font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:#7A8A80;font-weight:700;margin-bottom:6px">Sus respuestas</div>'+answers.map(function(x){ return '<div style="font-size:13.5px;margin-bottom:7px"><span style="color:#7A8A80">'+esc(x.q)+':</span> <strong>'+esc(x.a)+'</strong></div>'; }).join('')+'</div>'):'')+
      (joinLink?'<a href="'+esc(joinLink)+'" style="display:inline-block;background:#1B4332;color:#fff;text-decoration:none;padding:12px 22px;border-radius:10px;font-weight:700;font-size:14px;margin:6px 8px 0 0">Entrar a la videollamada</a>':'<p style="font-size:13.5px;color:#7A968E;margin:6px 0"><strong>Google Meet:</strong> el link se generará cuando agreges esta cita a tu Google Calendar.</p>')+
      '<a href="'+esc(gurl)+'" style="display:inline-block;background:#fff;color:#1B4332;border:1.5px solid #CFE3D4;text-decoration:none;padding:11px 20px;border-radius:10px;font-weight:700;font-size:13.5px;margin:6px 0 0">📅 Agregar a Google Calendar</a>'+
      '<p style="font-size:13px;color:#5A6A60;margin-top:14px">Se abre Google, guardás y listo. También la ves en tu agenda del panel.</p>';
    postEmail({ to:EMAIL, to_name:COACH, subject:'📅 Nueva reserva de '+name, html:htmlCoach, reply_to:email, signature:'pathway', attachment:(icsB64?[{content:icsB64, name:'sesion.ics'}]:undefined) });
  }
}
function postEmail(payload){
  try{
    // MEJORA: agregar reintento si falla, y logar el error
    var _retryEmail=function(n){
      fetch(SB+'/functions/v1/send-email',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) })
        .then(function(r){ if(!r.ok) throw new Error('send-email status '+r.status); })
        .catch(function(err){
          console.warn('Email falló (intento '+(3-n+1)+'/3):', payload.to, err);
          if(n>0) setTimeout(function(){ _retryEmail(n-1); }, 1000);
        });
    };
    _retryEmail(2); // reintenta hasta 3 veces con delay de 1s
  }catch(e){ console.warn('Error iniciando email:', e); }
}

function ok(name, start, gcalUrl, saved){
  $('card').className='card';
  // Si la cita no se pudo registrar (saved=false), el email igual sale, pero avisamos
  // suave para que el cliente reconfirme y no quede una reserva "fantasma".
  var _warnCoach=EMAIL?tf('okWarnCoach',{name:esc(FIRST),email:esc(EMAIL)}):"";
  var _warn=(saved===false)?("<p class='hint' style='color:#B45309;background:#FEF3E2;border:1px solid #F5D9A8;border-radius:10px;padding:9px 12px;margin-top:12px'>"+tf('okWarn',{coach:_warnCoach})+"</p>"):"";
  var _hintCoach=EMAIL?tf('okHintCoach',{name:esc(FIRST),email:esc(EMAIL)}):"";
  $('card').innerHTML=
    "<div class='center'><div class='ok-ico'>🎉</div>"+
    "<h1>"+t('reservaEnviada')+"</h1>"+
    "<p class='sub'>"+tf('elegiste',{fecha:esc(fechaEnTz(start, VIEWER_TZ))})+"</p>"+
    "<a class='btn btn-primary' href='"+esc(gcalUrl)+"' target='_blank' rel='noopener' style='margin-top:20px'>"+t('okAgregar')+"</a>"+
    "<p class='hint'>"+tf('okHint',{coach:_hintCoach})+"</p>"+_warn+"</div>";
}

// Arranque (al FINAL, cuando SAFE_SELECT y todas las funciones ya están definidas).
// ?c=<id> → reservar directo con esa persona. ?team=1 → elegir con quién y reservar.
(function(){
  var c=qp('c'); var typeIdx=parseInt(qp('t'),10); if(isNaN(typeIdx)) typeIdx=-1;
  var team=qp('team');
  try{ loadProof(); }catch(e){}   // prueba social real (coaches que ya usan Pathway)
  // OS Core: llegó a la página de reserva por el CTA de llamada/demo → paso del
  // embudo (intención de agendar). Best-effort; no cuenta reprogramaciones.
  try{ if(window.pwEmit && (c||team) && !qp('reprog')) pwEmit("CallRequested",{dominio:"Commercial",entidad_tipo:"coach",entidad_id:(""+(c||"team")).slice(0,80),payload:{via:qp('mp')==='1'?"marketplace":"link"}}); }catch(e){}
  if(c){ loadCoach(c,typeIdx); return; }
  if(team){ TEAM=true; loadTeam(); return; }
  fail(t('linkInvalido'));
})();
</script>
