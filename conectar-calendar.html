<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conectar Google Calendar · Pathway</title>
<meta name="robots" content="noindex">
<style>
  :root{ --bosque:#2D6A4F; --sendero:#52B788; --carbon:#1B2E26; --niebla:#FAFDF9; --soft:#5A6A60; --borde:rgba(45,106,79,.14); }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,'Segoe UI',Inter,sans-serif;background:var(--niebla);color:var(--carbon);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{background:#fff;border:1px solid var(--borde);border-radius:20px;box-shadow:0 10px 40px rgba(20,55,38,.08);max-width:440px;width:100%;padding:34px 30px;text-align:center;}
  .ico{width:60px;height:60px;border-radius:50%;background:rgba(82,183,136,.14);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 16px;}
  h1{font-size:21px;font-weight:600;margin-bottom:8px;letter-spacing:-.3px;}
  p{font-size:14px;color:var(--soft);line-height:1.6;margin-bottom:22px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px 18px;border-radius:11px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;border:none;text-decoration:none;transition:all .15s;}
  .btn-google{background:#fff;color:#3C4043;border:1.5px solid #DADCE0;}
  .btn-google:hover{background:#F8F9FA;box-shadow:0 1px 6px rgba(0,0,0,.08);}
  .btn-primary{background:var(--bosque);color:#fff;}
  .btn-ghost{background:transparent;color:var(--soft);font-weight:500;}
  .msg{font-size:13px;margin-top:14px;min-height:18px;}
  .msg.err{color:#C0756E;}
  .msg.ok{color:var(--bosque);font-weight:600;}
  .spin{width:22px;height:22px;border:3px solid rgba(45,106,79,.2);border-top-color:var(--bosque);border-radius:50%;animation:s 0.8s linear infinite;margin:6px auto;}
  @keyframes s{to{transform:rotate(360deg)}}
  .hint{font-size:11.5px;color:#9AA8A0;margin-top:16px;line-height:1.5;}
</style>
</head>
<body>
<div class="card">
  <div class="ico">🗓️</div>
  <h1 id="ttl">Conectá tu Google Calendar</h1>
  <p id="sub">Autorizá a Pathway a <strong>ver tu calendario</strong> para mostrar tus sesiones reales en tu agenda. No publicamos nada; solo lo mostramos en tu panel.</p>
  <div id="area">
    <button class="btn btn-google" id="btn-conn" onclick="conectar()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Conectar con Google
    </button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="hint">Volvés a esta página después de aceptar. Podés desconectarlo cuando quieras.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
var SB='https://ddxnrsnjdvtqhxunxnwj.supabase.co';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkeG5yc25qZHZ0cWh4dW54bndqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNDk5MzksImV4cCI6MjA5MDcyNTkzOX0.t82X1x-PDgFDGYhKC7YXoRKhga9I8Hjet60QUYvtZLU';
var CAL_SCOPE='https://www.googleapis.com/auth/calendar.readonly';
var _sb=null;
function sbc(){ if(!_sb) _sb=window.supabase.createClient(SB,KEY); return _sb; }
function setMsg(t,cls){ var m=document.getElementById('msg'); m.textContent=t||''; m.className='msg'+(cls?(' '+cls):''); }
function busy(t){ document.getElementById('area').innerHTML="<div class='spin'></div>"; document.getElementById('sub').textContent=t||'Conectando…'; }
function done(){
  document.getElementById('ico'); document.getElementById('ttl').textContent='¡Calendario conectado! 🎉';
  document.getElementById('sub').textContent='Tus sesiones reales ya aparecen en la agenda de tu panel.';
  document.getElementById('area').innerHTML="<a class='btn btn-primary' href='/panel-v2.html'>Ir a mi panel →</a>";
  setMsg('','');
}
function failView(t){
  document.getElementById('area').innerHTML="<button class='btn btn-google' onclick='conectar()'>Reintentar</button>"+
    "<a class='btn btn-ghost' href='/panel-v2.html' style='margin-top:8px'>Volver al panel</a>";
  setMsg(t||'No se pudo conectar. Probá de nuevo.','err');
}
function conectar(){
  if(!window.supabase){ setMsg('Recargá la página (SDK no cargó).','err'); return; }
  busy('Redirigiendo a Google…');
  sbc().auth.signInWithOAuth({
    provider:'google',
    options:{
      scopes:CAL_SCOPE,
      queryParams:{ access_type:'offline', prompt:'consent' },
      redirectTo: location.origin + '/conectar-calendar.html'
    }
  }).catch(function(e){ failView('Error al abrir Google: '+((e&&e.message)||'')); });
}
function guardar(session){
  busy('Guardando la conexión…');
  fetch(SB+'/functions/v1/gcal-connect',{
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'apikey':KEY, 'Authorization':'Bearer '+session.access_token },
    body:JSON.stringify({
      access_token: session.provider_token||'',
      refresh_token: session.provider_refresh_token||'',
      expiry: Date.now()+3600000
    })
  }).then(function(r){ return r.json().then(function(d){ return {ok:r.ok,d:d}; }); })
    .then(function(res){
      if(res.ok && res.d && res.d.ok){ done(); }
      else if(res.d && res.d.error==='coach_not_found'){ failView('Tu email de Google ('+(res.d.email||'')+') no coincide con tu cuenta de Pathway. Escribime y lo resolvemos.'); }
      else { failView('No pudimos guardar la conexión ('+((res.d&&res.d.error)||'error')+').'); }
    })
    .catch(function(){ failView('No pudimos guardar la conexión. Reintentá.'); });
}
// Al cargar: ¿venimos de vuelta del OAuth de Google?
(function(){
  var returning = (location.hash.indexOf('access_token')>=0) || (location.search.indexOf('code=')>=0);
  if(!returning) return; // primera visita → muestra el botón
  busy('Conectando con Google…');
  var tries=0;
  var iv=setInterval(function(){
    sbc().auth.getSession().then(function(res){
      var s=res && res.data && res.data.session;
      if(s && s.provider_token){ clearInterval(iv); guardar(s); }
      else if(++tries>15){ clearInterval(iv); failView('No recibimos el permiso de Google. Probá de nuevo y aceptá el acceso al calendario.'); }
    });
  }, 400);
})();
</script>
</body>
</html>
