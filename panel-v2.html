/* Bandeja del admin: lista de hilos agrupados por coach. Cada fila muestra
 * nombre del coach, último mensaje (preview), tiempo, badge de no-leídos.
 * Click → cierra la cabra y abre la ficha del coach (Admin → Coaches → Ver)
 * donde está el bloque de chat completo con caja para responder.
 */
/* Conversación admin↔coach renderizada DENTRO de la cabra (sin salir).
 * El back vuelve a la bandeja. El textarea de respuesta vive en el footer
 * del panel de la cabra (ver render de footer, action "chat-cabra-send").
 */
function viewAdminThreadInCabra(coachId){
  var hilo = (RMSG||[]).filter(function(m){ return String(m.coach_id)===String(coachId); })
    .slice().sort(function(a,b){ return new Date(a.created_at)-new Date(b.created_at); });
  // Marcar como leídos los del coach (from_admin=false) que aún no están leídos
  var unreadIds = hilo.filter(function(m){ return !m.from_admin && !m.leido_en && m.id; }).map(function(m){ return m.id; });
  if(unreadIds.length){
    _sbw("mensajes_admin_coach?id=in.("+unreadIds.join(",")+")","PATCH",{leido_en:new Date().toISOString()})
      .then(function(){ unreadIds.forEach(function(id){
        var m = hilo.find(function(x){return x.id===id;}); if(m) m.leido_en = new Date().toISOString();
      }); });
  }
  var coach = (RCOACHES||[]).filter(function(u){return String(u.id)===String(coachId);})[0] || {};
  var coachName = coach.nombre || coach.email || "coach";
  var coachPhoto = coach.foto_url || (coach.configuracion && (coach.configuracion.foto_url || coach.configuracion.foto_perfil)) || "";
  function fmtTime(s){ try{ return new Date(s).toLocaleString("es-ES",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; } }
  var bubbles = hilo.map(function(m){
    var mine = m.from_admin;
    var bg = mine ? "var(--pw-bosque)" : "var(--pw-niebla-2)";
    var color = mine ? "#fff" : "var(--pw-carbon)";
    var align = mine ? "flex-end" : "flex-start";
    var who = mine ? "Tú" : coachName.split(" ")[0];
    var av = mine ? _chatAv((COACH&&COACH.photo)||ADMIN_PHOTO,(COACH&&COACH.name)||'Micaela') : _chatAv(coachPhoto, coachName);
    var col = "<div style='display:flex;flex-direction:column;align-items:"+align+";gap:3px;max-width:85%'>"+
      "<div style='font-size:10.5px;color:var(--pw-text-soft)'>"+esc(who)+" · "+fmtTime(m.created_at)+"</div>"+
      "<div style='background:"+bg+";color:"+color+";padding:8px 12px;border-radius:12px;font-size:13px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word'>"+esc(m.body)+"</div>"+
    "</div>";
    return "<div style='display:flex;align-items:flex-end;gap:7px;justify-content:"+align+";margin-bottom:10px'>"+(mine?(col+av):(av+col))+"</div>";
  }).join("");
  if(!bubbles){
    bubbles = "<div style='text-align:center;padding:24px 12px;color:var(--pw-text-soft);font-size:12.5px'>Sin mensajes con "+esc(coachName.split(" ")[0])+" todavía. Escribe abajo para iniciar.</div>";
  }
  var head = "<div style='display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--pw-border);background:var(--pw-niebla);position:sticky;top:0;z-index:3'>"+
    "<button class='cp-btn cp-btn-ghost' data-act='chat-cabra-back' style='height:28px;padding:0 10px;font-size:12px'>← Bandeja</button>"+
    "<span style='font-size:13px;font-weight:600;color:var(--pw-carbon);margin-left:2px'>"+esc(coachName)+"</span>"+
  "</div>";
  return head+"<div style='padding:14px 16px'>"+bubbles+"</div>";
}

    if(aCli){
      var headAC = "<div style='display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--pw-border);background:var(--pw-niebla);position:sticky;top:0;z-index:3'>"+

  }

    var cliRows = _chatBandejaRows(false);
    if(!cliRows){
      cliRows = "<div style='text-align:center;padding:28px 16px;color:var(--pw-text-soft);font-size:13px'>"+
        "Todavía no tienes clientes propios. Cuando sumes uno, puedes escribirle desde aquí."+
      "</div>";
    }
    return adminTabsBar+"<div style='padding:0'>"+_chatTopBar()+cliRows+"</div>";
  }
  // ── Pestaña "Coaches": hilos admin↔coach ──
  var byCoach = {};
  (RMSG||[]).forEach(function(m){
    var k = String(m.coach_id||"");
    if(!byCoach[k]) byCoach[k] = { coachId:k, mensajes:[], unread:0, last:null };
    byCoach[k].mensajes.push(m);
    if(!m.leido_en && !m.from_admin) byCoach[k].unread++;
    if(!byCoach[k].last || new Date(m.created_at) > new Date(byCoach[k].last.created_at)) byCoach[k].last = m;
  });
  var threads = Object.keys(byCoach).map(function(k){ return byCoach[k]; });
  // Ordenar: no-leídos primero, después por mensaje más reciente
  threads.sort(function(a,b){
    if((b.unread>0) !== (a.unread>0)) return (b.unread>0)?1:-1;
    return new Date(b.last.created_at) - new Date(a.last.created_at);
  });
  if(!threads.length){
    return adminTabsBar+"<div style='text-align:center;padding:28px 16px;color:var(--pw-text-soft);font-size:13px'>"+
      "Todavía no hay conversaciones con coaches. Para empezar una, abre Admin → Coaches → Ver y escribe desde la ficha."+
    "</div>";
  }
  function fmtTime(s){
    try{
      var d = new Date(s), now = new Date();
      var diffMin = Math.round((now-d)/60000);
      if(diffMin < 1) return "ahora";
      if(diffMin < 60) return "hace "+diffMin+" min";
      var diffH = Math.round(diffMin/60);
      if(diffH < 24) return "hace "+diffH+" h";
      return d.toLocaleDateString("es-ES",{day:"2-digit",month:"short"});
    }catch(e){ return ""; }
  }
  function listAvA(url,name){ return avImg(url,name,"style='width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0'"); }
  var rows = threads.map(function(t){

    var cPhoto = (coach && (coach.foto_url || (coach.configuracion && (coach.configuracion.foto_url || coach.configuracion.foto_perfil)))) || "";
    var preview = (t.last.body||"").replace(/\s+/g," ").slice(0, 70);
    if(t.last.body && t.last.body.length > 70) preview += "…";
    var fromLabel = t.last.from_admin ? "Tú: " : "";
    var unreadBadge = t.unread > 0
      ? "<span style='background:var(--pw-danger);color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:99px;margin-left:6px'>"+t.unread+"</span>"
      : "";
    var bgRow = t.unread > 0 ? "rgba(192,117,110,.06)" : "#fff";
    return "<div data-act='chat-open-thread' data-cid='"+esc(t.coachId)+"' style='display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--pw-border);cursor:pointer;background:"+bgRow+"' onmouseover='this.style.background=\"var(--pw-niebla)\"' onmouseout='this.style.background=\""+bgRow+"\"'>"+
      listAvA(cPhoto,name)+
      "<div style='flex:1;min-width:0;display:flex;flex-direction:column;gap:3px'>"+
        "<div style='display:flex;align-items:center;gap:6px'>"+
          "<span style='font-weight:"+(t.unread>0?"700":"600")+";color:var(--pw-carbon);font-size:13.5px'>"+esc(name)+"</span>"+
          unreadBadge+
          "<span style='margin-left:auto;font-size:11px;color:var(--pw-text-soft);flex-shrink:0'>"+fmtTime(t.last.created_at)+"</span>"+
        "</div>"+
        "<div style='font-size:12.5px;color:var(--pw-text-soft);line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'>"+esc(fromLabel)+esc(preview)+"</div>"+
      "</div></div>";
  }).join("");
  return adminTabsBar+"<div style='padding:4px 0'>"+rows+"</div>";
}

/* ═══ Asistente ═══ */
function viewAsistente(){
  var STEPSx = computeSteps();
  var done = STEPSx.filter(function(s){return s.done;}).length;
  var pct = Math.round(done/STEPSx.length*100);
  var nextStep = STEPSx.filter(function(s){return !s.done;})[0];
  var allDone = !nextStep;
  // Cuenta de mensajes sin leer: si hay, la cabra saluda; si no, está tranquila.
  var _cabraUnread = 0;
  if(RMSG){ for(var _ci=0;_ci<RMSG.length;_ci++){ var _cm=RMSG[_ci]; if(!_cm.leido_en && ((RADMIN && !_cm.from_admin) || (!RADMIN && _cm.from_admin))) _cabraUnread++; } }
  var _mood = cabraMood();
  var cabraSrc = _mood.img;
  var tipTitle = allDone ? "¡Listo! Ya tienes todo configurado" : nextStep.tipTitle;
  var tipDesc  = allDone ? "Tu cuenta está lista. Recuerda que estoy aquí si necesitas ayuda." : nextStep.tipDesc;

  if(!state.ai.open){
    var top;
    if(allDone){
      // Onboarding completo: la cabra muestra su mood (pide atención / descuidada)
      // como cartel calmo y dismissible. Si no hay nada que avisar → solo el ícono.
      top = (_mood.msg && state.ai.bubbleOpen) ? _cabraCartel(_mood.msg) : "";
    } else if(state.ai.bubbleOpen){

function _coachChatBlock(c){
  if(!RADMIN || !c) return "";
  var hilo = (RMSG||[]).filter(function(m){ return String(m.coach_id)===String(c.id); }).sort(function(a,b){ return new Date(a.created_at)-new Date(b.created_at); });

  // me mandó (from_admin=false). Así la bandeja de la cabra se actualiza.
  if(hilo.length){
    var unreadIds = hilo.filter(function(m){ return !m.from_admin && !m.leido_en && m.id; }).map(function(m){ return m.id; });
    if(unreadIds.length){
      _sbw("mensajes_admin_coach?id=in.("+unreadIds.join(",")+")","PATCH",{leido_en:new Date().toISOString()})
        .then(function(){ unreadIds.forEach(function(id){
          var m = hilo.find(function(x){return x.id===id;}); if(m) m.leido_en = new Date().toISOString();
        }); });
    }

  function fmtTime(s){ try{ return new Date(s).toLocaleString("es-ES",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; } }

function _syncChatBtn(){
  try{
    var btn=document.getElementById("pw-chat-btn"); if(!btn) return;
    var old=btn.querySelector(".pw-chat-notif"); if(old) old.remove();
    var unread=0, lastMsg=null;
    if(RMSG){
      for(var i=0;i<RMSG.length;i++){ var m=RMSG[i];
        if(!m.leido_en && ((RADMIN && !m.from_admin) || (!RADMIN && m.from_admin))){
          unread++;
          if(!lastMsg || new Date(m.created_at)>new Date(lastMsg.created_at)) lastMsg=m;
        }
      }
    }
    if(!unread) return;
    // Foto de quien escribió: coach → Pathway/Mica; admin → foto del coach.
    var photo=ADMIN_PHOTO;
    if(RADMIN && lastMsg){
      var co=(RCOACHES||[]).filter(function(u){return String(u.id)===String(lastMsg.coach_id);})[0];
      photo=(co && (co.foto_url || (co.configuracion && (co.configuracion.foto_url||co.configuracion.foto_perfil)))) || ADMIN_PHOTO;
    }
    btn.style.position="relative";
    var wrap=document.createElement("span");
    wrap.className="pw-chat-notif";
    wrap.setAttribute("style","position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:#fff url('"+photo+"') center/cover no-repeat;box-shadow:0 2px 6px rgba(0,0,0,.18);pointer-events:none");
    var dot=document.createElement("span");

    dot.textContent=unread>9?"9+":String(unread);
    wrap.appendChild(dot);
    btn.appendChild(wrap);
  }catch(e){}
}

// Otorga acceso a CV Express: por cada email crea/actualiza el row en
// cv_express con paid_at=ahora (lo que valida el guard de cv-express.html
// por 48 h) y manda el email con el link correcto (?paid=1&email=) vía la
// edge function send-email. Reemplaza el viejo window.open(mailto) que
// abría una pestaña en blanco y mandaba un link sin acceso.
function cvxGrantAccess(emails, gbtn, clearInput){
  var gold=gbtn?gbtn.innerHTML:"";
  if(gbtn){ gbtn.disabled=true; gbtn.textContent="Otorgando..."; }
  var GH={apikey:KEY,Authorization:"Bearer "+KEY};
  function one(email){
    return fetch(SB+"/rest/v1/cv_express?email=eq."+encodeURIComponent(email)+"&select=email&limit=1",{headers:GH})
      .then(function(r){ return r.ok?r.json():[]; })
      .then(function(rows){
        var exists=rows.length>0;
        var body={paid_at:new Date().toISOString(),pago_monto:0};
        if(!exists) body.email=email;
        return fetch(SB+"/rest/v1/cv_express"+(exists?"?email=eq."+encodeURIComponent(email):""),{
          method:exists?"PATCH":"POST",
          headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json",Prefer:"return=minimal"},
          body:JSON.stringify(body)
        });
      })
      .then(function(r){
        if(!r.ok) throw new Error("grant_"+r.status);
        var link="https://pathwaycareercoach.com/cv-express.html?paid=1&email="+encodeURIComponent(email);
        var nm=(email.split("@")[0]||"").replace(/[._-]+/g," ").replace(/\b\w/g,function(c){return c.toUpperCase();});
        var html="<!DOCTYPE html><html><body style=\"font-family:Inter,-apple-system,sans-serif;font-size:14px;line-height:1.6;color:#1B4332;max-width:600px;margin:0 auto;padding:24px;background:#FAFDF9;\">"+
          "<h2 style=\"font-family:Fraunces,Georgia,serif;color:#1B4332;margin:0 0 14px;\">Hola "+esc(nm||"!")+",</h2>"+
          "<p>Tu acceso al <strong>Pack Express de Pathway</strong> ya está activo. Tienes <strong>48 horas</strong> para generar y descargar tu CV, tu carta y el análisis de tu LinkedIn.</p>"+
          "<p style=\"margin:22px 0;\"><a href=\""+link+"\" style=\"display:inline-block;padding:13px 26px;background:#2D6A4F;color:#fff;border-radius:10px;text-decoration:none;font-weight:700;\">Empezar mi Pack Express →</a></p>"+
          "<p style=\"font-size:12px;color:#5A6A60;word-break:break-all;\">Si el botón no funciona, copia este link: "+esc(link)+"</p></body></html>";
        return fetch(SB+"/functions/v1/send-email",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({to:email,to_name:nm,subject:"Tu acceso a CV Express — Pathway",html:html,reply_to:"hi@pathwaycareercoach.com"})})
          .then(function(r){ return {email:email,emailOk:r.ok}; })
          .catch(function(){ return {email:email,emailOk:false}; });
      })
      .catch(function(e){ return {email:email,error:(e&&e.message)||"error"}; });
  }
  Promise.all(emails.map(one)).then(function(res){
    if(gbtn){ gbtn.disabled=false; gbtn.innerHTML=gold; }
    var oks=res.filter(function(x){return !x.error;});
    var noMail=oks.filter(function(x){return !x.emailOk;});
    var fails=res.filter(function(x){return x.error;});
    if(oks.length && !noMail.length && !fails.length){
      if(clearInput){ var ci=document.getElementById("cvx-access"); if(ci) ci.value=""; }
      toast(oks.length>1?("Acceso otorgado y emails enviados ✓"):"Acceso otorgado y email enviado ✓");
      return;
    }
    var msg="";
    if(oks.length) msg+="✓ Acceso otorgado a "+oks.length+" persona(s).\n";
    if(noMail.length) msg+="\n⚠️ El email no se pudo enviar a: "+noMail.map(function(x){return x.email;}).join(", ")+
      "\nPasales el link manual:\nhttps://pathwaycareercoach.com/cv-express.html?paid=1&email=EMAIL\n";
    if(fails.length) msg+="\n✗ Falló otorgar acceso a: "+fails.map(function(x){return x.email;}).join(", ");
    alert(msg);
  });
}

// Sube un Blob/File a Supabase Storage (bucket 'avatars', público) y devuelve
// la URL pública. Guardamos URL (no base64): el base64 no se ve en emails y
// engorda el mensaje. Reemplaza a Uploadcare (que con esta cuenta no persistía).
function _uploadAvatar(fileOrBlob, ext){
  var id=(REAL&&RME&&RME.id)?RME.id:"anon";
  var path="coach-"+id+"-"+Date.now()+"."+(ext||"png");
  return fetch(SB+"/storage/v1/object/avatars/"+encodeURIComponent(path),{
    method:"POST",
    headers:{ apikey:KEY, Authorization:"Bearer "+KEY, "Content-Type": (fileOrBlob.type||"image/png"), "x-upsert":"true" },
    body: fileOrBlob
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){ throw new Error("storage "+r.status+" "+t); });
    return SB+"/storage/v1/object/public/avatars/"+path;
  });
}
// Sube un documento de sesión al storage (mismo bucket público) y devuelve
// la URL pública. Conserva el nombre original (limpio) en el path.
function _uploadDoc(f){
  var id=(REAL&&RME&&RME.id)?RME.id:"anon";
  var clean=(""+(f.name||"doc")).replace(/[^a-zA-Z0-9._-]/g,"_").slice(-60);
  var path="doc-"+id+"-"+Date.now()+"-"+clean;
  return fetch(SB+"/storage/v1/object/avatars/"+encodeURIComponent(path),{
    method:"POST",
    headers:{ apikey:KEY, Authorization:"Bearer "+KEY, "Content-Type": (f.type||"application/octet-stream"), "x-upsert":"true" },
    body: f
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){ throw new Error("storage "+r.status+" "+t); });
    return SB+"/storage/v1/object/public/avatars/"+path;
  });
}

    var _demoCoach=(RCOACHES||[]).filter(function(u){return (""+(u&&u.email||"")).toLowerCase()==="demo.coach@pathway.com";})[0];

    };

    RADM = (ME.rol==="admin") ? { cands:_adminCands, cvx:res[7]||[], leads:[], resenas:res[10]||[], informes:res[8]||[] } : null;

    RCFG = usr.configuracion || ME.configuracion || {};

      slug:RPROF.slug||(cfg&&cfg.slug)||"", email:ME.email||"" };
    var cvSet={}, cvMap={}; cvR.forEach(function(x){ if(x&&x.email){ var ke=(""+x.email).toLowerCase().trim(); cvSet[ke]=true; if(cvMap[ke]==null) cvMap[ke]=(x.contenido!=null?(""+x.contenido):""); } });
    var infMap={}, rpSet={};
    inf.forEach(function(x){
      if(!x||!x.email) return;
      var ke=(""+x.email).toLowerCase().trim();
      rpSet[ke]=true;
      if(infMap[ke]) return; // primer informe por email
      var dd={}; try{ dd=typeof x.data==="string"?(JSON.parse(x.data)||{}):(x.data||{}); }catch(e){ dd={}; }

    });
    var _norm=function(s){ return (""+(s||"")).toLowerCase().trim().replace(/\s+/g," "); };
    var meEm=_norm(ME.email), meNm=_norm(ME.nombre);
    // Emails de coaches/admins: nunca se listan como clientes (un coach no es cliente).
    var _coachEmails={}; (RCOACHES||[]).forEach(function(u){ if(u&&u.email) _coachEmails[_norm(u.email)]=true; });

// Migración automática: las fotos viejas guardadas como base64 (data: URI)
// no se ven en los emails (Gmail las bloquea) y engordan el mensaje. Cuando
// el coach abre el panel, si su foto es base64 la subimos UNA vez a
// Uploadcare y guardamos la URL del CDN. Transparente, sin acción del coach.
// El avatar SVG generado (placeholder) NO se migra — solo fotos reales.
function _migrateFotoToUploadcare(){
  if(!REAL || !RME || !RME.id) return;
  var foto = (COACH && COACH.photo) || "";
  if(!/^data:image\/(jpe?g|png|webp|gif);base64,/i.test(foto)) return;
  if(window._fotoMigrating) return; window._fotoMigrating = true;
  try{
    var parts = foto.split(",");
    var mime = (parts[0].match(/:(.*?);/) || [])[1] || "image/png";
    var bin = atob(parts[1] || "");
    var bytes = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    var blob = new Blob([bytes], { type: mime });
    var ext = (mime.split("/")[1]||"png").replace("jpeg","jpg");
    _uploadAvatar(blob, ext)
      .then(function(url){
        var merged={}; for(var k in RCFG){ if(RCFG.hasOwnProperty(k)) merged[k]=RCFG[k]; } merged.foto_url=url;
        return _sbw("usuarios?id=eq."+encodeURIComponent(RME.id),"PATCH",{configuracion:merged,foto_url:url}).then(function(r){
          if(r && r.ok){ RCFG=merged; COACH.photo=url;
            try{ var mu=JSON.parse(localStorage.getItem("mj_user")||"{}"); mu.configuracion=merged; mu.foto_url=url; localStorage.setItem("mj_user",JSON.stringify(mu)); }catch(e){}
            render();
          }
        });
      })
      .catch(function(){})
      .then(function(){ window._fotoMigrating=false; });
  }catch(e){ window._fotoMigrating=false; }
}

// Paywall: bloquea si la prueba venció sin suscripción (fiel a panel.html
// _paywallCheck). Excepciones: admin, es_pro_vitalicio, estado_sub 'activa',
// o sin fecha_fin_prueba (cuentas viejas). Devuelve true si maneja el gate.
function _paywallCheck(u){
  if(!u || u.rol==="admin") return false;
  var cfg=u.configuracion||{};
  if(cfg.es_pro_vitalicio===true) return false;
  if(cfg.estado_sub==="activa") return false;
  var fin=cfg.fecha_fin_prueba ? new Date(cfg.fecha_fin_prueba) : null;
  if(!fin || isNaN(fin)) return false;
  if(fin.getTime() > Date.now()) return false;
  var root=document.getElementById("root");
  if(root) root.innerHTML="<div style='display:flex;align-items:center;justify-content:center;height:100vh;font-family:var(--pw-sans);color:var(--pw-text-soft);font-size:14px'>Verificando tu suscripción…</div>";
  fetch(SB+"/rest/v1/usuarios?id=eq."+encodeURIComponent(u.id)+"&select=activo,configuracion",{headers:(window.PWAUTH&&PWAUTH.headersSync?PWAUTH.headersSync():{apikey:KEY,Authorization:"Bearer "+KEY})})
    .then(function(r){return r.ok?r.json():[];}).then(function(rows){
      var fresh=rows&&rows[0]; var fc=(fresh&&fresh.configuracion)||cfg;
      if(fc.estado_sub==="activa" || fc.es_pro_vitalicio===true){
        try{ var mu=JSON.parse(localStorage.getItem("mj_user")||"{}"); mu.configuracion=fc; localStorage.setItem("mj_user",JSON.stringify(mu)); }catch(e){}
        window.location.reload(); return;
      }
      var ff=fc.fecha_fin_prueba?new Date(fc.fecha_fin_prueba):null;
      if(ff && !isNaN(ff) && ff.getTime()>Date.now()){ window.location.reload(); return; }
      var su=STRIPE_BASIC+"?prefilled_email="+encodeURIComponent(u.email||"");
      document.body.innerHTML="<div style='position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#FAFDF9;font-family:Inter,sans-serif;padding:24px'><div style='background:#fff;border-radius:14px;padding:32px;max-width:480px;width:100%;text-align:center;box-shadow:0 8px 30px rgba(45,106,79,.1)'><div style='font-size:42px;margin-bottom:14px'>🌱</div><h1 style='font-family:Fraunces,Georgia,serif;font-size:24px;color:#1B2E26;margin-bottom:10px;letter-spacing:-.4px'>Tu prueba terminó</h1><p style='font-size:14px;color:#5A6A60;line-height:1.55;margin-bottom:20px'>Activa tu suscripción para seguir usando Pathway con todos tus clientes, informes y configuración. <strong>€58/mes, cancelas cuando quieras.</strong></p><a href='"+su+"' style='display:inline-block;padding:13px 28px;background:#2D6A4F;color:#fff;border-radius:10px;text-decoration:none;font-size:14px;font-weight:600;margin-bottom:10px'>Suscribirme →</a><br><a href='login.html' style='display:inline-block;padding:8px 18px;font-size:12px;color:#5A6A60;text-decoration:underline'>Cerrar sesión</a><p style='font-size:11px;color:#999;margin-top:18px;line-height:1.5'>¿Algún problema? Escríbenos a <a href='mailto:"+SUPPORT_EMAIL+"' style='color:#2D6A4F'>"+SUPPORT_EMAIL+"</a></p></div></div>";
    }).catch(function(){ window.location.href="login.html"; });
  return true;
}
(function bootPanel(){

      "<div style='font-size:13px;color:var(--pw-text-soft);margin-top:6px'>Trayendo tus clientes</div></div></div>";
  } else {

  loadReal();
  // Watchdog: nunca dejar "Cargando…" colgado. Si en 6s no se pintó el panel, pintarlo igual.

<script>
(function(){
  // Si ya fue descartada o la app ya corre en modo "standalone" (instalada),
  // no mostrar el chip.
  try { if (localStorage.getItem('pw_install_dismissed')==='1') return; } catch(e){}
  if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return;

  var chip = document.getElementById('pw-install-chip');
  var btn  = document.getElementById('pw-install-btn');
  var xBtn = document.getElementById('pw-install-x');
  var deferred = null;

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferred = e;
    if (chip) chip.style.display = 'block';
  });
  window.addEventListener('appinstalled', function(){
    if (chip) chip.style.display = 'none';
  });
  if (btn) btn.addEventListener('click', function(){
    if (!deferred) {
      // Safari / iPhone / navegador sin beforeinstallprompt → guía con QR.
      window.open('/instalar.html', '_blank', 'noopener');
      return;
    }
    deferred.prompt();
    try {
      deferred.userChoice.then(function(){
        deferred = null;
        if (chip) chip.style.display = 'none';
      });
    } catch(e) {}
  });
  if (xBtn) xBtn.addEventListener('click', function(){
    try { localStorage.setItem('pw_install_dismissed','1'); } catch(e){}
    if (chip) chip.style.display = 'none';
  });
})();
</script>
