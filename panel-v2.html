<!doctype html>
<html lang="es">
<head>
<script src="pw-observe.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<style>html{color-scheme:light;}</style>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Pathway Career Coach</title>
<link rel="icon" href="/favicon-app.svg?v=3" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
<link rel="manifest" href="/manifest.json?v=4">
<meta name="theme-color" content="#2D6A4F">
<style>
@import url("https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap");

:root{
  --pw-bosque:#2D6A4F; --pw-bosque-dark:#1B4332; --pw-sendero:#52B788;
  --pw-amanecer:#E9C46A; --pw-carbon:#1B2E26;
  --pw-niebla:#FAFDF9; --pw-niebla-2:#F0F7F2; --pw-niebla-3:#E8F2EC;
  --pw-text:var(--pw-carbon); --pw-text-soft:#5A5A55; --pw-text-muted:#8A8A82;
  --pw-text-on-dark:#FFFFFF; --pw-text-on-dark-soft:rgba(255,255,255,.78);
  --pw-bg:var(--pw-niebla); --pw-bg-card:#FFFFFF; --pw-bg-soft:var(--pw-niebla-2); --pw-bg-inverse:var(--pw-bosque-dark);
  --pw-border:rgba(45,106,79,.12); --pw-border-strong:rgba(45,106,79,.25); --pw-border-input:rgba(45,106,79,.18);
  --pw-success:var(--pw-sendero); --pw-success-bg:rgba(82,183,136,.14);
  --pw-warning:var(--pw-amanecer); --pw-warning-bg:rgba(233,196,106,.18);
  --pw-danger:#C0756E; --pw-danger-bg:rgba(192,117,110,.12);
  --pw-info:var(--pw-bosque); --pw-info-bg:rgba(82,183,136,.08);
  --pw-bronce:#B97A3D; --pw-dinero:#A8AFB5; --pw-oro:#D4A24C;
  --pw-serif:"Fraunces","Georgia","Times New Roman",serif;
  --pw-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --pw-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,"Menlo",monospace;
  --pw-fs-display:clamp(34px,5.5vw,58px); --pw-fs-h1:clamp(28px,3.6vw,40px);
  --pw-fs-h2:clamp(24px,3vw,32px); --pw-fs-h3:19px; --pw-fs-h4:16px;
  --pw-fs-body:15px; --pw-fs-body-lg:16px; --pw-fs-small:13px; --pw-fs-micro:11px;
  --pw-lh-tight:1.1; --pw-lh-snug:1.2; --pw-lh-body:1.55; --pw-lh-loose:1.65;
  --pw-ls-display:-2px; --pw-ls-tight:-1.2px; --pw-ls-h3:-0.4px; --pw-ls-eyebrow:1.2px;
  --pw-radius-xs:6px; --pw-radius-sm:8px; --pw-radius-md:10px; --pw-radius-lg:12px;
  --pw-radius-xl:14px; --pw-radius-2xl:16px; --pw-radius-3xl:20px; --pw-radius-pill:100px; --pw-radius-circle:50%;
  --pw-shadow-xs:0 1px 2px rgba(45,106,79,.06);
  --pw-shadow-sm:0 4px 14px rgba(45,106,79,.08);
  --pw-shadow-md:0 6px 20px rgba(45,106,79,.10);
  --pw-shadow-lg:0 12px 24px rgba(45,106,79,.12);
  --pw-shadow-xl:0 18px 40px rgba(45,106,79,.14);
  --pw-shadow-btn:0 4px 14px rgba(45,106,79,.18);
  --pw-focus-ring:0 0 0 3px rgba(82,183,136,.25);
  --pw-ease:cubic-bezier(.2,.7,.2,1); --pw-ease-out:cubic-bezier(.16,1,.3,1);
  --pw-dur-fast:.15s; --pw-dur-base:.2s; --pw-dur-slow:.5s;
  --pw-grad-niebla:linear-gradient(135deg,#FAFDF9 0%,#F0F7F2 50%,#E8F2EC 100%);
}
*,*::before,*::after{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;font-family:var(--pw-sans);font-size:var(--pw-fs-body-lg);line-height:var(--pw-lh-body);color:var(--pw-text);background:var(--pw-niebla);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:transparent;color:inherit;}
input,textarea,select{font-family:inherit;color:inherit;}

/* ═══ Layout shell ═══ */
.cp-app{display:grid;grid-template-columns:248px 1fr;height:100vh;}
.cp-main{display:flex;flex-direction:column;min-width:0;height:100vh;}
.cp-scroll{flex:1;overflow-y:auto;padding:20px 36px 120px;}
.cp-scroll::-webkit-scrollbar{width:8px;}
.cp-scroll::-webkit-scrollbar-thumb{background:rgba(45,106,79,.12);border-radius:4px;}
.cp-container{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}
/* Vistas de formulario (ficha de cliente, configuración): columna más angosta
   y ordenada — los campos y botones no se estiran a todo el ancho. */
.cp-container--narrow{max-width:760px;}
/* "Sumar un cliente": a lo ancho (sin limite) */
/* Ficha del cliente: menu vertical a la izquierda + contenido a la derecha (como Configuracion) */
.cp-ficha-cols{display:grid;grid-template-columns:212px 1fr;gap:16px;align-items:start;}
.cp-ficha-menu{background:#fff;border:1px solid var(--pw-border);border-radius:14px;padding:8px;position:sticky;top:16px;display:flex;flex-direction:column;gap:2px;}
.cp-fmenu-item{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:9px;font-family:var(--pw-sans);font-size:13.5px;font-weight:500;color:var(--pw-text);background:none;cursor:pointer;border:none;}
.cp-fmenu-item:hover{background:var(--pw-niebla);}
.cp-fmenu-item.is-on{background:var(--pw-success-bg);color:var(--pw-bosque);font-weight:600;}
.cp-ficha-main{min-width:0;display:flex;flex-direction:column;gap:16px;}
.cp-ficha-top{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;}
.cp-ficha-cal{flex:0 0 320px;max-width:340px;}
.cp-ficha-cal .cp-card{margin:0;}
@media (max-width:760px){.cp-ficha-cols{grid-template-columns:1fr;}.cp-ficha-menu{flex-direction:row;flex-wrap:wrap;position:static;}.cp-fmenu-item{width:auto;}.cp-ficha-cal{flex:1 1 100%;max-width:none;}}
/* Calendario del cliente en la ficha (solo-lectura) */
.pwcal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px;}
.pwcal-dow span{text-align:center;font-size:9px;font-weight:700;color:var(--pw-text-soft);}
.pwcal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.pwcal-cell{position:relative;height:30px;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-size:10px;font-weight:600;color:var(--pw-text-soft);background:var(--pw-niebla);}
.pwcal-cell.fut{color:#c9d2cc;}
.pwcal-cell.today{outline:1.5px solid var(--pw-bosque);color:var(--pw-bosque);}
.pwcal-cell.meas{background:#E1EDF1;box-shadow:inset 0 0 0 1px #BBD5DE;color:#2E7587;}
.pwcal-ics{display:flex;gap:1px;height:11px;line-height:11px;font-size:9px;}
.pwcal-mtag{position:absolute;top:2px;right:3px;font-size:7px;font-weight:700;color:#2E7587;}
.pwcal-legend{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;font-size:10.5px;color:var(--pw-text-soft);margin-top:10px;}
.pwcal-legend .sq{display:inline-block;width:10px;height:10px;border-radius:3px;background:#E1EDF1;box-shadow:inset 0 0 0 1px #BBD5DE;vertical-align:-1px;margin-right:3px;}

/* ═══ Sidebar ═══ */
.cp-side{background:linear-gradient(180deg,#1f5c43 0%,#1B4332 100%);color:var(--pw-text-on-dark);display:flex;flex-direction:column;padding:18px 14px;gap:16px;height:100vh;overflow:hidden;}
.cp-side-brand{display:inline-flex;align-items:center;gap:8px;padding:4px 6px;}
.cp-side-brand-word{font-family:var(--pw-serif);font-size:20px;font-weight:500;color:#fff;letter-spacing:-.5px;}
.cp-side-coach{display:flex;align-items:center;gap:11px;padding:12px 8px 14px;border-top:1px solid rgba(255,255,255,.10);border-bottom:1px solid rgba(255,255,255,.10);}
.cp-side-coach-txt{flex:1;min-width:0;}
.cp-side-coach img{width:54px;height:54px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.35);flex-shrink:0;}
.cp-side-coach-name{font-family:var(--pw-serif);font-weight:500;font-size:14px;color:#fff;line-height:1.15;letter-spacing:-.2px;}
.cp-side-coach-role{font-size:11px;color:rgba(255,255,255,.62);margin-top:2px;display:flex;align-items:center;gap:6px;}
.cp-side-plan{font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;background:var(--pw-amanecer);color:var(--pw-carbon);padding:2px 6px;border-radius:100px;}
.cp-side-nav{display:flex;flex-direction:column;gap:2px;}
.cp-side-nav-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;font-size:13px;font-weight:500;color:rgba(255,255,255,.78);transition:all .15s var(--pw-ease);width:100%;text-align:left;cursor:pointer;border:none;background:transparent;position:relative;}
.cp-side-nav-item:hover{background:rgba(255,255,255,.08);color:#fff;}
.cp-side-nav-item.is-active{background:rgba(255,255,255,.14);color:#fff;font-weight:600;}
.cp-side-nav-item.is-active::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--pw-sendero);}
.cp-side-nav-icon{width:16px;height:16px;flex-shrink:0;opacity:.9;}
.cp-side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:0 4px;}
.cp-side-cta{display:inline-flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:10px 14px;background:#fff;color:var(--pw-bosque-dark);border-radius:10px;font-weight:700;font-size:13px;transition:all .15s var(--pw-ease);}
.cp-side-cta:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.18);}
.cp-side-link{display:inline-flex;align-items:center;gap:6px;padding:6px 8px;font-size:11px;color:rgba(255,255,255,.6);border-radius:6px;}
.cp-side-link:hover{color:#fff;background:rgba(255,255,255,.06);}

/* ═══ Topbar ═══ */
.cp-topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;}
.cp-h1{font-family:var(--pw-serif);font-size:34px;font-weight:500;letter-spacing:-1.4px;line-height:1;margin:0;color:var(--pw-carbon);}
.cp-h1 .dot{color:var(--pw-sendero);}
.cp-h1 em{font-style:italic;color:var(--pw-bosque);font-weight:500;}
.cp-sub{font-size:13px;color:var(--pw-text-soft);margin-top:8px;}
.cp-topbar-actions{display:flex;align-items:center;gap:10px;}
.cp-search{display:flex;align-items:center;gap:8px;padding:0 12px;background:#fff;border:1px solid var(--pw-border);border-radius:10px;width:280px;height:38px;color:var(--pw-text-soft);transition:all .2s;}
.cp-search:focus-within{border-color:var(--pw-bosque);box-shadow:var(--pw-focus-ring);}
.cp-search input{border:none;outline:none;background:transparent;flex:1;font-size:13px;color:var(--pw-carbon);}
.cp-btn{display:inline-flex;align-items:center;gap:7px;padding:0 16px;height:38px;border-radius:10px;font-size:13px;font-weight:600;transition:all .15s var(--pw-ease);border:1px solid transparent;}
.cp-btn-primary{background:var(--pw-bosque);color:#fff;}
.cp-btn-primary:hover{background:var(--pw-bosque-dark);transform:translateY(-1px);box-shadow:var(--pw-shadow-btn);}
/* Beacon: el botón del próximo paso "respira". Se aplica solo a UN botón por
   pantalla (ej. "Generar con IA" cuando el cliente aún no tiene informe) y se
   apaga cuando la acción se completa. Respeta prefers-reduced-motion. */
@keyframes beacon{
  0%,100%{transform:translateY(0);box-shadow:0 2px 8px color-mix(in oklab, var(--pw-bosque) 22%, transparent);}
  50%{transform:translateY(-2px);box-shadow:0 8px 18px color-mix(in oklab, var(--pw-bosque) 32%, transparent), 0 0 0 8px color-mix(in oklab, var(--pw-bosque) 14%, transparent);}
}
.cp-btn.beacon{animation:beacon 2.4s ease-in-out infinite;}
@media (prefers-reduced-motion:reduce){.cp-btn.beacon{animation:none;}}
.cp-btn-ghost{background:#fff;color:var(--pw-text);border-color:var(--pw-border);}
.cp-btn-ghost:hover{border-color:var(--pw-border-strong);}

/* ═══ Card ═══ */
.cp-card{background:#fff;border:1px solid var(--pw-border);border-radius:14px;box-shadow:var(--pw-shadow-sm);transition:box-shadow .2s var(--pw-ease),transform .2s var(--pw-ease);}
.cp-card:hover{box-shadow:var(--pw-shadow-md);}
.cp-btn:hover{transform:translateY(-1px);}
.cp-btn:active{transform:translateY(0);}
.cp-rev-txt{font-size:13px;color:var(--pw-carbon);margin-top:4px;line-height:1.5;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;}
.cp-rev-txt.is-open{-webkit-line-clamp:unset;display:block;overflow:visible;}
.cp-rev-more{margin-top:4px;background:none;border:none;padding:0;font-size:12px;font-weight:600;color:var(--pw-bosque);cursor:pointer;}
.cp-rev-more:hover{text-decoration:underline;}
.cp-card-pad{padding:13px 18px;}
.cp-card-hd{padding:12px 20px;border-bottom:1px solid var(--pw-border);display:flex;align-items:center;justify-content:space-between;gap:16px;}
.cp-card-title{font-family:var(--pw-serif);font-weight:500;font-size:17px;letter-spacing:-.4px;color:var(--pw-carbon);margin:0;}
.cp-card-title .dot{color:var(--pw-sendero);}
.cp-eyebrow{font-size:10px;font-weight:700;color:var(--pw-bosque);text-transform:uppercase;letter-spacing:1.2px;}

/* ═══ Resumen ═══ */
.cp-greet{display:flex;align-items:center;gap:18px;}
.cp-greet img{width:64px;height:64px;border-radius:50%;object-fit:cover;flex-shrink:0;box-shadow:var(--pw-shadow-sm);}
.cp-greet-h1{font-family:var(--pw-serif);font-size:32px;font-weight:500;letter-spacing:-1.2px;line-height:1.05;color:var(--pw-carbon);margin:0;}
.cp-greet-h1 .dot{color:var(--pw-sendero);}
.cp-greet-sub{font-size:14px;color:var(--pw-text-soft);margin-top:4px;}
.cp-action-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.cp-action{background:#fff;border:1px solid var(--pw-border);border-radius:16px;padding:18px 20px;cursor:pointer;transition:all .2s var(--pw-ease);display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;text-align:left;}
.cp-action:hover{transform:translateY(-2px);box-shadow:var(--pw-shadow-md);border-color:var(--pw-border-strong);}
.cp-action-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;}
.cp-action.is-urgent .cp-action-tag{color:var(--pw-danger);}
.cp-action.is-today .cp-action-tag{color:var(--pw-bosque);}
.cp-action.is-risk .cp-action-tag{color:var(--pw-amanecer);filter:brightness(.7);}
.cp-action-h{font-family:var(--pw-serif);font-size:22px;font-weight:500;letter-spacing:-.5px;color:var(--pw-carbon);line-height:1.15;}
.cp-action-h strong{font-family:var(--pw-serif);font-weight:600;color:var(--pw-bosque);}
.cp-action-d{font-size:12px;color:var(--pw-text-soft);}
.cp-action-cta{margin-top:auto;padding-top:8px;font-size:12px;font-weight:600;color:var(--pw-bosque);display:inline-flex;align-items:center;gap:4px;}
.cp-action-bg{position:absolute;right:-20px;top:-20px;width:110px;height:110px;border-radius:50%;opacity:.07;pointer-events:none;}
.cp-action.is-urgent .cp-action-bg{background:var(--pw-danger);}
.cp-action.is-today .cp-action-bg{background:var(--pw-bosque);}
.cp-action.is-risk .cp-action-bg{background:var(--pw-amanecer);}
.cp-todo{display:flex;flex-direction:column;}
.cp-todo-row{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--pw-border);cursor:pointer;transition:background .12s;}
.cp-todo-row:last-child{border-bottom:none;}
.cp-todo-row:hover{background:var(--pw-niebla-2);}
.cp-todo-row img{width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0;}
.cp-todo-body{flex:1;min-width:0;}
.cp-todo-head{font-size:13px;font-weight:600;color:var(--pw-carbon);}
.cp-todo-meta{font-size:11px;color:var(--pw-text-soft);margin-top:2px;}
.cp-todo-time{font-size:11px;font-weight:600;padding:3px 9px;border-radius:100px;}
.cp-todo-time.is-now{background:var(--pw-danger-bg);color:var(--pw-danger);}
.cp-todo-time.is-today{background:var(--pw-warning-bg);color:#8E7A35;}
.cp-todo-time.is-soon{background:var(--pw-success-bg);color:var(--pw-bosque);}
.cp-todo-arrow{width:14px;height:14px;color:var(--pw-text-muted);}

/* ═══ Clientes ═══ */
.cp-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.cp-chip{padding:8px 16px;border:1px solid var(--pw-border);border-radius:100px;background:#fff;color:var(--pw-text-soft);font-size:13px;font-weight:500;transition:all .15s var(--pw-ease);}
.cp-chip:hover{border-color:var(--pw-border-strong);color:var(--pw-carbon);}
.cp-chip.is-on{background:var(--pw-bosque);color:#fff;border-color:var(--pw-bosque);font-weight:600;}
.cp-chip-count{margin-left:6px;padding:0 6px;font-size:11px;font-weight:700;background:rgba(45,106,79,.12);color:var(--pw-bosque-dark);border-radius:100px;}
.cp-chip.is-on .cp-chip-count{background:rgba(255,255,255,.22);color:#fff;}
.cp-sort{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--pw-text-soft);}
.cp-clients-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;}
.cp-client{background:#fff;border:1px solid var(--pw-border);border-radius:16px;padding:16px 18px 14px;box-shadow:var(--pw-shadow-xs);display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:all .2s var(--pw-ease);}
.cp-client:hover{transform:translateY(-2px);box-shadow:var(--pw-shadow-md);border-color:var(--pw-border-strong);}
.cp-client-head{display:flex;align-items:center;gap:11px;}
.cp-client-photo{width:44px;height:44px;border-radius:50%;object-fit:cover;flex-shrink:0;}
.cp-client-id{flex:1;min-width:0;}
.cp-client-name{font-family:var(--pw-serif);font-weight:500;font-size:15px;color:var(--pw-carbon);letter-spacing:-.3px;line-height:1.15;}
.cp-client-role{font-size:11px;color:var(--pw-text-soft);margin-top:2px;}
.cp-client-medal{width:36px;height:36px;object-fit:contain;flex-shrink:0;}
.cp-client-last{font-size:12px;font-weight:500;}
.cp-client-last.is-fresh{color:var(--pw-bosque);}
.cp-client-last.is-stale{color:var(--pw-danger);}
.cp-client-last.is-mid{color:var(--pw-text-soft);}
.cp-client-last::before{content:"●";margin-right:6px;font-size:8px;vertical-align:middle;}
.cp-week{display:flex;align-items:center;gap:8px;}
.cp-week-label{font-size:11px;color:var(--pw-text-soft);font-weight:500;}
.cp-week-dots{display:flex;gap:4px;flex:1;}
.cp-week-dot{flex:1;height:5px;border-radius:100px;background:rgba(45,106,79,.08);}
.cp-week-dot.is-done{background:var(--pw-sendero);}
.cp-week-dot.is-current{background:var(--pw-bosque);box-shadow:0 0 0 2px rgba(82,183,136,.20);}
.cp-client-foot{display:flex;gap:6px;padding-top:8px;border-top:1px solid var(--pw-border);}
.cp-client-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:100px;font-size:10px;font-weight:700;background:var(--pw-niebla-2);color:var(--pw-text-soft);}
.cp-client-pill.is-pending{background:rgba(233,196,106,.22);color:#8E7A35;}
.cp-client-pill.is-published{background:var(--pw-success-bg);color:var(--pw-bosque);}

/* ═══ Links ═══ */
.cp-link-group{display:flex;flex-direction:column;}
.cp-link-row{display:flex;align-items:center;gap:10px;padding:14px 22px;border-bottom:1px solid var(--pw-border);}
.cp-link-row:last-child{border-bottom:none;}
.cp-link-tag{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;background:rgba(82,183,136,.14);color:var(--pw-bosque);flex-shrink:0;}
.cp-link-info{flex:1;min-width:0;}
.cp-link-label{font-size:13px;font-weight:600;color:var(--pw-carbon);}
.cp-link-desc{font-size:11px;color:var(--pw-text-soft);margin-top:2px;}
.cp-link-url{font-family:var(--pw-mono);font-size:11px;background:var(--pw-niebla-2);padding:6px 10px;border-radius:8px;color:var(--pw-text-soft);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cp-link-actions{display:flex;gap:6px;flex-shrink:0;}
.cp-icon-btn{width:34px;height:34px;border:1px solid var(--pw-border);border-radius:9px;background:#fff;color:var(--pw-text-soft);display:inline-flex;align-items:center;justify-content:center;transition:all .15s var(--pw-ease);}
.cp-icon-btn:hover{border-color:var(--pw-bosque);color:var(--pw-bosque);background:var(--pw-success-bg);}
.cp-icon-btn.is-copied{background:var(--pw-bosque);color:#fff;border-color:var(--pw-bosque);}
.cp-client-link-row{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--pw-border);}
.cp-client-link-row:last-child{border-bottom:none;}
.cp-client-link-row img{width:32px;height:32px;border-radius:50%;object-fit:cover;flex-shrink:0;}
.cp-client-link-name{flex:1;font-size:13px;font-weight:500;color:var(--pw-carbon);}

/* ═══ Plan y pagos ═══ */
.cp-plan-card{background:linear-gradient(135deg,#1B4332 0%,#2D6A4F 100%);color:#fff;border-radius:18px;padding:28px 30px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:22px;position:relative;overflow:hidden;isolation:isolate;}
.cp-plan-card::after{content:"";position:absolute;right:-120px;top:-120px;width:240px;height:240px;border-radius:50%;background:rgba(82,183,136,.12);pointer-events:none;z-index:0;}
.cp-plan-card>*{position:relative;z-index:1;}
.cp-plan-eyebrow{font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--pw-sendero);}
.cp-plan-name{font-family:var(--pw-serif);font-size:32px;font-weight:500;letter-spacing:-1px;margin-top:6px;line-height:1;}
.cp-plan-price{font-size:13px;color:rgba(255,255,255,.78);margin-top:8px;}
.cp-plan-price strong{color:#fff;font-weight:600;font-size:14px;}
.cp-plan-meta{font-size:12px;color:rgba(255,255,255,.62);margin-top:14px;}
.cp-plan-actions{display:flex;flex-direction:column;gap:8px;align-items:flex-end;z-index:1;}
.cp-plan-btn-up{background:#fff;color:var(--pw-bosque-dark);padding:10px 18px;border-radius:10px;font-weight:700;font-size:13px;}
.cp-plan-btn-mng{color:rgba(255,255,255,.78);font-size:12px;font-weight:500;padding:4px 6px;}
.cp-plan-btn-mng:hover{color:#fff;}
.cp-bill-table{width:100%;border-collapse:collapse;}
.cp-bill-table th{text-align:left;font-size:10px;font-weight:700;color:var(--pw-text-muted);text-transform:uppercase;letter-spacing:.5px;padding:10px 12px;border-bottom:1px solid var(--pw-border);}
.cp-bill-table td{padding:11px 12px;border-bottom:1px solid var(--pw-border);font-size:13px;color:var(--pw-text);vertical-align:middle;}
.cp-bill-table tr:last-child td{border-bottom:none;}
.cp-bill-table tr:hover td{background:var(--pw-niebla-2);}
.cp-bill-status{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:100px;font-size:11px;font-weight:600;}
.cp-bill-status.is-paid{background:var(--pw-success-bg);color:var(--pw-bosque);}
.cp-bill-status.is-paid::before{content:"✓";}
.cp-bill-amount{font-family:var(--pw-serif);font-size:16px;font-weight:500;color:var(--pw-carbon);letter-spacing:-.3px;}
.cp-pm-row{display:flex;align-items:center;gap:16px;padding:18px 22px;}
.cp-pm-brand{width:48px;height:32px;border-radius:6px;background:linear-gradient(135deg,#2A6FDB,#1B4332);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:11px;letter-spacing:.5px;}
.cp-pm-info{flex:1;}
.cp-pm-name{font-size:14px;font-weight:600;color:var(--pw-carbon);}
.cp-pm-exp{font-size:12px;color:var(--pw-text-soft);margin-top:2px;}
.cp-reassurance{margin-top:8px;padding:14px 18px;background:var(--pw-niebla-2);border-left:3px solid var(--pw-sendero);border-radius:0 12px 12px 0;font-size:13px;color:var(--pw-text-soft);line-height:1.55;}
/* Demo interactivo de María */
.cp-demo-banner{padding:16px 18px;background:linear-gradient(135deg,var(--pw-niebla-2),#fff);border:1px dashed var(--pw-sendero);border-radius:14px;}
.cp-demo-banner.is-done{border-style:solid;border-color:var(--pw-bosque);background:var(--pw-success-bg,#eef5f0);}
.cp-demo-overlay{position:fixed;inset:0;background:rgba(20,30,25,.55);backdrop-filter:blur(3px);z-index:9000;display:flex;align-items:center;justify-content:center;animation:cpAiIn .25s ease;}
.cp-demo-card{background:#fff;border-radius:18px;padding:30px 34px;max-width:340px;width:88%;text-align:center;box-shadow:var(--pw-shadow-lg);}
.cp-demo-spin{width:46px;height:46px;margin:0 auto 16px;border:4px solid var(--pw-niebla-2);border-top-color:var(--pw-bosque);border-radius:50%;animation:cpSpin .8s linear infinite;}
@keyframes cpSpin{to{transform:rotate(360deg);}}
.cp-demo-title{font-size:17px;font-weight:800;color:var(--pw-carbon);margin-bottom:6px;}
.cp-demo-step{font-size:13px;color:var(--pw-text-soft);min-height:34px;line-height:1.4;transition:opacity .2s;}
.cp-demo-bar{height:7px;background:var(--pw-niebla-2);border-radius:100px;overflow:hidden;margin:10px 0 12px;}
.cp-demo-bar>span{display:block;height:100%;width:8%;background:var(--pw-bosque);border-radius:100px;transition:width .55s ease;}
.cp-demo-note{font-size:11px;color:var(--pw-text-soft);letter-spacing:.4px;text-transform:uppercase;font-weight:700;opacity:.7;}
.cp-conf{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;z-index:9001;pointer-events:none;animation:cpConfFall 2.4s ease-in forwards;}
@keyframes cpConfFall{to{transform:translateY(104vh) rotate(560deg);opacity:.2;}}
@media (prefers-reduced-motion:reduce){.cp-demo-spin{animation:none;}.cp-conf{display:none;}}
/* Carteles "Empieza por aquí" (camino de activación del coach) */
.cp-path .cp-path-medal{display:flex;align-items:center;gap:8px;}
.cp-path-step{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:12px;border:1px solid var(--pw-border);transition:opacity .3s,background .3s;}
.cp-path-step.is-current{border-color:var(--pw-bosque);background:linear-gradient(135deg,var(--pw-niebla-2),#fff);}
.cp-path-step.is-done{opacity:.6;}
.cp-path-step.is-locked{opacity:.5;}
.cp-path-num,.cp-path-check{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;}
.cp-path-num{background:var(--pw-niebla-2);color:var(--pw-text-soft);}
.cp-path-step.is-current .cp-path-num{background:var(--pw-bosque);color:#fff;}
.cp-path-check{background:var(--pw-bosque);color:#fff;}
.cp-path-body{flex:1;min-width:0;}
.cp-path-label{font-size:14px;font-weight:700;color:var(--pw-carbon);}
.cp-path-desc{font-size:12px;color:var(--pw-text-soft);margin-top:1px;}
.cp-path-donetag{font-size:12px;font-weight:700;color:var(--pw-bosque);}
.cp-path-soon{font-size:12px;color:var(--pw-text-soft);}
.cp-ph{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1px solid var(--pw-border);transition:opacity .3s;}
.cp-ph-lock{opacity:.5;}
.cp-ph-done{opacity:.75;background:var(--pw-niebla-2);align-items:center;}
.cp-ph-cur{border-color:var(--pw-bosque);background:linear-gradient(135deg,var(--pw-niebla-2),#fff);}
.cp-ph-num{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;background:var(--pw-niebla-2);color:var(--pw-text-soft);}
.cp-ph-num.is-on{background:var(--pw-bosque);color:#fff;}
.cp-ph-body{flex:1;min-width:0;}
.cp-ph-title{font-size:14px;font-weight:700;color:var(--pw-carbon);}
.cp-ph-sub{font-size:12px;color:var(--pw-text-soft);margin-top:1px;}
.cp-ph-btns{display:flex;flex-direction:column;gap:7px;margin-top:11px;}
.cp-ph-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:9px;border:1px solid var(--pw-border);background:#fff;font-size:13px;font-weight:600;color:var(--pw-carbon);cursor:pointer;font-family:inherit;transition:border-color .15s,background .15s;}
.cp-ph-btn:hover:not(.is-done){border-color:var(--pw-bosque);background:var(--pw-niebla-2);}
.cp-ph-btn.is-done{color:var(--pw-text-soft);cursor:default;}
.cp-ph-btn-ic{flex:0 0 auto;color:var(--pw-bosque);display:inline-flex;}
/* Burbuja guía sobre el botón del menú */
.cp-side-nav-wrap{position:relative;}
.cp-guide-bubble{position:absolute;left:6px;right:6px;bottom:calc(100% + 9px);background:#fff;color:var(--pw-carbon);font-size:12.5px;font-weight:700;line-height:1.3;padding:10px 12px 11px;border-radius:13px;box-shadow:0 12px 30px rgba(0,0,0,.28);z-index:40;animation:cpBubbleIn .4s var(--pw-ease-out);}
.cp-guide-step{display:block;font-size:9px;font-weight:800;color:var(--pw-bosque);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px;}
.cp-guide-arrow{position:absolute;left:26px;bottom:-6px;width:13px;height:13px;background:#fff;transform:rotate(45deg);box-shadow:3px 3px 6px rgba(0,0,0,.06);}
.cp-guide-x{position:absolute;top:5px;right:6px;width:18px;height:18px;border:0;background:transparent;color:var(--pw-text-muted);font-size:15px;line-height:1;cursor:pointer;border-radius:50%;}
.cp-guide-x:hover{background:var(--pw-niebla-2);color:var(--pw-carbon);}
/* Burbuja guía dentro de una pantalla (sobre el campo que falta) */
.cp-iguide{display:inline-block;background:var(--pw-bosque);color:#fff;font-size:12.5px;font-weight:700;line-height:1.3;padding:8px 13px;border-radius:12px;margin-bottom:9px;box-shadow:0 7px 18px rgba(31,87,64,.3);animation:cpBubbleIn .35s var(--pw-ease-out);}
.cp-side-coach-badge{display:inline-flex;align-items:center;gap:7px;margin-top:5px;}
.cp-side-coach-badge span{font-size:11px;font-weight:600;color:rgba(255,255,255,.72);letter-spacing:.3px;}
.cp-side-coach-medal{width:52px!important;height:52px!important;border:0!important;border-radius:0!important;box-shadow:none!important;object-fit:contain!important;flex:0 0 auto;}
.cp-reassurance strong{color:var(--pw-bosque);font-weight:600;}
.cp-stripe-row{display:flex;align-items:center;gap:16px;padding:18px 22px;}
.cp-stripe-logo{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#635BFF,#4F46E5);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-family:var(--pw-serif);font-weight:600;font-size:20px;flex-shrink:0;}
.cp-stripe-info{flex:1;min-width:0;}
.cp-stripe-name{font-size:14px;font-weight:600;color:var(--pw-carbon);}
.cp-stripe-meta{font-size:12px;color:var(--pw-text-soft);margin-top:2px;}
.cp-stripe-amount{font-family:var(--pw-serif);font-size:18px;font-weight:500;color:var(--pw-bosque);letter-spacing:-.4px;}
.cp-stripe-amount small{font-size:11px;color:var(--pw-text-muted);font-weight:400;margin-left:4px;}

/* ═══ Configuración ═══ */
.cp-cfg-layout{display:grid;grid-template-columns:220px 1fr;gap:18px;align-items:start;}
.cp-ficha-layout3{display:grid;grid-template-columns:220px 1fr 242px;gap:18px;align-items:start;}
.cp-ficha-rail{position:sticky;top:16px;display:flex;flex-direction:column;gap:13px;}
.cp-ficha-rail .cp-btn{width:100%;justify-content:flex-start;}
@media (max-width:1040px){.cp-ficha-layout3{grid-template-columns:200px 1fr;}.cp-ficha-rail{grid-column:1 / -1;flex-direction:row;flex-wrap:wrap;}.cp-ficha-rail .cp-card{flex:1;min-width:200px;}}
@media (max-width:760px){.cp-ficha-layout3{grid-template-columns:1fr;}.cp-ficha-rail{position:static;flex-direction:column;}}
.cp-ses-hero{background:linear-gradient(135deg,var(--pw-bosque),var(--pw-bosque-dark));color:#fff;border-radius:14px;padding:18px 22px;margin-bottom:14px;box-shadow:var(--pw-shadow-sm);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;}
.cp-ses-hero-lbl{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;opacity:.85;}
.cp-ses-hero-date{font-family:var(--pw-serif);font-size:24px;font-weight:500;margin-top:4px;}
.cp-ses-hero-sub{font-size:12.5px;opacity:.85;margin-top:3px;}
.cp-tl{position:relative;padding-left:22px;}
.cp-tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--pw-border-strong);}
.cp-tl-item{position:relative;padding:11px 0 11px 0;border-bottom:1px solid var(--pw-border);}
.cp-tl-item:last-child{border-bottom:none;}
.cp-tl-dot{position:absolute;left:-22px;top:15px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--pw-sendero);}
/* casilla de acciones — estilo del mockup (cuadrado redondeado verde con check) */
.cp-act-cb{appearance:none;-webkit-appearance:none;width:18px;height:18px;border-radius:5px;border:2px solid var(--pw-border-strong);cursor:pointer;flex-shrink:0;position:relative;margin:0;background:#fff;}
.cp-act-cb:checked{background:var(--pw-bosque);border-color:var(--pw-bosque);}
.cp-act-cb:checked::after{content:"✓";color:#fff;font-size:12px;font-weight:700;position:absolute;top:-2px;left:2px;line-height:1;}
.cp-cfg-nav{background:#fff;border:1px solid var(--pw-border);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;}
/* REGLA DE DISENO: en el panel TODOS los emojis van en gris (no a color).
 * Envolver cada emoji de UI en <span class='cp-emo'>…</span> en vez de repetir
 * el filtro inline. Una sola fuente de verdad para mantenerlo unificado. */
.cp-emo{display:inline-block;filter:grayscale(1);opacity:.55;font-style:normal;}
.cp-cfg-nav-item .cp-emo{width:18px;flex-shrink:0;text-align:center;}
.cp-cfg-nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;font-size:13px;font-weight:500;color:var(--pw-text-soft);border-radius:8px;text-align:left;transition:all .15s;cursor:pointer;}
.cp-cfg-nav-item:hover{background:var(--pw-niebla-2);color:var(--pw-carbon);}
.cp-cfg-nav-item.is-on{background:var(--pw-success-bg);color:var(--pw-bosque);font-weight:600;}
.cp-cfg-nav-icon{width:15px;height:15px;opacity:.85;}
.cp-cfg-panel{display:flex;flex-direction:column;gap:13px;}
/* Admin: tarjetas de coach */
.cp-coach-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.cp-emb-split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start;}
.cp-emb-side{border-left:1px solid var(--pw-border);padding-left:20px;}
.cp-cpc-row{transition:background .12s;} .cp-cpc-row:hover{background:var(--pw-niebla-2);}
@media(max-width:880px){.cp-emb-split{grid-template-columns:1fr;}.cp-emb-side{border-left:none;border-top:1px solid var(--pw-border);padding-left:0;padding-top:14px;}}
.cp-coach{background:#fff;border:1px solid var(--pw-border);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:11px;}
.cp-coach.off{opacity:.55;}
.cp-coach-top{display:flex;align-items:center;gap:11px;}
.cp-coach-av{width:42px;height:42px;border-radius:50%;object-fit:cover;flex-shrink:0;}
.cp-coach-av-i{background:var(--pw-success-bg);color:var(--pw-bosque);display:flex;align-items:center;justify-content:center;font-family:var(--pw-serif);font-weight:600;font-size:16px;}
.cp-coach-nm{font-family:var(--pw-serif);font-size:15px;font-weight:500;color:var(--pw-carbon);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cp-coach-meta{font-size:11px;color:var(--pw-text-soft);margin-top:2px;}
.cp-coach-health{margin-left:auto;flex-shrink:0;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;}
.cp-coach-health.ok{background:var(--pw-success-bg);color:var(--pw-bosque);}
.cp-coach-health.warn{background:rgba(233,196,106,.22);color:#8E7A35;}
.cp-coach-health.danger{background:rgba(180,69,58,.12);color:var(--pw-danger);}
.cp-coach-badges{display:flex;gap:6px;flex-wrap:wrap;}
.cp-coach-b{font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--pw-niebla);color:var(--pw-text-soft);}
.cp-coach-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.cp-coach-st{background:var(--pw-niebla);border-radius:9px;padding:7px 8px;text-align:center;}
.cp-coach-st .v{font-size:14px;font-weight:700;color:var(--pw-carbon);}
.cp-coach-st .k{font-size:9px;color:var(--pw-text-soft);text-transform:uppercase;letter-spacing:.03em;margin-top:2px;}
.cp-coach-flags{display:flex;gap:14px;font-size:12px;color:var(--pw-text-soft);flex-wrap:wrap;}
.cp-coach-setup{font-size:12px;color:var(--pw-text-soft);}
.cp-coach-acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--pw-border);padding-top:10px;}
/* Tarjeta de coach ordenada: chips de conexion + menu de gestion (...) */
.cp-coach-chips{display:flex;gap:6px;flex-wrap:wrap;}
.cp-chipk{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:100px;border:1px solid var(--pw-border);color:var(--pw-text-muted);background:var(--pw-niebla);}
.cp-chipk.on{color:var(--pw-bosque);background:rgba(82,183,136,.10);border-color:rgba(82,183,136,.3);}
.cp-more{position:relative;}
.cp-more-btn{list-style:none;cursor:pointer;width:34px;height:30px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--pw-border-strong,rgba(45,106,79,.22));border-radius:8px;font-size:17px;line-height:1;color:var(--pw-text-muted);background:#fff;}
.cp-more-btn::-webkit-details-marker{display:none;}
.cp-more[open]>.cp-more-btn{background:var(--pw-niebla-2);color:var(--pw-carbon);}
.cp-more-menu{position:absolute;right:0;top:34px;z-index:30;background:#fff;border:1px solid var(--pw-border);border-radius:10px;box-shadow:0 8px 24px rgba(45,106,79,.16);padding:6px;display:flex;flex-direction:column;gap:3px;min-width:160px;}
.cp-more-menu>button{justify-content:flex-start!important;width:100%;margin-right:0!important;}
@media(max-width:760px){.cp-coach-grid{grid-template-columns:1fr;}}
.cp-form-row{display:flex;flex-direction:column;gap:5px;}
.cp-form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
.cp-form-label{font-size:11px;font-weight:700;color:var(--pw-text-soft);text-transform:uppercase;letter-spacing:1px;}
.cp-form-input,.cp-form-textarea,.cp-form-select{background:#fff;border:1.5px solid var(--pw-border-input);border-radius:10px;padding:11px 14px;font-size:14px;color:var(--pw-carbon);transition:all .2s;outline:none;width:100%;font-family:inherit;}
.cp-form-input:focus,.cp-form-textarea:focus,.cp-form-select:focus{border-color:var(--pw-bosque);background:var(--pw-niebla);box-shadow:var(--pw-focus-ring);}
.cp-form-textarea{min-height:80px;resize:vertical;}
/* Un input solo (fila completa) no se estira a toda la pantalla; los textarea sí. */
.cp-form-input{max-width:520px;}
/* Dentro de grillas de 2/3 columnas el input llena su celda → columnas parejas, sin huecos. */
.cp-form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px;}
.cp-form-row-2 .cp-form-input,.cp-form-row-3 .cp-form-input{max-width:none;}
/* Campo + botón en la misma fila (ej. contraseña): menos scroll vertical. */
.cp-inline-row{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;}
.cp-inline-row .cp-form-row{flex:1;min-width:200px;}
.cp-inline-row .cp-form-input{max-width:none;}
.cp-form-hint{font-size:11px;color:var(--pw-text-muted);}
.cp-form-hint code{background:var(--pw-niebla-2);padding:1px 6px;border-radius:4px;}
.cp-photo-pick{display:flex;align-items:center;gap:18px;}
.cp-photo-pick img{width:112px;height:112px;border-radius:50%;object-fit:cover;box-shadow:var(--pw-shadow-sm);}
.cp-photo-actions{display:flex;flex-direction:column;gap:6px;align-items:flex-start;}
.cp-photo-btn{font-size:12px;font-weight:600;padding:7px 14px;border-radius:8px;border:1px solid var(--pw-border);background:#fff;color:var(--pw-carbon);}
.cp-photo-btn:hover{border-color:var(--pw-bosque);color:var(--pw-bosque);}
.cp-photo-remove{font-size:11px;color:var(--pw-text-muted);padding:4px 6px;}
.cp-toggle{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--pw-border);}
.cp-toggle:last-child{border-bottom:none;}
.cp-toggle-body{flex:1;padding-right:18px;}
.cp-toggle-title{font-size:14px;font-weight:600;color:var(--pw-carbon);}
.cp-toggle-desc{font-size:12px;color:var(--pw-text-soft);margin-top:2px;}
.cp-switch{width:38px;height:22px;border-radius:100px;background:rgba(45,106,79,.18);position:relative;transition:background .15s;cursor:pointer;flex-shrink:0;}
.cp-switch.is-on{background:var(--pw-bosque);}
.cp-switch>span{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);transition:transform .15s;}
.cp-switch.is-on>span{transform:translateX(16px);}
.cp-service-card{display:grid;grid-template-columns:1fr auto;gap:16px;padding:16px 18px;background:var(--pw-niebla-2);border-radius:12px;align-items:center;}
.cp-service-name{font-size:14px;font-weight:600;color:var(--pw-carbon);}
.cp-service-desc{font-size:12px;color:var(--pw-text-soft);margin-top:3px;}
.cp-service-price{font-family:var(--pw-serif);font-size:22px;font-weight:500;color:var(--pw-bosque);letter-spacing:-.5px;}
.cp-service-price small{font-size:11px;color:var(--pw-text-muted);font-weight:400;}
.cp-integration{display:grid;grid-template-columns:36px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--pw-border);}
.cp-integration:last-child{border-bottom:none;}
.cp-integration-icon{width:36px;height:36px;border-radius:9px;background:var(--pw-niebla-2);display:flex;align-items:center;justify-content:center;color:var(--pw-bosque);}
.cp-integration-info{min-width:0;}
.cp-integration-name{font-size:14px;font-weight:600;color:var(--pw-carbon);}
.cp-integration-status{font-size:11px;color:var(--pw-text-soft);margin-top:2px;}
.cp-integration-status.is-connected{color:var(--pw-bosque);font-weight:600;}
.cp-integration-status.is-connected::before{content:"● ";}

/* ═══ Asistente cabra ═══ */
.cp-inbox-fab{position:fixed;top:16px;right:22px;z-index:75;display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
.cp-inbox-btn{position:relative;width:42px;height:42px;border-radius:50%;background:#fff;border:1.5px solid var(--pw-border);color:var(--pw-bosque);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--pw-shadow-sm);transition:transform .15s var(--pw-ease),box-shadow .15s;}
.cp-inbox-btn:hover{transform:translateY(-1px);box-shadow:var(--pw-shadow-md);}
.cp-inbox-badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:100px;background:var(--pw-danger);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--pw-niebla);}
.cp-inbox-panel{width:330px;background:#fff;border:1.5px solid var(--pw-border);border-radius:14px;box-shadow:0 14px 36px rgba(45,106,79,.18),0 2px 6px rgba(0,0,0,.06);overflow:hidden;}
.cp-inbox-hd{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--pw-border);font-family:var(--pw-serif);font-size:15px;font-weight:500;color:var(--pw-carbon);}
.cp-inbox-x{width:24px;height:24px;border-radius:50%;border:none;background:transparent;color:var(--pw-text-muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;}
.cp-inbox-x:hover{background:var(--pw-niebla-2);color:var(--pw-carbon);}
.cp-inbox-list{max-height:400px;overflow-y:auto;}
.cp-inbox-row{display:flex;align-items:center;gap:11px;width:100%;padding:11px 14px;border:none;background:transparent;border-bottom:1px solid var(--pw-border);cursor:pointer;}
.cp-inbox-row:hover{background:var(--pw-niebla-2);}
.cp-inbox-row.is-unread{background:rgba(82,183,136,.07);}
.cp-inbox-av{width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0;}
.cp-inbox-name{font-size:13px;font-weight:700;color:var(--pw-carbon);display:flex;align-items:center;gap:6px;}
.cp-inbox-dot{width:7px;height:7px;border-radius:50%;background:var(--pw-danger);display:inline-block;}
.cp-inbox-snip{font-size:12px;color:var(--pw-text-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px;}
.cp-ai-fab{position:fixed;right:22px;bottom:18px;z-index:60;display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none;}
.cp-ai-fab>*{pointer-events:auto;}
/* Cabra discreta también en desktop (como en móvil): botón circular chico abajo
   a la derecha. La burbuja grande de onboarding queda oculta; el ícono sigue
   abriendo el chat. */
.cp-cabra-bubble{display:none !important;}
.cp-cabra-bubble--legacy{background:#fff;border:1px solid var(--pw-border);border-radius:16px;padding:14px 32px 14px 16px;width:280px;box-shadow:0 14px 36px rgba(45,106,79,.18),0 2px 6px rgba(0,0,0,.06);position:relative;cursor:pointer;transition:transform .2s var(--pw-ease);animation:cpBubbleIn .35s var(--pw-ease-out);}
.cp-cabra-bubble:hover{transform:translateY(-2px);}
@keyframes cpBubbleIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.cp-cabra-bubble::after{content:"";position:absolute;right:38px;bottom:-7px;width:14px;height:14px;transform:rotate(45deg);background:#fff;border-right:1px solid var(--pw-border);border-bottom:1px solid var(--pw-border);}
.cp-cabra-bubble-step{font-size:9px;font-weight:700;color:var(--pw-bosque);text-transform:uppercase;letter-spacing:1.2px;}
.cp-cabra-bubble-title{font-family:var(--pw-serif);font-size:16px;font-weight:500;color:var(--pw-carbon);letter-spacing:-.3px;margin-top:4px;line-height:1.25;}
.cp-cabra-bubble-desc{font-size:12px;color:var(--pw-text-soft);margin-top:4px;line-height:1.4;}
.cp-cabra-bubble-cta{font-size:12px;font-weight:600;color:var(--pw-bosque);margin-top:8px;display:inline-flex;align-items:center;gap:4px;}
.cp-cabra-bubble-close{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--pw-text-muted);background:transparent;}
.cp-cabra-bubble-close:hover{background:var(--pw-niebla-2);color:var(--pw-carbon);}
.cp-cabra-mini-bubble{background:#fff;border:1px solid var(--pw-border);border-radius:100px;padding:7px 14px;box-shadow:var(--pw-shadow-sm);font-size:12px;font-weight:500;color:var(--pw-carbon);cursor:pointer;transition:all .2s var(--pw-ease);}
.cp-cabra-mini-bubble:hover{transform:translateY(-2px);box-shadow:var(--pw-shadow-md);}
/* Desktop: la cabra flota como sticker transparente (sin botón/círculo blanco).
   En móvil, el @media de abajo le devuelve el círculo blanco (botón). */
.cp-cabra-img-wrap{width:88px;height:88px;cursor:pointer;transition:transform .25s var(--pw-ease);position:relative;display:flex;align-items:center;justify-content:center;}
.cp-cabra-img-wrap:hover{transform:scale(1.06);}
.cp-cabra-img-wrap img{width:100%;height:100%;object-fit:contain;pointer-events:none;filter:drop-shadow(0 6px 9px rgba(45,106,79,.25));}
@keyframes cpCabraFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
@keyframes cpCabraPoke{0%{transform:scale(1) rotate(0);}25%{transform:scale(1.16) rotate(-5deg);}55%{transform:scale(.94) rotate(4deg);}80%{transform:scale(1.04) rotate(-2deg);}100%{transform:scale(1) rotate(0);}}
@keyframes cpDotPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
.cp-ai-panel{position:fixed;right:20px;bottom:20px;z-index:60;width:340px;height:480px;max-height:calc(100vh - 110px);background:#fff;border-radius:18px;box-shadow:0 24px 60px rgba(45,106,79,.25),0 4px 12px rgba(0,0,0,.10);display:flex;flex-direction:column;overflow:hidden;animation:cpAiIn .25s var(--pw-ease-out);}
/* Modo guía: alto ajustado al contenido (sin el hueco vacío cuando hay poco). */
.cp-ai-panel--guide{height:auto;max-height:calc(100vh - 110px);}
/* Modo chat: el panel baja desde el ícono de chat de arriba (no desde la cabra). */
.cp-ai-panel--chat{top:62px;bottom:auto;right:14px;animation:cpChatIn .22s var(--pw-ease-out);}
@keyframes cpChatIn{from{opacity:0;transform:translateY(-12px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
/* Cabecera del chat: limpia (blanca con acentos verdes), no el bloque verde pesado. */
.cp-ai-panel--chat .cp-ai-head{background:#fff;color:var(--pw-carbon);border-bottom:1px solid var(--pw-border);}
.cp-ai-panel--chat .cp-ai-name{color:var(--pw-carbon);}
.cp-ai-panel--chat .cp-ai-status{color:var(--pw-text-soft);}
.cp-ai-panel--chat .cp-ai-close{background:var(--pw-niebla-2);color:var(--pw-text-muted);}
.cp-ai-panel--chat .cp-ai-close:hover{background:var(--pw-niebla);color:var(--pw-carbon);}
.cp-ai-panel--chat .cp-ai-head-cabra{background:var(--pw-success-bg);color:var(--pw-bosque);box-shadow:none;}
@keyframes cpAiIn{from{opacity:0;transform:translateY(12px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}
.cp-ai-head{padding:16px 16px 14px;background:linear-gradient(135deg,#1B4332 0%,#2D6A4F 100%);color:#fff;display:flex;align-items:center;gap:11px;flex-shrink:0;}
.cp-ai-head-cabra{width:42px;height:42px;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.12);}
.cp-ai-head-cabra img{width:84%;height:84%;object-fit:contain;}
.cp-ai-name{font-family:var(--pw-serif);font-size:15px;font-weight:500;line-height:1.15;}
.cp-ai-status{font-size:11px;color:rgba(255,255,255,.7);margin-top:2px;display:flex;align-items:center;gap:5px;}
.cp-ai-status::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--pw-sendero);}
.cp-ai-close{margin-left:auto;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.10);color:#fff;display:inline-flex;align-items:center;justify-content:center;transition:background .15s;}
.cp-ai-close:hover{background:rgba(255,255,255,.20);}
.cp-ai-tabs{display:flex;padding:0 14px;gap:4px;background:#fff;border-bottom:1px solid var(--pw-border);flex-shrink:0;}
.cp-ai-tab{flex:1;padding:11px 8px;font-size:12px;font-weight:600;color:var(--pw-text-soft);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;}
.cp-ai-tab:hover{color:var(--pw-carbon);}
.cp-ai-tab.is-on{color:var(--pw-bosque);border-bottom-color:var(--pw-bosque);}
.cp-ai-scroll{flex:1;overflow-y:auto;}
.cp-ai-scroll::-webkit-scrollbar{width:6px;}
.cp-ai-scroll::-webkit-scrollbar-thumb{background:rgba(45,106,79,.15);border-radius:3px;}
.cp-ai-home{padding:13px 15px 15px;display:flex;flex-direction:column;gap:12px;}
.cp-ob-mini{background:linear-gradient(135deg,#F0F7F2 0%,#E8F2EC 100%);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;}
.cp-ob-mini-top{display:flex;justify-content:space-between;align-items:center;}
.cp-ob-mini-title{font-family:var(--pw-serif);font-size:15px;font-weight:500;letter-spacing:-.3px;color:var(--pw-carbon);}
.cp-ob-mini-pct{font-family:var(--pw-serif);font-size:18px;font-weight:600;color:var(--pw-bosque);}
.cp-ob-bar{height:6px;border-radius:100px;background:rgba(45,106,79,.10);overflow:hidden;}
.cp-ob-bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--pw-sendero),var(--pw-bosque));border-radius:100px;transition:width .6s var(--pw-ease);}
.cp-ob-next{font-size:12px;color:var(--pw-text-soft);display:flex;align-items:center;gap:6px;}
.cp-ob-next strong{color:var(--pw-bosque);font-weight:600;}
.cp-ob-next-cta{margin-left:auto;font-size:11px;font-weight:600;color:var(--pw-bosque);}
.cp-ob-list{display:flex;flex-direction:column;gap:0;}
.cp-ob-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(45,106,79,.06);}
.cp-ob-row:last-child{border-bottom:none;}
.cp-ob-check{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;background:#fff;border:1.5px solid var(--pw-border-strong);color:var(--pw-text-muted);}
.cp-ob-row.is-done .cp-ob-check{background:var(--pw-bosque);border-color:var(--pw-bosque);color:#fff;}
.cp-ob-row.is-current .cp-ob-check{border-color:var(--pw-bosque);background:rgba(82,183,136,.18);color:var(--pw-bosque);}
.cp-ob-text{font-size:13px;color:var(--pw-carbon);flex:1;}
.cp-ob-row.is-done .cp-ob-text{color:var(--pw-text-soft);text-decoration:line-through;text-decoration-color:rgba(45,106,79,.3);}
.cp-ai-section-title{font-size:10px;font-weight:700;color:var(--pw-bosque);text-transform:uppercase;letter-spacing:1.2px;margin-top:4px;}
.cp-insight{display:grid;grid-template-columns:34px 1fr auto;gap:10px;padding:12px;background:#fff;border:1px solid var(--pw-border);border-radius:12px;align-items:center;cursor:pointer;transition:all .15s var(--pw-ease);margin-bottom:8px;}
.cp-insight:hover{border-color:var(--pw-border-strong);box-shadow:var(--pw-shadow-xs);transform:translateY(-1px);}
.cp-insight-icon{width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.cp-insight.is-warn .cp-insight-icon{background:var(--pw-warning-bg);color:#8E7A35;}
.cp-insight.is-danger .cp-insight-icon{background:var(--pw-danger-bg);color:var(--pw-danger);}
.cp-insight.is-ok .cp-insight-icon{background:var(--pw-success-bg);color:var(--pw-bosque);}
.cp-insight-body{min-width:0;}
.cp-insight-title{font-size:12px;font-weight:600;color:var(--pw-carbon);line-height:1.35;}
.cp-insight-desc{font-size:11px;color:var(--pw-text-soft);margin-top:2px;line-height:1.4;}
.cp-insight-arrow{color:var(--pw-text-muted);}
.cp-ai-body{padding:14px;display:flex;flex-direction:column;gap:10px;}
.cp-ai-bubble{max-width:86%;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.5;}
.cp-ai-bubble-them{background:var(--pw-niebla-2);color:var(--pw-text);border-bottom-left-radius:4px;align-self:flex-start;}
.cp-ai-bubble-me{background:var(--pw-bosque);color:#fff;border-bottom-right-radius:4px;align-self:flex-end;}
.cp-ai-suggest{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-self:flex-start;}
.cp-ai-chip{font-size:11px;padding:6px 11px;border-radius:100px;background:#fff;border:1px solid var(--pw-border);color:var(--pw-bosque);font-weight:500;cursor:pointer;transition:all .15s;}
.cp-ai-chip:hover{background:var(--pw-success-bg);border-color:var(--pw-bosque);}
.cp-ai-compose{border-top:1px solid var(--pw-border);padding:14px 16px;display:flex;gap:8px;flex-shrink:0;background:#fff;}
.cp-ai-compose input{flex:1;border:1px solid var(--pw-border);border-radius:10px;padding:9px 12px;font-size:13px;background:var(--pw-niebla);outline:none;transition:all .2s;}
.cp-ai-compose input:focus{border-color:var(--pw-bosque);background:#fff;box-shadow:var(--pw-focus-ring);}
.cp-ai-compose textarea{font-family:inherit;font-size:14px;color:var(--pw-carbon);line-height:1.5;padding:11px 13px;border:1px solid var(--pw-border);border-radius:10px;background:#fff;outline:none;transition:border-color .2s,box-shadow .2s;width:100%;min-height:64px;resize:vertical;}
.cp-ai-compose textarea:focus{border-color:var(--pw-bosque);box-shadow:var(--pw-focus-ring);}
.cp-ai-compose textarea::placeholder{color:var(--pw-text-soft);}
.cp-ai-send{width:38px;height:38px;border-radius:10px;background:var(--pw-bosque);color:#fff;display:inline-flex;align-items:center;justify-content:center;transition:all .15s;}
.cp-ai-send:hover{background:var(--pw-bosque-dark);}

/* ═══ Responsive — móvil/tablet (el prototipo era desktop-only) ═══ */
@media (max-width: 900px){
  .cp-app{ grid-template-columns:1fr; }
  /* iOS hace auto-zoom al enfocar un campo de <16px — forzamos 16px en móvil
     para que no "salte" la pantalla al escribir (búsqueda, formularios, chat). */
  input,textarea,select{ font-size:16px !important; }
  .cp-main{ height:auto; min-height:100vh; }
  /* Padding-top suficiente para que los íconos flotantes no tapen, pero más
     condensado para que entre más info sin scroll. */
  .cp-scroll{ padding:44px 14px 110px; height:auto; }
  .cp-container{ gap:12px; max-width:100%; }
  .cp-card-pad{ padding:14px 16px; }
  .cp-action{ padding:14px 16px; }
  .cp-side{
    position:fixed; left:0; right:0; bottom:0; top:auto;
    height:auto; flex-direction:row; align-items:stretch;
    padding:6px 6px max(6px, env(safe-area-inset-bottom));
    gap:0; z-index:50; overflow:visible;
    box-shadow:0 -6px 22px rgba(45,106,79,.20);
  }
  .cp-side-brand,.cp-side-coach,.cp-side-foot{ display:none; }
  .cp-side-nav{ flex-direction:row; flex:1; gap:0; }
  .cp-side-nav-wrap{ flex:1; display:flex; }
  .cp-side-nav-wrap > .cp-side-nav-item{ flex:1; }
  .cp-guide-bubble{ display:none; }
  .cp-side-nav-item{
    flex:1; flex-direction:column; gap:3px; padding:8px 2px;
    font-size:10px; justify-content:center; border-radius:10px;
  }
  .cp-side-nav-item.is-active{ background:rgba(255,255,255,.16); }
  .cp-side-nav-item.is-active::before{ display:none; }
  .cp-side-nav-item .cp-side-nav-icon{ width:21px; height:21px; }
  .cp-topbar{ flex-direction:column; align-items:stretch; gap:14px; }
  .cp-topbar-actions{ flex-wrap:wrap; }
  .cp-search{ width:100%; }
  .cp-h1{ font-size:28px; }
  /* Greet: foto a la izquierda (entre el brand y los íconos de la derecha)
     para que no quede tapada por los íconos circulares. */
  .cp-greet{ gap:13px; }
  .cp-greet > div{ flex:1; }
  .cp-greet img{ width:56px; height:56px; }
  .cp-greet-h1{ font-size:26px; }
  .cp-action-row{ grid-template-columns:1fr; }
  .cp-cfg-layout{ grid-template-columns:1fr; }
  .cp-cfg-nav{ position:static; flex-direction:row; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .cp-cfg-nav-item{ white-space:nowrap; flex-shrink:0; }
  .cp-form-row-2,.cp-form-row-3{ grid-template-columns:1fr; }
  .cp-plan-card{ grid-template-columns:1fr; gap:16px; }
  .cp-plan-actions{ flex-direction:row; align-items:stretch; flex-wrap:wrap; }
  .cp-stripe-row,.cp-pm-row{ flex-wrap:wrap; }
  .cp-link-row,.cp-client-link-row{ flex-wrap:wrap; }
  .cp-link-url{ max-width:100%; order:3; flex-basis:100%; }
  .cp-bill-table td{ padding:12px 14px; }
  .cp-ai-fab{ right:14px; bottom:96px; }
  #pw-mobile-logout{ display:inline-flex !important; }
  /* Topbar mobile — íconos circulares limpios, sin texto. Necesita !important
     porque los botones tienen estilo inline (mayor prioridad). */
  #pw-app-actions{ top:10px !important; right:10px !important; gap:8px !important; }
  #pw-app-actions button{
    width:38px !important; height:38px !important; padding:0 !important;
    border-radius:50% !important;
    display:inline-flex !important; align-items:center !important; justify-content:center !important;
    font-size:0 !important;          /* oculta el texto del botón, deja solo el ícono */
    overflow:hidden !important;
    gap:0 !important;
  }
  #pw-app-actions button svg{ width:18px !important; height:18px !important; flex-shrink:0 !important; }
  /* Inbox al lado de los otros, mismo tamaño y estilo. */
  .cp-inbox-fab{ top:10px; right:104px; }
  .cp-inbox-btn{ width:38px; height:38px; }
  .cp-inbox-btn svg{ width:18px; height:18px; }
  #pw-install-chip{ display:none !important; }
  /* Cabra (asistente IA) — chica y discreta en móvil. La burbuja con texto se
     oculta; queda solo el ícono circular. Se sigue tocando para abrir el panel. */
  .cp-cabra-bubble{ display:none !important; }
  /* Cabra: círculo blanco con sombra — la animación de 'volar' sigue, pero
     ahora flota DENTRO de su botón blanco (no como sticker transparente). */
  .cp-cabra-img-wrap{
    width:60px !important; height:60px !important;
    background:#fff !important; border-radius:50% !important;

function makeAvatar(name, hueOverride){
  name = (""+(name||"")).trim() || "·";
  var initials = name.split(/\s+/).map(function(p){return p[0];}).slice(0,2).join("").toUpperCase();
  var hash = name.split("").reduce(function(a,ch){return a+ch.charCodeAt(0);},0);
  var hues = [150,130,95,65,25,5,175,110];
  var hue = hueOverride!=null ? hueOverride : hues[hash%hues.length];
  var sat1=32,sat2=38,lt1=56,lt2=36;
  // OJO: usar comillas DOBLES en los atributos del SVG. encodeURIComponent
  // escapa las comillas dobles (%22) pero NO las simples — y este data URI se
  // inserta dentro de onerror="...this.src='AQUI'", así que una comilla simple
  // rompía el JS con "Unexpected identifier 'http'" (en xmlns='http...').
  var svg = "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\" width=\"100\" height=\"100\">"+
    "<defs><linearGradient id=\"g"+hash+"\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\">"+
    "<stop offset=\"0\" stop-color=\"hsl("+hue+", "+sat1+"%, "+lt1+"%)\"/>"+
    "<stop offset=\"1\" stop-color=\"hsl("+((hue+18)%360)+", "+sat2+"%, "+lt2+"%)\"/>"+
    "</linearGradient></defs>"+
    "<rect width=\"100\" height=\"100\" fill=\"url(#g"+hash+")\"/>"+
    "<text x=\"50\" y=\"63\" font-family=\"Inter,system-ui,sans-serif\" font-size=\"40\" font-weight=\"600\" fill=\"white\" text-anchor=\"middle\">"+initials+"</text>"+
    "</svg>";
  return "data:image/svg+xml;utf8,"+encodeURIComponent(svg);
}
// <img> que cae a iniciales si no hay foto o la foto está rota
function avImg(src, name, attrs){

}

// Progreso real del onboarding. Antes STEPS tenía los flags `done`
// hardcodeados, así que la cabra mostraba SIEMPRE el mismo mensaje sin
// importar lo que la coach ya hubiera hecho. Acá derivamos `done` de los
// datos reales; los pasos sin señal de datos (stripe, plantillas) se
// marcan al tocarlos y se recuerdan en localStorage.
function _onbKey(){ return "pw_onb_"+((COACH&&COACH.email)||(REAL&&RME&&RME.email)||"x"); }
function _onbManual(){ try{ return JSON.parse(localStorage.getItem(_onbKey())||"{}")||{}; }catch(e){ return {}; } }
function onbMark(id){ try{ var m=_onbManual(); m[id]=true; localStorage.setItem(_onbKey(), JSON.stringify(m)); }catch(e){} }
function computeSteps(){
  if(!REAL) return STEPS.map(function(s){ return Object.assign({}, s); });
  var man=_onbManual();
  var hasServices = !!(RCFG && Object.prototype.toString.call(RCFG.servicios)==="[object Array]" && RCFG.servicios.length);
  var hasSlug = !!(RCFG && (""+(RCFG.slug||"")).trim());
  var hasProfile = hasSlug || !!(RCFG && ((""+(RCFG.bio||"")).trim() || (""+(RCFG.titulo||"")).trim() || (""+(RCFG.foto_url||"")).trim()));
  var hasClient = !!(typeof CLIENTS!=="undefined" && CLIENTS && CLIENTS.length);
  var hasReport = !!(typeof CLIENTS!=="undefined" && CLIENTS && CLIENTS.some(function(c){return c&&c.reportState==="published";}));
  var optPw = !!(RCFG && RCFG.pathway_optin); // Stripe solo aplica si la coach acepta clientes de Pathway; con clientes propios cobra directo (0% comisión)
  var sig = { account:true, profile:hasProfile, services:hasServices, stripe:!optPw,
              link:hasSlug, client:hasClient, report:hasReport, template:false };
  var firstPending=true;
  return STEPS.map(function(s){
    var d = (sig[s.id]!=null ? sig[s.id] : s.done) || !!man[s.id];
    var o = Object.assign({}, s, { done:d, current:false });
    if(!d && firstPending){ o.current=true; firstPending=false; }
    return o;
  });
}
var INSIGHTS = [
  { level:"danger", icon:"insStale",     title:"Clientes sin actividad",          desc:"Revisa quién no entra hace días y mándales un mensaje.",      go:"clientes" },
  { level:"warn",   icon:"insClosing",   title:"Cierres de semana 4",             desc:"Pide review y ofrece continuación a los que cierran.",        go:"clientes" },
  { level:"warn",   icon:"insMilestone", title:"Clientes con buen avance",        desc:"Felicítalos — sube la retención del programa.",               go:"clientes" },
  { level:"ok",     icon:"insProfile",   title:"Completa tu perfil público",      desc:"Foto, bio y servicios suben tu conversión.",                  go:"config|profile" }
];
// Sugerencias adaptativas para la guía de la cabra: salen de datos REALES (no
// una lista fija). Solo aparece lo que aplica a la situación del coach, así no
// es repetitivo ni se contradice con los pasos ya hechos.
function computeInsights(){
  var out=[];
  // Solo clientes ACTIVOS (los inactivos / con los que ya no trabajás no deben
  // generar sugerencias) y nunca el de ejemplo.
  var cls=(typeof CLIENTS!=="undefined"&&CLIENTS)?CLIENTS.filter(function(c){return c&&!c._example&&!(c.raw&&c.raw.activo===false);}):[];
  // Perfil incompleto (solo si el paso de perfil NO está hecho).
  try{
    var st=computeSteps();
    var pf=st.filter(function(s){return s.id==="profile";})[0];
    if(pf && !pf.done) out.push({ level:"ok", icon:"insProfile", title:"Completa tu perfil público", desc:"Foto, bio y servicios suben tu conversión.", go:"config|profile" });
  }catch(e){}
  // Pendientes de revisión (CV o informe esperando tu visto bueno).
  var pend=cls.filter(function(c){return c.reportState==="pending"||c.cvState==="pending";});
  if(pend.length) out.push({ level:"warn", icon:"insMilestone", title:(pend.length>1?(pend.length+" pendientes de revisión"):"1 pendiente de revisión"), desc:"Tienes CV/informe esperando tu visto bueno.", go:"clientes" });
  // Clientes sin actividad (stale).
  var stale=cls.filter(function(c){return c.last && c.last.state==="stale";});
  if(stale.length) out.push({ level:"danger", icon:"insStale", title:(stale.length>1?(stale.length+" clientes sin actividad"):"1 cliente sin actividad"), desc:"Hace días que no entran. Escríbeles desde el chat.", go:"clientes" });
  // Cierres de semana 4.
  var closing=cls.filter(function(c){return c.week>=4;});
  if(closing.length) out.push({ level:"warn", icon:"insClosing", title:(closing.length>1?(closing.length+" cierres de semana 4"):"1 cierre de semana 4"), desc:"Pide review y ofrece continuación.", go:"clientes" });
  return out;
}

function cabraMood(){
  // Días desde la última visita: se calcula UNA vez por carga y se cachea, así
  // "descuidada" no parpadea (aparece la primera vez tras estar 5+ días afuera).
  if(_cabraAwayDays===null){
    var email=(typeof COACH!=="undefined"&&COACH&&COACH.email)||(REAL&&RME&&RME.email)||"";
    if(email){
      var d=0;
      try{ var k="pw_lastseen_"+email; var prev=parseInt(localStorage.getItem(k)||"0",10)||0; if(prev) d=Math.floor((Date.now()-prev)/86400000); localStorage.setItem(k,String(Date.now())); }catch(e){}
      _cabraAwayDays=d;
    }
  }
  var away=_cabraAwayDays||0;
  var unread=0;
  if(RMSG){ for(var i=0;i<RMSG.length;i++){ var m=RMSG[i]; if(!m.leido_en && ((RADMIN && !m.from_admin) || (!RADMIN && m.from_admin))) unread++; } }
  var fn=((typeof COACH!=="undefined"&&COACH&&COACH.firstName)||"").trim();
  // Estado base (persistente). Las reacciones (saluda al entrar / salta al hacer
  // algo) son flashes aparte que pisan esto un ratito.
  // Hace mucho que no entra y todavía no hizo nada → triste (hasta que actúe).
  if(away>=5 && !_cabraDidSomething) return { mood:"triste", img:"assets/cabra/cansada.png", msg:"¡Cuánto tiempo"+(fn?", "+fn:"")+"! Tus clientes te esperan 💚" };
  // Hay mensajes sin leer → saluda (gif).
  if(unread>0) return { mood:"saluda", img:CABRA_SALUDA, msg:(unread===1?"Tienes 1 mensaje sin leer 👀":"Tienes "+unread+" mensajes sin leer 👀") };
  // Todo bien → parada mirando (frente). 'mira' (yoga) no se usa.
  return { mood:"tranquila", img:CABRA_TRANQUILA, msg:"" };
}

// Fases de arranque del coach con sub-pasos. María (ejemplo) NO cuenta como
// cliente real. Cada fase completa = una medalla (bronce → plata → oro).
function coachPhaseData(){
  // 3 pasos del sendero de la cabra (Perfil · Cliente · Sesión), de datos reales.
  // Cada uno completo = una medalla (bronce/plata/oro) en el sidebar.
  var rc=(typeof RCFG!=="undefined"&&RCFG)?RCFG:{};
  var rp=(typeof RPROF!=="undefined"&&RPROF)?RPROF:{};
  var _has=function(v){ return !!((""+(v||"")).trim()); };
  var hasFoto=_has(rc.foto_url)||_has(rp.foto_url);
  var hasBio =_has(rc.bio)||_has(rc.titulo)||_has(rc.titulo_profesional)||_has(rp.bio)||_has(rp.titulo_profesional);
  var real=(typeof CLIENTS!=="undefined"&&CLIENTS)?CLIENTS.filter(function(c){return c&&!c._example;}):[];
  var hasReal=real.length>0;
  var hasSesion=real.some(function(c){ return c && c.ses && c.ses.length; });
  var phases=[
    { medal:"bronce", title:"Completá tu perfil", go:"config|profile", steps:[
      { label:"Sumá tu bio/título y tu foto", done:(hasBio&&hasFoto), go:"config|profile" }
    ]},
    { medal:"plata", title:"Sumá tu primer cliente", go:"clientes", steps:[
      { label:"Da de alta un cliente (nombre y email)", done:hasReal, go:"clientes" }
    ]},
    { medal:"oro", title:"Registrá una sesión", go:"clientes", steps:[
      { label:"Registrá una sesión con un cliente", done:hasSesion, go:"clientes" }
    ]}
  ];
  phases.forEach(function(p){ p.done=p.steps.every(function(s){return s.done;}); });
  return phases;
}
// Medalla del coach = cantidad de fases completas (1=bronce, 2=plata, 3=oro).
function coachMedalInfo(){
  var ph=coachPhaseData();
  var n=ph.filter(function(p){return p.done;}).length;
  return { n:n, name:(n>=3?"oro":(n>=2?"plata":(n>=1?"bronce":""))) };
}
// Celebra con confeti cuando el coach completa un hito nuevo (no en el primer render).
var _realLoaded=false; // true recién cuando loadReal() terminó de traer los datos
function _pathProgressCheck(n){
  if(!_realLoaded) return; // evita falsos positivos: en renders previos a la
  // carga de datos coachPhaseData() da un número bajo y pisaría el guardado,
  // disparando confeti en cada entrada al panel.
  try{
    var k="pw_path_"+((COACH&&COACH.email)||(REAL&&RME&&RME.email)||"x");
    var raw=localStorage.getItem(k);
    if(raw===null){ localStorage.setItem(k,String(n)); return; }
    var prev=parseInt(raw,10)||0;
    if(n>prev){ var _mn=["","bronce","plata","oro"][n]||""; localStorage.setItem(k,String(n)); setTimeout(function(){ demoConfetti(); toast(n>=3?"¡Medalla de oro! Completaste tu arranque 🏆":("¡Ganaste la medalla "+_mn+"! 🏅")); },300); }
    else if(n!==prev){ localStorage.setItem(k,String(n)); }
  }catch(e){}
}
// Sendero de la cabra: una escena ilustrada en el Resumen. La cabra se planta
// en el paso actual (Perfil/Cliente/Sesión), sube hacia la bandera Pathway de
// la cima y, al completar los 3, la tarjeta se apaga y la medalla oro queda en
// el sidebar. Posiciones %-based (afinadas en preview) → escalan con el ancho.
function coachPath(){
  var ph=coachPhaseData();
  var doneN=ph.filter(function(p){return p.done;}).length;
  // Modo previsualización: ?cabra=0|1|2 fuerza la escena en ese paso aunque el
  // coach ya tenga su arranque completo. Sirve para verla sin un coach nuevo.
  var _pv=null; try{ _pv=new URLSearchParams(location.search).get("cabra"); }catch(e){}
  if(_pv!==null){
    var k=Math.max(0,Math.min(ph.length-1,parseInt(_pv,10)||0));
    ph.forEach(function(p,i){ p.done=(i<k); });
    // En preview, arrancar un paso atrás para VER el caminar hasta el paso pedido.
    if(_goatLastIdx===null && k>0) _goatLastIdx=k-1;
    return _coachPathRender(ph,k);
  }
  _pathProgressCheck(doneN);
  if(doneN>=ph.length) return ""; // 3/3 → se apaga (la medalla queda en el sidebar)
  return _coachPathRender(ph,doneN);
}
function _coachPathRender(ph,doneN){
  var curIdx=doneN; // primer paso incompleto
  var SHORT=["Perfil","Cliente","Sesión"];
  // Paradas sobre el sendero pintado (fondo 3420×1216): {x%, y% (pies), escala}.
  // Calibradas siguiendo el camino de la foto: arranca abajo-izquierda y sube
  // hacia la cima derecha (donde ya está pintada la bandera de Pathway).
  var STOPS=[{x:36,y:85,s:1.0},{x:55,y:74,s:0.82},{x:79,y:49,s:0.64}];
  var labels=ph.map(function(p,i){
    var s=STOPS[i], current=(i===curIdx);
    var col=p.done?"#2D6A4F":(current?"#1B4332":"#54655A");
    var chk=p.done?"<svg width='11' height='11' viewBox='0 0 24 24' fill='none' stroke='#2D6A4F' stroke-width='3.6' stroke-linecap='round' stroke-linejoin='round' style='margin-right:4px'><polyline points='20 6 9 17 4 12'></polyline></svg>":"";
    var bg=current?"#fff":"rgba(255,255,255,.92)";
    var bd=current?"1.5px solid rgba(82,183,136,.7)":"1px solid rgba(255,255,255,.75)";

    // 82% para que el recorte de abajo no los corte.
    var anchorY=current?(s.y-32*s.s):Math.min(s.y,82);
    return "<div style='position:absolute;left:"+s.x+"%;top:"+anchorY+"%;transform:translate(-50%,-100%);display:inline-flex;align-items:center;padding:4px 11px;border-radius:100px;background:"+bg+";border:"+bd+";box-shadow:0 2px 8px rgba(20,55,38,.28);white-space:nowrap;z-index:6'>"+chk+"<span style='font-family:Inter,sans-serif;font-size:11.5px;font-weight:"+(current?"700":"600")+";color:"+col+"'>"+SHORT[i]+"</span></div>";
  }).join("");

    _animStyle="animation:"+_nm+" 2s ease both;";

  } else { _goatLastIdx=curIdx; }

    "<img src='"+goatSrc+"' alt='' style='position:relative;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 8px rgba(45,106,79,.25))'></div>";
  // Banner chico y centrado (max-width) → margen a los costados sobre el fondo
  // cálido de la card. Mostramos la foto COMPLETA (ratio nativo 3420/1216, sin
  // recorte) para que NO se corte ni el sol/bandera arriba ni las patas de la
  // cabra abajo. Los % de cabra y etiquetas mapean 1:1 al sendero pintado.
  var scene="<div style='position:relative;width:100%;aspect-ratio:3420 / 1216;overflow:hidden;border-radius:12px;box-shadow:0 3px 12px rgba(20,55,38,.12)'>"+
    "<div style='position:absolute;left:50%;top:50%;width:100%;aspect-ratio:3420 / 1216;transform:translate(-50%,-50%);background:url(assets/cabra/fondo.webp?v=2) center/cover no-repeat'>"+goat+labels+"</div></div>";
  var cur=ph[curIdx];
  // Columna derecha: panel enfocado en el SIGUIENTE paso (limpio, no cargado):

    for(var dd=1;dd<=days;dd++){ var key=y+"-"+("0"+(m+1)).slice(-2)+"-"+("0"+dd).slice(-2); var o=WD[key]; if(o&&(o.gym||o.nutri||o.agua||o.sueno||o.pasos)) done++; }

function _coachCalHtml(c){
  var WD={},SES=[],ANT=[];
  try{ WD=JSON.parse((c.raw&&c.raw.fit_habitos)||"{}")||{}; }catch(e){}
  try{ SES=JSON.parse((c.raw&&c.raw.sesiones_registro)||"[]")||[]; }catch(e){}
  try{ ANT=JSON.parse((c.raw&&c.raw.fit_antro)||"[]")||[]; }catch(e){}
  function ymd(f){ if(!f)return""; var s=""+f; if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10); var d=new Date(s); return isNaN(d.getTime())?"":d.toISOString().slice(0,10); }
  var meas={}; SES.forEach(function(s){var k=ymd(s.fecha); if(k)meas[k]=1;}); ANT.forEach(function(m){var k=ymd(m.fecha); if(k)meas[k]=1;});
  var now=new Date(), y=now.getFullYear(), m=now.getMonth();
  var MES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"][m];
  var startDow=(new Date(y,m,1).getDay()+6)%7, days=new Date(y,m+1,0).getDate(), todayK=now.toISOString().slice(0,10);
  var HABK=["agua","sueno","pasos"], cells="";
  for(var i=0;i<startDow;i++) cells+="<div class='pwcal-cell' style='visibility:hidden'></div>";
  for(var d=1;d<=days;d++){
    var key=y+"-"+("0"+(m+1)).slice(-2)+"-"+("0"+d).slice(-2);
    var dd=WD[key]||{}, fut=key>todayK, ics="";
    if(!fut){ if(dd.gym)ics+="💪"; if(HABK.every(function(h){return dd[h]===true;}))ics+="⭐"; if(dd.nutri)ics+="🍎"; }
    var cls="pwcal-cell"+(meas[key]?" meas":"")+(key===todayK?" today":"")+(fut?" fut":"");
    cells+="<div class='"+cls+"'>"+(meas[key]?"<span class='pwcal-mtag'>M</span>":"")+d+"<div class='pwcal-ics'>"+ics+"</div></div>";
  }
  return "<div class='cp-card cp-card-pad'><h3 class='cp-card-title'>Constancia · "+MES+" "+y+"<span class='dot'>.</span></h3>"+
    "<div class='cp-form-hint' style='margin:4px 0 12px'>Los días que el cliente cumplió. Día resaltado = medición/sesión.</div>"+
    "<div class='pwcal-dow'><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div>"+
    "<div class='pwcal-grid'>"+cells+"</div>"+
    "<div class='pwcal-legend'><span>💪 Gym</span><span>⭐ Hábitos</span><span>🍎 Nutrición</span><span><span class='sq'></span>Medición</span></div></div>";
}

    return "<article class='cp-client' data-act='cli-open:"+c.id+"' data-s='"+esc(((c.name||"")+" "+(c.email||"")+" "+(c.role||"")).toLowerCase())+"'"+(isPw?" style='border-color:var(--pw-border-strong)'":"")+">"+

function _coachMicaBubbles(){
  var hilo = (RMSG||[]).slice().sort(function(a,b){ return new Date(a.created_at)-new Date(b.created_at); });
  if(REAL && RME && hilo.length){
    var unreadIds = hilo.filter(function(m){ return m.from_admin && !m.leido_en && m.id; }).map(function(m){ return m.id; });

      _sbw("mensajes_admin_coach?id=in.("+unreadIds.join(",")+")","PATCH",{leido_en:new Date().toISOString()})
        .then(function(){ unreadIds.forEach(function(id){
          var m=hilo.find(function(x){return x.id===id;}); if(m) m.leido_en=new Date().toISOString();
        }); });
    }
  }
  function fmtTime(s){ try{ return new Date(s).toLocaleString("es-ES",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; } }
  var bubbles = hilo.map(function(m){
    var mine = !m.from_admin;
    var bg = mine ? "var(--pw-bosque)" : "var(--pw-niebla-2)";
    var color = mine ? "#fff" : "var(--pw-carbon)";
    var align = mine ? "flex-end" : "flex-start";
    var who = mine ? "Tú" : "Micaela";
    var av = mine ? _chatAv(COACH&&COACH.photo,(COACH&&COACH.name)) : _chatAv(ADMIN_PHOTO,'Pathway');

    "</div>";
    return "<div style='display:flex;align-items:flex-end;gap:7px;justify-content:"+align+";margin-bottom:10px'>"+(mine?(col+av):(av+col))+"</div>";
  }).join("");

    bubbles = "<div style='text-align:center;padding:24px 12px;color:var(--pw-text-soft);font-size:12.5px'>Sin mensajes todavía. Si te trabaste con algo, escribe abajo y Micaela te responde.</div>";

      ? "<span style='background:var(--pw-danger);color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:99px;margin-left:6px'>"+opts.unread+"</span>"

    var bgRow = opts.unread>0 ? "rgba(192,117,110,.06)" : "#fff";
    return "<div data-act='chat-coach-open' data-thread='"+esc(opts.key)+"' style='display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--pw-border);cursor:pointer;background:"+bgRow+"' onmouseover='this.style.background=\"var(--pw-niebla)\"' onmouseout='this.style.background=\""+bgRow+"\"'>"+
      (opts.avatarHtml||"")+

        "<div style='display:flex;align-items:center;gap:6px'>"+
          "<span style='font-weight:"+(opts.unread>0?"700":"600")+";color:var(--pw-carbon);font-size:13.5px'>"+esc(opts.name)+"</span>"+
          unreadBadge+

      "</div></div>";
  }
  function prevTxt(s){ var p=(s||"").replace(/\s+/g," ").slice(0,60); if(s&&s.length>60) p+="…"; return p; }
  // Avatar de lista de 38px, con foto real si la hay e iniciales como fallback.
  function listAv(url,name){ return avImg(url,name,"style='width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0'"); }
  var rows = "";
  // 1) Soporte Pathway (Mica) — solo para el coach (el admin ES el soporte)
  if(includeMica){
    var micaMsgs = (RMSG||[]).slice().sort(function(a,b){ return new Date(a.created_at)-new Date(b.created_at); });
    var micaLast = micaMsgs[micaMsgs.length-1];
    var micaUnread = (RMSG||[]).filter(function(m){ return m.from_admin && !m.leido_en; }).length;
    var micaPrev = micaLast ? ((micaLast.from_admin?"Micaela: ":"Tú: ")+prevTxt(micaLast.body)) : "Soporte y dudas de la plataforma";
    rows += row({ key:"mica", name:"Soporte Pathway", avatarHtml:listAv(ADMIN_PHOTO,"Pathway"), preview:micaPrev, time:micaLast?fmtRel(micaLast.created_at):"", unread:micaUnread });
  }
  // 2) Un item por cada cliente real del coach (los desactivados no aparecen)
  (CLIENTS||[]).forEach(function(c){
    if(c.raw && c.raw.activo===false) return;
    var chat = c.chat||[];
    var last = chat.length ? chat[chat.length-1] : null;
    var prev = last ? ((last.from==="coach"?"Tú: ":((c.name||"").split(" ")[0]+": "))+prevTxt(last.text)) : "Iniciar conversación";
    rows += row({ key:String(c.id), name:c.name||"Cliente", avatarHtml:listAv(c.photo,c.name||"Cliente"), preview:prev, time:last?(last.time||""):"", unread:0 });
  });
  return rows;
}
