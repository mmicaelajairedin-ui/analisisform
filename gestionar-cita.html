<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu reserva · Pathway</title>
<link rel="icon" href="/favicon-app.svg?v=4" type="image/svg+xml">
<meta name="theme-color" content="#2D6A4F">
<meta name="robots" content="noindex">
<style>
  :root{ --bosque:#1B4332; --bosque2:#2D6A4F; --sendero:#52B788; --carbon:#1B2E26; --niebla:#FAFDF9; --soft:#5A6A60; --muted:#9AA8A0; --borde:rgba(45,106,79,.14); --serif:'Fraunces',Georgia,serif; --sans:'Inter',-apple-system,'Segoe UI',sans-serif; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--sans);background:radial-gradient(120% 60% at 50% 0%, #EEF6EE 0%, var(--niebla) 55%) no-repeat, var(--niebla);color:var(--carbon);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:30px 16px 70px;}
  .wrap{max-width:440px;width:100%;}
  .brand{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:14px;}
  .brand svg{width:26px;height:26px;}
  .brand-word{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-.5px;}
  .card{background:#fff;border:1px solid var(--borde);border-radius:20px;box-shadow:0 14px 46px rgba(20,55,38,.09);padding:26px 24px;}
  h1{font-family:var(--serif);font-size:21px;font-weight:500;margin-bottom:4px;letter-spacing:-.3px;}
  .sub{font-size:13px;color:var(--soft);margin-bottom:18px;line-height:1.5;}
  .box{background:#F0F5EF;border-radius:12px;padding:14px 16px;margin-bottom:18px;}
  .box .k{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#7A8A80;font-weight:700;}
  .box .v{font-size:16px;font-weight:700;color:var(--bosque);text-transform:capitalize;margin-top:2px;}
  .box .t{font-size:13px;color:var(--soft);margin-top:6px;}
  .btn{display:block;width:100%;padding:12px 16px;border-radius:11px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;border:none;text-decoration:none;text-align:center;transition:all .15s;margin-bottom:9px;}
  .btn-primary{background:var(--bosque);color:#fff;}
  .btn-primary:hover{background:#153726;}
  .btn-danger{background:#fff;color:#C0756E;border:1.5px solid rgba(192,117,110,.5);}
  .btn-danger:hover{background:#fdf3f2;}
  .btn-ghost{background:transparent;color:var(--soft);font-weight:600;}
  .msg{font-size:13px;text-align:center;color:var(--soft);min-height:16px;margin-top:6px;}
  .ico{width:54px;height:54px;border-radius:50%;background:rgba(82,183,136,.14);display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 14px;}
  .spin{width:24px;height:24px;border:3px solid rgba(45,106,79,.2);border-top-color:var(--bosque2);border-radius:50%;animation:s .8s linear infinite;margin:20px auto;}
  @keyframes s{to{transform:rotate(360deg)}}
  .foot{text-align:center;font-size:11px;color:var(--muted);margin-top:16px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="36.2,35.2 52.8,54.3 52.8,81.8 7.4,81.8" fill="#215C44"/><polygon points="67.9,45.8 92.6,81.8 43.1,81.8" fill="#267A54"/><circle cx="75.4" cy="27.8" r="10.3" fill="#F8CA45"/></svg><span class="brand-word">pathway<span style="color:#52B788">.</span></span></div>
  <div class="card" id="card"><div class="spin"></div></div>
  <div class="foot">Reservas con Pathway · pathwaycareercoach.com</div>
</div>

<script>
var SB='https://api.pathwaycareercoach.com';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkeG5yc25qZHZ0cWh4dW54bndqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNDk5MzksImV4cCI6MjA5MDcyNTkzOX0.t82X1x-PDgFDGYhKC7YXoRKhga9I8Hjet60QUYvtZLU';
function $(id){ return document.getElementById(id); }
function esc(s){ return (''+(s==null?'':s)).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function qp(k){ try{ return new URLSearchParams(location.search).get(k); }catch(e){ return null; } }
var TOKEN=(qp('t')||'').trim();
var CITA=null;

function H(headers){ return Object.assign({ apikey:KEY, Authorization:'Bearer '+KEY }, headers||{}); }
function fmtFecha(iso, tz){ try{ return new Date(iso).toLocaleDateString('es-ES',{ timeZone:tz||undefined, weekday:'long', day:'numeric', month:'long' }); }catch(e){ return new Date(iso).toLocaleDateString('es-ES'); } }
function fmtHora(iso, tz){ try{ return new Date(iso).toLocaleTimeString('es-ES',{ timeZone:tz||undefined, hour:'2-digit', minute:'2-digit' }); }catch(e){ return ''; } }

function fail(txt){ $('card').innerHTML="<div class='ico'>🙁</div><h1>Ups</h1><p class='sub'>"+esc(txt)+"</p><a class='btn btn-ghost' href='/'>Ir a Pathway</a>"; }

function load(){
  if(!TOKEN){ fail('Link inválido. Abre el link tal cual está en tu email.'); return; }
  fetch(SB+'/rest/v1/citas?token=eq.'+encodeURIComponent(TOKEN)+'&select=id,coach_id,nombre,email,tipo,inicio,estado,cliente_tz&limit=1',{ headers:H() })
    .then(function(r){ return r.ok?r.json():[]; })
    .then(function(rows){
      CITA=(rows&&rows[0])||null;
      if(!CITA){ fail('No encontramos esta reserva. Puede que el link sea viejo.'); return; }
      render();
    })
    .catch(function(){ fail('No pudimos cargar tu reserva. Reintenta en un momento.'); });
}

function render(){
  var tz=CITA.cliente_tz||'';
  var cuando=fmtFecha(CITA.inicio,tz), hora=fmtHora(CITA.inicio,tz);
  var pasada=(+new Date(CITA.inicio) < Date.now());
  if(CITA.estado==='cancelada'){
    $('card').innerHTML="<div class='ico'>🗓️</div><h1>Reserva cancelada</h1>"+
      "<p class='sub'>Esta reserva (<strong>"+esc(CITA.tipo||'sesión')+"</strong>) ya está cancelada.</p>"+
      "<a class='btn btn-primary' href='/reservar.html?c="+encodeURIComponent(CITA.coach_id||'')+"'>Reservar de nuevo</a>";
    return;
  }
  $('card').innerHTML=
    "<h1>Tu reserva</h1>"+
    "<p class='sub'>Hola "+esc((''+(CITA.nombre||'')).split(' ')[0])+", acá puedes cancelar o reprogramar.</p>"+
    "<div class='box'>"+
      "<div class='k'>"+esc(CITA.tipo||'Sesión')+"</div>"+
      "<div class='v'>"+esc(cuando)+"</div>"+
      "<div class='t'>⏰ "+esc(hora)+(tz?(" <span style='color:var(--muted)'>("+esc(tz)+")</span>"):"")+"</div>"+
    "</div>"+
    (pasada?"<p class='sub'>Esta reserva ya pasó.</p>":"")+
    "<button class='btn btn-primary' id='btn-re'>Reprogramar (elegir otro horario)</button>"+
    "<button class='btn btn-danger' id='btn-cancel'>Cancelar la reserva</button>"+
    "<div class='msg' id='msg'></div>";
  $('btn-cancel').onclick=doCancel;
  $('btn-re').onclick=doReprogramar;
}

function _patchCancelada(){
  return fetch(SB+'/rest/v1/citas?token=eq.'+encodeURIComponent(TOKEN),{ method:'PATCH', headers:H({ 'content-type':'application/json', Prefer:'return=minimal' }), body:JSON.stringify({ estado:'cancelada' }) });
}

function doCancel(){
  if(!confirm('¿Seguro que quieres cancelar esta reserva?')) return;
  $('msg').textContent='Cancelando…';
  _patchCancelada()
    .then(function(r){
      if(!r.ok) throw 0;
      $('card').innerHTML="<div class='ico'>✅</div><h1>Reserva cancelada</h1>"+
        "<p class='sub'>Listo, liberamos el horario. Si quieres, puedes reservar otro momento.</p>"+
        "<a class='btn btn-primary' href='/reservar.html?c="+encodeURIComponent(CITA.coach_id||'')+"'>Reservar otro horario</a>";
    })
    .catch(function(){ $('msg').textContent='No se pudo cancelar. Reintenta o responde el email.'; });
}

function doReprogramar(){
  // Reprogramar = cancelar esta (libera el hueco) y volver a la página de reserva
  // para elegir un horario nuevo con el mismo coach.
  $('msg').textContent='Preparando…';
  _patchCancelada()
    .then(function(){ location.href='/reservar.html?c='+encodeURIComponent(CITA.coach_id||''); })
    .catch(function(){ location.href='/reservar.html?c='+encodeURIComponent(CITA.coach_id||''); });
}

load();
</script>
</body>
</html>
