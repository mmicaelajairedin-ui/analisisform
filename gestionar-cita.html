<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><style>html{scrollbar-gutter:stable;overflow-x:hidden;max-width:100%;}body{overflow-x:hidden;max-width:100%;}</style>
<title>Tu reserva · Pathway</title>
<link rel="icon" href="/favicon-app.svg?v=6" type="image/svg+xml">
<meta name="theme-color" content="#2D6A4F">
<meta name="robots" content="noindex">
<style>
  :root{ --bosque:#1B4332; --bosque2:#2D6A4F; --sendero:#52B788; --carbon:#1B2E26; --niebla:#FAFDF9; --soft:#5A6A60; --muted:#9AA8A0; --borde:rgba(45,106,79,.14); --serif:'Fraunces',Georgia,serif; --sans:'Inter',-apple-system,'Segoe UI',sans-serif; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--sans);background:radial-gradient(120% 60% at 50% 0%, #EEF6EE 0%, var(--niebla) 55%) no-repeat, var(--niebla);color:var(--carbon);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:30px 16px 70px;}
  .wrap{max-width:440px;width:100%;}
  .brand{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:14px;}
  .brand svg{width:26px;height:26px;}
  .brand-word{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-.5px;}
  .card{background:#fff;border:1px solid var(--borde);border-radius:20px;box-shadow:0 14px 46px rgba(20,55,38,.09);padding:26px 24px;}
  h1{font-family:var(--serif);font-size:21px;font-weight:500;margin-bottom:4px;letter-spacing:-.3px;}
  .sub{font-size:13px;color:var(--soft);margin-bottom:18px;line-height:1.5;}
  .box{background:#F0F5EF;border-radius:12px;padding:14px 16px;margin-bottom:18px;}
  .box .k{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#7A8A80;font-weight:700;}
  .box .v{font-size:16px;font-weight:700;color:var(--bosque);text-transform:capitalize;margin-top:2px;}
  .box .t{font-size:13px;color:var(--soft);margin-top:6px;}
  .btn{display:block;width:100%;padding:12px 16px;border-radius:11px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;border:none;text-decoration:none;text-align:center;transition:all .15s;margin-bottom:9px;}
  .btn-primary{background:var(--bosque);color:#fff;}
  .btn-primary:hover{background:#153726;}
  .btn-danger{background:#fff;color:#C0756E;border:1.5px solid rgba(192,117,110,.5);}
  .btn-danger:hover{background:#fdf3f2;}
  .btn-ghost{background:transparent;color:var(--soft);font-weight:600;}
  .msg{font-size:13px;text-align:center;color:var(--soft);min-height:16px;margin-top:6px;}
  .ico{width:54px;height:54px;border-radius:50%;background:rgba(82,183,136,.14);display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 14px;}
  .spin{width:24px;height:24px;border:3px solid rgba(45,106,79,.2);border-top-color:var(--bosque2);border-radius:50%;animation:s .8s linear infinite;margin:20px auto;}
  @keyframes s{to{transform:rotate(360deg)}}
  .foot{text-align:center;font-size:11px;color:var(--muted);margin-top:16px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="36.2,35.2 52.8,54.3 52.8,81.8 7.4,81.8" fill="#215C44"/><polygon points="67.9,45.8 92.6,81.8 43.1,81.8" fill="#267A54"/><circle cx="75.4" cy="27.8" r="10.3" fill="#F8CA45"/></svg><span class="brand-word">pathway<span style="color:#52B788">.</span></span></div>
  <div class="card" id="card"><div class="spin"></div></div>
  <div class="foot">Reservas con Pathway · pathwaycareercoach.com</div>
</div>

<script>
var SB='https://ddxnrsnjdvtqhxunxbwj.supabase.co';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkeG5yc25qZHZ0cWh4dW54bndqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNDk5MzksImV4cCI6MjA5MDcyNTkzOX0.t82X1x-PDgFDGYhKC7YXoRKhga9I8Hjet60QUYvtZLU';
function $(id){ return document.getElementById(id); }
function esc(s){ return (''+(s==null?'':s)).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function qp(k){ try{ return new URLSearchParams(location.search).get(k); }catch(e){ return null; } }
// ── Idioma ES/EN (auto por navegador / ?lang / pw_lang, igual que la landing) ──
var LANG='es';
try{
  var _ql=(qp('lang')||'').toLowerCase().slice(0,2);
  var _sl=''; try{ _sl=localStorage.getItem('pw_lang')||''; }catch(e){}
  var _nl=(navigator.language||navigator.userLanguage||'es').toLowerCase().slice(0,2);
  LANG=(_ql==='en'||_ql==='es')?_ql:(_sl==='en'||_sl==='es'?_sl:(_nl==='es'?'es':'en'));
  if(_ql==='en'||_ql==='es'){ try{ localStorage.setItem('pw_lang',LANG); }catch(e){} }
}catch(e){ LANG='es'; }
if(LANG!=='en') LANG='es';
try{ document.documentElement.lang=LANG; }catch(e){}
var T={
  es:{ foot:'Reservas con Pathway · pathwaycareercoach.com', ups:'Ups', irPathway:'Ir a Pathway',
    linkInvalido:'Link inválido. Abre el link tal cual está en tu email.', noEncontrada:'No encontramos esta reserva. Puede que el link sea viejo.', loadErr:'No pudimos cargar tu reserva. Reintenta en un momento.',
    canceladaT:'Reserva cancelada', yaCancelada:'Esta reserva (<strong>{tipo}</strong>) ya está cancelada.', reservarDeNuevo:'Reservar de nuevo',
    sesion:'Sesión', tuReserva:'Tu reserva', holaPaso:'Hola {name}, esta reserva ya pasó.', reservarOtro:'Reservar otro horario',
    holaGestion:'Hola {name}, aquí puedes cancelar o reprogramar.', btnReprogramar:'Reprogramar (elegir otro horario)', btnCancelar:'Cancelar la reserva',
    confirmCancel:'¿Seguro que quieres cancelar esta reserva?', cancelando:'Cancelando…', cancelListo:'Listo, liberamos el horario. Si quieres, puedes reservar otro momento.', cancelErr:'No se pudo cancelar. Reintenta o responde el email.' },
  en:{ foot:'Bookings by Pathway · pathwaycareercoach.com', ups:'Oops', irPathway:'Go to Pathway',
    linkInvalido:'Invalid link. Open the link exactly as it is in your email.', noEncontrada:'We couldn\'t find this booking. The link may be old.', loadErr:'We couldn\'t load your booking. Please try again in a moment.',
    canceladaT:'Booking canceled', yaCancelada:'This booking (<strong>{tipo}</strong>) is already canceled.', reservarDeNuevo:'Book again',
    sesion:'Session', tuReserva:'Your booking', holaPaso:'Hi {name}, this booking has already passed.', reservarOtro:'Book another time',
    holaGestion:'Hi {name}, here you can cancel or reschedule.', btnReprogramar:'Reschedule (pick another time)', btnCancelar:'Cancel booking',
    confirmCancel:'Are you sure you want to cancel this booking?', cancelando:'Canceling…', cancelListo:'Done, we\'ve freed up the slot. If you like, you can book another time.', cancelErr:'Couldn\'t cancel. Try again or reply to the email.' }
};
function t(k){ var v=(T[LANG]&&T[LANG][k]); return v!=null?v:(T.es[k]!=null?T.es[k]:k); }
function tf(k,m){ var s=t(k); if(m) for(var x in m){ s=s.split('{'+x+'}').join(m[x]); } return s; }
function _langLoc(){ return LANG==='en'?'en-US':'es-ES'; }
function pwSetLang(l){ if(l!=='es'&&l!=='en'||l===LANG) return; LANG=l; try{ localStorage.setItem('pw_lang',l); }catch(e){} try{ document.documentElement.lang=l; }catch(e){} _langBtns(); try{ if(CITA) render(); else load(); }catch(e){} }
function _langBtns(){ var a=$('lng-es'),b=$('lng-en'); if(a){a.style.background=LANG==='es'?'#1B4332':'#fff';a.style.color=LANG==='es'?'#fff':'#5A6A60';} if(b){b.style.background=LANG==='en'?'#1B4332':'#fff';b.style.color=LANG==='en'?'#fff':'#5A6A60';} try{ var fo=document.querySelector('.foot'); if(fo) fo.textContent=t('foot'); }catch(e){} try{ document.title=(LANG==='en'?'Your booking · Pathway':'Tu reserva · Pathway'); }catch(e){} }
(function(){ function mk(){ if($('lng-sw'))return; var w=document.querySelector('.wrap')||document.body; var d=document.createElement('div'); d.id='lng-sw'; d.style.cssText='display:flex;justify-content:flex-end;margin:0 0 10px'; d.innerHTML="<div style='display:inline-flex;gap:2px;background:#fff;border:1px solid rgba(45,106,79,.2);border-radius:999px;padding:3px;box-shadow:0 2px 8px rgba(27,46,38,.08)'><button id='lng-es' onclick=\"pwSetLang('es')\" style='border:0;border-radius:999px;font:600 12.5px Inter,sans-serif;padding:5px 13px;cursor:pointer'>🇪🇸 Español</button><button id='lng-en' onclick=\"pwSetLang('en')\" style='border:0;border-radius:999px;font:600 12.5px Inter,sans-serif;padding:5px 13px;cursor:pointer'>🇬🇧 English</button></div>"; if(w.firstChild) w.insertBefore(d,w.firstChild); else w.appendChild(d); _langBtns(); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',mk); else mk();
})();
var TOKEN=(qp('t')||'').trim();
var CITA=null;

function H(headers){ return Object.assign({ apikey:KEY, Authorization:'Bearer '+KEY }, headers||{}); }
function fmtFecha(iso, tz){ try{ return new Date(iso).toLocaleDateString(_langLoc(),{ timeZone:tz||undefined, weekday:'long', day:'numeric', month:'long' }); }catch(e){ return new Date(iso).toLocaleDateString(_langLoc()); } }
function fmtHora(iso, tz){ try{ return new Date(iso).toLocaleTimeString(_langLoc(),{ timeZone:tz||undefined, hour:'2-digit', minute:'2-digit' }); }catch(e){ return ''; } }

function fail(txt){ $('card').innerHTML="<div class='ico'>🙁</div><h1>"+t('ups')+"</h1><p class='sub'>"+esc(txt)+"</p><a class='btn btn-ghost' href='/'>"+t('irPathway')+"</a>"; }

function load(){
  if(!TOKEN){ fail(t('linkInvalido')); return; }
  fetch(SB+'/rest/v1/rpc/get_cita_by_token',{ method:'POST', headers:H({ 'content-type':'application/json' }), body:JSON.stringify({ p_token:TOKEN }) })
    .then(function(r){ return r.ok?r.json():[]; })
    .then(function(rows){
      CITA=(rows&&rows[0])||null;
      if(!CITA){ fail(t('noEncontrada')); return; }
      render();
    })
    .catch(function(){ fail(t('loadErr')); });
}

function render(){
  var tz=CITA.cliente_tz||'';
  var cuando=fmtFecha(CITA.inicio,tz), hora=fmtHora(CITA.inicio,tz);
  var pasada=(+new Date(CITA.inicio) < Date.now());
  var _nm=esc((''+(CITA.nombre||'')).split(' ')[0]);
  if(CITA.estado==='cancelada'){
    $('card').innerHTML="<div class='ico'>🗓️</div><h1>"+t('canceladaT')+"</h1>"+
      "<p class='sub'>"+tf('yaCancelada',{tipo:esc(CITA.tipo||t('sesion'))})+"</p>"+
      "<a class='btn btn-primary' href='/reservar.html?c="+encodeURIComponent(CITA.coach_id||'')+"'>"+t('reservarDeNuevo')+"</a>";
    return;
  }
  var _box="<div class='box'>"+
      "<div class='k'>"+esc(CITA.tipo||t('sesion'))+"</div>"+
      "<div class='v'>"+esc(cuando)+"</div>"+
      "<div class='t'>⏰ "+esc(hora)+(tz?(" <span style='color:var(--muted)'>("+esc(tz)+")</span>"):"")+"</div>"+
    "</div>";
  // Una reserva que YA pasó no se cancela ni reprograma (no tiene sentido): solo
  // ofrecemos reservar otra.
  if(pasada){
    $('card').innerHTML=
      "<h1>"+t('tuReserva')+"</h1>"+
      "<p class='sub'>"+tf('holaPaso',{name:_nm})+"</p>"+
      _box+
      "<a class='btn btn-primary' href='/reservar.html?c="+encodeURIComponent(CITA.coach_id||'')+"'>"+t('reservarOtro')+"</a>";
    return;
  }
  $('card').innerHTML=
    "<h1>"+t('tuReserva')+"</h1>"+
    "<p class='sub'>"+tf('holaGestion',{name:_nm})+"</p>"+
    _box+
    "<button class='btn btn-primary' id='btn-re'>"+t('btnReprogramar')+"</button>"+
    "<button class='btn btn-danger' id='btn-cancel'>"+t('btnCancelar')+"</button>"+
    "<div class='msg' id='msg'></div>";
  $('btn-cancel').onclick=doCancel;
  $('btn-re').onclick=doReprogramar;
}
// Avisa al coach por email que el cliente canceló (antes no se enteraba). Busca su
// email por coach_id y manda el aviso; best-effort.
function _notifyCoachCancel(){
  try{
    if(!CITA||!CITA.coach_id) return;
    fetch(SB+'/rest/v1/usuarios?id=eq.'+encodeURIComponent(CITA.coach_id)+'&select=email,nombre&limit=1',{ headers:H() })
      .then(function(r){ return r.ok?r.json():[]; })
      .then(function(u){ var co=(u&&u[0])||{}; if(!co.email) return;
        var tz=CITA.cliente_tz||''; var cuando=fmtFecha(CITA.inicio,tz)+' · '+fmtHora(CITA.inicio,tz);
        var html="<div style='font-family:Inter,Arial,sans-serif;color:#1B2E26'><h2 style='font-family:Georgia,serif;color:#1B4332'>Reserva cancelada</h2><p><strong>"+esc(CITA.nombre||CITA.email||'Un cliente')+"</strong> canceló su <strong>"+esc(CITA.tipo||'sesión')+"</strong> del <strong>"+esc(cuando)+"</strong>.</p><p style='font-size:13px;color:#5A6A60'>El horario quedó libre en tu agenda.</p></div>";
        fetch(SB+'/functions/v1/send-email',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ to:co.email, to_name:co.nombre||'', subject:'❌ '+(CITA.nombre||'Un cliente')+' canceló su reserva', html:html, reply_to:(CITA.email||undefined), signature:'pathway' }) }).catch(function(){});
      }).catch(function(){});
  }catch(e){}
}

function _patchCancelada(){
  return fetch(SB+'/rest/v1/rpc/cancelar_cita_by_token',{ method:'POST', headers:H({ 'content-type':'application/json' }), body:JSON.stringify({ p_token:TOKEN }) })
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(ok){ if(ok !== true) throw 0; return true; });
}

function doCancel(){
  if(!confirm(t('confirmCancel'))) return;
  $('msg').textContent=t('cancelando');
  _patchCancelada()
    .then(function(){
      _notifyCoachCancel();   // avisar al coach que se liberó el horario
      $('card').innerHTML="<div class='ico'>✅</div><h1>"+t('canceladaT')+"</h1>"+
        "<p class='sub'>"+t('cancelListo')+"</p>"+
        "<a class='btn btn-primary' href='/reservar.html?c="+encodeURIComponent(CITA.coach_id||'')+"'>"+t('reservarOtro')+"</a>";
    })
    .catch(function(){ $('msg').textContent=t('cancelErr'); });
}

function doReprogramar(){
  // Reprogramar SIN perder el turno: NO cancelamos ahora. Vamos a reservar con el
  // token viejo (&reprog=) → reservar.html cancela la cita vieja SOLO cuando la
  // nueva se confirma. Si el cliente abandona, su turno original sigue en pie.
  location.href='/reservar.html?c='+encodeURIComponent(CITA.coach_id||'')+'&reprog='+encodeURIComponent(TOKEN);
}

load();
</script>
</body>
</html>
