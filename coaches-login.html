<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Pathway Coaches · Acceso</title>
<!-- M2: login/registro real con Supabase Auth (proyecto pathway-coaches). -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--rose:#2D6A4F;--rose-dark:#1B4332;--rose-light:#E8F5EE;--border:#D8E5DD;--muted:#777;--serif:'Fraunces',Georgia,serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Inter,sans-serif;background:#EFF3EE;color:#1a1a1a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;}
.card{background:#fff;border-radius:18px;box-shadow:0 10px 40px rgba(45,106,79,.12);max-width:420px;width:100%;padding:2rem 1.75rem;}
.brand{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:1.5rem;}
.brand span{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--rose-dark);letter-spacing:-.6px;}
.tabs{display:flex;gap:6px;background:var(--rose-light);border-radius:12px;padding:4px;margin-bottom:1.5rem;}
.tab{flex:1;padding:9px;border:none;background:none;border-radius:9px;font-family:inherit;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;}
.tab.on{background:#fff;color:var(--rose);box-shadow:0 1px 4px rgba(0,0,0,.06);}
.fld{margin-bottom:13px;}
.fld label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;}
.fld input,.fld select{width:100%;padding:12px 14px;font-size:14px;font-family:inherit;border:1.5px solid var(--border);border-radius:10px;outline:none;}
.fld input:focus,.fld select:focus{border-color:var(--rose);box-shadow:0 0 0 3px rgba(45,106,79,.12);}
.btn{width:100%;padding:14px;font-size:15px;font-weight:700;font-family:inherit;background:var(--rose);color:#fff;border:none;border-radius:12px;cursor:pointer;margin-top:6px;}
.btn:hover{background:var(--rose-dark);}
.btn:disabled{opacity:.6;cursor:wait;}
.msg{font-size:13px;line-height:1.5;margin-top:14px;padding:11px 13px;border-radius:10px;display:none;}
.msg.err{display:block;background:#FAF0EF;color:#9a3b3b;border:1px solid #f0d5d3;}
.msg.ok{display:block;background:var(--rose-light);color:var(--rose-dark);border:1px solid var(--border);}
.hint{font-size:11.5px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.5;}
.conn{font-size:10px;text-align:center;color:var(--muted);margin-top:10px;}
.conn b{color:var(--rose);}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 100 100"><polygon points="10,82 32,52 54,82" fill="#52B788"/><polygon points="34,82 58,28 82,82" fill="#2D6A4F"/><circle cx="58" cy="22" r="5" fill="#E9C46A"/></svg>
    <span>pathway<span style="color:#52B788">.</span></span>
  </div>

  <div class="tabs">
    <button class="tab on" id="t-signup" onclick="tab('signup')">Crear cuenta</button>
    <button class="tab" id="t-login" onclick="tab('login')">Entrar</button>
  </div>

  <!-- SIGNUP -->
  <form id="f-signup" onsubmit="return doSignup(event)">
    <div class="fld"><label>Tu nombre</label><input id="su-nombre" placeholder="Ej: Gonza" required></div>
    <div class="fld"><label>Tipo de coach</label><select id="su-tipo"><option value="fitness">🧘 Fitness</option><option value="financiero">💰 Financiero</option></select></div>
    <div class="fld"><label>Email</label><input id="su-email" type="email" placeholder="vos@email.com" required></div>
    <div class="fld"><label>Contraseña</label><input id="su-pass" type="password" placeholder="mín. 6 caracteres" minlength="6" required></div>
    <button class="btn" id="su-btn">Crear mi cuenta de coach</button>
  </form>

  <!-- LOGIN -->
  <form id="f-login" style="display:none;" onsubmit="return doLogin(event)">
    <div class="fld"><label>Email</label><input id="li-email" type="email" placeholder="vos@email.com" required></div>
    <div class="fld"><label>Contraseña</label><input id="li-pass" type="password" required></div>
    <button class="btn" id="li-btn">Entrar</button>
  </form>

  <div class="msg" id="msg"></div>
  <div class="conn" id="conn">conectando…</div>
</div>

<script src="pw-coaches.js"></script>
<script>
function tab(w){
  document.getElementById('t-signup').classList.toggle('on',w==='signup');
  document.getElementById('t-login').classList.toggle('on',w==='login');
  document.getElementById('f-signup').style.display=w==='signup'?'block':'none';
  document.getElementById('f-login').style.display=w==='login'?'block':'none';
  msg('');
}
function msg(t,type){var m=document.getElementById('msg');if(!t){m.className='msg';m.textContent='';return;}m.className='msg '+(type||'err');m.textContent=t;}

async function doSignup(e){
  e.preventDefault();
  var btn=document.getElementById('su-btn');btn.disabled=true;msg('');
  var nombre=su_nombre.value.trim(), tipo=su_tipo.value, email=su_email.value.trim(), pass=su_pass.value;
  try{
    var {data,error}=await sb.auth.signUp({email:email,password:pass});
    if(error) throw error;
    if(!data.session){ msg('Cuenta creada. Revisá tu email para confirmar y después entrá. (O desactivá la confirmación de email en Supabase para probar más rápido.)','ok'); btn.disabled=false; return false; }
    // hay sesión → crear el perfil del coach
    var ins=await sb.from('coaches').insert({id:data.user.id, email:email, nombre:nombre, coach_type:tipo, plan:'sencillo'});
    if(ins.error) throw ins.error;
    msg('¡Listo! Entrando a tu panel…','ok');
    setTimeout(function(){ pwRedirect('coach', tipo); }, 800);
  }catch(err){ msg('Error: '+(err.message||err)); btn.disabled=false; }
  return false;
}

async function doLogin(e){
  e.preventDefault();
  var btn=document.getElementById('li-btn');btn.disabled=true;msg('');
  try{
    var {data,error}=await sb.auth.signInWithPassword({email:li_email.value.trim(),password:li_pass.value});
    if(error) throw error;
    // ¿es coach?
    var c=await sb.from('coaches').select('coach_type').eq('id',data.user.id).maybeSingle();
    if(c.data){ pwRedirect('coach', c.data.coach_type); return false; }
    // ¿es cliente?
    var cl=await sb.from('clientes').select('coach_id').eq('id',data.user.id).maybeSingle();
    if(cl.data){
      var ct=await sb.from('coaches').select('coach_type').eq('id',cl.data.coach_id).maybeSingle();
      pwRedirect('cliente', ct.data ? ct.data.coach_type : 'fitness'); return false;
    }
    msg('Tu cuenta no tiene perfil de coach ni de cliente todavía.');
    btn.disabled=false;
  }catch(err){ msg('Error: '+(err.message||err)); btn.disabled=false; }
  return false;
}

// Chequeo de conexión (corre en tu navegador)
(async function(){
  var c=document.getElementById('conn');
  try{
    var r=await sb.from('coaches').select('id',{count:'exact',head:true});
    if(r.error) throw r.error;
    c.innerHTML='✅ Conectado a Supabase · tablas <b>OK</b>';
  }catch(err){
    c.innerHTML='⚠️ '+(err.message||err).slice(0,80);
  }
})();
</script>
</body>
</html>
