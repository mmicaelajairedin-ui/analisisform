<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bosque:#2D6A4F;
  --bosque-dark:#1B4332;
  --sendero:#52B788;
  --amanecer:#E9C46A;
  --carbon:#1B2E26;
  --niebla:#FAFDF9;
  --texto:#1B2E26;
  --texto-suave:#5A5A55;
  --borde:rgba(45,106,79,.12);
  --serif:'Fraunces',Georgia,serif;
  --sans:'Inter',-apple-system,sans-serif;
}
body{
  font-family:var(--sans);color:var(--texto);min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:2rem 1rem;
  background:linear-gradient(135deg,#FAFDF9 0%,#F0F7F2 50%,#E8F2EC 100%);
  position:relative;overflow:hidden;
}
body::before{content:'';position:absolute;top:-180px;right:-180px;width:480px;height:480px;border-radius:50%;background:rgba(82,183,136,.08);}
body::after{content:'';position:absolute;bottom:-120px;left:-120px;width:340px;height:340px;border-radius:50%;background:rgba(45,106,79,.05);}
.card{
  background:#fff;border-radius:20px;padding:2.5rem 2rem;width:100%;max-width:420px;
  box-shadow:0 8px 40px rgba(45,106,79,.08);position:relative;z-index:1;
  animation:cardIn .5s ease;
  border:1px solid var(--borde);
}
@keyframes cardIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.logo{text-align:center;margin-bottom:1.5rem;}
.logo-mark{width:48px;height:48px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;}
.logo h1{font-family:var(--serif);font-size:24px;font-weight:500;color:var(--carbon);margin-bottom:4px;letter-spacing:-0.6px;}
.logo h1 .accent{color:var(--sendero);}
.logo p{font-size:13px;color:var(--texto-suave);font-weight:400;}
.quote{
  text-align:center;font-size:12px;color:var(--bosque);font-style:italic;line-height:1.6;
  margin-bottom:1.5rem;padding:0 .5rem;
  animation:quoteIn .6s ease .2s both;
}
@keyframes quoteIn{from{opacity:0;}to{opacity:1;}}
.field{margin-bottom:1rem;}
.field label{display:block;font-size:11px;font-weight:600;color:var(--texto-suave);margin-bottom:6px;letter-spacing:.06em;text-transform:uppercase;}
.field input{width:100%;padding:13px 14px;font-size:14px;font-family:var(--sans);border:1.5px solid var(--borde);border-radius:10px;background:#fff;color:var(--texto);outline:none;transition:all .2s;}
.field input:focus{border-color:var(--bosque);box-shadow:0 0 0 3px rgba(82,183,136,.15);background:#FAFDF9;}
.btn{width:100%;padding:14px;font-size:14px;font-family:var(--sans);font-weight:600;border:none;border-radius:10px;background:var(--bosque);color:#fff;cursor:pointer;transition:all .2s;margin-top:.5rem;box-shadow:0 4px 14px rgba(45,106,79,.18);}
.btn:hover{background:var(--bosque-dark);transform:translateY(-1px);box-shadow:0 6px 20px rgba(45,106,79,.25);}
.btn:disabled{background:#bbb;cursor:not-allowed;box-shadow:none;transform:none;animation:none;}
@keyframes beacon{
  0%,100%{transform:translateY(0);box-shadow:0 4px 14px rgba(45,106,79,.22);}
  50%{transform:translateY(-2px);box-shadow:0 10px 22px rgba(45,106,79,.30), 0 0 0 8px rgba(82,183,136,.14);}
}
.btn.beacon{animation:beacon 2.4s ease-in-out infinite;}
@media (prefers-reduced-motion:reduce){.btn.beacon{animation:none;}}
.error{font-size:12px;color:#C0756E;text-align:center;margin-top:10px;min-height:16px;font-weight:600;}
.loading{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:var(--texto-suave);margin-top:10px;}
.dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--sendero);animation:dp 1.2s ease-in-out infinite;}
.dots span:nth-child(2){animation-delay:.2s;}.dots span:nth-child(3){animation-delay:.4s;}
@keyframes dp{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.divider{display:flex;align-items:center;gap:10px;margin:1.4rem 0 1rem;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--borde);}
.divider span{font-size:11px;color:var(--texto-suave);text-transform:uppercase;letter-spacing:.08em;font-weight:500;}
.signup{text-align:center;font-size:13px;color:var(--texto-suave);}
.signup a{color:var(--bosque);text-decoration:none;font-weight:600;}
.signup a:hover{color:var(--bosque-dark);text-decoration:underline;}
.help{text-align:center;margin-top:1rem;font-size:11px;color:#999;}
.help a{color:var(--bosque);text-decoration:none;font-weight:500;}
.help a:hover{text-decoration:underline;}
.lang-bar{position:absolute;top:14px;right:14px;display:flex;gap:4px;z-index:2;}
.lang-bar button{padding:4px 10px;font-size:10px;font-weight:600;font-family:var(--sans);border-radius:20px;border:1.5px solid var(--borde);background:#fff;color:var(--texto-suave);cursor:pointer;transition:all .15s;}
.lang-bar button.on{background:var(--bosque);border-color:var(--bosque);color:#fff;}
.lang-bar a{padding:4px 10px;font-size:10px;font-weight:600;font-family:var(--sans);border-radius:20px;border:1.5px solid var(--borde);background:#fff;color:var(--texto-suave);cursor:pointer;transition:all .15s;text-decoration:none;display:inline-block;}
@media(max-width:480px){
  .card{padding:1.5rem 1.2rem;border-radius:16px;}
  .field input{font-size:16px;padding:14px;}
  .btn{font-size:16px;padding:16px;min-height:48px;}
}

async function hashPassword(password){
  const encoder=new TextEncoder();
  const data=encoder.encode(password);
  const hashBuffer=await crypto.subtle.digest('SHA-256',data);
  const hashArray=Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function entrar(){
  var email=document.getElementById('email').value.trim().toLowerCase();
  var password=document.getElementById('password').value;
  var btn=document.getElementById('btn');
  var error=document.getElementById('error');
  var loading=document.getElementById('loading');

  error.textContent='';
  if(!email||!password){error.textContent=TXT[_lng].err_empty;return;}

  btn.disabled=true;
  loading.style.display='flex';

  try{
    // ── Login vía Supabase Auth (Fase 4: ya NO leemos password_hash con la
    //    anon key). La contraseña se verifica contra Supabase Auth. Si el
    //    usuario todavía no está en Auth (o cambió la pass solo en la tabla
    //    vieja), migrate-user-to-auth re-verifica el hash legacy server-side y
    //    crea/sincroniza el auth user; entonces reintentamos el login. ────────
    var _sbAuth=window.supabase.createClient(SB,KEY);
    var _si=await _sbAuth.auth.signInWithPassword({email:email,password:password});
    if(_si.error){
      try{
        var _mc=new AbortController();
        var _mt=setTimeout(function(){_mc.abort();},8000);
        var _mr=await fetch(SB+'/functions/v1/migrate-user-to-auth',{
          method:'POST',
          headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY},
          body:JSON.stringify({email:email,password:password}),
          signal:_mc.signal
        });
        clearTimeout(_mt);
        if(!_mr.ok){
          // 401 = credenciales mal; otro = problema de red/servidor.
          error.textContent = (_mr.status===401) ? TXT[_lng].err_wrong : TXT[_lng].err_net;
          btn.disabled=false;loading.style.display='none';
          return;
        }
      }catch(_e){
        error.textContent=TXT[_lng].err_net;
        btn.disabled=false;loading.style.display='none';
        return;
      }
      // Reintentar ya con el auth user creado/sincronizado.
      _si=await _sbAuth.auth.signInWithPassword({email:email,password:password});
      if(_si.error){
        error.textContent=TXT[_lng].err_wrong;
        btn.disabled=false;loading.style.display='none';
        return;
      }
    }
    var _authUid=(_si.data && _si.data.user && _si.data.user.id) || null;
    // Token de la sesión recién creada: lo usamos para leer/escribir la PROPIA
    // fila de usuarios (las políticas RLS "tu propia fila" lo necesitan; con la
    // anon key, tras el hardening, un cliente no podría leer su fila).
    var _jwt=(_si.data && _si.data.session && _si.data.session.access_token) || KEY;

    // Perfil propio (SIN password_hash). Con la sesión activa lo leemos por email.
    var res=await fetch(SB+'/rest/v1/usuarios?email=eq.'+encodeURIComponent(email)+'&select=id,email,rol,nombre,activo,configuracion,foto_url,bio,nombre_practica,auth_id&limit=1',{
      headers:{'apikey':KEY,'Authorization':'Bearer '+_jwt}
    });
    var rows=await res.json();

    if(!rows||!rows.length){
      error.textContent=TXT[_lng].err_wrong;
      btn.disabled=false;loading.style.display='none';
      return;
    }

    var usuario=rows[0];

    // Paywall: si la cuenta esta inactiva (no pagaron o suscripcion vencida),
    // mostrar mensaje claro y CTA al Stripe en vez de error generico
    if(usuario.activo===false && usuario.rol!=='admin' && usuario.rol!=='empleado'){
      var stripeUrl = 'https://buy.stripe.com/00waEX3Qke8gczqge78AE0d';
      // Dentro de la app de tienda no se muestra el link de pago (se renueva en la web).
      error.innerHTML = window.PW_IN_APP
        ? 'Your account is pending payment. Renew your subscription by visiting <strong>pathwaycareercoach.com</strong> from your browser.'
        : 'Your account is pending payment. <a href="'+stripeUrl+'?prefilled_email='+encodeURIComponent(usuario.email)+'" style="color:var(--bosque);font-weight:600;text-decoration:underline;">Complete payment →</a>';
      btn.disabled=false;loading.style.display='none';
      return;
    }
    localStorage.setItem('mj_user',JSON.stringify({id:usuario.id,email:usuario.email,rol:usuario.rol,nombre:usuario.nombre,activo:usuario.activo,configuracion:usuario.configuracion||{},foto_url:usuario.foto_url||'',bio:usuario.bio||'',nombre_practica:usuario.nombre_practica||''}));

    // Guardar auth_id si todavía no estaba (lo tenemos de la sesión recién creada).
    if(!usuario.auth_id && _authUid){
      try{
        await fetch(SB+'/rest/v1/usuarios?id=eq.'+encodeURIComponent(usuario.id),{
          method:'PATCH',
          headers:{'apikey':KEY,'Authorization':'Bearer '+_jwt,'Content-Type':'application/json','Prefer':'return=minimal'},
          body:JSON.stringify({auth_id:_authUid})
        });
      }catch(_e){}
    }

    // Registrar el último acceso (best-effort). El panel admin lo lee de
    // configuracion.last_login para la columna "Último acceso" de coaches.
    if(usuario.rol==='coach'||usuario.rol==='admin'){
      try{
        var _cfg=Object.assign({}, usuario.configuracion||{}, {last_login:new Date().toISOString()});
        await fetch(SB+'/rest/v1/usuarios?id=eq.'+encodeURIComponent(usuario.id),{
          method:'PATCH',
          headers:{'apikey':KEY,'Authorization':'Bearer '+_jwt,'Content-Type':'application/json','Prefer':'return=minimal'},
          body:JSON.stringify({configuracion:_cfg})
        });
      }catch(e){}
    }

    var _v='v='+Date.now();
    if(usuario.rol==='coach'||usuario.rol==='admin'){
      window.location.href=BASE+'/panel-v2.html?'+_v;
    } else if(usuario.rol==='empleado'){
      window.location.href=BASE+'/empleado.html?'+_v;
    } else {
      // Clientes de nicho (fitness/financiero) van a su portal; carrera = cliente.html.
      // El nicho real está en candidatos.nicho (la config del usuario puede no
      // tenerlo). Lo leemos con el cliente de Supabase (lleva el JWT → pasa RLS).
      var _ct=(usuario.configuracion&&usuario.configuracion.coach_type)||'';
      if(!_ct || _ct==='carrera'){
        try{
          var _sc=window.supabase.createClient(SB,KEY);
          var _cq=await _sc.from('candidatos').select('nicho').eq('email',email).limit(1);
          if(_cq && _cq.data && _cq.data.length && _cq.data[0].nicho) _ct=_cq.data[0].nicho;
        }catch(_e){}
      }
      if(!_ct)_ct='carrera';
      var _em='&email='+encodeURIComponent((''+(usuario.email||'')).toLowerCase().trim());
      if(_ct==='fitness'){ window.location.href=BASE+'/pathway-fit-cliente.html?'+_v+_em; }
      else if(_ct==='financiero'){ window.location.href=BASE+'/pathway-fin-cliente.html?'+_v+_em; }
      else { window.location.href=BASE+'/cliente.html?'+_v; }
    }
  }catch(err){
    error.textContent=TXT[_lng].err_net;
    btn.disabled=false;loading.style.display='none';
  }
}

// Registrar el service worker para que el navegador pueda ofrecer "Instalar app".
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('/sw.js').catch(function(){});
  });
}
</script>
