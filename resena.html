<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><style>html{scrollbar-gutter:stable;overflow-x:hidden;max-width:100%;}body{overflow-x:hidden;max-width:100%;}</style>
<meta name="robots" content="noindex">
<title>Deja tu reseña · Pathway</title>
<link rel="icon" href="/favicon-app.svg?v=6" type="image/svg+xml">
<style>
:root{--pw-bosque:#2D6A4F;--pw-carbon:#1B2E26;--pw-borde:#dfe5e0;--pw-texto:#33403a;--pw-suave:#7a857f;--pw-bg:#f4f6f4}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--pw-bg);color:var(--pw-texto);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
.card{background:#fff;border:1.5px solid var(--pw-borde);border-radius:18px;max-width:480px;width:100%;padding:30px 28px}
h1{font-family:Georgia,'Times New Roman',serif;font-size:23px;font-weight:500;color:var(--pw-carbon);letter-spacing:-.5px;margin-bottom:6px}
.sub{font-size:14px;color:var(--pw-suave);margin-bottom:20px;line-height:1.5}
#stars{cursor:pointer;user-select:none;color:#E9C46A;margin-bottom:14px}
#stars span{display:inline-block;padding:8px 9px;font-size:36px;line-height:1}
textarea,input{width:100%;padding:12px 14px;border:1.5px solid var(--pw-borde);border-radius:10px;font-family:inherit;font-size:14px;margin-bottom:12px}
textarea{resize:vertical;min-height:96px}
button{width:100%;padding:14px;background:var(--pw-bosque);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
button:disabled{opacity:.6}
#ok{display:none;text-align:center}
#ok .big{font-size:38px;margin-bottom:10px}
.gbtn{display:inline-block;margin-top:14px;padding:12px 24px;background:#E9C46A;color:#1B2E26;border-radius:10px;font-size:14px;font-weight:700;text-decoration:none}
.foot{margin-top:18px;text-align:center;font-size:11px;color:var(--pw-suave)}
</style>
</head>
<body>
<div class="card">
  <div id="form">
    <h1>¿Cómo te fue con Pathway?</h1>
    <div class="sub">Tu opinión nos ayuda un montón — y a otros profesionales a animarse. Son 30 segundos 🙏</div>
    <div id="stars"><span data-v="1">☆</span><span data-v="2">☆</span><span data-v="3">☆</span><span data-v="4">☆</span><span data-v="5">☆</span></div>
    <textarea id="txt" placeholder="¿Qué te pareció? ¿Qué fue lo más útil para ti?"></textarea>
    <input id="nom" placeholder="Tu nombre (opcional)">
    <button type="button" id="btn" onclick="enviar()">Enviar mi reseña</button>
  </div>
  <div id="ok">
    <div class="big">🙌</div>
    <h1>¡Gracias por tu reseña!</h1>
    <div class="sub" id="ok-sub">De verdad nos ayuda muchísimo.</div>
  </div>
  <div class="foot">Pathway · pathwaycareercoach.com</div>
</div>
<script>
"use strict";
var SB='https://api.pathwaycareercoach.com';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkeG5yc25qZHZ0cWh4dW54bndsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjM5ODAwMDAsImV4cCI6MTg4MTc0NjAwMH0.WyY8_f_mTGJfRJLZ_b4A_rC8_r-9qOqNM8gfDg6xxRk';
var rating=0;
var q=new URLSearchParams(location.search);
(function(){
  var n=q.get('nombre'); if(n){ var el=document.getElementById('nom'); el.value=n; }
  var st=document.getElementById('stars');
  st.addEventListener('click',function(e){
    var t=e.target&&e.target.getAttribute('data-v')?e.target:null; if(!t)return;
    rating=parseInt(t.getAttribute('data-v'),10)||0;
    var sp=st.getElementsByTagName('span');
    for(var i=0;i<sp.length;i++){ sp[i].textContent=(parseInt(sp[i].getAttribute('data-v'),10)<=rating)?'★':'☆'; }
  });
})();
function enviar(){
  var txt=(document.getElementById('txt').value||'').trim();
  var nom=(document.getElementById('nom').value||'').trim();
  if(!rating && !txt){ alert('Déjanos al menos una estrella o un comentario 🙏'); return; }
  var btn=document.getElementById('btn'); btn.disabled=true; btn.textContent='Enviando…';
  var fin=function(){
    document.getElementById('form').style.display='none';
    document.getElementById('ok').style.display='block';
  };
  // Guarda en la tabla `reviews` (formato estructurado). Antes guardaba una
  // línea de texto en contactos_chat, que testimonios.js no podía leer.
  // No usar .then(fin,fin) — chequeamos r.ok y avisamos si falla.
  // Si el link trae ?coach=<slug> (lo arma el panel al "Pedir reseña"), la
  // reseña queda vinculada a ESE coach y sale en su perfil /coach/<slug>.
  // Sin coach -> reseña general (landing de Pathway, coach_slug NULL).
  var _cslug=(q.get('coach')||'').trim().toLowerCase();
  var _payload={nombre:nom||null,rating:rating||null,texto:txt||null,fuente:(_cslug?'coach':'cv-express')};
  if(_cslug) _payload.coach_slug=_cslug;
  fetch(SB+'/rest/v1/reviews',{
    method:'POST',
    headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
    body:JSON.stringify(_payload)
  }).then(function(r){
    if(!r.ok){
      btn.disabled=false; btn.textContent='Enviar mi reseña';
      alert('No pudimos guardar tu reseña ahora mismo 😔 Reintenta en un momento o escríbenos por WhatsApp al +34 611 25 62 24.');
      return;
    }
    fin();
  }).catch(function(){
    btn.disabled=false; btn.textContent='Enviar mi reseña';
    alert('Parece que no hay conexión. Reintenta cuando vuelvas a tener internet 🙏');
  });
}
</script>
</body>
</html>
