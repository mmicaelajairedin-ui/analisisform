<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><style>html{scrollbar-gutter:stable;overflow-x:hidden;max-width:100%;}body{overflow-x:hidden;max-width:100%;}</style>
<title>Perfil del coach · Pathway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* ═══ Perfil del coach — gamificación (limpio, editorial, con aire) ═══ */
:root{
  --pw-bosque:#2D6A4F; --pw-bosque-dark:#1B4332; --pw-sendero:#52B788;
  --pw-amanecer:#E9C46A; --pw-oro:#D4A24C;
  --crema:#F8F5EF; --panel:#FBFAF6;
  --ink:#1C2620; --ink-soft:#5A5A55; --ink-mute:#8A928C;
  --line:rgba(45,106,79,.10);
  --serif:"Fraunces","Georgia",serif; --sans:"Inter",-apple-system,sans-serif;
  --sh-sm:0 1px 3px rgba(28,38,32,.05);
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);color:var(--ink);background:var(--crema);min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:428px;margin:0 auto;padding:20px 22px 40px}
.eyebrow{font:800 11px var(--sans);text-transform:uppercase;letter-spacing:1.2px;color:var(--ink-mute);display:flex;align-items:center;gap:7px}
.seehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.seeall{font:700 12.5px var(--sans);color:var(--pw-bosque);cursor:pointer;text-decoration:none;white-space:nowrap}
.sec{padding:14px 0}
.hr{height:1px;background:var(--line)}

/* Header (sin caja) */
.phead{display:flex;align-items:center;gap:16px;position:relative;padding:6px 0 22px}
.phead-x{position:absolute;top:0;right:0;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink-mute);display:grid;place-items:center;cursor:pointer;font-size:13px}
.pavatar{position:relative;flex:0 0 auto}
.pavatar img{width:72px;height:72px;border-radius:50%;object-fit:cover;box-shadow:var(--sh-sm)}
.pavatar .pen{position:absolute;bottom:-1px;right:-1px;width:26px;height:26px;border-radius:50%;background:var(--pw-bosque);color:#fff;display:grid;place-items:center;border:3px solid var(--crema)}
.pavatar .pen svg{width:12px;height:12px}
.pname{font:700 22px var(--sans);letter-spacing:-.4px;line-height:1.1}
.prole{display:inline-flex;align-items:center;gap:5px;font:700 14px var(--sans);color:var(--pw-bosque);margin-top:3px}
.pmeta{font-size:12.5px;color:var(--ink-mute);margin-top:6px;line-height:1.75}
.pmeta span{display:flex;align-items:center;gap:6px}
.pmeta svg{width:13px;height:13px;opacity:.7;flex:0 0 auto}

/* PUNTOS (caja 1 — el bloque estrella) */
.pts{position:relative;overflow:hidden;border-radius:20px;padding:22px 20px;
  background:linear-gradient(135deg,#FCFBF5,#F4EEDF);border:1px solid rgba(212,162,76,.22);box-shadow:var(--sh-sm);margin-bottom:8px}
.pts .eyebrow{color:#a98a3e}
.pts-big{font:800 54px var(--sans);letter-spacing:-2.5px;line-height:.95;margin-top:10px}
.pts-big small{font-size:22px;font-weight:600;color:var(--ink-soft);letter-spacing:-.5px}
.pts-delta{display:inline-flex;align-items:center;gap:6px;font:700 13.5px var(--sans);color:var(--pw-bosque);margin-top:12px}
.pts-goat{position:absolute;right:6px;bottom:2px;width:186px;pointer-events:none}

/* NIVEL (sin caja) */
.niv{display:flex;align-items:flex-start;gap:16px}
.niv-l{flex:1}
.niv-t{font:700 20px var(--sans);letter-spacing:-.3px;margin-top:6px}
.niv-x{font-size:13px;color:var(--ink-soft);margin-top:4px}
.niv-track{height:10px;border-radius:100px;background:rgba(45,106,79,.10);overflow:hidden;margin-top:14px}
.niv-fill{height:100%;border-radius:100px;background:linear-gradient(90deg,var(--pw-sendero),var(--pw-bosque))}
.niv-cap{font-size:12px;color:var(--ink-mute);font-weight:600;margin-top:7px}
.niv-shield{flex:0 0 auto;width:66px;height:76px;position:relative;display:grid;place-items:center;margin-top:2px}
.niv-shield svg.sh{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 8px 12px rgba(45,106,79,.26))}
.niv-shield .star{position:relative;color:var(--pw-amanecer);font-size:26px}

/* MEDALLAS (sin caja — círculos grandes con aire) */
.medals{display:flex;justify-content:space-between;gap:8px}
.medal{flex:1;text-align:center}
.medal-ic{width:58px;height:58px;border-radius:50%;margin:0 auto 9px;display:grid;place-items:center;color:#fff;box-shadow:0 4px 10px rgba(28,38,32,.10)}
.medal-ic svg{width:27px;height:27px}
.medal-t{font:700 12px var(--sans);line-height:1.1}
.medal-s{font-size:10.5px;color:var(--ink-mute);margin-top:2px}

/* BADGES (sin caja — protagonistas, grandes) */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 2px}
.badge{text-align:center}
/* Todos los badges en una caja del MISMO tamaño (contain) → grilla pareja
   aunque el arte tenga aspectos distintos. */
.badge img{width:100%;height:128px;object-fit:contain;display:block;filter:drop-shadow(0 11px 16px rgba(27,67,50,.22)) drop-shadow(0 3px 6px rgba(27,67,50,.12))}
.badge.lock img{filter:grayscale(1) opacity(.42)}
.badge.lock{position:relative}
.badge.lock .lk{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);font-size:26px;opacity:.5}
.badge-t{font:600 12.5px var(--sans);color:var(--ink-soft);margin-top:-2px}

/* LOGROS (sin caja) */
.ach{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.ach:last-child{border-bottom:none;padding-bottom:2px}
.ach-ic{flex:0 0 auto;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:20px;background:#fff;box-shadow:var(--sh-sm)}
.ach-t{font:700 14px var(--sans)}
.ach-s{font-size:12px;color:var(--ink-mute);margin-top:2px;line-height:1.4}
.ach-r{margin-left:auto;text-align:right;flex:0 0 auto}
.ach-pts{font:800 13px var(--sans);color:var(--pw-bosque)}
.ach-time{font-size:11px;color:var(--ink-mute);margin-top:1px}

/* RANKING (caja 2 — botón) */
.cta{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;height:54px;border:none;border-radius:16px;
  background:var(--pw-bosque-dark);color:#fff;font:700 15.5px var(--sans);cursor:pointer;box-shadow:0 12px 26px rgba(27,67,50,.24);margin-top:20px}
.cta svg{width:19px;height:19px}

/* Popup "Ver ranking de coaches" — el podio de la revista */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.pf-rkov{position:fixed;inset:0;z-index:9800;display:flex;align-items:center;justify-content:center;background:rgba(20,30,25,.5);backdrop-filter:blur(3px);padding:20px}
.pf-rkcard{background:linear-gradient(170deg,#F1F8F4 0%,#EAF4EE 50%,#FBF6E9 100%);border-radius:22px;padding:20px 18px;max-width:340px;width:100%;box-shadow:0 24px 60px rgba(20,40,30,.3);text-align:center;position:relative}
.pf-rkx{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink-mute);cursor:pointer;font-size:13px}
.gold{display:inline-flex;align-items:center;gap:6px;font:800 10.5px var(--sans);letter-spacing:1.8px;text-transform:uppercase;padding:7px 12px;border-radius:100px;background:linear-gradient(135deg,#E9C46A,#D4A24C);color:#4a340c}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;width:100%;height:252px;padding:0 8px}
.pod{display:flex;flex-direction:column;align-items:center;flex:1;max-width:82px}
.pod-av{width:48px;height:48px;border-radius:50%;margin-bottom:8px;position:relative;overflow:hidden;box-shadow:var(--sh-sm);border:2.5px solid #fff}
.pod-av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pod-ini{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff}
.pod-trophy{font-size:25px;line-height:1;margin-bottom:3px;filter:drop-shadow(0 5px 7px rgba(212,162,76,.45));animation:bob 3s var(--ease) infinite}
.pod-nm{font-size:11px;font-weight:700;margin-bottom:6px;text-align:center;line-height:1.1}
.pod-block{width:100%;border-radius:12px 12px 0 0;display:grid;place-items:start center;padding-top:12px;font-family:var(--serif);font-size:23px;font-weight:700;position:relative;background:#fff;border:1.5px solid var(--line);border-bottom:none;box-shadow:0 -1px 10px rgba(28,38,32,.04)}
.pod-pts{position:absolute;bottom:9px;font-family:var(--sans);font-size:10px;font-weight:700;color:var(--ink-mute)}
.pod-1 .pod-block{height:118px;border-color:rgba(212,162,76,.6);color:var(--pw-oro);background:linear-gradient(180deg,#FFFBF1,#fff 60%)}
.pod-2 .pod-block{height:88px;border-color:rgba(168,175,181,.65);color:#8A9199;background:linear-gradient(180deg,#FAFBFC,#fff 60%)}
.pod-3 .pod-block{height:66px;border-color:rgba(185,122,61,.55);color:#B97A3D;background:linear-gradient(180deg,#FEF8F2,#fff 60%)}
.pod-1 .pod-av{background:linear-gradient(135deg,#2D6A4F,#52B788);width:54px;height:54px}
.pod-2 .pod-av{background:linear-gradient(135deg,#5E6B74,#93A0A6)}
.pod-3 .pod-av{background:linear-gradient(135deg,#B97A3D,#D19A63)}
</style>
</head>
<body>
<div class="wrap">

  <!-- Header -->
  <div class="phead">
    <button class="phead-x" aria-label="Cerrar">✕</button>
    <div class="pavatar">
      <img id="pav" src="assets/micaela.jpg" alt="" onerror="this.src='assets/cabra/mira.png';this.style.background='#EAF3ED'">
    </div>
    <div>
      <div class="pname">Micaela Jairedin</div>
      <div class="prole"><img src="/assets/cabra/frente.gif" alt="" style="height:1.05em;width:auto;vertical-align:-.16em"> Coach Pro</div>
      <div class="pmeta">
        <span id="pf-loc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><span>Barcelona, España</span></span>
        <span id="pf-since"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span>Miembro desde marzo 2024</span></span>
      </div>
    </div>
  </div>

  <!-- PUNTOS (caja) -->
  <div class="pts">
    <div class="eyebrow">⭐ Mis puntos</div>
    <div class="pts-big">1.240 <small>pts</small></div>
    <div class="pts-delta">▲ 180 pts esta semana</div>
    <img class="pts-goat" src="assets/cabra/trofeo.png" alt="">
  </div>

  <!-- NIVEL -->
  <div class="sec" id="secNivel">
    <div class="eyebrow" style="margin-bottom:2px">Mi nivel</div>
    <div class="niv">
      <div class="niv-l">
        <div class="niv-t">Nivel 7 · Coach Pro</div>
        <div class="niv-x">Te faltan <b>160 pts</b> para llegar a Coach Elite</div>
        <div class="niv-track"><div class="niv-fill" style="width:88%"></div></div>
        <div class="niv-cap">1.240 / 1.400 pts</div>
      </div>
      <div class="niv-shield">
        <svg class="sh" viewBox="0 0 66 76"><path d="M33 2 62 13 V38 C62 58 49 69 33 74 C17 69 4 58 4 38 V13 Z" fill="#2D6A4F" stroke="#1B4332" stroke-width="2"/></svg>
        <span class="star">★</span>
      </div>
    </div>
  </div>
  <div class="hr" id="hrNivel"></div>

  <!-- MEDALLAS -->
  <div class="sec">
    <div class="seehead"><div class="eyebrow">🏅 Mis medallas</div></div>
    <div class="medals" id="medals"></div>
  </div>
  <div class="hr"></div>

  <!-- BADGES -->
  <div class="sec">
    <div class="seehead"><div class="eyebrow">🎖️ Mis badges</div></div>
    <div class="badges" id="badges"></div>
    <button id="badges-more" onclick="pfToggleBadges()" style="display:none;width:100%;margin-top:12px;background:none;border:none;color:var(--pw-bosque);font:700 13px var(--sans);cursor:pointer;padding:6px"></button>
  </div>
  <div class="hr"></div>

  <!-- LOGROS -->
  <div class="sec" id="secActividad">
    <div class="seehead"><div class="eyebrow">🏆 Actividad reciente</div><a class="seeall">Ver todos</a></div>
    <div id="ach"></div>
  </div>

  <button class="cta" onclick="pfShowRanking()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/></svg> Ver ranking de coaches</button>
</div>

<script>
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function svg(d){return "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='"+d+"'/></svg>";}

var MEDALS=[
  {t:'Constancia',s:'Nivel 3',c:'#2D6A4F',ic:svg('M12 2l3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z')},
  {t:'Racha',     s:'5 días', c:'#E29A3C',ic:svg('M12 2C9 6 6 8 6 13a6 6 0 0 0 12 0c0-2-1-3.5-2-5-1.5 2-3 2-3 0 0-2 1-4-1-6z')},
  {t:'Comunidad', s:'Nivel 2',c:'#8B7BB5',ic:svg('M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 7a4 4 0 1 0 .01 0M22 21v-2a4 4 0 0 0-3-3.87')},
  {t:'Enfoque',   s:'Nivel 4',c:'#3FA89B',ic:svg('M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM12 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2z')},
  {t:'Impacto',   s:'Nivel 1',c:'#C0756E',ic:svg('M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.8 1.1-1.1a5.5 5.5 0 0 0 0-7.8z')}
];
document.getElementById('medals').innerHTML=MEDALS.map(function(m){
  return "<div class='medal'><div class='medal-ic' style='background:"+m.c+"'>"+m.ic+"</div>"+
    "<div class='medal-t'>"+esc(m.t)+"</div><div class='medal-s'>"+esc(m.s)+"</div></div>";
}).join('');

/* La colección completa de badges (en modo real se bloquean los no ganados) */
var BADGES=[
  {f:'nivel-1',       t:'Nivel 1'},
  {f:'fundador',      t:'Fundador'},
  {f:'early-adopter', t:'Early Adopter'},
  {f:'enfocado',      t:'Enfocado'},
  {f:'explorador',    t:'Explorador'},
  {f:'productivo',    t:'Productivo'},
  {f:'embajador',     t:'Embajador'},
  {f:'comunidad',     t:'Comunidad'},
  {f:'primer_ingreso',t:'Primer ingreso', lock:true},
  {f:'influencer',    t:'Influencer', lock:true},
  {f:'racha_30_dias', t:'Racha 30 días', lock:true},
  {f:'coach-pro',     t:'Coach Pro', lock:true},
  {f:'top-coach',     t:'Top Coach', lock:true},
  {f:'leyenda',       t:'Leyenda', lock:true}
];
// ── Modo real (integrado al sistema de Pathway) ──────────────────────────
// El panel pasa ?badges=<ganados>&pts=<total>&clients=<activos>. Con eso:
//  · badges: se bloquean los que el coach NO ganó.
//  · puntos: total real = cabra + acciones (una sola cuenta).
//  · medalla: la REAL de Pathway → bronce/plata/oro por clientes activos.
//  · se ocultan las secciones inventadas (nivel Coach Pro, actividad falsa).
var _P=new URLSearchParams(location.search);
var _REALP=_P.has('badges');
var _EARNED=(_P.get('badges')||'').split(',').map(function(s){return s.trim();}).filter(Boolean);
function _set(sel,html){ var e=document.querySelector(sel); if(e) e.innerHTML=html; }
function _hide(id){ var e=document.getElementById(id); if(e) e.style.display='none'; }
function _cap(s){ return s?(s.charAt(0).toUpperCase()+s.slice(1)):s; }

// Badges: se ven los primeros 6 (desbloqueados primero); el resto se despliega
// con "Ver todos" debajo del último.
(function(){
  var items=BADGES.map(function(b){ return {f:b.f,t:b.t,locked:_REALP?(_EARNED.indexOf(b.f)<0):!!b.lock}; });
  if(_REALP) items.sort(function(a,b){ return (a.locked?1:0)-(b.locked?1:0); });
  var LIM=6;
  // Sin nombre debajo: el badge ya trae su nombre en la cinta/escudo (evita el título repetido).
  function cell(b){ return "<div class='badge"+(b.locked?' lock':'')+"' title='"+esc(b.t)+"'><img src='assets/badges/"+b.f+".png?v=7' alt='"+esc(b.t)+"'>"+(b.locked?"<span class='lk'>🔒</span>":"")+"</div>"; }
  function draw(all){
    document.getElementById('badges').innerHTML=(all?items:items.slice(0,LIM)).map(cell).join('');
    var mb=document.getElementById('badges-more');
    if(mb){ if(items.length>LIM){ mb.style.display='block'; mb.textContent=all?'Ver menos ▴':('Ver todos ('+items.length+') ▾'); } else mb.style.display='none'; }
  }
  window._pfAllBadges=false;
  window.pfToggleBadges=function(){ window._pfAllBadges=!window._pfAllBadges; draw(window._pfAllBadges); };
  draw(false);
})();

if(_REALP){
  // Puntos totales reales
  var _pts=parseInt(_P.get('pts')||'0',10)||0;
  _set('.pts-big', _pts.toLocaleString('es-ES')+" <small>pts</small>");
  var _pd=document.querySelector('.pts-delta'); if(_pd) _pd.style.display='none';
  // Nivel inventado (Coach Pro/Elite) y actividad demo: fuera hasta tener datos reales
  _hide('secNivel'); _hide('hrNivel'); _hide('secActividad');
  // Medalla REAL de Pathway: bronce(1+) / plata(5+) / oro(10+) por clientes activos
  var _cl=parseInt(_P.get('clients')||'0',10)||0;
  // Las 3 medallas REALES de Pathway (imágenes). Gris = todavía no lograda.
  var TIERS=[{k:'bronce',t:'Bronce',at:1},{k:'plata',t:'Plata',at:5},{k:'oro',t:'Oro',at:10}];
  var _mhtml=TIERS.map(function(m){
    var got=_cl>=m.at;
    return "<div class='medal"+(got?'':' lock')+"' style='flex:1'>"+
      "<img src='assets/iconos/medalla-"+m.k+"-sm.webp' alt='Medalla "+m.t+"' style='width:60px;height:60px;object-fit:contain;margin:0 auto 8px;display:block;"+(got?'filter:drop-shadow(0 5px 10px rgba(27,67,50,.18))':'filter:grayscale(1) opacity(.4)')+"'>"+
      "<div class='medal-t'>"+m.t+"</div>"+
      "<div class='medal-s'>"+(got?'Lograda':(m.at+' cliente'+(m.at>1?'s':'')))+"</div></div>";
  }).join('');
  _set('#medals',_mhtml);
  var _cur = _cl>=10?'oro':(_cl>=5?'plata':(_cl>=1?'bronce':''));
  var _nx  = _cl>=10?null:(_cl>=5?{t:'Oro',at:10}:(_cl>=1?{t:'Plata',at:5}:{t:'Bronce',at:1}));
  var _sub = _nx ? ("Te faltan <b>"+(_nx.at-_cl)+" cliente"+((_nx.at-_cl)>1?'s':'')+"</b> para "+_nx.t) : "¡Medalla máxima!";
  var _mh=document.querySelector('#medals');
  if(_mh){ var _cap2=document.createElement('div'); _cap2.style.cssText='font:500 12px var(--sans);color:var(--ink-soft);margin-top:12px;text-align:center'; _cap2.innerHTML=_sub; _mh.parentNode.appendChild(_cap2); }
  // Rol bajo el nombre: la medalla REAL de Pathway (no la cabra)
  _set('.prole', _cur?("<img src='assets/iconos/medalla-"+_cur+"-sm.webp' alt='' style='width:16px;height:16px;object-fit:contain;vertical-align:-3px;margin-right:4px'>Medalla "+_cap(_cur)):'Coach');
  // Foto y nombre reales del coach (los pasa el panel)
  try{ if(_P.get('photo')){ var _pv=document.getElementById('pav'); if(_pv) _pv.src=decodeURIComponent(_P.get('photo')); } }catch(e){}
  try{ if(_P.get('name')){ var _pn=document.querySelector('.pname'); if(_pn) _pn.textContent=decodeURIComponent(_P.get('name')); } }catch(e){}
  // Ubicación y "miembro desde" de CADA coach (los pasa el panel). Si no hay ubicación, se oculta.
  try{ var _lc=document.getElementById('pf-loc'); var _lv=_P.get('loc'); if(_lc){ if(_lv){ _lc.querySelector('span').textContent=decodeURIComponent(_lv); } else { _lc.style.display='none'; } } }catch(e){}
  try{ var _sc=document.getElementById('pf-since'); var _sv=_P.get('since'); if(_sc){ if(_sv){ _sc.querySelector('span').textContent='Miembro desde '+decodeURIComponent(_sv); } else { _sc.style.display='none'; } } }catch(e){}
}

var ACH=[
  {ic:'🔥',t:'¡Racha de 5 días!',s:'Usaste Pathway 5 días seguidos.',p:'+50 pts',w:'Hoy'},
  {ic:'🤝',t:'Primera recomendación',s:'Un coach se unió con tu link.',p:'+100 pts',w:'Ayer'},
  {ic:'🎯',t:'Desafío semanal completado',s:'Completaste todas las tareas del desafío.',p:'+80 pts',w:'Hace 2 días'}
];
document.getElementById('ach').innerHTML=ACH.map(function(a){
  return "<div class='ach'><span class='ach-ic'>"+a.ic+"</span>"+
    "<div><div class='ach-t'>"+esc(a.t)+"</div><div class='ach-s'>"+esc(a.s)+"</div></div>"+
    "<div class='ach-r'><div class='ach-pts'>"+esc(a.p)+"</div><div class='ach-time'>"+esc(a.w)+"</div></div></div>";
}).join('');

// Embebido en el drawer del panel: el drawer ya trae su propio ✕, ocultamos el interno.
if(/[?&]embed=1/.test(location.search)){
  var _px=document.querySelector('.phead-x');
  if(_px)_px.style.display='none';
}
// Podio "Los coaches del mes" (la card de la revista) en un popup. Datos reales
// del ranking MENSUAL los pasa el panel en ?rank.
function _pod(cls,ini,nm,rank,pts,photo){var tr=rank==='1'?"<span class='pod-trophy'>🏆</span>":"";
  var av="<div class='pod-av'><span class='pod-ini'>"+esc(ini)+"</span>"+(photo?"<img src='"+esc(photo)+"' alt='' onerror='this.remove()'>":"")+"</div>";
  return "<div class='pod "+cls+"'>"+tr+av+
    "<div class='pod-nm'>"+esc(nm)+"</div>"+
    "<div class='pod-block'>"+rank+"<span class='pod-pts'>"+esc(pts)+" pts</span></div></div>";}
function pfShowRanking(){
  var rk=null; try{ var rp=_P.get('rank'); if(rp) rk=JSON.parse(rp); }catch(e){}
  var top=(rk&&rk.top&&rk.top.length)?rk.top:[];
  var t1=top[0],t2=top[1],t3=top[2];
  var body = top.length
    ? "<div class='podium'>"+(t2?_pod('pod-2',t2.i||'·',t2.n||'—','2',t2.p||'—',t2.photo):'')+(t1?_pod('pod-1',t1.i||'·',t1.n||'—','1',t1.p||'—',t1.photo):'')+(t3?_pod('pod-3',t3.i||'·',t3.n||'—','3',t3.p||'—',t3.photo):'')+"</div>"
    : "<p style='font:400 13px/1.6 var(--sans);color:var(--ink-soft);padding:26px 8px'>Todavía no hay puntajes esta semana. Suma puntos y aparecés en el podio.</p>";
  var me=(rk&&rk.me)?("<div style='margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between'><span style='font-family:var(--serif);font-size:20px;color:var(--pw-bosque)'>Estás #"+esc(rk.me.pos)+"</span><span style='font:700 13px var(--sans);color:var(--ink-soft)'>"+esc(rk.me.pts)+" pts</span></div>"):"";
  var ov=document.createElement('div'); ov.className='pf-rkov';
  ov.innerHTML="<div class='pf-rkcard'><button class='pf-rkx' aria-label='Cerrar'>✕</button>"+
    "<div class='gold'>★ Ranking de la semana</div>"+
    "<div style='font-family:var(--serif);font-weight:700;font-size:22px;color:var(--pw-bosque-dark);margin:10px 0 2px'>Los coaches de la semana.</div>"+
    "<p style='font:400 12.5px/1.5 var(--sans);color:var(--ink-soft);margin:0 0 8px'>Suma puntos y escala el podio. Se reinicia cada semana.</p>"+
    body+me+"</div>";
  ov.addEventListener('click',function(e){ if(e.target===ov||(e.target.className||'').indexOf('pf-rkx')>=0) ov.remove(); });
  document.body.appendChild(ov);
}
</script>
</body>
