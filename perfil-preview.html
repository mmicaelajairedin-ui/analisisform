<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Perfil del coach · Pathway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* ═══ Perfil del coach — gamificación (puntos · nivel · medallas · badges) ═══ */
:root{
  --pw-bosque:#2D6A4F; --pw-bosque-dark:#1B4332; --pw-sendero:#52B788;
  --pw-amanecer:#E9C46A; --pw-oro:#D4A24C;
  --crema:#FAF7F0; --crema-2:#F3EEE2; --panel:#FBFAF6;
  --ink:#1C2620; --ink-soft:#5A5A55; --ink-mute:#8A928C;
  --line:#ECEAE1; --line-soft:#F2F0E8;
  --serif:"Fraunces","Georgia",serif; --sans:"Inter",-apple-system,sans-serif;
  --sh-xs:0 1px 2px rgba(28,38,32,.04); --sh-sm:0 1px 3px rgba(28,38,32,.05);
  --sh-md:0 4px 14px rgba(28,38,32,.06);
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);color:var(--ink);
  background:radial-gradient(900px 500px at 80% -10%,#EEF6F0,transparent 60%),var(--crema);
  min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:392px;margin:0 auto;padding:18px 14px 52px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-sm);padding:15px;margin-bottom:11px}
.eyebrow{font:800 10px var(--sans);text-transform:uppercase;letter-spacing:1.2px;color:var(--ink-mute);display:flex;align-items:center;gap:6px}
.seehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.seeall{font:700 12px var(--sans);color:var(--pw-bosque);cursor:pointer;text-decoration:none}

/* Header */
.phead{display:flex;align-items:center;gap:15px;position:relative}
.phead-x{position:absolute;top:-2px;right:-2px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink-mute);display:grid;place-items:center;cursor:pointer;font-size:13px}
.pavatar{position:relative;flex:0 0 auto}
.pavatar img{width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:var(--sh-sm)}
.pavatar .pen{position:absolute;bottom:-2px;right:-2px;width:22px;height:22px;border-radius:50%;background:var(--pw-bosque);color:#fff;display:grid;place-items:center;border:2px solid #fff}
.pavatar .pen svg{width:11px;height:11px}
.pname{font:700 18px var(--sans);letter-spacing:-.3px}
.prole{display:inline-flex;align-items:center;gap:5px;font:700 13px var(--sans);color:var(--pw-bosque);margin-top:2px}
.pmeta{font-size:12px;color:var(--ink-mute);margin-top:5px;line-height:1.7}
.pmeta span{display:inline-flex;align-items:center;gap:5px;margin-right:10px}
.pmeta svg{width:12px;height:12px;opacity:.7}

/* Puntos */
.pts-card{position:relative;overflow:hidden;background:linear-gradient(135deg,#FCFBF5,#F7F2E6);border-color:#EFE8D6}
.pts-big{font:800 34px var(--sans);letter-spacing:-1.3px;line-height:1;margin-top:6px}
.pts-big small{font-size:16px;font-weight:600;color:var(--ink-soft)}
.pts-delta{display:inline-flex;align-items:center;gap:5px;font:700 12px var(--sans);color:var(--pw-bosque);margin-top:7px}
.pts-goat{position:absolute;right:10px;bottom:4px;width:90px;filter:drop-shadow(0 6px 10px rgba(27,67,50,.14))}
.pts-goat .sp{position:absolute;font-size:12px}

/* Nivel */
.niv{display:flex;align-items:center;gap:14px}
.niv-l{flex:1}
.niv-t{font:700 18px var(--sans);letter-spacing:-.2px}
.niv-x{font-size:12.5px;color:var(--ink-soft);margin-top:3px}
.niv-track{height:9px;border-radius:100px;background:var(--crema-2);overflow:hidden;margin-top:12px}
.niv-fill{height:100%;border-radius:100px;background:linear-gradient(90deg,var(--pw-sendero),var(--pw-bosque))}
.niv-cap{font-size:11px;color:var(--ink-mute);font-weight:600;margin-top:6px;text-align:right}
.niv-shield{flex:0 0 auto;width:54px;height:62px;position:relative;display:grid;place-items:center}
.niv-shield svg.sh{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 6px 10px rgba(45,106,79,.28))}
.niv-shield .star{position:relative;color:var(--pw-amanecer);font-size:22px}

/* Medallas */
.medals{display:flex;justify-content:space-between;gap:6px}
.medal{flex:1;text-align:center}
.medal-ic{width:46px;height:46px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;color:#fff;box-shadow:var(--sh-xs)}
.medal-ic svg{width:21px;height:21px}
.medal-t{font:700 10.5px var(--sans);line-height:1.1}
.medal-s{font-size:9.5px;color:var(--ink-mute);margin-top:1px}

/* Badges */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 8px}
.badge{text-align:center}
.badge img{width:100%;max-width:96px;filter:drop-shadow(0 4px 9px rgba(27,67,50,.14))}
.badge.lock img{filter:grayscale(1) opacity(.42)}
.badge.lock{position:relative}
.badge.lock .lk{position:absolute;top:32%;left:50%;transform:translate(-50%,-50%);font-size:24px;opacity:.6}
.badge-t{font:600 11px var(--sans);color:var(--ink-soft);margin-top:3px;line-height:1.15}
.badge.lock .badge-t{color:var(--ink-mute)}

/* Logros recientes */
.ach{display:flex;align-items:center;gap:13px;padding:12px 2px;border-bottom:1px solid var(--line-soft)}
.ach:last-child{border-bottom:none}
.ach-ic{flex:0 0 auto;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:var(--crema-2)}
.ach-t{font:700 13.5px var(--sans)}
.ach-s{font-size:11.5px;color:var(--ink-mute);margin-top:1px}
.ach-r{margin-left:auto;text-align:right;flex:0 0 auto}
.ach-pts{font:800 12.5px var(--sans);color:var(--pw-bosque)}
.ach-time{font-size:10.5px;color:var(--ink-mute)}

.cta{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;height:52px;border:none;border-radius:15px;
  background:var(--pw-bosque-dark);color:#fff;font:700 15px var(--sans);cursor:pointer;box-shadow:0 10px 24px rgba(27,67,50,.24);margin-top:4px}
.cta svg{width:19px;height:19px}
</style>
</head>
<body>
<div class="wrap">

  <!-- Header -->
  <div class="card phead">
    <button class="phead-x" aria-label="Cerrar">✕</button>
    <div class="pavatar">
      <img src="assets/micaela.jpg" alt="" onerror="this.src='assets/cabra/mira.png';this.style.background='#EAF3ED'">
      <span class="pen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span>
    </div>
    <div>
      <div class="pname">Micaela Jairedin</div>
      <div class="prole">🐐 Coach Pro</div>
      <div class="pmeta">
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>Barcelona, España</span>
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Miembro desde marzo 2024</span>
      </div>
    </div>
  </div>

  <!-- Puntos -->
  <div class="card pts-card">
    <div class="eyebrow">⭐ Mis puntos</div>
    <div class="pts-big">1.240 <small>pts</small></div>
    <div class="pts-delta">▲ 180 pts esta semana</div>
    <div class="pts-goat">
      <img src="assets/cabra/trofeo.png" alt="" style="width:150px">
    </div>
  </div>

  <!-- Nivel -->
  <div class="card">
    <div class="eyebrow" style="margin-bottom:12px">▲ Mi nivel</div>
    <div class="niv">
      <div class="niv-l">
        <div class="niv-t">Nivel 7 · Coach Pro</div>
        <div class="niv-x">Te faltan <b>160 pts</b> para llegar a Coach Elite</div>
        <div class="niv-track"><div class="niv-fill" style="width:88%"></div></div>
        <div class="niv-cap">1.240 / 1.400 pts</div>
      </div>
      <div class="niv-shield">
        <svg class="sh" viewBox="0 0 60 68"><path d="M30 2 56 12 V34 C56 52 44 62 30 66 C16 62 4 52 4 34 V12 Z" fill="#2D6A4F" stroke="#1B4332" stroke-width="2"/></svg>
        <span class="star">★</span>
      </div>
    </div>
  </div>

  <!-- Medallas -->
  <div class="card">
    <div class="seehead"><div class="eyebrow">🏅 Mis medallas</div><a class="seeall">Ver todas</a></div>
    <div class="medals" id="medals"></div>
  </div>

  <!-- Badges -->
  <div class="card">
    <div class="seehead"><div class="eyebrow">🎖️ Mis badges</div><a class="seeall">Ver todos</a></div>
    <div class="badges" id="badges"></div>
  </div>

  <!-- Logros recientes -->
  <div class="card">
    <div class="seehead"><div class="eyebrow">🏆 Logros recientes</div><a class="seeall">Ver todos</a></div>
    <div id="ach"></div>
  </div>

  <button class="cta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/></svg> Ver ranking de coaches</button>
</div>

<script>
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function svg(d){return "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='"+d+"'/></svg>";}

/* Medallas: color + icono + nivel */
var MEDALS=[
  {t:'Constancia',s:'Nivel 3',c:'#2D6A4F',ic:svg('M12 2l3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z')},
  {t:'Racha',     s:'5 días', c:'#E29A3C',ic:svg('M12 2C9 6 6 8 6 13a6 6 0 0 0 12 0c0-2-1-3.5-2-5-1.5 2-3 2-3 0 0-2 1-4-1-6z')},
  {t:'Comunidad', s:'Nivel 2',c:'#8B7BB5',ic:svg('M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 7a4 4 0 1 0 .01 0M22 21v-2a4 4 0 0 0-3-3.87')},
  {t:'Enfoque',   s:'Nivel 4',c:'#3FA89B',ic:svg('M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM12 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2z')},
  {t:'Impacto',   s:'Nivel 1',c:'#C0756E',ic:svg('M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.8 1.1-1.1a5.5 5.5 0 0 0 0-7.8z')}
];
document.getElementById('medals').innerHTML=MEDALS.map(function(m){
  return "<div class='medal'><div class='medal-ic' style='background:"+m.c+"'>"+m.ic+"</div>"+
    "<div class='medal-t'>"+esc(m.t)+"</div><div class='medal-s'>"+esc(m.s)+"</div></div>";
}).join('');

/* Badges: colección (color = desbloqueado, lock = pendiente) */
var BADGES=[
  {f:'enfocado',   t:'Enfocado'},
  {f:'explorador', t:'Explorador'},
  {f:'coach-pro',  t:'Coach Pro'},
  {f:'top-coach',  t:'Top Coach'},
  {f:'productivo', t:'Productivo'},
  {f:'embajador',  t:'Embajador'},
  {f:'comunidad',  t:'Comunidad'},
  {f:'leyenda',    t:'Leyenda', lock:true}
];
document.getElementById('badges').innerHTML=BADGES.map(function(b){
  return "<div class='badge"+(b.lock?' lock':'')+"'>"+
    "<img src='assets/badges/"+b.f+".png' alt='"+esc(b.t)+"'>"+
    (b.lock?"<span class='lk'>🔒</span>":"")+
    "<div class='badge-t'>"+(b.lock?'Aún no<br>desbloqueado':esc(b.t))+"</div></div>";
}).join('');

/* Logros recientes */
var ACH=[
  {ic:'🔥',t:'¡Racha de 5 días!',s:'Usaste Pathway 5 días seguidos.',p:'+50 pts',w:'Hoy'},
  {ic:'🤝',t:'Primera recomendación',s:'Un coach se unió con tu link.',p:'+100 pts',w:'Ayer'},
  {ic:'🎯',t:'Desafío semanal completado',s:'Completaste todas las tareas del desafío.',p:'+80 pts',w:'Hace 2 días'}
];
document.getElementById('ach').innerHTML=ACH.map(function(a){
  return "<div class='ach'><span class='ach-ic'>"+a.ic+"</span>"+
    "<div><div class='ach-t'>"+esc(a.t)+"</div><div class='ach-s'>"+esc(a.s)+"</div></div>"+
    "<div class='ach-r'><div class='ach-pts'>"+esc(a.p)+"</div><div class='ach-time'>"+esc(a.w)+"</div></div></div>";
}).join('');
</script>
</body>
</html>
