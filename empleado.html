<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon-app.svg?v=3" type="image/svg+xml">
<meta name="theme-color" content="#2D6A4F">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Panel de empleado — Pathway</title>
<script>
  // ── Guard de acceso ─────────────────────────────────────────
  // Solo empleados / admin (o la allowlist comercial). Si no, al login.
  (function(){
    var me = null;
    try{ me = JSON.parse(localStorage.getItem('mj_user') || 'null'); }catch(e){}
    var ALLOW = ["gonzaloalcalde97@gmail.com","gonzaloalcalde@pathwaycareercoach.com","mmicaela.jairedin@gmail.com"];
    var email = (me && me.email ? ('' + me.email).toLowerCase().trim() : '');
    var ok = !!me && (me.rol === 'empleado' || me.rol === 'admin' || ALLOW.indexOf(email) >= 0);
    if(!ok){ window.location.replace('/login.html'); }
    window.__ME = me || {};
  })();
</script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bosque:#2D6A4F;--bosque-dark:#1B4332;--sendero:#52B788;
    --carbon:#1B2E26;--niebla:#FAFDF9;--texto-suave:#5A5A55;--borde:rgba(45,106,79,.13);
    --serif:'Fraunces',Georgia,serif;--sans:'Inter',-apple-system,sans-serif;
    --side-top:#1f5c43;--side-bot:#1B4332;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:var(--sans);color:var(--carbon);background:#EFF3EE;display:flex;min-height:100vh;min-height:100dvh;}
  a{text-decoration:none;color:inherit;}

  /* Sidebar */
  .side{width:230px;flex-shrink:0;background:linear-gradient(180deg,var(--side-top),var(--side-bot));color:#fff;display:flex;flex-direction:column;padding:18px 14px;}
  .brand{display:flex;align-items:center;gap:9px;padding:6px 8px 18px;}
  .brand-word{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-.4px;}
  .badge{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:rgba(255,255,255,.6);padding:0 8px 14px;}
  .nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;font-size:13.5px;font-weight:500;color:rgba(255,255,255,.82);width:100%;text-align:left;border:none;background:transparent;cursor:pointer;position:relative;}
  .nav-item.is-active{background:rgba(255,255,255,.14);color:#fff;font-weight:600;}
  .nav-item.is-active::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--sendero);}
  .side-foot{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.12);}
  .who{display:flex;align-items:center;gap:10px;padding:6px 8px 12px;}
  .who-av{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:600;font-size:15px;flex-shrink:0;}
  .who-name{font-size:13px;font-weight:600;line-height:1.2;}
  .who-role{font-size:11px;color:rgba(255,255,255,.6);}
  .logout{display:flex;align-items:center;gap:9px;width:100%;padding:9px 12px;border-radius:9px;font-size:13px;font-weight:600;color:rgba(255,255,255,.85);background:rgba(255,255,255,.08);border:none;cursor:pointer;}
  .logout:hover{background:rgba(255,255,255,.16);}

  /* Main */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .top{padding:20px 26px 14px;}
  .h1{font-family:var(--serif);font-size:24px;font-weight:600;color:var(--carbon);}
  .sub{font-size:13.5px;color:var(--texto-suave);margin-top:3px;}
  .frame-wrap{flex:1;padding:0 20px 20px;}
  .frame-card{height:100%;background:#fff;border:1px solid var(--borde);border-radius:16px;overflow:hidden;box-shadow:0 2px 14px rgba(20,55,38,.05);}
  iframe{width:100%;height:100%;border:0;display:block;}

  @media(max-width:820px){
    body{flex-direction:column;}
    .side{width:100%;flex-direction:row;align-items:center;padding:10px 14px;gap:10px;}
    .brand{padding:0;} .badge,.who,.side-foot{display:none;}
    .nav-item{width:auto;}
    .side-mobile-logout{display:inline-flex!important;margin-left:auto;}
    .frame-wrap{padding:0 10px 10px;} .top{padding:14px 16px 10px;}
  }
  .side-mobile-logout{display:none;}
</style>
</head>
<body>
  <aside class="side">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 100 100" aria-hidden="true"><polygon points="10,82 32,52 54,82" fill="#52B788"/><polygon points="34,82 58,28 82,82" fill="#FAFDF9"/><circle cx="58" cy="22" r="5" fill="#E9C46A"/></svg>
      <span class="brand-word">pathway<span style="color:var(--sendero)">.</span></span>
    </div>
    <div class="badge">Panel de empleado</div>
    <button class="nav-item is-active">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
      <span>Email templates</span>
    </button>
    <button class="logout side-mobile-logout" onclick="cerrarSesion()" aria-label="Cerrar sesión">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
    <div class="side-foot">
      <div class="who">
        <div class="who-av" id="avatar">·</div>
        <div><div class="who-name" id="uname">—</div><div class="who-role">Empleado</div></div>
      </div>
      <button class="logout" onclick="cerrarSesion()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Cerrar sesión
      </button>
    </div>
  </aside>

  <div class="main">
    <div class="top">
      <div class="h1">📧 Email templates</div>
      <div class="sub">Plantillas de email diseñadas para el equipo comercial. Copiá con diseño y pegá en Gmail.</div>
    </div>
    <div class="frame-wrap">
      <div class="frame-card">
        <iframe src="plantillas-email-comercial.html" title="Plantillas de email comercial" loading="lazy"></iframe>
      </div>
    </div>
  </div>

<script>
  // Nombre / inicial del empleado
  (function(){
    var me = window.__ME || {};
    var nombre = me.nombre || (me.email ? me.email.split('@')[0] : 'Empleado');
    var un = document.getElementById('uname'); if(un) un.textContent = nombre;
    var av = document.getElementById('avatar');
    if(av){ av.textContent = (('' + nombre).trim()[0] || '·').toUpperCase(); }
  })();

  function cerrarSesion(){
    try{ localStorage.removeItem('mj_user'); }catch(e){}
    // Best-effort: cerrar también la sesión de Supabase si el SDK está presente
    try{
      if(window.supabase){
        var sb = window.supabase.createClient('https://ddxnrsnjdvtqhxunxnwj.supabase.co','x');
        sb.auth.signOut();
      }
    }catch(e){}
    window.location.href = '/login.html';
  }
</script>
</body>
</html>
