<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon-app.svg?v=3" type="image/svg+xml">
<meta name="theme-color" content="#2D6A4F">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Panel — Pathway Team</title>
<script>
  // Guard: solo empleados / admin. Genérico por rol.
  (function(){
    var me=null; try{ me=JSON.parse(localStorage.getItem('mj_user')||'null'); }catch(e){}
    if(!me || !(me.rol==='empleado' || me.rol==='admin')){ window.location.replace('/login.html'); }
    window.__ME = me || {};
  })();
</script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pw-serif:'Fraunces',Georgia,serif;--pw-sans:'Inter',-apple-system,sans-serif;
    --pw-bosque:#2D6A4F;--pw-bosque-dark:#1B4332;--pw-sendero:#52B788;--pw-amanecer:#E9C46A;
    --pw-carbon:#1B2E26;--pw-niebla:#FAFDF9;--pw-text-soft:#5A5A55;--pw-border:rgba(45,106,79,.13);
    --pw-side-top:#1f5c43;--pw-side-bot:#1B4332;--pw-text-on-dark:rgba(255,255,255,.9);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:var(--pw-sans);color:var(--pw-carbon);background:#EFF3EE;display:flex;min-height:100vh;}
  a{text-decoration:none;color:inherit;}

  /* ===== Sidebar (idéntico al del coach) ===== */
  .cp-side{width:236px;flex-shrink:0;background:linear-gradient(180deg,var(--pw-side-top) 0%,var(--pw-side-bot) 100%);color:var(--pw-text-on-dark);display:flex;flex-direction:column;padding:18px 14px;gap:16px;min-height:100vh;}
  .cp-side-brand{display:inline-flex;align-items:center;gap:8px;padding:4px 6px;}
  .cp-side-brand-word{font-family:var(--pw-serif);font-size:20px;font-weight:500;color:#fff;letter-spacing:-.5px;}
  .cp-side-coach{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding:16px 8px 18px;border-top:1px solid rgba(255,255,255,.10);border-bottom:1px solid rgba(255,255,255,.10);}
  .cp-side-coach-photo{position:relative;width:80px;height:80px;margin-bottom:7px;}
  .cp-side-coach-photo img,.cp-side-coach-photo .ini{width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.78);}
  .cp-side-coach-photo .ini{display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.16);color:#fff;font-family:var(--pw-serif);font-size:30px;font-weight:600;}
  .cp-side-coach-name{font-family:var(--pw-serif);font-weight:600;font-size:16px;color:#fff;line-height:1.15;letter-spacing:-.2px;}
  .cp-side-coach-role{font-size:12px;color:rgba(255,255,255,.66);margin-top:2px;}
  .cp-side-nav{display:flex;flex-direction:column;gap:2px;}
  .cp-side-nav-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;font-size:13px;font-weight:500;color:rgba(255,255,255,.78);transition:all .15s;width:100%;text-align:left;cursor:pointer;border:none;background:transparent;position:relative;}
  .cp-side-nav-item:hover{background:rgba(255,255,255,.08);color:#fff;}
  .cp-side-nav-item.is-active{background:rgba(255,255,255,.14);color:#fff;font-weight:600;}
  .cp-side-nav-item.is-active::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--pw-sendero);}
  .cp-side-nav-icon{width:16px;height:16px;flex-shrink:0;opacity:.9;}
  .cp-side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:0 4px;}
  .cp-side-link{display:inline-flex;align-items:center;gap:7px;padding:8px 8px;font-size:12.5px;color:rgba(255,255,255,.62);border-radius:7px;background:none;border:none;cursor:pointer;font-family:inherit;text-align:left;}
  .cp-side-link:hover{color:#fff;background:rgba(255,255,255,.06);}

  /* ===== Main ===== */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .emp-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 24px 10px;position:relative;}
  .emp-title{font-family:var(--pw-serif);font-size:22px;font-weight:600;color:var(--pw-carbon);}
  .emp-sub{font-size:13px;color:var(--pw-text-soft);margin-top:1px;}
  .emp-msg{position:relative;width:42px;height:42px;border-radius:12px;border:1px solid var(--pw-border);background:#fff;color:var(--pw-bosque);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
  .emp-msg:hover{background:var(--pw-niebla);}
  .emp-msg svg{width:20px;height:20px;}
  .emp-msg .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:#C25B5B;border:2px solid #fff;}
  .msgpop{position:absolute;top:60px;right:24px;width:270px;background:#fff;border:1px solid var(--pw-border);border-radius:14px;box-shadow:0 12px 40px rgba(20,55,38,.18);padding:16px;z-index:40;display:none;}
  .msgpop.show{display:block;}
  .msgpop h4{font-family:var(--pw-serif);font-size:15px;font-weight:600;margin-bottom:2px;}
  .msgpop p{font-size:12px;color:var(--pw-text-soft);margin-bottom:12px;}
  .msgpop a{display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:10px;font-size:13.5px;font-weight:600;margin-bottom:8px;}
  .msgpop a.wa{background:#25D366;color:#fff;} .msgpop a.mail{background:rgba(45,106,79,.09);color:var(--pw-bosque);}
  .body{flex:1;padding:0 20px 20px;min-height:0;}
  .pane{height:100%;} .pane[hidden]{display:none;}
  .frame-card{height:100%;background:#fff;border:1px solid var(--pw-border);border-radius:16px;overflow:hidden;box-shadow:0 2px 14px rgba(20,55,38,.05);}
  iframe{width:100%;height:100%;border:0;display:block;}

  @media(max-width:820px){
    body{flex-direction:column;}
    .cp-side{width:100%;min-height:auto;flex-direction:row;align-items:center;gap:6px;padding:9px 12px;overflow-x:auto;}
    .cp-side-brand{padding:0 6px 0 0;flex-shrink:0;} .cp-side-coach,.cp-side-foot{display:none;}
    .cp-side-nav{flex-direction:row;gap:2px;} .cp-side-nav-item span{display:none;} .cp-side-nav-item{gap:0;padding:9px 12px;}
    .mob-logout{display:inline-flex!important;margin-left:auto;flex-shrink:0;}
    .body{padding:0 10px 10px;} .emp-top{padding:12px 14px 8px;} .msgpop{right:10px;}
  }
  .mob-logout{display:none;}
</style>
</head>
<body>
  <aside class="cp-side">
    <a href="#" class="cp-side-brand">
      <svg width="24" height="24" viewBox="0 0 100 100" aria-hidden="true"><polygon points="10,82 32,52 54,82" fill="var(--pw-sendero)"/><polygon points="34,82 58,28 82,82" fill="#FAFDF9"/><circle cx="58" cy="22" r="5" fill="#E9C46A"/></svg>
      <span class="cp-side-brand-word">pathway<span style="color:var(--pw-sendero)">.</span></span>
    </a>

    <div class="cp-side-coach">
      <div class="cp-side-coach-photo" id="photo"></div>
      <div class="cp-side-coach-name" id="uname">—</div>
      <div class="cp-side-coach-role">Pathway Team</div>
    </div>

    <nav class="cp-side-nav">
      <button class="cp-side-nav-item is-active" data-tab="plantillas">
        <svg class="cp-side-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
        <span>Email templates</span>
      </button>
      <button class="cp-side-nav-item" data-tab="firma">
        <svg class="cp-side-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <span>Mi firma</span>
      </button>
    </nav>

    <button class="cp-side-link mob-logout" onclick="cerrarSesion()" aria-label="Cerrar sesión">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>

    <div class="cp-side-foot">
      <button class="cp-side-link" onclick="cerrarSesion()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Cerrar sesión
      </button>
    </div>
  </aside>

  <div class="main">
    <div class="emp-top">
      <div>
        <div class="emp-title" id="ptitle">Email templates</div>
        <div class="emp-sub" id="psub">Plantillas de email diseñadas. Copiá con diseño y pegá en Gmail.</div>
      </div>
      <button class="emp-msg" onclick="toggleMsg(event)" title="Mensajes con Micaela">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span class="dot"></span>
      </button>
      <div class="msgpop" id="msgpop">
        <h4>Micaela Jairedin</h4>
        <p>Escribile por lo que necesites.</p>
        <a class="wa" href="https://wa.me/34623816019" target="_blank" rel="noopener">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="#fff"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.76.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.21c5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2zm5.52 13.99c-.21.58-1.2 1.11-1.68 1.18-.43.06-.97.09-1.56-.1-.36-.11-.82-.26-1.41-.52-2.48-1.07-4.11-3.57-4.23-3.74-.12-.16-1.01-1.34-1.01-2.56 0-1.22.63-1.82.86-2.07.23-.25.49-.31.66-.31l.48.01c.15 0 .36-.06.56.42.2.5.7 1.72.76 1.84.06.12.1.26.02.43-.08.17-.12.28-.25.42-.12.14-.26.32-.37.43-.13.13-.25.26-.11.51.15.25.64 1.06 1.38 1.72.94.84 1.74 1.11 1.99 1.23.25.13.4.11.54-.06.15-.16.63-.72.79-.97.16-.25.32-.21.56-.13.23.09 1.45.69 1.69.81.25.12.41.18.47.29.07.11.07.6-.14 1.18z"/></svg>
          WhatsApp
        </a>
        <a class="mail" href="mailto:hi@pathwaycareercoach.com">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
          Email
        </a>
      </div>
    </div>

    <div class="body">
      <div class="pane" id="pane-plantillas">
        <div class="frame-card"><iframe src="plantillas-email-comercial.html" title="Plantillas de email"></iframe></div>
      </div>
      <div class="pane" id="pane-firma" hidden>
        <div class="frame-card"><iframe id="if-firma" title="Mi firma" data-src="firmas-email.html"></iframe></div>
      </div>
    </div>
  </div>

<script>
  var TABS = {
    plantillas:{ title:"Email templates", sub:"Plantillas de email diseñadas. Copiá con diseño y pegá en Gmail." },
    firma:{ title:"Mi firma", sub:"Tu firma corporativa. Cambiá tu foto o tus links y copiala para Gmail." }
  };
  var _loaded={};
  document.querySelectorAll('.cp-side-nav-item[data-tab]').forEach(function(b){ b.addEventListener('click',function(){ goTab(b.dataset.tab); }); });
  function goTab(t){
    document.querySelectorAll('.cp-side-nav-item[data-tab]').forEach(function(b){ b.classList.toggle('is-active',b.dataset.tab===t); });
    ['plantillas','firma'].forEach(function(x){ document.getElementById('pane-'+x).hidden=(x!==t); });
    var m=TABS[t]||TABS.plantillas;
    document.getElementById('ptitle').textContent=m.title;
    document.getElementById('psub').textContent=m.sub;
    if(t==='firma' && !_loaded.firma){ var f=document.getElementById('if-firma'); f.src=f.getAttribute('data-src'); _loaded.firma=true; }
  }

  // Foto / nombre del empleado
  (function(){
    var me=window.__ME||{};
    var nombre=me.nombre||(me.email?me.email.split('@')[0]:'Pathway Team');
    document.getElementById('uname').textContent=nombre;
    var ph=document.getElementById('photo');
    if(me.foto_url){ ph.innerHTML="<img src='"+me.foto_url+"' alt='"+nombre+"'>"; }
    else { ph.innerHTML="<div class='ini'>"+((''+nombre).trim()[0]||'·').toUpperCase()+"</div>"; }
  })();

  function toggleMsg(e){ if(e) e.stopPropagation(); document.getElementById('msgpop').classList.toggle('show'); }
  document.addEventListener('click', function(e){ if(!e.target.closest('.emp-msg') && !e.target.closest('.msgpop')){ document.getElementById('msgpop').classList.remove('show'); } });

  function cerrarSesion(){ try{ localStorage.removeItem('mj_user'); }catch(e){} window.location.href='/login.html'; }
</script>
</body>
</html>
