<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<style>html{color-scheme:light;scrollbar-gutter:stable;overflow-x:hidden;max-width:100%;}</style>
<link rel="icon" href="/favicon-app.svg?v=6" type="image/svg+xml">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Recuperar contraseña — Pathway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bosque:#2D6A4F;--bosque-dark:#1B4332;--sendero:#52B788;--amanecer:#E9C46A;
  --carbon:#1B2E26;--niebla:#FAFDF9;--texto:#1B2E26;--texto-suave:#5A5A55;
  --borde:rgba(45,106,79,.12);--serif:'Fraunces',Georgia,serif;--sans:'Inter',-apple-system,sans-serif;
}
body{
  font-family:var(--sans);color:var(--texto);min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:2rem 1rem;
  background:linear-gradient(135deg,#FAFDF9 0%,#F0F7F2 50%,#E8F2EC 100%);
  position:relative;overflow:hidden;
}
body::before{content:'';position:absolute;top:-180px;right:-180px;width:480px;height:480px;border-radius:50%;background:rgba(82,183,136,.08);}
body::after{content:'';position:absolute;bottom:-120px;left:-120px;width:340px;height:340px;border-radius:50%;background:rgba(45,106,79,.05);}
.card{background:#fff;border-radius:20px;padding:2.5rem 2rem;width:100%;max-width:420px;box-shadow:0 8px 40px rgba(45,106,79,.08);position:relative;z-index:1;animation:cardIn .5s ease;border:1px solid var(--borde);}
@keyframes cardIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.logo{text-align:center;margin-bottom:1.4rem;}
.logo-mark{width:48px;height:48px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;}
.logo h1{font-family:var(--serif);font-size:22px;font-weight:500;color:var(--carbon);margin-bottom:6px;letter-spacing:-0.6px;}
.logo p{font-size:13px;color:var(--texto-suave);font-weight:400;line-height:1.5;}
.field{margin-bottom:1rem;}
.field label{display:block;font-size:11px;font-weight:600;color:var(--texto-suave);margin-bottom:6px;letter-spacing:.06em;text-transform:uppercase;}
.field input{width:100%;padding:13px 14px;font-size:14px;font-family:var(--sans);border:1.5px solid var(--borde);border-radius:10px;background:#fff;color:var(--texto);outline:none;transition:all .2s;}
.field input:focus{border-color:var(--bosque);box-shadow:0 0 0 3px rgba(82,183,136,.15);background:#FAFDF9;}
.btn{width:100%;padding:14px;font-size:14px;font-family:var(--sans);font-weight:600;border:none;border-radius:10px;background:var(--bosque);color:#fff;cursor:pointer;transition:all .2s;margin-top:.5rem;box-shadow:0 4px 14px rgba(45,106,79,.18);}
.btn:hover{background:var(--bosque-dark);transform:translateY(-1px);}
.btn:disabled{background:#bbb;cursor:not-allowed;box-shadow:none;transform:none;}
.msg{font-size:12.5px;text-align:center;margin-top:12px;min-height:16px;font-weight:600;line-height:1.5;}
.msg.err{color:#C0756E;}
.msg.ok{color:var(--bosque);}
.loading{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:var(--texto-suave);margin-top:10px;}
.dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--sendero);animation:dp 1.2s ease-in-out infinite;}
.dots span:nth-child(2){animation-delay:.2s;}.dots span:nth-child(3){animation-delay:.4s;}
@keyframes dp{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.back{text-align:center;margin-top:1.3rem;font-size:13px;}
.back a{color:var(--bosque);text-decoration:none;font-weight:600;}
.back a:hover{text-decoration:underline;}
.success-icon{width:54px;height:54px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;background:rgba(82,183,136,.15);border-radius:50%;font-size:26px;}
@media(max-width:480px){
  .card{padding:1.6rem 1.2rem;border-radius:16px;}
  .field input{font-size:16px;padding:14px;}
  .btn{font-size:16px;padding:16px;min-height:48px;}
}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-mark">
      <svg width="44" height="44" viewBox="0 0 100 100" aria-hidden="true">
        <polygon points="36.2,35.2 52.8,54.3 52.8,81.8 7.4,81.8" fill="#215C44"/>
        <polygon points="67.9,45.8 92.6,81.8 43.1,81.8" fill="#267A54"/>
        <circle cx="75.4" cy="27.8" r="10.3" fill="#F8CA45"/>
      </svg>
    </div>
    <h1 id="title">Recuperar contraseña</h1>
    <p id="subtitle">Te enviamos un enlace para crear una nueva.</p>
  </div>

  <!-- MODO 1: pedir el email -->
  <div id="mode-request">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="tu@email.com" autocomplete="email">
    </div>
    <button class="btn" id="btn-request" onclick="pedir()">Enviar enlace →</button>
  </div>

  <!-- MODO 2: setear la nueva contraseña (cuando hay token en la URL) -->
  <div id="mode-reset" style="display:none;">
    <div class="field">
      <label for="pass1">Nueva contraseña</label>
      <input type="password" id="pass1" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
    </div>
    <div class="field">
      <label for="pass2">Repite la contraseña</label>
      <input type="password" id="pass2" placeholder="Otra vez" autocomplete="new-password" onkeydown="if(event.key==='Enter')guardar()">
    </div>
    <button class="btn" id="btn-reset" onclick="guardar()">Guardar contraseña →</button>
  </div>

  <!-- MODO 3: confirmación -->
  <div id="mode-done" style="display:none;text-align:center;">
    <div class="success-icon">✓</div>
    <p style="font-size:14px;color:var(--texto);line-height:1.6;" id="done-text"></p>
  </div>

  <div class="msg" id="msg"></div>
  <div class="loading" id="loading" style="display:none;">
    <div class="dots"><span></span><span></span><span></span></div>
    <span>Procesando...</span>
  </div>

  <div class="back"><a href="login.html">← Volver a acceder</a></div>
</div>

<script>
var SB='https://api.pathwaycareercoach.com';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkeG5yc25qZHZ0cWh4dW54bndqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNDk5MzksImV4cCI6MjA5MDcyNTkzOX0.t82X1x-PDgFDGYhKC7YXoRKhga9I8Hjet60QUYvtZLU';

function qs(k){return new URLSearchParams(location.search).get(k)||'';}
var TOKEN=qs('token');
var EMAIL_FROM_URL=qs('email').trim().toLowerCase();

var elMsg=document.getElementById('msg');
var elLoad=document.getElementById('loading');
function showMsg(t,cls){elMsg.textContent=t;elMsg.className='msg '+(cls||'');}
function busy(on){elLoad.style.display=on?'flex':'none';}

// Si hay token en la URL → modo "setear nueva contraseña".
if(TOKEN){
  document.getElementById('mode-request').style.display='none';
  document.getElementById('mode-reset').style.display='block';
  document.getElementById('title').textContent='Crea tu nueva contraseña';
  document.getElementById('subtitle').textContent='Elige una contraseña que recuerdes.';
} else if(EMAIL_FROM_URL){
  // Venimos del login con el email ya escrito → lo precargamos para que solo
  // tenga que tocar "Enviar enlace" (un paso menos, menos fricción).
  var _ei=document.getElementById('email'); if(_ei) _ei.value=EMAIL_FROM_URL;
}

function post(payload){
  return fetch(SB+'/functions/v1/password-reset',{
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY},
    body:JSON.stringify(payload)
  });
}

// ── MODO 1: pedir enlace ──────────────────────────────────────────────
async function pedir(){
  showMsg('','');
  var email=document.getElementById('email').value.trim().toLowerCase();
  if(!email||email.indexOf('@')<0){showMsg('Escribe un email válido.','err');return;}
  var btn=document.getElementById('btn-request');
  btn.disabled=true;busy(true);
  try{
    await post({action:'request',email:email});
    // Respuesta siempre OK (no revelamos si el email existe).
    busy(false);
    document.getElementById('mode-request').style.display='none';
    document.getElementById('title').textContent='Revisa tu email';
    document.getElementById('subtitle').textContent='';
    var done=document.getElementById('mode-done');
    document.getElementById('done-text').innerHTML='Si <b>'+email+'</b> tiene una cuenta, te llegó un enlace para crear una nueva contraseña. Revisa también spam.';
    done.style.display='block';
  }catch(e){
    busy(false);btn.disabled=false;
    showMsg('Error de conexión. Prueba de nuevo.','err');
  }
}

// ── MODO 2: guardar nueva contraseña ──────────────────────────────────
async function guardar(){
  showMsg('','');
  var p1=document.getElementById('pass1').value;
  var p2=document.getElementById('pass2').value;
  if(p1.length<6){showMsg('La contraseña debe tener al menos 6 caracteres.','err');return;}
  if(p1!==p2){showMsg('Las contraseñas no coinciden.','err');return;}
  if(!EMAIL_FROM_URL){showMsg('Enlace inválido. Pide uno nuevo.','err');return;}
  var btn=document.getElementById('btn-reset');
  btn.disabled=true;busy(true);
  try{
    var res=await post({action:'confirm',email:EMAIL_FROM_URL,token:TOKEN,password:p1});
    var data=await res.json();
    busy(false);
    if(data&&data.ok){
      document.getElementById('mode-reset').style.display='none';
      document.getElementById('title').textContent='¡Listo!';
      document.getElementById('subtitle').textContent='';
      var done=document.getElementById('mode-done');
      document.getElementById('done-text').innerHTML='Tu contraseña se actualizó. Ya puedes <a href="login.html" style="color:var(--bosque);font-weight:600;">acceder con la nueva</a>.';
      done.style.display='block';
      setTimeout(function(){location.href='login.html';},3500);
    }else{
      btn.disabled=false;
      var err=(data&&data.error)||'';
      if(err==='invalid_or_expired'){
        showMsg('El enlace venció o ya se usó. Pide uno nuevo.','err');
      }else if(err==='password_too_short'){
        showMsg('La contraseña debe tener al menos 6 caracteres.','err');
      }else{
        showMsg('No se pudo actualizar. Prueba de nuevo.','err');
      }
    }
  }catch(e){
    busy(false);btn.disabled=false;
    showMsg('Error de conexión. Prueba de nuevo.','err');
  }
}
</script>
</body>
</html>
