<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bosque:#2D6A4F;
  --bosque-dark:#1B4332;
  --sendero:#52B788;
  --amanecer:#E9C46A;
  --carbon:#1B2E26;
  --niebla:#FAFDF9;
  --texto:#1B2E26;
  --texto-suave:#5A5A55;
  --borde:rgba(45,106,79,.12);
  --serif:'Fraunces',Georgia,serif;
  --sans:'Inter',-apple-system,sans-serif;
}
html{
  scrollbar-gutter:stable;
  max-width:100%;
}
body{
  font-family:var(--sans);color:var(--texto);min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:2rem 1rem;
  background:linear-gradient(135deg,#FAFDF9 0%,#F0F7F2 50%,#E8F2EC 100%);
  position:relative;overflow:hidden;
  max-width:100%;
}
body::before{content:'';position:absolute;top:-180px;right:-180px;width:480px;height:480px;border-radius:50%;background:rgba(82,183,136,.08);}
body::after{content:'';position:absolute;bottom:-120px;left:-120px;width:340px;height:340px;border-radius:50%;background:rgba(45,106,79,.05);}
.card{
  background:#fff;border-radius:20px;padding:2.5rem 2rem;width:100%;max-width:420px;
  box-shadow:0 8px 40px rgba(45,106,79,.08);position:relative;z-index:1;
  animation:cardIn .5s ease;
  border:1px solid var(--borde);
}
@keyframes cardIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.logo{text-align:center;margin-bottom:1.5rem;}
.logo-mark{width:48px;height:48px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;}
.logo h1{font-family:var(--serif);font-size:24px;font-weight:500;color:var(--carbon);margin-bottom:4px;letter-spacing:-0.6px;}
.logo h1 .accent{color:var(--sendero);}
.logo p{font-size:13px;color:var(--texto-suave);font-weight:400;}
.quote{
  text-align:center;font-size:12px;color:var(--bosque);font-style:italic;line-height:1.6;
  margin-bottom:1.5rem;padding:0 .5rem;
  animation:quoteIn .6s ease .2s both;
}
@keyframes quoteIn{from{opacity:0;}to{opacity:1;}}
.field{margin-bottom:1rem;}
.field label{display:block;font-size:11px;font-weight:600;color:var(--texto-suave);margin-bottom:6px;letter-spacing:.06em;text-transform:uppercase;}
.field input{width:100%;padding:13px 14px;font-size:14px;font-family:var(--sans);border:1.5px solid var(--borde);border-radius:10px;background:#fff;color:var(--texto);outline:none;transition:all .2s;}
.field input:focus{border-color:var(--bosque);box-shadow:0 0 0 3px rgba(82,183,136,.15);background:#FAFDF9;}
.btn{width:100%;padding:14px;font-size:14px;font-family:var(--sans);font-weight:600;border:none;border-radius:10px;background:var(--bosque);color:#fff;cursor:pointer;transition:all .2s;margin-top:.5rem;box-shadow:0 4px 14px rgba(45,106,79,.18);}
.btn:hover{background:var(--bosque-dark);transform:translateY(-1px);box-shadow:0 6px 20px rgba(45,106,79,.25);}
.btn:disabled{background:#bbb;cursor:not-allowed;box-shadow:none;transform:none;animation:none;}
@keyframes beacon{
  0%,100%{transform:translateY(0);box-shadow:0 4px 14px rgba(45,106,79,.22);}
  50%{transform:translateY(-2px);box-shadow:0 10px 22px rgba(45,106,79,.30), 0 0 0 8px rgba(82,183,136,.14);}
}
.btn.beacon{animation:beacon 2.4s ease-in-out infinite;}
@media (prefers-reduced-motion:reduce){.btn.beacon{animation:none;}}
.error{font-size:12px;color:#C0756E;text-align:center;margin-top:10px;min-height:16px;font-weight:600;}
.loading{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:var(--texto-suave);margin-top:10px;}
.dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--sendero);animation:dp 1.2s ease-in-out infinite;}
.dots span:nth-child(2){animation-delay:.2s;}.dots span:nth-child(3){animation-delay:.4s;}
@keyframes dp{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.divider{display:flex;align-items:center;gap:10px;margin:1.4rem 0 1rem;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--borde);}
.divider span{font-size:11px;color:var(--texto-suave);text-transform:uppercase;letter-spacing:.08em;font-weight:500;}
.signup{text-align:center;font-size:13px;color:var(--texto-suave);}
.signup a{color:var(--bosque);text-decoration:none;font-weight:600;}
.signup a:hover{color:var(--bosque-dark);text-decoration:underline;}
.help{text-align:center;margin-top:1rem;font-size:11px;color:#999;}
.help a{color:var(--bosque);text-decoration:none;font-weight:500;}
.help a:hover{text-decoration:underline;}
.lang-bar{position:absolute;top:14px;right:14px;display:flex;gap:4px;z-index:2;}
.lang-bar button{padding:4px 10px;font-size:10px;font-weight:600;font-family:var(--sans);border-radius:20px;border:1.5px solid var(--borde);background:#fff;color:var(--texto-suave);cursor:pointer;transition:all .15s;}
.lang-bar button.on{background:var(--bosque);border-color:var(--bosque);color:#fff;}
@media(max-width:480px){
  .card{padding:1.5rem 1.2rem;border-radius:16px;}
  .field input{font-size:16px;padding:14px;}
  .btn{font-size:16px;padding:16px;min-height:48px;}
}
</style>

<!-- Supabase JS SDK para Google OAuth -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
// ════════════════════════════════════════════════════════════════
// CONFIGURATION ARCHITECTURE — Automatic Project Detection (v2)
// ════════════════════════════════════════════════════════════════
//
// DESIGN PRINCIPLE: Configuration must be automatic and project-aware.
// Do NOT hardcode JWTs or access tokens. They must be generated dynamically.
//
// Architecture:
// 1. Proxy (api.pathwaycareercoach.com) provides configuration endpoint
// 2. login.html fetches ANON_KEY from proxy on page load
// 3. Supabase client is initialized with ANON_KEY for correct project
// 4. Auth flows issue JWTs for correct project automatically
//
// This ensures: same code works for all deployments (dev, staging, prod)
// without hardcoding secrets or changing code.

var BASE='https://pathwaycareercoach.com';

// SB points to proxy which routes to correct Supabase project
var SB='https://api.pathwaycareercoach.com';

// KEY — usar valor conocido, fallback inmediato (no bloquear login)
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkeG5yc25qZHZ0cWh4dW54bndqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNDk5MzksImV4cCI6MjA5MDcyNTkzOX0.t82X1x-PDgFDGYhKC7YXoRKhga9I8Hjet60QUYvtZLU';

// ── Instancia global Supabase (evita "Multiple GoTrueClient" warning) ──
var _sbGlobal = null;
try {
  if(window.supabase) _sbGlobal = window.supabase.createClient(SB, KEY);
} catch(e) {}

document.body.classList.add('auth-ready');

// ── Google Sign-in ─────────────────────────────────────────
// Redirige al usuario a Google OAuth → Supabase → /auth-callback.html?source=login
// auth-callback.html sincroniza con la tabla usuarios y redirige al panel
// (o a Stripe si es la primera vez via Google y no tienen cuenta).
function signInWithApple(){
  if(!KEY){
    alert('⚠️ Configuración aún no disponible. Por favor recarga la página.');
    return;
  }

  var btn = document.getElementById('btn-apple');
  if(btn){btn.disabled = true; btn.style.opacity = '.65'; var span = btn.querySelector('span'); if(span) span.textContent = 'Conectando con Apple...';}

  // Detectar si estamos en la app iOS nativa (Capacitor).
  var isNativeIOS = false;
  try {
    var C = window.Capacitor;
    if(C && (typeof C.isNativePlatform === "function" ? C.isNativePlatform() : C.isNative)){
      var plat = (typeof C.getPlatform === "function" ? C.getPlatform() : "");
      isNativeIOS = (plat === "ios");
    }
  } catch(e) {}

  // ── Flujo nativo (iOS app con Capacitor) ──
  if(isNativeIOS){
    var SignInWithApple = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SignInWithApple;
    if(!SignInWithApple){
      if(btn){btn.disabled = false; btn.style.opacity = '1'; var span = btn.querySelector('span'); if(span) span.textContent = 'Continuar con Apple';}
      alert('Plugin de Apple no disponible en esta versión de la app.');
      return;
    }

    SignInWithApple.authorize({ scopes: 'name email' })
      .then(function(result){
        if(!result || !result.response){
          throw new Error('No se recibió respuesta del plugin');
        }
        var resp = result.response;
        var identityToken = resp.identityToken;
        var user = resp.user; // ID único de Apple
        var email = resp.email;
        var givenName = resp.givenName;
        var familyName = resp.familyName;

        // Validar identityToken (obligatorio).
        if(!identityToken){
          throw new Error('No identityToken en respuesta de Apple');
        }

        // Fallback: si email/nombre vienen null (usuario ya autorizó antes),
        // usar el user (ID de Apple) como identificador.
        var finalEmail = email || (user ? (user + '@privaterelay.appleid.com') : null);
        var finalName = '';
        if(givenName || familyName){
          finalName = ((givenName || '') + ' ' + (familyName || '')).trim();
        }

        // Guardar token y datos en localStorage para auth-callback.
        try {
          localStorage.setItem('pw_apple_identity_token', identityToken);
          localStorage.setItem('pw_apple_user_id', user || '');
          if(finalEmail) localStorage.setItem('pw_apple_email', finalEmail);
          if(finalName) localStorage.setItem('pw_apple_name', finalName);
        } catch(e) {}

        // Redirigir a auth-callback para procesar con Supabase.
        window.location.href = 'https://pathwaycareercoach.com/auth-callback.html?source=login&apple_native=1';
      })
      .catch(function(err){
        console.error('[apple native signin]', err);
        if(btn){btn.disabled = false; btn.style.opacity = '1'; var span = btn.querySelector('span'); if(span) span.textContent = 'Continuar con Apple';}
        alert('Error iniciando sesión con Apple: ' + (err && err.message || 'desconocido'));
      });
    return;
  }

  // ── Flujo web (navegador normal o PWA) ──
  if(!window.supabase){
    if(btn){btn.disabled = false; btn.style.opacity = '1'; var span = btn.querySelector('span'); if(span) span.textContent = 'Continuar con Apple';}
    alert('Supabase SDK no cargo todavia. Recarga la página.');
    return;
  }

  var redirectTo = 'https://pathwaycareercoach.com/auth-callback.html?source=login';
  var sb = window.supabase.createClient(SB, KEY);
  sb.auth.signInWithOAuth({
    provider: 'apple',
    options: { redirectTo: redirectTo }
  }).catch(function(err){
    console.error('[apple signin web]', err);
    if(btn){btn.disabled = false; btn.style.opacity = '1'; var span = btn.querySelector('span'); if(span) span.textContent = 'Continuar con Apple';}
    alert('Error iniciando sesión con Apple: ' + (err && err.message || 'desconocido'));
  });
}
// Helper: Procesar tokens de Google y completar login (compartido por iOS nativo y web)
function _handleGoogleAuthSuccess(access_token, refresh_token, btn){
  var sb = _sbGlobal || window.supabase.createClient(SB, KEY);
  // setSession es rápido (solo valida JWT locally), no esperes más de 2s
  var sessionTimeout = setTimeout(function(){
    if(btn){btn.disabled = false; btn.style.opacity = '1'; var span = btn.querySelector('span'); if(span) span.textContent = 'Continuar con Google';}
    alert('La sesión tardó demasiado. Inténtalo de nuevo.');
  }, 2000);

  sb.auth.setSession({ access_token: access_token, refresh_token: refresh_token }).then(function(){
    clearTimeout(sessionTimeout);
    // Sesión seteada → redirigir según rol guardado o crear usuario
    try {
      var usrStr = localStorage.getItem('mj_user');
      if(usrStr){
        var usr = JSON.parse(usrStr);
        var _v = 'v=' + Date.now();
        var dest = usr.rol === 'owner' ? '/panel-v2.html#multicoach&v=' :
                   (usr.rol === 'coach' || usr.rol === 'admin') ? '/panel-v2.html?' :
                   (usr.rol === 'empleado') ? '/empleado.html?' :
                   '/cliente.html?';
        window.location.href = dest + _v;
        return;
      }
    } catch(e) {}
    // Sin sesión → redirigir a auth-callback para crear usuario
    window.location.href = 'https://pathwaycareercoach.com/auth-callback.html?source=login&v=' + Date.now();
  }).catch(function(err){
    clearTimeout(sessionTimeout);
    console.error('[setSession error]', err);
    if(btn){btn.disabled = false; btn.style.opacity = '1'; var span = btn.querySelector('span'); if(span) span.textContent = 'Continuar con Google';}
    alert('Error completando sesión: ' + (err && err.message || 'desconocido'));
  });
}

function signInWithGoogle(){
  if(!KEY){
    alert('⚠️ Configuración aún no disponible. Por favor recarga la página.');
    return;
  }
  if(!window.supabase){
    alert('Supabase SDK no cargo todavia. Recarga la página.');
    return;
  }
  var btn = document.getElementById('btn-google');
  if(btn){btn.disabled = true; btn.style.opacity = '.65'; var span = btn.querySelector('span'); if(span) span.textContent = 'Conectando con Google...';}

  // Detectar si está corriendo en iOS app nativa
  var isNativeIOS = window.Capacitor && (typeof window.Capacitor.isNativePlatform === 'function' ? window.Capacitor.isNativePlatform() : window.Capacitor.isNative);
  console.log('[google-debug] Capacitor existe:', !!window.Capacitor, '| isNativeIOS:', isNativeIOS, '| GoogleAuthPlugin:', !!(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.GoogleAuthPlugin));

  if(isNativeIOS && window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.GoogleAuthPlugin){
    // iOS nativo: usar GoogleAuthPlugin.authenticate() → ASWebAuthenticationSession
    window.Capacitor.Plugins.GoogleAuthPlugin.authenticate({
      url: 'https://api.pathwaycareercoach.com/auth/v1/authorize?provider=google&redirect_to=' + encodeURIComponent('com.pathwaycareercoach.twa://auth-callback'),
      callbackScheme: 'com.pathwaycareercoach.twa'
    }).then(function(result){
      console.log('[google native plugin success]');
      // result.url = "com.pathwaycareercoach.twa://auth-callback#access_token=...&refresh_token=..."
      if(!result || !result.url){ throw 'No URL returned from plugin'; }
      var hashIndex = result.url.indexOf('#');
      if(hashIndex < 0){ throw 'No # in callback URL'; }
      var params = new URLSearchParams(result.url.substring(hashIndex + 1));
      var access_token = params.get('access_token');
      var refresh_token = params.get('refresh_token');
      if(!access_token || !refresh_token){ throw 'Missing tokens in URL'; }
      _handleGoogleAuthSuccess(access_token, refresh_token, btn);
    }).catch(function(err){
      console.error('[google native plugin error]', err);
      if(btn){btn.disabled = false; btn.style.opacity = '1'; var span = btn.querySelector('span'); if(span) span.textContent = 'Continuar con Google';}
      alert('Error iniciando sesión con Google: ' + (typeof err === 'string' ? err : (err && err.message || 'desconocido')));
    });
    return;
  }

  // En web, usar flujo OAuth estándar
  var redirectTo = 'https://pathwaycareercoach.com/auth-callback.html?source=login';
  var sb = _sbGlobal || window.supabase.createClient(SB, KEY);
  sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: redirectTo }
  }).catch(function(err){
    console.error('[google signin]', err);
    if(btn){btn.disabled = false; btn.style.opacity = '1'; var span = btn.querySelector('span'); if(span) span.textContent = 'Continuar con Google';}
    alert('Error iniciando sesión con Google: ' + (err && err.message || 'desconocido'));
  });
}

// ── iOS Custom Scheme Handler (@capacitor/app App.addListener) ──────────────
// Intercepta custom scheme com.pathwaycareercoach.twa://auth-callback
// Ejecuta en main app context (CON acceso a Capacitor bridge → Browser.close() funciona)
if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
  const { App } = window.Capacitor.Plugins;

  // Limpiar listeners previos (evita acumulación al recargar la página)
  App.removeAllListeners();

  App.addListener('appUrlOpen', async function(data) {
    const url = new URL(data.url);

    // Solo procesar si es nuestro custom scheme
    if (!url.href.startsWith('com.pathwaycareercoach.twa://auth-callback')) {
      return;
    }

    try {
      const hash = url.hash.substring(1); // Remove #
      const params = new URLSearchParams(hash);
      const access_token = params.get('access_token');
      const refresh_token = params.get('refresh_token');

      if (!access_token) {
        console.error('[iOS OAuth] No access_token en URL hash');
        return;
      }

      // Restaurar sesión en Supabase
      const sb = _sbGlobal || window.supabase.createClient(SB, KEY);
      const { data: session, error: sessionError } = await sb.auth.setSession({
        access_token,
        refresh_token
      });

      if (sessionError || !session) {
        throw new Error('setSession failed: ' + (sessionError && sessionError.message));
      }

      const user = session.user;
      const email = (user.email || '').toLowerCase().trim();

      if (!email) {
        throw new Error('Sin email en JWT');
      }

      // Buscar usuario existente (timeout 3s por si la BD es lenta)
      var existingUser = null;
      try {
        var _fetchTimeout = setTimeout(function(){}, 3000);
        const { data, error } = await sb
          .from('usuarios')
          .select('*')
          .eq('email', email)
          .single();
        clearTimeout(_fetchTimeout);
        existingUser = data;
      } catch(e) {
        console.error('[user fetch error]', e);
      }

      if (existingUser) {
        // USUARIO EXISTENTE: actualizar last_login (best-effort, no bloquea)
        const cfg = Object.assign({}, existingUser.configuracion || {});
        cfg.last_login = new Date().toISOString();
        try {
          sb.from('usuarios').update({ configuracion: cfg }).eq('id', existingUser.id);
        } catch(e) {}

        localStorage.setItem('mj_user', JSON.stringify({
          id: existingUser.id,
          email: existingUser.email,
          rol: existingUser.rol,
          nombre: existingUser.nombre,
          activo: true,
          configuracion: cfg
        }));

        // Cerrar browser inmediatamente (no esperes 300ms)
        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Browser) {
          try { window.Capacitor.Plugins.Browser.close(); } catch(e) {}
        }

        // Redirigir según rol
        const dest = existingUser.rol === 'cliente' ? '/cliente.html?' : '/panel-v2.html?';
        window.location.href = dest + 'v=' + Date.now();

      } else {
        // USUARIO NUEVO: crear con trial 14 días
        const meta = user.user_metadata || {};
        const name = meta.full_name || meta.name || meta.given_name || email.split('@')[0];
        const trialDays = 14;
        const now = new Date().toISOString();

        const newUser = {
          email,
          password_hash: null,
          rol: 'coach',
          nombre: name,
          activo: true,
          auth_id: user.id,
          configuracion: {
            coach_type: 'carrera',
            auth_provider: 'google',
            from_google: true,
            from_apple: false,
            plan: 'basic',
            estado_sub: 'prueba',
            visible_directorio: true,
            max_candidatos: 5,
            fecha_fin_prueba: new Date(Date.now() + trialDays * 24 * 60 * 60 * 1000).toISOString(),
            last_login: now
          }
        };

        const { data: createdUser, error: createError } = await sb
          .from('usuarios')
          .insert(newUser)
          .select()
          .single();

        if (createError) throw new Error('Insert failed: ' + createError.message);

        localStorage.setItem('mj_user', JSON.stringify({
          id: createdUser.id,
          email: createdUser.email,
          rol: createdUser.rol,
          nombre: createdUser.nombre,
          activo: true,
          configuracion: createdUser.configuracion || {}
        }));

        // Cierre inmediato (no esperes)
        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Browser) {
          try { window.Capacitor.Plugins.Browser.close(); } catch(e) {}
        }

        // Redirigir SIN esperar email (se envía en bg)
        window.location.href = '/panel-v2.html?welcome=1&v=' + Date.now();

        // Email de bienvenida en BACKGROUND (no bloquea redirect)
        try {
          fetch(SB + '/functions/v1/send-email', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              to: email,
              to_name: name,
              subject: '¡Te damos la bienvenida a Pathway! Tu trial de 14 días empezó 🌱',
              html: '<h2 style="font-family:Fraunces,Georgia,serif;color:#1B4332;margin:0 0 14px;">Hola ' + (name.split(' ')[0]) + ',</h2>'
                + '<p style="font-size:15px;line-height:1.65;">Te damos la bienvenida a Pathway. Tu cuenta está lista y empezaste tu <strong>trial de 14 días gratis</strong>. No te pedimos tarjeta — si al final no quieres seguir, simplemente no haces nada.</p>'
                + '<p style="margin-top:20px;"><a href="https://pathwaycareercoach.com/panel-v2.html" style="display:inline-block;padding:13px 28px;background:#2D6A4F;color:#fff;border-radius:10px;text-decoration:none;font-weight:700;">Ir a mi panel →</a></p>'
                + '<p style="font-size:13px;color:#888;margin-top:18px;">Cualquier duda, responde este mail. — Mica</p>'
            })
          }).catch(function(){});
        } catch(e) {}
      }

    } catch (err) {
      console.error('[iOS OAuth appUrlOpen] Error:', err && err.message, err && err.stack);

      // Re-habilitar botón de Google
      var btn = document.getElementById('btn-google');
      if (btn) {
        btn.disabled = false;
        btn.style.opacity = '1';
        var span = btn.querySelector('span');
        if (span) span.textContent = 'Continuar con Google';
      }

      // Mostrar error al usuario
      alert('Error iniciando sesión con Google: ' + (err && err.message || 'desconocido') + '\n\nIntentá de nuevo o usa otro método de login.');

      // Fallback: cerrar browser
      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Browser) {
        setTimeout(() => {
          try { window.Capacitor.Plugins.Browser.close(); } catch(e) {}
        }, 300);
      }
    }
  });
}

async function hashPassword(password){
  const encoder=new TextEncoder();
  const data=encoder.encode(password);
  const hashBuffer=await crypto.subtle.digest('SHA-256',data);
  const hashArray=Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function entrar(){
  var email=document.getElementById('email').value.trim().toLowerCase();
  var password=document.getElementById('password').value;
  var btn=document.getElementById('btn');
  var error=document.getElementById('error');
  var loading=document.getElementById('loading');

  // Guard: wait for KEY to load from configuration
  if(!KEY){
    error.textContent='⚠️ Configuración cargando... Inténtalo en unos momentos.';
    return;
  }

  error.textContent='';
  if(!email||!password){error.textContent=TXT[_lng].err_empty;return;}

  btn.disabled=true;
  loading.style.display='flex';

  try{
    // ── Login vía Supabase Auth (Fase 4: ya NO leemos password_hash con la
    //    anon key). La contraseña se verifica contra Supabase Auth. Si el
    //    usuario todavía no está en Auth (o cambió la pass solo en la tabla
    //    vieja), migrate-user-to-auth re-verifica el hash legacy server-side y
    //    crea/sincroniza el auth user; entonces reintentamos el login. ────────
    var _sbAuth=window.supabase.createClient(SB,KEY);
    var _si=await _sbAuth.auth.signInWithPassword({email:email,password:password});
    if(_si.error){
      try{
        var _mc=new AbortController();
        var _mt=setTimeout(function(){_mc.abort();},3000);
        var _mr=await fetch(SB+'/functions/v1/migrate-user-to-auth',{
          method:'POST',
          headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY},
          body:JSON.stringify({email:email,password:password}),
          signal:_mc.signal
        });
        clearTimeout(_mt);
        if(!_mr.ok){
          // 401 = credenciales mal; otro = problema de red/servidor.
          if(_mr.status===401){ _wrongCredsHelp(email); } else { error.textContent=TXT[_lng].err_net; }
          btn.disabled=false;loading.style.display='none';
          return;
        }
      }catch(_e){
        error.textContent=TXT[_lng].err_net;
        btn.disabled=false;loading.style.display='none';
        return;
      }
      // Reintentar ya con el auth user creado/sincronizado.
      _si=await _sbAuth.auth.signInWithPassword({email:email,password:password});
      if(_si.error){
        _wrongCredsHelp(email);
        btn.disabled=false;loading.style.display='none';
        return;
      }
    }
    var _authUid=(_si.data && _si.data.user && _si.data.user.id) || null;
    // Token de la sesión recién creada: lo usamos para leer/escribir la PROPIA
    // fila de usuarios (las políticas RLS "tu propia fila" lo necesitan; con la
    // anon key, tras el hardening, un cliente no podría leer su fila).
    var _jwt=(_si.data && _si.data.session && _si.data.session.access_token) || KEY;

    // Perfil propio (SIN password_hash). Lo buscamos por email O por auth_id: si
    // el email de Auth/Google no coincide con el de la ficha (emails desajustados),
    // por email solo no aparecía y salía "contraseña incorrecta" aunque el login
    // fuese válido. Con el fallback por auth_id igual lo encuentra.
    var _idFilter=_authUid?('or=(email.eq.'+encodeURIComponent(email)+',auth_id.eq.'+encodeURIComponent(_authUid)+')'):('email=eq.'+encodeURIComponent(email));
    var res=await fetch(SB+'/rest/v1/usuarios?'+_idFilter+'&select=id,email,rol,nombre,activo,configuracion,foto_url,bio,nombre_practica,auth_id,org_id&limit=1',{
      headers:{'apikey':KEY,'Authorization':'Bearer '+_jwt}
    });
    var rows=await res.json();

    if(!rows||!rows.length){
      _wrongCredsHelp(email);
      btn.disabled=false;loading.style.display='none';
      return;
    }

    var usuario=rows[0];

    // Paywall de SUSCRIPCIÓN: SOLO aplica a coaches (ellos pagan la plataforma).
    // Un CLIENTE nunca paga — su coach gestiona su acceso. Si un cliente está
    // pausado (activo=false) NO se le pide pago: se le muestra un mensaje claro.
    if(usuario.activo===false && usuario.rol!=='admin'){
      if(usuario.rol==='cliente'||usuario.rol==='empleado'){
        error.innerHTML = usuario.rol==='empleado'
          ? 'Tu acceso está pausado. Contactá al administrador.'
          : 'Tu acceso está pausado. Para retomarlo, escribe a tu coach.';
        btn.disabled=false;loading.style.display='none';
        return;
      }
      // Rutear al plan que tenía el coach (Pro $59 vs Basic $29), no siempre Basic.
      var _plan = (usuario.configuracion && usuario.configuracion.plan) || 'basic';
      var stripeUrl = _plan==='pro'
        ? 'https://buy.stripe.com/eVq5kD86Ae8geHy1jd8AE0e'
        : 'https://buy.stripe.com/00waEX3Qke8gczqge78AE0d';
      // Dentro de la app de tienda no se muestra el link de pago (se renueva en la web).
      error.innerHTML = window.PW_IN_APP
        ? 'Tu cuenta está pendiente de pago. Contacta con nuestro equipo para completar tu suscripción.'
        : 'Tu cuenta está pendiente de pago. <a href="'+stripeUrl+'?prefilled_email='+encodeURIComponent(usuario.email)+'" style="color:var(--bosque);font-weight:600;text-decoration:underline;">Completar pago →</a>';
      btn.disabled=false;loading.style.display='none';
      return;
    }
    // ── Determinar contexto y validar acceso según rol ────────────────────────
    var contextType = usuario.org_id ? 'enterprise' : 'individual';
    var multicoachAccess = false;
    var colaboradorPermisos = null;

    // PARALELO: Iniciar fetches de owner/colaborador SIN bloquear
    var _ownerPromise = null;
    var _colaboradorPromise = null;

    if(usuario.rol === 'owner'){
      multicoachAccess = true;
      // Iniciar fetch de orgs en paralelo (NO await aquí)
      _ownerPromise = (async function(){
        try{
          var _orgsRes = await fetch(SB+'/rest/v1/usuarios?auth_id=eq.'+encodeURIComponent(_authUid)+'&select=org_id&distinct=true', {
            headers: {'apikey': KEY, 'Authorization': 'Bearer ' + _jwt}
          });
          var _orgsRows = await _orgsRes.json();
          if(_orgsRows && Array.isArray(_orgsRows)){
            var _orgIds = {};
            _orgsRows.forEach(function(r){ if(r.org_id) _orgIds[r.org_id] = true; });
            var _orgIdsList = Object.keys(_orgIds);
            if(_orgIdsList.length > 1){
              localStorage.setItem('mj_multiorg_ids', JSON.stringify(_orgIdsList));
              localStorage.setItem('mj_multiorg_current', usuario.org_id || _orgIdsList[0]);
            }
          }
        }catch(_e){}
      })();
    }
    else if(usuario.rol === 'colaborador' && usuario.org_id){
      // Iniciar fetch de permisos en paralelo (NO await aquí)
      _colaboradorPromise = (async function(){
        try{
          var _permRes = await fetch(SB+'/rest/v1/colaborador_permisos?usuario_id=eq.'+encodeURIComponent(usuario.id)+'&org_id=eq.'+encodeURIComponent(usuario.org_id)+'&select=permisos', {
            headers: {'apikey': KEY, 'Authorization': 'Bearer ' + _jwt}
          });
          var _permRows = await _permRes.json();
          if(_permRows && Array.isArray(_permRows) && _permRows.length > 0){
            multicoachAccess = true;
            colaboradorPermisos = _permRows[0].permisos || [];
            return true;
          } else {
            return false;
          }
        }catch(_e){
          return false;
        }
      })();
    }

    // Esperar promesas de owner/colaborador ANTES de redirect (non-blocking)
    if(_colaboradorPromise !== null){
      var _hasPerms = await _colaboradorPromise;
      if(!_hasPerms){
        error.innerHTML = _lng === 'en'
          ? 'You do not have access to enterprise management. Contact your administrator.'
          : 'No tienes permisos para acceder a la gestión empresarial. Contacta al administrador.';
        btn.disabled = false;
        loading.style.display = 'none';
        return;
      }
    }
    if(_ownerPromise !== null){
      await _ownerPromise;
    }

    // Guardar usuario con contexto + flags de acceso
    var _mj_user = {
      id: usuario.id,
      email: usuario.email,
      rol: usuario.rol,
      nombre: usuario.nombre,
      activo: usuario.activo,
      configuracion: usuario.configuracion || {},
      foto_url: usuario.foto_url || '',
      bio: usuario.bio || '',
      nombre_practica: usuario.nombre_practica || '',
      org_id: usuario.org_id || null,
      coach_context: contextType,
      multicoach_access: multicoachAccess
    };
    localStorage.setItem('mj_user', JSON.stringify(_mj_user));
    localStorage.setItem('mj_auth', _jwt);
    if(colaboradorPermisos){
      localStorage.setItem('mj_colaborador_permisos', JSON.stringify(colaboradorPermisos));
    }

    // Guardar auth_id si todavía no estaba (lo tenemos de la sesión recién creada).
    if(!usuario.auth_id && _authUid){
      try{
        await fetch(SB+'/rest/v1/usuarios?id=eq.'+encodeURIComponent(usuario.id),{
          method:'PATCH',
          headers:{'apikey':KEY,'Authorization':'Bearer '+_jwt,'Content-Type':'application/json','Prefer':'return=minimal'},
          body:JSON.stringify({auth_id:_authUid})
        });
      }catch(_e){}
    }
    // Enlace robusto del auth_id vía RPC SECURITY DEFINER: salta la RLS que
    // bloqueaba el PATCH de arriba (a admins por rol<>'admin', y a emails
    // desajustados). Idempotente. Sin esto el coach queda sin ver/crear clientes.
    if(_jwt){
      try{ await fetch(SB+'/rest/v1/rpc/pw_link_auth_id',{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+_jwt,'Content-Type':'application/json'},body:'{}'}); }catch(_e){}
    }

    // Registrar el último acceso (best-effort). El panel admin lo lee de
    // configuracion.last_login para la columna "Último acceso" de coaches.
    if(usuario.rol==='coach'||usuario.rol==='admin'){
      try{
        var _cfg=Object.assign({}, usuario.configuracion||{}, {last_login:new Date().toISOString()});
        await fetch(SB+'/rest/v1/usuarios?id=eq.'+encodeURIComponent(usuario.id),{
          method:'PATCH',
          headers:{'apikey':KEY,'Authorization':'Bearer '+_jwt,'Content-Type':'application/json','Prefer':'return=minimal'},
          body:JSON.stringify({configuracion:_cfg})
        });
      }catch(e){}
    }

    // Login fresco → damos un presupuesto nuevo de reintento al panel/portal.
    // (El panel, ante un 401 por carrera de token al entrar, reintenta UNA vez
    // recargando en vez de desloguear; esto resetea ese "una vez" por login.)
    try{ sessionStorage.removeItem('pw_auth_retry'); }catch(e){}
    var _v='v='+Date.now();
    if(usuario.rol==='owner' || (usuario.rol==='colaborador' && multicoachAccess)) {
      // Handoff seguro de sesión a MultiCoach
      try {
        var _handoffResp = await fetch(SB+'/functions/v1/pathway-handoff', {
          method: 'POST',
          headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer '+_jwt},
        });
        if (_handoffResp.ok) {
          var _handoffData = await _handoffResp.json();
          if (_handoffData.code) {
            window.location.href='https://pathwayplatforms.com/?handoff='+encodeURIComponent(_handoffData.code);
            return;
          }
        }
      } catch(e) {
        console.error('[handoff] Error:', e);
      }
      // Fallback si handoff falla: redirect sin código (usuario tendrá que hacer login)
      window.location.href='https://pathwayplatforms.com/?'+_v;
    }
    else if(usuario.rol==='coach'||usuario.rol==='admin'){
      window.location.href=BASE+'/panel-v2.html?'+_v;
    } else if(usuario.rol==='empleado'){
      // Empleado (equipo comercial): panel propio mínimo con las plantillas.
      window.location.href=BASE+'/empleado.html?'+_v;
    } else {
      // Clientes de nicho (fitness/financiero) van a su portal; carrera = cliente.html.
      // El nicho real está en candidatos.nicho (la config del usuario puede no
      // tenerlo). Lo leemos con el cliente de Supabase (lleva el JWT → pasa RLS).
      var _ct=(usuario.configuracion&&usuario.configuracion.coach_type)||'';
      if(!_ct || _ct==='carrera'){
        try{
          var _sc=window.supabase.createClient(SB,KEY);
          var _cq=await _sc.from('candidatos').select('nicho').eq('email',email).limit(1);
          if(_cq && _cq.data && _cq.data.length && _cq.data[0].nicho) _ct=_cq.data[0].nicho;
        }catch(_e){}
      }
      if(!_ct)_ct='carrera';
      var _em='&email='+encodeURIComponent((''+(usuario.email||'')).toLowerCase().trim());
      if(_ct==='fitness'){ window.location.href=BASE+'/pathway-fit-cliente.html?'+_v+_em; }
      else if(_ct==='financiero'){ window.location.href=BASE+'/pathway-fin-cliente.html?'+_v+_em; }
      else { window.location.href=BASE+'/cliente.html?'+_v; }
    }
  }catch(err){
    error.textContent=TXT[_lng].err_net;
    btn.disabled=false;loading.style.display='none';
  }
}

// Registrar el service worker para que el navegador pueda ofrecer "Instalar app".
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('/sw.js').catch(function(){});
  });
}
</script>
