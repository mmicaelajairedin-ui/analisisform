<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Pathway</title>
<style>
  :root{ --pw-bosque:#2D6A4F; --pw-sendero:#52B788; --pw-niebla:#FAFDF9; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:var(--pw-niebla); color:#1B2E26;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px; text-align:center; padding:32px;
  }
  svg{ width:88px; height:88px; }
  .msg{ font-size:15px; color:#5A5A55; max-width:320px; line-height:1.5; }
  .spin{ width:26px; height:26px; border:3px solid rgba(45,106,79,.18);
    border-top-color:var(--pw-bosque); border-radius:50%; animation:s 0.8s linear infinite; }
  @keyframes s{ to{ transform:rotate(360deg); } }
  .retry{ display:none; margin-top:6px; padding:12px 22px; background:var(--pw-bosque);
    color:#fff; border:0; border-radius:12px; font-size:15px; font-weight:600; }
</style>
</head>
<body>
  <!-- Pantalla local de respaldo. En condiciones normales, Capacitor carga
       directamente el sitio en vivo (server.url en capacitor.config.json).
       Esta pantalla solo se ve si no hay conexion o mientras carga. -->
  <svg viewBox="0 0 100 100" aria-hidden="true">
    <polygon points="36.2,35.2 52.8,54.3 52.8,81.8 7.4,81.8" fill="#215C44"/>
    <polygon points="67.9,45.8 92.6,81.8 43.1,81.8" fill="#267A54"/>
    <circle cx="75.4" cy="27.8" r="10.3" fill="#F8CA45"/>
  </svg>
  <div class="spin" id="spin"></div>
  <p class="msg" id="msg">Abriendo Pathway…</p>
  <button class="retry" id="retry" onclick="location.reload()">Reintentar</button>
  <script>
    // Si tras unos segundos seguimos aca (sin conexion), mostramos "reintentar".
    setTimeout(function(){
      var s=document.getElementById('spin'), m=document.getElementById('msg'), r=document.getElementById('retry');
      if(navigator.onLine===false){
        if(s) s.style.display='none';
        if(m) m.textContent='Sin conexion a internet. Revisa tu red e intenta de nuevo.';
        if(r) r.style.display='inline-block';
      }
    }, 6000);
  </script>
</body>
</html>
