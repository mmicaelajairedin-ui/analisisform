<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pathway</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,'Inter',sans-serif;background:#FAFDF9;color:#1B2E26;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:32px;gap:18px}
  .logo{width:72px;height:72px}
  h1{font-size:22px;font-weight:600;letter-spacing:-.5px}
  p{font-size:15px;color:#5A5A55;line-height:1.5;max-width:300px}
  button{margin-top:8px;padding:13px 26px;border:none;border-radius:11px;background:#1B4332;
    color:#fff;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}
  .sp{width:24px;height:24px;border:3px solid rgba(45,106,79,.2);border-top-color:#2D6A4F;
    border-radius:50%;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <!--
    Pantalla de respaldo (offline). La app carga la plataforma en vivo desde
    server.url (capacitor.config.json). Esta página solo aparece si el celular
    no tiene conexión al abrir. El botón reintenta cargar el sitio.
  -->
  <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
    <polygon points="10,82 32,52 54,82" fill="#52B788"/>
    <polygon points="34,82 58,28 82,82" fill="#2D6A4F"/>
    <circle cx="58" cy="22" r="5" fill="#E9C46A"/>
  </svg>
  <div class="sp" id="sp"></div>
  <div id="offline" hidden>
    <h1>Sin conexión</h1>
    <p>Necesitás internet para usar Pathway. Revisá tu conexión y volvé a intentar.</p>
    <button onclick="go()">Reintentar</button>
  </div>
  <script>
    var SITE='https://pathwaycareercoach.com/app.html?source=ios';
    function go(){ location.href=SITE; }
    // Si hay conexión, intentamos ir directo al sitio en vivo; si no, mostramos
    // el estado offline.
    if(navigator.onLine){ go(); }
    else { document.getElementById('sp').hidden=true; document.getElementById('offline').hidden=false; }
    window.addEventListener('online', go);
  </script>
</body>
</html>
