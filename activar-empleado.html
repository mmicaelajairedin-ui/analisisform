<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<link rel="icon" href="/favicon-app.svg?v=8" type="image/svg+xml">
<meta name="theme-color" content="#2D6A4F">
<title>Activar cuenta de empleado — Pathway</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{--bosque:#2D6A4F;--bosque-dark:#1B4332;--sendero:#52B788;--carbon:#1B2E26;--niebla:#FAFDF9;--texto:#1B2E26;--texto-suave:#5A5A55;--borde:rgba(45,106,79,.12);--serif:'Fraunces',Georgia,serif;--sans:'Inter',-apple-system,sans-serif;}
  body{font-family:var(--sans);color:var(--texto);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem 1rem;background:linear-gradient(135deg,#FAFDF9 0%,#F0F7F2 50%,#E8F2EC 100%);}
  .card{background:#fff;border-radius:20px;padding:2.4rem 2rem;width:100%;max-width:430px;box-shadow:0 8px 40px rgba(45,106,79,.08);border:1px solid var(--borde);animation:in .5s ease;}
  @keyframes in{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
  .logo{text-align:center;margin-bottom:1.2rem;}
  .logo h1{font-family:var(--serif);font-size:22px;font-weight:500;color:var(--carbon);margin-top:12px;letter-spacing:-.5px;}
  .logo p{font-size:13px;color:var(--texto-suave);margin-top:4px;}
  .badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--bosque);background:rgba(82,183,136,.14);padding:4px 11px;border-radius:20px;margin-top:10px;}
  .gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:13px 16px;background:#fff;color:#3C4043;border:1.5px solid #DADCE0;border-radius:10px;font-size:14px;font-weight:600;font-family:var(--sans);cursor:pointer;margin:16px 0 6px;}
  .gbtn:hover{background:#F8F9FA;}
  .divider{display:flex;align-items:center;gap:10px;margin:14px 0;}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--borde);}
  .divider span{font-size:11px;color:var(--texto-suave);text-transform:uppercase;letter-spacing:.08em;}
  .field{margin-bottom:.9rem;}
  .field label{display:block;font-size:11px;font-weight:600;color:var(--texto-suave);margin-bottom:6px;letter-spacing:.06em;text-transform:uppercase;}
  .field input{width:100%;padding:13px 14px;font-size:14px;font-family:var(--sans);border:1.5px solid var(--borde);border-radius:10px;background:#fff;color:var(--texto);outline:none;transition:all .2s;}
  .field input:focus{border-color:var(--bosque);box-shadow:0 0 0 3px rgba(82,183,136,.15);background:#FAFDF9;}
  .btn{width:100%;padding:14px;font-size:14px;font-family:var(--sans);font-weight:600;border:none;border-radius:10px;background:var(--bosque);color:#fff;cursor:pointer;transition:all .2s;box-shadow:0 4px 14px rgba(45,106,79,.18);}
  .btn:hover{background:var(--bosque-dark);}
  .btn:disabled{background:#bbb;cursor:not-allowed;box-shadow:none;}
  .msg{font-size:12.5px;text-align:center;margin-top:12px;min-height:16px;font-weight:600;}
  .msg.err{color:#C0756E;} .msg.ok{color:var(--bosque);}
  .success{text-align:center;}
  .success .tick{width:64px;height:64px;border-radius:50%;background:rgba(82,183,136,.16);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
  .hint{font-size:11.5px;color:#999;text-align:center;margin-top:14px;}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="logo">
    <svg width="42" height="42" viewBox="0 0 100 100" aria-hidden="true"><polygon points="36.2,35.2 52.8,54.3 52.8,81.8 7.4,81.8" fill="#215C44"/><polygon points="67.9,45.8 92.6,81.8 43.1,81.8" fill="#267A54"/><circle cx="75.4" cy="27.8" r="10.3" fill="#F8CA45"/></svg>
    <h1>Activa tu cuenta<span style="color:var(--sendero)">.</span></h1>
    <p>Acceso de equipo · Pathway</p>
    <div class="badge">Empleado</div>
  </div>

  <button type="button" class="gbtn" onclick="conGoogle()">
    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
    Continuar con Google
  </button>
  <button type="button" id="btn-apple" onclick="signInWithApple()" data-apple-redirect="https://pathwaycareercoach.com/auth-callback.html?source=login" style="width:100%;display:none;align-items:center;justify-content:center;gap:10px;padding:13px 16px;background:#000;color:#fff;border:1.5px solid #000;border-radius:10px;font-size:14px;font-weight:600;font-family:Inter,sans-serif;cursor:pointer;transition:opacity .15s;margin-bottom:14px;" onmouseover="this.style.opacity='.88';" onmouseout="this.style.opacity='1';"><svg width="16" height="18" viewBox="0 0 16 18" aria-hidden="true" fill="#fff"><path d="M13.3 9.6c0-2 1.6-3 1.7-3-1-1.4-2.4-1.6-2.9-1.6-1.2-.1-2.4.7-3 .7-.6 0-1.6-.7-2.6-.7C3.3 5 1.9 6 1.2 7.5c-1.4 2.4-.4 6 1 8 .7 1 1.5 2 2.5 2 1 0 1.4-.6 2.6-.6s1.5.6 2.6.6c1.1 0 1.7-1 2.4-2 .5-.7.9-1.5 1-1.7-.1 0-2.4-.9-2.4-3.7zM11.4 3.3c.5-.7.9-1.6.8-2.5-.8 0-1.7.5-2.3 1.2-.5.6-1 1.5-.8 2.4.9.1 1.7-.4 2.3-1.1z"/></svg><span>Continuar con Apple</span></button>
  <div class="divider"><span>o elige una contraseña</span></div>

  <div class="field">
    <label>Email</label>
    <input type="email" id="email" placeholder="tu@email.com" autocomplete="email">
  </div>
  <div class="field">
    <label>Contraseña nueva</label>
    <input type="password" id="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password" onkeydown="if(event.key==='Enter')activar()">
  </div>
  <button class="btn" id="btn" onclick="activar()">Activar mi cuenta →</button>
  <div class="msg" id="msg"></div>
  <div class="hint">¿Problemas? Escribe a hi@pathwaycareercoach.com</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="pw-apple-signin.js"></script>
<script>
var SB='https://api.pathwaycareercoach.com';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkeG5yc25qZHZ0cWh4dW54bndqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNDk5MzksImV4cCI6MjA5MDcyNTkzOX0.t82X1x-PDgFDGYhKC7YXoRKhga9I8Hjet60QUYvtZLU';

// Prefill email desde el link del mail
var _q=new URLSearchParams(location.search);
var _em=(_q.get('email')||'').trim().toLowerCase();
if(_em) document.getElementById('email').value=_em;

function setMsg(t,kind){ var m=document.getElementById('msg'); m.textContent=t; m.className='msg '+(kind||''); }

function conGoogle(){
  if(!window.supabase){ alert('Recargá la página e intentá de nuevo.'); return; }
  var sb=window.supabase.createClient(SB,KEY);
  sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo:'https://pathwaycareercoach.com/auth-callback.html?source=login' } })
    .catch(function(){ alert('No se pudo iniciar con Google.'); });
}

async function hashPassword(p){
  var data=new TextEncoder().encode(p);
  var buf=await crypto.subtle.digest('SHA-256',data);
  return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
}

async function activar(){
  var email=(document.getElementById('email').value||'').trim().toLowerCase();
  var pass=document.getElementById('password').value||'';
  var btn=document.getElementById('btn');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ setMsg('Escribe tu email.','err'); return; }
  if(pass.length<8){ setMsg('La contraseña debe tener al menos 8 caracteres.','err'); return; }
  btn.disabled=true; setMsg('Activando…','');
  try{
    // Buscar la invitación creada por el admin
    var res=await fetch(SB+'/rest/v1/usuarios?email=eq.'+encodeURIComponent(email)+'&select=id,rol,nombre,configuracion&limit=1',{headers:{'apikey':KEY,'Authorization':'Bearer '+KEY}});
    var rows=await res.json();
    if(!Array.isArray(rows)||!rows.length){ setMsg('No encontramos tu invitación. Pídele el acceso a tu administrador.','err'); btn.disabled=false; return; }
    var u=rows[0];
    if(u.rol!=='empleado'){ setMsg('Este email no es un acceso de empleado. Entra desde el login normal.','err'); btn.disabled=false; return; }
    // ¿Ya tiene contraseña?
    try{
      var hp=await fetch(SB+'/rest/v1/rpc/pw_tiene_pass',{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_email:email})});
      if(hp.ok && (await hp.json())===true){ setMsg('Ya tienes contraseña. Entra desde el login.','ok'); btn.disabled=false; return; }
    }catch(e){}
    var hash=await hashPassword(pass);
    var nc=Object.assign({},u.configuracion||{},{pendiente_activacion:false});
    var pr=await fetch(SB+'/rest/v1/usuarios?id=eq.'+encodeURIComponent(u.id),{
      method:'PATCH',
      headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify({password_hash:hash,configuracion:nc})
    });
    if(!pr.ok){ setMsg('No se pudo activar. Prueba con Google o escríbenos.','err'); btn.disabled=false; return; }
    exito();
  }catch(err){ setMsg('Error de conexión. Intentá de nuevo.','err'); btn.disabled=false; }
}

function exito(){
  document.getElementById('card').innerHTML =
    '<div class="success">'+
      '<div class="tick"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2D6A4F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>'+
      '<h1 style="font-family:var(--serif);font-size:21px;font-weight:600;color:var(--carbon)">¡Cuenta activada!</h1>'+
      '<p style="font-size:14px;color:var(--texto-suave);margin:8px 0 20px;line-height:1.55">Ya puedes entrar a tu panel con tu email y tu contraseña.</p>'+
      '<a href="/login.html" class="btn" style="display:inline-block;text-decoration:none;text-align:center">Ir al login →</a>'+
    '</div>';
}
</script>
</body>
</html>
