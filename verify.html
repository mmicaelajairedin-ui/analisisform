<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon-app.svg?v=9" type="image/svg+xml">
<meta name="robots" content="noindex, nofollow">
<title>Confirma tu email — Pathway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bosque:#2D6A4F;--bosque-dark:#1B4332;--sendero:#52B788;--amanecer:#E9C46A;
  --carbon:#1B2E26;--niebla:#FAFDF9;--texto:#1B2E26;--texto-suave:#5A5A55;
  --borde:rgba(45,106,79,.12);--serif:'Fraunces',Georgia,serif;
  --sans:'Inter',-apple-system,sans-serif;
}
body{
  font-family:var(--sans);color:var(--texto);min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:2rem 1rem;
  background:linear-gradient(135deg,#FAFDF9 0%,#F0F7F2 50%,#E8F2EC 100%);
}
.card{
  background:#fff;border-radius:20px;padding:2.5rem 2rem;width:100%;max-width:460px;
  box-shadow:0 8px 40px rgba(45,106,79,.08);text-align:center;
  border:1px solid var(--borde);animation:in .5s ease;
}
@keyframes in{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.icon{width:64px;height:64px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;}
h1{font-family:var(--serif);font-size:26px;font-weight:500;color:var(--carbon);margin-bottom:10px;letter-spacing:-0.6px;}
.msg{font-size:14px;color:var(--texto-suave);line-height:1.6;margin-bottom:24px;}
.btn{display:inline-block;padding:13px 32px;background:var(--bosque);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;font-family:var(--sans);cursor:pointer;text-decoration:none;transition:all .2s;box-shadow:0 4px 14px rgba(45,106,79,.18);}
.btn:hover{background:var(--bosque-dark);transform:translateY(-1px);}
.btn-sec{background:#fff;color:var(--bosque);border:1.5px solid var(--bosque);box-shadow:none;margin-left:8px;}
.btn-sec:hover{background:var(--bosque);color:#fff;}
.loading{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--texto-suave);margin-top:14px;}
.dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--sendero);animation:dp 1.2s ease-in-out infinite;}
.dots span:nth-child(2){animation-delay:.2s;}.dots span:nth-child(3){animation-delay:.4s;}
@keyframes dp{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.success-icon{color:#52B788;}
.error-icon{color:#C0756E;}
.help{font-size:11px;color:#999;margin-top:24px;}
.help a{color:var(--bosque);text-decoration:none;}
</style>
</head>
<body>
<div class="card">
  <div class="icon" id="icon">
    <div class="dots"><span></span><span></span><span></span></div>
  </div>
  <h1 id="title">Confirmando tu email...</h1>
  <div class="msg" id="msg">Validando tu link. Esto toma unos segundos.</div>
  <div id="actions" style="display:none;"></div>
  <div class="help">¿Algo no funciona? <a href="mailto:hi@pathwaycareercoach.com">Escríbenos</a>.</div>
</div>

<script>
var SB='https://api.pathwaycareercoach.com';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkeG5yc25qZHZ0cWh4dW54bndqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNDk5MzksImV4cCI6MjA5MDcyNTkzOX0.t82X1x-PDgFDGYhKC7YXoRKhga9I8Hjet60QUYvtZLU';

function showState(state, title, msg, actions){
  var iconEl = document.getElementById('icon');
  if(state==='success'){
    iconEl.innerHTML = '<svg width="56" height="56" viewBox="0 0 56 56" class="success-icon" fill="none" stroke="currentColor" stroke-width="3"><circle cx="28" cy="28" r="24" fill="rgba(82,183,136,.12)" stroke="#52B788"/><path d="M18 28l8 8 14-16" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  } else if(state==='error'){
    iconEl.innerHTML = '<svg width="56" height="56" viewBox="0 0 56 56" class="error-icon" fill="none" stroke="currentColor" stroke-width="3"><circle cx="28" cy="28" r="24" fill="rgba(196,117,110,.12)" stroke="#C0756E"/><path d="M20 20l16 16M36 20l-16 16" stroke-linecap="round"/></svg>';
  }
  document.getElementById('title').textContent = title;
  document.getElementById('msg').innerHTML = msg;
  if(actions){
    var act = document.getElementById('actions');
    act.innerHTML = actions;
    act.style.display = 'block';
  }
}

(function init(){
  var params = new URLSearchParams(window.location.search);
  var email = (params.get('email')||'').trim().toLowerCase();
  var token = (params.get('token')||'').trim();

  if(!email || !token){
    showState('error', 'Link inválido',
      'El link no incluye email o token. Vuelve a usar el link del email de bienvenida.',
      '<a href="/login.html" class="btn">Ir a login</a>');
    return;
  }

  // Validación EN EL SERVIDOR: la edge function `verify-email` compara el token
  // contra configuracion.verification_token y marca email_verificado — todo del
  // lado server. Antes el navegador leía la `configuracion` con la anon key
  // (el token de verificación quedaba legible por cualquiera). Ahora no.
  fetch(SB+'/functions/v1/verify-email', {
    method:'POST',
    headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},
    body: JSON.stringify({email:email, token:token})
  }).then(function(r){
    return r.json().catch(function(){ return null; });
  }).then(function(d){
    if(!d){ throw new Error('bad_response'); }
    if(d.ok){
      var firstName = (d.nombre||'').split(' ')[0] || '';
      // Reflejar el cambio en localStorage si el coach está logueado en este navegador.
      try{
        var ls = JSON.parse(localStorage.getItem('mj_user')||'null');
        if(ls && ls.email===email){
          ls.configuracion = ls.configuracion || {};
          ls.configuracion.email_verificado = true;
          localStorage.setItem('mj_user', JSON.stringify(ls));
        }
      }catch(e){}
      if(d.status==='already'){
        showState('success', '✓ Tu email ya estaba confirmado',
          'Tu cuenta está activa. Puedes ir directo al panel.',
          '<a href="/panel-v2.html" class="btn">Ir a mi panel →</a>');
      } else {
        showState('success', '¡Email confirmado! 🌱',
          (firstName?'Te damos la bienvenida, '+firstName+'. Tu':'Tu')+' cuenta está activa. Ya puedes generar informes con IA y usar todas las features de Pathway.',
          '<a href="/panel-v2.html" class="btn">Ir a mi panel →</a>');
      }
      return;
    }
    if(d.error==='not_found'){
      showState('error', 'Cuenta no encontrada',
        'No encontramos una cuenta con ese email. ¿Te registraste? <a href="/registro.html" style="color:#2D6A4F;font-weight:600;">Regístrate aquí</a>.',
        '<a href="/registro.html" class="btn">Crear cuenta</a>');
      return;
    }
    if(d.error==='bad_token'){
      showState('error', 'Token inválido o expirado',
        'El link no es válido o ya fue usado. Reenvía el email de verificación desde tu panel.',
        '<a href="/login.html" class="btn">Ir a login</a>');
      return;
    }
    showState('error', 'Error al confirmar',
      'No pudimos actualizar tu cuenta. Prueba de nuevo en un minuto o escríbenos.',
      '<a href="javascript:location.reload()" class="btn btn-sec">Reintentar</a>');
  }).catch(function(){
    showState('error', 'Error de conexión',
      'No pudimos verificar tu cuenta ahora. Prueba de nuevo en un minuto.',
      '<a href="javascript:location.reload()" class="btn btn-sec">Reintentar</a>');
  });
})();
</script>
</body>
</html>
