<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="robots" content="noindex, nofollow">

<title>Conectando con Pathway...</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@500;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Inter',-apple-system,sans-serif;
  background:linear-gradient(135deg,#FAFDF9 0%,#EEF6F1 100%);
  color:#1B2E26;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
}
.card{
  background:#fff;
  border-radius:20px;
  padding:48px 40px;
  max-width:440px;
  width:100%;
  text-align:center;
  box-shadow:0 8px 40px rgba(45,106,79,.08);
  border:1px solid rgba(45,106,79,.12);
}
.spinner{
  width:48px;height:48px;
  border:3px solid #E8F2EC;
  border-top:3px solid #2D6A4F;
  border-radius:50%;
  margin:0 auto 24px;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
h1{
  font-family:'Fraunces',Georgia,serif;
  font-size:22px;font-weight:500;
  color:#1B2E26;margin-bottom:10px;letter-spacing:-0.4px;
}
p{font-size:14px;color:#5A6A60;line-height:1.55;}
.error{
  background:#FFF1EE;
  border-left:3px solid #C0756E;
  border-radius:10px;
  padding:14px 18px;
  text-align:left;
  font-size:13px;
  color:#8B4D45;
  margin-top:20px;
}
.btn{
  display:inline-block;
  margin-top:20px;
  padding:12px 28px;
  background:#2D6A4F;
  color:#fff;
  border-radius:10px;
  text-decoration:none;
  font-size:14px;
  font-weight:600;
}
.hidden{display:none;}
</style>
</head>
<body>
<div class="card">
  <div id="loading">
    <div class="spinner"></div>
    <h1>Conectando con Pathway...</h1>
    <p id="loading-msg">Validando tu cuenta de Google y configurando tu acceso.</p>
  </div>
  <div id="error-state" class="hidden">
    <div style="font-size:42px;margin-bottom:12px;">⚠️</div>
    <h1>Algo salió mal</h1>
    <div class="error" id="error-msg">No pudimos completar el login.</div>
    <a href="login.html" class="btn">Volver al login</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
var SB='https://ddxnrsnjdvtqhxunxnwj.supabase.co';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkeG5yc25qZHZ0cWh4dW54bndqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNDk5MzksImV4cCI6MjA5MDcyNTkzOX0.t82X1x-PDgFDGYhKC7YXoRKhga9I8Hjet60QUYvtZLU';

// Stripe Payment Links — debe matchear con registro.html
var STRIPE_LINK_14D='https://buy.stripe.com/9B6eVddqUd4c2YQfa38AE0c';
var STRIPE_LINK_30D='https://buy.stripe.com/9B6eVddqUd4c2YQfa38AE0c';

function showError(msg){
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('error-state').classList.remove('hidden');
  document.getElementById('error-msg').textContent = msg;
}

function setLoadingMsg(msg){
  var el = document.getElementById('loading-msg');
  if(el) el.textContent = msg;
}

async function handleCallback(){
  // URL params declarados al inicio: antes estaban al final pero el branch
  // de "usuario nuevo" los usaba por hoisting (params=undefined ⇒ TypeError
  // al hacer params.get(...)). Movidos arriba para que esten disponibles
  // en cualquier rama del flow.
  var params = new URLSearchParams(window.location.search);
  var source = params.get('source') || 'login';
  var ref = params.get('ref') || '';
  var referredBy = params.get('referrer') || null;

  // Inicializar Supabase JS client
  var sb;
  try {
    sb = window.supabase.createClient(SB, KEY, {
      auth: {
        // detectSessionInUrl=true (default) hace que Supabase parsee el #access_token=
        // del callback de Google y guarde la sesion automaticamente.
        detectSessionInUrl: true,
        persistSession: true,
        autoRefreshToken: true
      }
    });
  } catch(e) {
    return showError('No pudimos cargar el cliente. Recargá la página.');
  }

  // Esperar a que se procese el hash de la URL (Supabase lo hace al cargar)
  await new Promise(function(r){ setTimeout(r, 200); });

  // Obtener la sesion
  var sessionRes;
  try {
    sessionRes = await sb.auth.getSession();
  } catch(e) {
    return showError('Error obteniendo sesión: ' + e.message);
  }

  var session = sessionRes && sessionRes.data && sessionRes.data.session;
  if(!session){
    return showError('No se encontró sesión activa. Probá iniciar sesión de nuevo.');
  }

  var user = session.user;
  var email = (user.email || '').toLowerCase();
  if(!email){
    return showError('Google no compartió tu email. Verificá los permisos otorgados.');
  }

  var meta = user.user_metadata || {};
  var name = meta.full_name || meta.name || meta.given_name || email.split('@')[0];
  var photoUrl = meta.avatar_url || meta.picture || null;

  setLoadingMsg('Buscando tu cuenta...');

  // Chequear si el usuario existe en nuestra tabla usuarios
  var existingUser = null;
  try {
    var checkRes = await fetch(SB + '/rest/v1/usuarios?email=eq.' + encodeURIComponent(email) + '&select=id,email,rol,nombre,activo,configuracion', {
      headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY }
    });
    var existingArr = await checkRes.json();
    if(Array.isArray(existingArr) && existingArr.length > 0){
      existingUser = existingArr[0];
    }
  } catch(e) {
    return showError('Error consultando tu cuenta: ' + e.message);
  }

  var isNew = !existingUser;
  var usuario;

  if(existingUser){
    // Usuario existente — actualizar nombre/foto si cambió
    usuario = existingUser;
    var cfg = usuario.configuracion || {};
    var needsUpdate = false;
    if(cfg.auth_provider !== 'google'){ cfg.auth_provider = 'google'; needsUpdate = true; }
    if(photoUrl && cfg.foto_perfil !== photoUrl){ cfg.foto_perfil = photoUrl; needsUpdate = true; }
    if(needsUpdate){
      // Update best-effort, no bloquea el flow
      fetch(SB + '/rest/v1/usuarios?id=eq.' + usuario.id, {
        method: 'PATCH',
        headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
        body: JSON.stringify({ configuracion: cfg })
      }).catch(function(){});
    }
  } else {
    // Usuario nuevo — crearlo en usuarios.
    // Modelo nuevo: trial SIN tarjeta. activo=true desde el inicio. La coach
    // tiene 14 dias gratis (28 si vino del popup) sin pasar por Stripe.
    // Cuando vence fecha_fin_prueba sin suscripcion, panel.html muestra un
    // paywall full-screen con el CTA a Stripe Payment Link.
    setLoadingMsg('Creando tu cuenta...');
    try {
      var refIsPopup = ref === 'popup';
      var trialDays = refIsPopup ? 28 : 14;
      var newCfg = {
        auth_provider: 'google',
        foto_perfil: photoUrl,
        from_google: true,
        from_popup: refIsPopup,
        plan: 'basic',
        estado_sub: 'prueba',
        visible_directorio: true,
        max_candidatos: 5,
        fecha_fin_prueba: new Date(Date.now() + trialDays * 24 * 60 * 60 * 1000).toISOString()
      };
      if(referredBy){
        newCfg.referred_by = referredBy;
        newCfg.referred_at = new Date().toISOString();
      }
      var createRes = await fetch(SB + '/rest/v1/usuarios', {
        method: 'POST',
        headers: {
          'apikey': KEY,
          'Authorization': 'Bearer ' + KEY,
          'Content-Type': 'application/json',
          'Prefer': 'return=representation'
        },
        body: JSON.stringify({
          email: email,
          password_hash: null,
          rol: 'coach',
          nombre: name,
          activo: true,
          configuracion: newCfg
        })
      });
      if(!createRes.ok){
        var errTxt = await createRes.text();
        return showError('No pudimos crear tu cuenta: ' + errTxt.slice(0,200));
      }
      var created = await createRes.json();
      usuario = Array.isArray(created) ? created[0] : created;

      var primerNombreGoogle = (name && name.split(' ')[0]) || name || '';

      // Notificar admin (best-effort)
      fetch(SB + '/functions/v1/send-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          to: 'hi@pathwaycareercoach.com',
          to_name: 'Micaela',
          subject: '🎉 Nuevo coach via Google: ' + name,
          html: '<h2>Nuevo coach registrado</h2><p><strong>' + name + '</strong> (' + email + ') se registró via Google.</p><p>Trial de ' + trialDays + ' días sin tarjeta. Se le ofrece Stripe al final del trial.</p>'
        })
      }).catch(function(){});

      // Email de bienvenida (best-effort)
      fetch(SB + '/functions/v1/send-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          to: email,
          to_name: name,
          subject: '¡Bienvenida a Pathway! Tu trial de ' + trialDays + ' días empezó 🌱',
          html: '<h1 style="font-family:Fraunces,Georgia,serif;font-size:24px;font-weight:700;color:#1B4332;margin:0 0 6px;letter-spacing:-.4px;">¡Bienvenida a Pathway, ' + primerNombreGoogle + '! 🌱</h1>'
            + '<p style="margin:0 0 18px;color:#5A6A60;font-size:15px;line-height:1.6;">Tu cuenta ya está lista y arrancaste tu <strong style="color:#243B31;">trial de ' + trialDays + ' días gratis</strong>. No te pedimos tarjeta — si al final no seguís, no hacés nada y listo.</p>'
            + '<div style="background:#F4F9F4;border:1px solid #DCEBDD;border-radius:12px;padding:20px;margin:0 0 22px;">'
            + '<div style="font-size:15px;font-weight:700;color:#1B4332;margin-bottom:4px;">Todo listo para empezar</div>'
            + '<div style="font-size:13px;color:#5A6A60;line-height:1.55;margin-bottom:14px;">Tu email ya quedó confirmado con Google — entrá y armá tu primer cliente.</div>'
            + '<a href="https://pathwaycareercoach.com/panel.html" style="display:inline-block;padding:13px 26px;background:#2D6A4F;color:#fff;border-radius:10px;text-decoration:none;font-weight:700;font-size:14px;">Entrar a mi panel →</a>'
            + '</div>'
            + '<div style="font-size:13px;font-weight:700;color:#1B4332;text-transform:uppercase;letter-spacing:.06em;margin:26px 0 14px;">Tus primeros 4 pasos</div>'
            + '<table role="presentation" cellpadding="0" cellspacing="0" width="100%">'
            + '<tr><td style="width:38px;vertical-align:top;padding:0 12px 16px 0;"><div style="width:26px;height:26px;border-radius:50%;background:#2D6A4F;color:#fff;font-size:13px;font-weight:700;text-align:center;line-height:26px;">1</div></td><td style="vertical-align:top;padding:0 0 16px;font-size:14px;line-height:1.45;"><strong style="color:#1B4332;">Completá tu perfil</strong><br><span style="color:#7A877E;font-size:13px;">Foto, bio y color de marca en Configuración (5 min)</span></td></tr>'
            + '<tr><td style="width:38px;vertical-align:top;padding:0 12px 16px 0;"><div style="width:26px;height:26px;border-radius:50%;background:#2D6A4F;color:#fff;font-size:13px;font-weight:700;text-align:center;line-height:26px;">2</div></td><td style="vertical-align:top;padding:0 0 16px;font-size:14px;line-height:1.45;"><strong style="color:#1B4332;">Conectá Calendly y Stripe</strong><br><span style="color:#7A877E;font-size:13px;">Para que tus clientes agenden y te paguen directo</span></td></tr>'
            + '<tr><td style="width:38px;vertical-align:top;padding:0 12px 16px 0;"><div style="width:26px;height:26px;border-radius:50%;background:#2D6A4F;color:#fff;font-size:13px;font-weight:700;text-align:center;line-height:26px;">3</div></td><td style="vertical-align:top;padding:0 0 16px;font-size:14px;line-height:1.45;"><strong style="color:#1B4332;">Sumá tu primer cliente</strong><br><span style="color:#7A877E;font-size:13px;">Un click en "+ Nuevo cliente"</span></td></tr>'
            + '<tr><td style="width:38px;vertical-align:top;padding:0 12px 0 0;"><div style="width:26px;height:26px;border-radius:50%;background:#2D6A4F;color:#fff;font-size:13px;font-weight:700;text-align:center;line-height:26px;">4</div></td><td style="vertical-align:top;padding:0;font-size:14px;line-height:1.45;"><strong style="color:#1B4332;">Generá su informe con IA</strong><br><span style="color:#7A877E;font-size:13px;">30 segundos — y los clientes lo aman</span></td></tr>'
            + '</table>'
            + '<p style="font-size:13px;color:#7A877E;margin:26px 0 0;line-height:1.6;">Antes de que terminen los ' + trialDays + ' días te avisamos para que elijas plan. Si no, no se cobra nada.</p>'
            + '<p style="font-size:14px;color:#5A6A60;margin:20px 0 0;line-height:1.6;">Un abrazo,<br><strong style="color:#243B31;">Mica</strong> · Pathway</p>'
        })
      }).catch(function(){});

      // Mail recovery a +5 min en email_queue. panel.html borra esta fila
      // cuando la coach entra por primera vez (asi solo lo reciben las que
      // no llegaron a usar la plataforma).
      var nowMs = Date.now();
      fetch(SB + '/rest/v1/email_queue', {
        method: 'POST',
        headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
        body: JSON.stringify([{
          coach_id: usuario.id,
          to_email: email,
          to_nombre: name,
          subject: '¿Te puedo ayudar a empezar, ' + primerNombreGoogle + '? 🌱',
          body: '<h2 style="font-family:Fraunces,Georgia,serif;color:#1B4332;margin:0 0 14px;">Hola ' + primerNombreGoogle + ',</h2>'
            + '<p style="font-size:15px;line-height:1.65;">Me llamo Micaela, soy fundadora de Pathway. Vi que te registraste hace unos minutos pero no llegaste a entrar al panel — supuse que quizás te quedó alguna duda o se te complicó.</p>'
            + '<p style="font-size:15px;line-height:1.65;">Recordá que tu trial de ' + trialDays + ' días <strong>ya está activo</strong> y <strong>no te pedimos tarjeta</strong> para empezar.</p>'
            + '<p style="margin-top:20px;"><a href="https://pathwaycareercoach.com/login.html" style="display:inline-block;padding:13px 26px;background:#2D6A4F;color:#fff;border-radius:10px;text-decoration:none;font-weight:700;">Entrar al panel →</a></p>'
            + '<p style="font-size:13px;color:#666;margin-top:18px;">Cualquier duda, respondé este mail. — Mica</p>',
          scheduled_at: new Date(nowMs + 5 * 60 * 1000).toISOString(),
          plantilla_id: 'recovery_5min'
        }])
      }).catch(function(){});
    } catch(e) {
      return showError('Error creando cuenta: ' + e.message);
    }
  }

  // Guardar sesion en localStorage (mismo formato que login.html)
  localStorage.setItem('mj_user', JSON.stringify({
    id: usuario.id,
    email: usuario.email,
    rol: usuario.rol,
    nombre: usuario.nombre,
    activo: true,
    configuracion: usuario.configuracion || {}
  }));

  // Destino:
  //   - Coach/admin nuevo o existente → /panel.html
  //   - Cliente → /cliente.html
  // (Antes los nuevos via Google iban a Stripe. Con trial-sin-tarjeta, van
  //  directo al panel — el cobro se ofrece al final del trial.)
  if(isNew){
    setLoadingMsg('¡Bienvenida! Te llevamos al panel...');
  } else {
    setLoadingMsg('¡Bienvenida de vuelta! Te llevamos al panel...');
  }
  var dest = (usuario.rol === 'cliente') ? '/cliente.html' : '/panel.html';
  setTimeout(function(){
    window.location.href = dest + (isNew ? '?welcome=1&v=' : '?v=') + Date.now();
  }, 800);
}

// Esperar a que el SDK de Supabase cargue
if(window.supabase){
  handleCallback();
} else {
  window.addEventListener('load', function(){
    if(window.supabase){
      handleCallback();
    } else {
      showError('No pudimos cargar Supabase. Verificá tu conexión.');
    }
  });
}
</script>
</body>
</html>
