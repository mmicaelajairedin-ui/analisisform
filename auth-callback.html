function showError(msg){
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('error-state').classList.remove('hidden');
  document.getElementById('error-msg').textContent = msg;
}

function setLoadingMsg(msg){
  var el = document.getElementById('loading-msg');
  if(el) el.textContent = msg;
}

// Maneja el flujo de Apple nativo (Capacitor iOS): crear o actualizar usuario.
// Ahora recibe el JWT real de la sesión autenticada de Supabase.
function handleAppleNativeUser(email, name, provider, appleUserId, authJWT){
  setLoadingMsg('Buscando tu cuenta...');

  // Usar el JWT real de Supabase Auth (no la anon key).
  var SJWT = authJWT || KEY;
  var SB = 'https://api.pathwaycareercoach.com';

  // Chequear si el usuario existe en usuarios (por email exacto o alias).
  fetch(SB + '/rest/v1/usuarios?email=eq.' + encodeURIComponent(email) + '&select=id,email,rol,nombre,activo,configuracion,auth_id', {
    headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + SJWT }
  })
  .then(function(r){ return r.json(); })
  .then(function(existingArr){
    var existingUser = (Array.isArray(existingArr) && existingArr.length > 0) ? existingArr[0] : null;
    // Si no existe por email exacto, buscar por alias (merge por persona)
    if(existingUser) return Promise.resolve(existingUser);
    var aliasQ = encodeURIComponent(JSON.stringify({ emails_alias: [email] }));
    return fetch(SB + '/rest/v1/usuarios?configuracion=cs.' + aliasQ + '&select=id,email,rol,nombre,activo,configuracion,auth_id&limit=1', {
      headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + SJWT }
    }).then(function(r){ return r.json(); }).then(function(aliasArr){
      return (Array.isArray(aliasArr) && aliasArr.length > 0) ? aliasArr[0] : null;
    }).catch(function(){ return null; });
  })
  .then(function(existingUser){
    var isNew = !existingUser;
    var usuario = existingUser;

    if(isNew){
      // Crear nuevo usuario (mismo flujo que Google).
      setLoadingMsg('Creando tu cuenta...');
      var trialDays = 14;
      var newCfg = {
        coach_type: 'carrera',
        auth_provider: provider,
        foto_url: null,
        last_login: new Date().toISOString(),
        from_google: false,
        from_apple: true,
        plan: 'basic',
        estado_sub: 'prueba',
        visible_directorio: true,
        max_candidatos: 5,
        fecha_fin_prueba: new Date(Date.now() + trialDays * 24 * 60 * 60 * 1000).toISOString()
      };

      return fetch(SB + '/rest/v1/usuarios?select=id,email,rol,nombre,activo,configuracion,auth_id', {
        method: 'POST',
        headers: {
          'apikey': KEY,
          'Authorization': 'Bearer ' + SJWT,
          'Content-Type': 'application/json',
          'Prefer': 'return=representation'
        },
        body: JSON.stringify({
          email: email,
          password_hash: null,
          rol: 'coach',
          nombre: name,
          activo: true,
          auth_id: appleUserId,
          configuracion: newCfg
        })
      })
      .then(function(r){
        if(!r.ok) throw new Error('No se pudo crear cuenta');
        return r.json();
      })
      .then(function(created){
        usuario = Array.isArray(created) ? created[0] : created;
        // Email de bienvenida (best-effort).
        fetch(SB + '/functions/v1/send-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            to: email,
            to_name: name,
            subject: '¡Te damos la bienvenida a Pathway! Tu trial de 14 días empezó 🌱',
            html: '<h2 style="font-family:Fraunces,Georgia,serif;color:#1B4332;margin:0 0 14px;">Hola ' + (name.split(' ')[0]) + ',</h2>'
              + '<p style="font-size:15px;line-height:1.65;">Te damos la bienvenida a Pathway. Tu cuenta está lista y empezaste tu <strong>trial de 14 días gratis</strong>. No te pedimos tarjeta — si al final no quieres seguir, simplemente no haces nada.</p>'
              + '<p style="margin-top:20px;"><a href="https://pathwaycareercoach.com/panel-v2.html" style="display:inline-block;padding:13px 28px;background:#2D6A4F;color:#fff;border-radius:10px;text-decoration:none;font-weight:700;">Ir a mi panel →</a></p>'
              + '<p style="font-size:13px;color:#888;margin-top:18px;">Cualquier duda, responde este mail. — Mica</p>'
          })
        }).catch(function(){});

        finishAppleLogin(usuario, name, isNew);
      })
      .catch(function(e){
        showError('No pudimos crear tu cuenta: ' + (e && e.message || 'desconocido'));
      });
    } else {
      // Usuario existente — actualizar last_login.
      var cfg = usuario.configuracion || {};
      cfg.auth_provider = provider;
      cfg.last_login = new Date().toISOString();

      fetch(SB + '/rest/v1/usuarios?id=eq.' + usuario.id, {
        method: 'PATCH',
        headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + SJWT, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
        body: JSON.stringify({ configuracion: cfg })
      }).catch(function(){});

      finishAppleLogin(usuario, name, false);
    }
  })
  .catch(function(e){
    showError('Error consultando tu cuenta: ' + (e && e.message || 'desconocido'));
  });
}

function finishAppleLogin(usuario, name, isNew){
  // Guardar sesion en localStorage.
  localStorage.setItem('mj_user', JSON.stringify({
    id: usuario.id,
    email: usuario.email,
    rol: usuario.rol,
    nombre: usuario.nombre,
    activo: true,
    configuracion: usuario.configuracion || {}
  }));

  // Destino según rol.
  var _v = (isNew ? 'welcome=1&v=' : 'v=') + Date.now();
  var dest = usuario.rol === 'cliente' ? '/cliente.html?' + _v : '/panel-v2.html?' + _v;
  setLoadingMsg(isNew ? '¡Te damos la bienvenida! Te llevamos al panel...' : '¡Hola de nuevo! Te llevamos al panel...');

  try{ sessionStorage.removeItem('pw_auth_retry'); }catch(e){}
  setTimeout(function(){
    window.location.href = dest;
  }, 800);
}

async function handleCallback(){
  // URL params declarados al inicio: antes estaban al final pero el branch
  // de "usuario nuevo" los usaba por hoisting (params=undefined ⇒ TypeError
  // al hacer params.get(...)). Movidos arriba para que esten disponibles
  // en cualquier rama del flow.
  var params = new URLSearchParams(window.location.search);
  var source = params.get('source') || 'login';
  var ref = params.get('ref') || '';
  var referredBy = params.get('referrer') || null;
  var appleNative = params.get('apple_native') === '1';
  var googleNative = params.get('google_native') === '1';

  // Manejo especial para Apple nativo (Capacitor iOS): el token está en localStorage.
  if(appleNative){
    var appleIdentityToken = null;
    var appleUserId = null;
    var appleEmail = null;
    var appleName = null;
    try {
      appleIdentityToken = localStorage.getItem('pw_apple_identity_token');
      appleUserId = localStorage.getItem('pw_apple_user_id');
      appleEmail = localStorage.getItem('pw_apple_email');
      appleName = localStorage.getItem('pw_apple_name');
    } catch(e) {}

    if(!appleIdentityToken){
      return showError('Token de Apple no encontrado. Intenta iniciar sesión de nuevo.');
    }

    setLoadingMsg('Validando tu identidad con Apple...');

    // Usar el identityToken de Apple para crear sesión en Supabase.
    // (En producción, esto iría a una edge function que valida el token de Apple
    // y emite un JWT de Supabase. Por ahora usamos email directo si está disponible.)
    try {
      // Clean up localStorage.
      localStorage.removeItem('pw_apple_identity_token');
      localStorage.removeItem('pw_apple_user_id');
      localStorage.removeItem('pw_apple_email');
      localStorage.removeItem('pw_apple_name');
    } catch(e) {}

    if(!appleEmail){
      return showError('No pudimos obtener tu email. Intenta iniciar sesión de nuevo — asegúrate de permitir que Pathway acceda a tu email.');
    }

    setLoadingMsg('Conectando tu cuenta...');

    // ── Intercambiar identityToken de Apple por sesión real en Supabase ────
    // Esto valida el token con Apple del lado del servidor y crea una sesión
    // real con JWT autenticado (no anon key). Necesario para que las políticas
    // RLS permitan crear/leer en la tabla usuarios.
    try {
      var sb = window.supabase.createClient(SB, KEY, {
        auth: { persistSession: true, autoRefreshToken: true }
      });

      var { data: authData, error: authError } = await sb.auth.signInWithIdToken({
        provider: 'apple',
        token: appleIdentityToken
      });

      if(authError){
        return showError('Error validando con Apple: ' + (authError.message || 'desconocido'));
      }

      if(!authData || !authData.user || !authData.session){
        return showError('No se recibió sesión de Apple. Intenta de nuevo.');
      }

      var email = (authData.user.email || appleEmail || '').toLowerCase().trim();
      var name = appleName || (authData.user.user_metadata && authData.user.user_metadata.full_name) || email.split('@')[0];
      var provider = 'apple';
      var userId = authData.user.id;
      var authJWT = authData.session.access_token; // JWT real de usuario autenticado

      // Pasar el JWT real a handleAppleNativeUser para que lo use en lugar de la anon key.
      handleAppleNativeUser(email, name, provider, userId, authJWT);
      return;
    } catch(e) {
      return showError('Error en validación de Apple: ' + (e && e.message || 'desconocido'));
    }
  }

  // ── Manejo especial para Google nativo (Capacitor iOS) ──
  if(googleNative){
    var googleIdToken = null;
    var googleEmail = null;
    var googleName = null;
    try {
      googleIdToken = localStorage.getItem('pw_google_id_token');
      googleEmail = localStorage.getItem('pw_google_email');
      googleName = localStorage.getItem('pw_google_name');
    } catch(e) {}

    if(!googleIdToken){
      return showError('Token de Google no encontrado. Intenta iniciar sesión de nuevo.');
    }

    setLoadingMsg('Validando tu identidad con Google...');

    // Limpiar localStorage.
    try {
      localStorage.removeItem('pw_google_id_token');
      localStorage.removeItem('pw_google_email');
      localStorage.removeItem('pw_google_name');
    } catch(e) {}

    if(!googleEmail){
      return showError('No pudimos obtener tu email. Intenta iniciar sesión de nuevo.');
    }

    setLoadingMsg('Conectando tu cuenta...');

    // ── Intercambiar idToken de Google por sesión real en Supabase ──
    try {
      var sb = window.supabase.createClient(SB, KEY, {
        auth: { persistSession: true, autoRefreshToken: true }
      });

      var { data: authData, error: authError } = await sb.auth.signInWithIdToken({
        provider: 'google',
        token: googleIdToken
      });

      if(authError){
        return showError('Error validando con Google: ' + (authError.message || 'desconocido'));
      }

      if(!authData || !authData.user || !authData.session){
        return showError('No se recibió sesión de Google. Intenta de nuevo.');
      }

      var email = (authData.user.email || googleEmail || '').toLowerCase().trim();
      var name = googleName || (authData.user.user_metadata && authData.user.user_metadata.full_name) || email.split('@')[0];
      var provider = 'google';
      var userId = authData.user.id;
      var authJWT = authData.session.access_token;

      // Crear/actualizar usuario con el JWT real.
      setLoadingMsg('Buscando tu cuenta...');
      var usr = await fetch(SB + '/rest/v1/usuarios?email=eq.' + encodeURIComponent(email) + '&select=id,email,rol,nombre,activo,configuracion', {
        headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + authJWT }
      }).then(r => r.json()).then(rows => rows && rows.length > 0 ? rows[0] : null);

      if(!usr){
        // Crear nuevo usuario.
        setLoadingMsg('Creando tu cuenta...');
        var trialDays = 14;
        var newCfg = {
          coach_type: 'carrera',
          auth_provider: provider,
          from_google: true,
          from_apple: false,
          plan: 'basic',
          estado_sub: 'prueba',
          visible_directorio: true,
          max_candidatos: 5,
          fecha_fin_prueba: new Date(Date.now() + trialDays * 24 * 60 * 60 * 1000).toISOString(),
          last_login: new Date().toISOString()
        };
        usr = await fetch(SB + '/rest/v1/usuarios', {
          method: 'POST',
          headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + authJWT, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
          body: JSON.stringify({
            email: email,
            password_hash: null,
            rol: 'coach',
            nombre: name,
            activo: true,
            auth_id: userId,
            configuracion: newCfg
          })
        }).then(r => {
          if(!r.ok) throw new Error('No se pudo crear cuenta');
          return r.json();
        }).then(created => Array.isArray(created) ? created[0] : created);

        // Email de bienvenida.
        fetch(SB + '/functions/v1/send-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            to: email,
            to_name: name,
            subject: '¡Te damos la bienvenida a Pathway! Tu trial de 14 días empezó 🌱',
            html: '<h2 style="font-family:Fraunces,Georgia,serif;color:#1B4332;margin:0 0 14px;">Hola ' + (name.split(' ')[0]) + ',</h2>'
              + '<p style="font-size:15px;line-height:1.65;">Te damos la bienvenida a Pathway. Tu cuenta está lista y empezaste tu <strong>trial de 14 días gratis</strong>.</p>'
              + '<p style="margin-top:20px;"><a href="https://pathwaycareercoach.com/panel-v2.html" style="display:inline-block;padding:13px 28px;background:#2D6A4F;color:#fff;border-radius:10px;text-decoration:none;font-weight:700;">Ir a mi panel →</a></p>'
          })
        }).catch(function(){});

        // Guardar sesión y redirigir.
        localStorage.setItem('mj_user', JSON.stringify({
          id: usr.id,
          email: usr.email,
          rol: usr.rol,
          nombre: usr.nombre,
          activo: true,
          configuracion: usr.configuracion || {}
        }));
        setLoadingMsg('¡Te damos la bienvenida! Te llevamos al panel...');
        try{ sessionStorage.removeItem('pw_auth_retry'); }catch(e){}

        // En iOS (Browser nativo), cerrar la ventana después de guardar la sesión.
        // El app principal recibe el browserFinished event y redirige al panel.
        if(googleNative){
          var Browser = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Browser;
          if(Browser && Browser.close) Browser.close();
        } else {
          setTimeout(function(){
            window.location.href = '/panel-v2.html?welcome=1&v=' + Date.now();
          }, 800);
        }
      } else {
        // Usuario existente.
        var cfg = usr.configuracion || {};
        cfg.last_login = new Date().toISOString();
        await fetch(SB + '/rest/v1/usuarios?id=eq.' + usr.id, {
          method: 'PATCH',
          headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + authJWT, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
          body: JSON.stringify({ configuracion: cfg })
        }).catch(function(){});

        localStorage.setItem('mj_user', JSON.stringify({
          id: usr.id,
          email: usr.email,
          rol: usr.rol,
          nombre: usr.nombre,
          activo: true,
          configuracion: cfg
        }));
        setLoadingMsg('¡Hola de nuevo! Te llevamos al panel...');
        try{ sessionStorage.removeItem('pw_auth_retry'); }catch(e){}

        // En iOS (Browser nativo), cerrar la ventana después de guardar la sesión.
        if(googleNative){
          var Browser = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Browser;
          if(Browser && Browser.close) Browser.close();
        } else {
          setTimeout(function(){
            var dest = usr.rol === 'cliente' ? '/cliente.html?v=' : '/panel-v2.html?v=';
            window.location.href = dest + Date.now();
          }, 800);
        }
      }
      return;
    } catch(e) {
      return showError('Error en validación de Google: ' + (e && e.message || 'desconocido'));
    }
  }

  // Inicializar Supabase JS client
  var sb;
  try {
    sb = window.supabase.createClient(SB, KEY, {
      auth: {
        // detectSessionInUrl=true (default) hace que Supabase parsee el #access_token=
        // del callback de Google y guarde la sesion automaticamente.
        detectSessionInUrl: true,
        persistSession: true,
        autoRefreshToken: true
      }
    });
  } catch(e) {
    return showError('No pudimos cargar el cliente. Recarga la página.');
  }

  // Si Google/Supabase devolvieron un error en la URL (?error= o #error=),
  // mostrarlo claro en vez del genérico "no hay sesión" (p.ej. access_denied
  // cuando el usuario cancela, o app no verificada).
  var _oauthErr = params.get('error_description') || params.get('error');
  if(!_oauthErr){
    try{
      var _hp = new URLSearchParams((window.location.hash || '').replace(/^#/, ''));
      _oauthErr = _hp.get('error_description') || _hp.get('error');
    }catch(_e){}
  }
  if(_oauthErr){
    return showError('Google no completó el inicio de sesión: ' + String(_oauthErr).replace(/\+/g,' ') + '. Vuelve a intentar.');
  }

  // El intercambio del "code" de OAuth (flujo PKCE) es una llamada de red
  // asíncrona que Supabase dispara al cargar la página. Un único getSession()
  // corriendo 200ms después puede ganarle la carrera y devolver null → el
  // usuario veía "No se encontró sesión activa". Reintentamos ~5s: apenas la
  // sesión aparece, seguimos.
  // Apple en iOS puede tomar más tiempo — intentamos hasta 20 veces (6 segundos).
  async function _getSessionRetry(){
    var maxRetries = 20; // Apple puede ser más lento en iOS
    for(var i=0;i<maxRetries;i++){
      try{
        var r = await sb.auth.getSession();
        if(r && r.data && r.data.session) return r.data.session;
      }catch(e){}
      if(i < maxRetries - 1) await new Promise(function(res){ setTimeout(res, 300); });
    }
    return null;
  }

  var session;
  try {
    session = await _getSessionRetry();
  } catch(e) {
    return showError('Error obteniendo sesión: ' + e.message);
  }
  if(!session){
    return showError('No se encontró sesión activa. Prueba iniciar sesión de nuevo.');
  }

  var user = session.user;
  var SJWT = session.access_token || KEY; // JWT del usuario: lecturas/updates a candidatos pasan RLS
  var email = (user.email || '').toLowerCase();
  if(!email){
    return showError('No se compartió tu email al iniciar sesión. Verifica los permisos otorgados e intenta de nuevo.');
  }

  var meta = user.user_metadata || {};
  var name = meta.full_name || meta.name || meta.given_name || email.split('@')[0];
  var photoUrl = meta.avatar_url || meta.picture || null;
  // Método real con el que entró (google / apple / email). Sirve para etiquetar
  // bien la cuenta; la IDENTIDAD igual es el email (se busca por email siempre).
  var provider = (user.app_metadata && user.app_metadata.provider) ||
    (user.identities && user.identities[0] && user.identities[0].provider) || 'google';

  // Candidato ("Busco trabajo"): NO crear cuenta en usuarios. Solo registrar
  // el lead y mandarlo al directorio curado. Rama aislada: solo corre si
  // source === 'candidato', no afecta el flujo de login/coach.
  if(source === 'candidato'){
    try {
      localStorage.setItem('pw_cand_reg', '1');
      localStorage.setItem('pw_cand_nombre', name || '');
      localStorage.setItem('pw_cand_email', email || '');
    } catch(_e){}
    try {
      await fetch(SB + '/rest/v1/contactos_chat', {
        method: 'POST',
        headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
        body: JSON.stringify({ contacto: ((name ? name + ' · ' : '') + email + ' (Google)'), pagina: 'soy-candidato-google' })
      });
    } catch(_e){}
    window.location.replace('https://pathwaycareercoach.com/coaches.html');
    return;
  }

  setLoadingMsg('Buscando tu cuenta...');

  // Chequear si el usuario existe en nuestra tabla usuarios
  var existingUser = null;
  try {
    var checkRes = await fetch(SB + '/rest/v1/usuarios?email=eq.' + encodeURIComponent(email) + '&select=id,email,rol,nombre,activo,configuracion,auth_id', {
      headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + SJWT }
    });
    var existingArr = await checkRes.json();
    if(Array.isArray(existingArr) && existingArr.length > 0){
      existingUser = existingArr[0];
    }
  } catch(e) {
    return showError('Error consultando tu cuenta: ' + e.message);
  }

  // ── Merge por persona (una persona, varios emails) ───────────────────────
  // Si el email NO es el primario de ningún usuario, ver si está registrado
  // como ALIAS de uno existente (configuracion.emails_alias). Una misma
  // persona puede tener su email de negocio + el Gmail con el que entra por
  // Google; ambos deben caer SIEMPRE en la misma cuenta. Sin esto, el login
  // con el segundo email creaba un usuario nuevo (coach/cliente duplicado).
  if(!existingUser){
    try {
      var aliasQ = encodeURIComponent(JSON.stringify({ emails_alias: [email] }));
      var aliasRes = await fetch(SB + '/rest/v1/usuarios?configuracion=cs.' + aliasQ + '&select=id,email,rol,nombre,activo,configuracion,auth_id&limit=1', {
        headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + SJWT }
      });
      var aliasArr = await aliasRes.json();
      if(Array.isArray(aliasArr) && aliasArr.length > 0){
        existingUser = aliasArr[0];
      }
    } catch(e) {}
  }

  // Si NO está en usuarios pero SÍ en candidatos, es un CLIENTE que el coach ya
  // cargó pero que todavía no tenía login. Le creamos su acceso como CLIENTE
  // (no como coach) y seguimos el flujo normal -> el routing por rol lo manda a
  // su portal. Así cualquier cliente puede entrar con Google sin contraseña.
  if(!existingUser){
    try {
      var candCheck = await fetch(SB + '/rest/v1/candidatos?email=eq.' + encodeURIComponent(email) + '&select=id,nicho&limit=1', {
        headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + SJWT }
      });
      var candArr = await candCheck.json();
      if(Array.isArray(candArr) && candArr.length){
        var cliRes = await fetch(SB + '/rest/v1/usuarios?select=id,email,rol,nombre,activo,configuracion,auth_id', {
          method: 'POST',
          headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + SJWT, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
          body: JSON.stringify({ email: email, password_hash: null, rol: 'cliente', nombre: name, activo: true, auth_id: user.id,
            configuracion: { auth_provider: provider, coach_type: (candArr[0].nicho || 'carrera'), from_google: (provider==='google'), last_login: new Date().toISOString() } })
        });
        if(cliRes.ok){ var _cc = await cliRes.json(); existingUser = Array.isArray(_cc) ? _cc[0] : _cc; }
      }
    } catch(e) {}
  }

  var isNew = !existingUser;
  var usuario;

  if(existingUser){
    // Usuario existente — actualizar nombre/foto si cambió
    usuario = existingUser;
    var cfg = usuario.configuracion || {};
    if(cfg.auth_provider !== provider){ cfg.auth_provider = provider; }
    // El panel lee la foto del coach desde configuracion.foto_url (no foto_perfil).
    // Ponemos/REFRESCAMOS la de Google si el coach no tiene foto, O si la que
    // tiene es una URL de Google (esas vencen/rotan, hay que refrescarlas en cada
    // login para que no queden rotas). Si subio una propia (no-Google), se
    // respeta y NO se pisa. (Default: Google; prioridad: la elegida a mano.)
    if(photoUrl && (!cfg.foto_url || /googleusercontent\.com/.test(cfg.foto_url))){ cfg.foto_url = photoUrl; }
    cfg.last_login = new Date().toISOString();
    // Update best-effort (incluye last_login → columna "Último acceso" del
    // panel admin de coaches). No bloquea el flow.
    fetch(SB + '/rest/v1/usuarios?id=eq.' + usuario.id, {
      method: 'PATCH',
      headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + SJWT, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ configuracion: cfg })
    }).catch(function(){});
  } else {
    // Usuario nuevo — crearlo en usuarios.
    // Modelo nuevo: trial SIN tarjeta. activo=true desde el inicio. La coach
    // tiene 14 dias gratis (28 si vino del popup) sin pasar por Stripe.
    // Cuando vence fecha_fin_prueba sin suscripcion, panel-v2.html muestra un
    // paywall full-screen con el CTA a Stripe Payment Link.
    setLoadingMsg('Creando tu cuenta...');
    try {
      var refIsPopup = ref === 'popup';
      var trialDays = refIsPopup ? 28 : 14;
      var _ct='carrera'; try{ _ct=localStorage.getItem('pw_signup_coach_type')||'carrera'; localStorage.removeItem('pw_signup_coach_type'); }catch(e){}
      var newCfg = {
        coach_type: _ct,
        auth_provider: provider,
        foto_url: photoUrl,
        last_login: new Date().toISOString(),
        from_google: (provider==='google'),
        from_popup: refIsPopup,
        plan: 'basic',
        estado_sub: 'prueba',
        visible_directorio: true,
        max_candidatos: 5,
        fecha_fin_prueba: new Date(Date.now() + trialDays * 24 * 60 * 60 * 1000).toISOString()
      };
      if(referredBy){
        newCfg.referred_by = referredBy;
        newCfg.referred_at = new Date().toISOString();
      }
      var createRes = await fetch(SB + '/rest/v1/usuarios?select=id,email,rol,nombre,activo,configuracion,auth_id', {
        method: 'POST',
        headers: {
          'apikey': KEY,
          'Authorization': 'Bearer ' + SJWT,
          'Content-Type': 'application/json',
          'Prefer': 'return=representation'
        },
        body: JSON.stringify({
          email: email,
          password_hash: null,
          rol: 'coach',
          nombre: name,
          activo: true,
          auth_id: user.id,
          configuracion: newCfg
        })
      });
      if(!createRes.ok){
        var errTxt = await createRes.text();
        return showError('No pudimos crear tu cuenta: ' + errTxt.slice(0,200));
      }
      var created = await createRes.json();
      usuario = Array.isArray(created) ? created[0] : created;

      var primerNombreGoogle = (name && name.split(' ')[0]) || name || '';

      // Notificar admin (best-effort)
      fetch(SB + '/functions/v1/send-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          to: 'hi@pathwaycareercoach.com',
          to_name: 'Micaela',
          subject: '🎉 Nuevo coach via Google: ' + name,
          html: '<h2>Nuevo coach registrado</h2><p><strong>' + name + '</strong> (' + email + ') se registró via Google.</p><p>Trial de ' + trialDays + ' días sin tarjeta. Se le ofrece Stripe al final del trial.</p>'
        })
      }).catch(function(){});

      // Email de bienvenida (best-effort)
      fetch(SB + '/functions/v1/send-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          to: email,
          to_name: name,
          subject: '¡Te damos la bienvenida a Pathway! Tu trial de ' + trialDays + ' días empezó 🌱',
          html: '<h2 style="font-family:Fraunces,Georgia,serif;color:#1B4332;margin:0 0 14px;">Hola ' + primerNombreGoogle + ',</h2>'
            + '<p style="font-size:15px;line-height:1.65;">Te damos la bienvenida a Pathway. Tu cuenta está lista y empezaste tu <strong>trial de ' + trialDays + ' días gratis</strong>. No te pedimos tarjeta — si al final no quieres seguir, simplemente no haces nada.</p>'
            + '<p style="margin-top:20px;"><a href="https://pathwaycareercoach.com/panel-v2.html" style="display:inline-block;padding:13px 28px;background:#2D6A4F;color:#fff;border-radius:10px;text-decoration:none;font-weight:700;">Ir a mi panel →</a></p>'
            + '<p style="font-size:13px;color:#888;margin-top:18px;">Cualquier duda, responde este mail. — Mica</p>'
        })
      }).catch(function(){});

      // Programar emails de trial (mismo flow que registro.html con email/password).
      // Drip activo con templates sin precios (CTA a upgrade.html). El
      // whitelist en send-queued-emails bloquea cualquier legacy con precios.
      var TRIAL_DRIP_ENABLED = true;
      var nowMs = Date.now();
      var upgradeUrl = 'https://pathwaycareercoach.com/upgrade.html?email=' + encodeURIComponent(email);
      var trialShell = function(inner){
        return '<div style="background:#FAFDF9;padding:28px 16px;font-family:Inter,-apple-system,Segoe UI,Roboto,Arial,sans-serif;">'
          + '<div style="max-width:520px;margin:0 auto;">'
          + '<div style="text-align:center;margin-bottom:18px;"><img src="https://pathwaycareercoach.com/logo-horizontal.png" alt="Pathway" width="150" style="width:150px;max-width:60%;height:auto;display:inline-block;"></div>'
          + '<div style="background:#fff;border:1px solid #E8EFE9;border-radius:16px;padding:30px 28px;box-shadow:0 6px 22px rgba(45,106,79,.06);">'
          + inner + '</div>'
          + '<p style="text-align:center;color:#8A968E;font-size:12px;margin:16px 0 0;line-height:1.7;">¿Dudas? Responde a este correo, te leo.<br>— Micaela, fundadora de Pathway</p>'
          + '</div></div>';
      };
      var trialCta = '<p style="margin:0 0 12px;"><a href="' + upgradeUrl + '" style="display:inline-block;padding:13px 28px;background:#2D6A4F;color:#fff;border-radius:10px;text-decoration:none;font-weight:700;font-family:Inter,sans-serif;">Ver planes y suscribirme →</a></p>';
      var trialEmails = [
        {
          days: 7,
          plantilla: 'trial_day_7',
          subject: '¿Cómo va tu primera semana en Pathway, ' + primerNombreGoogle + '? 🌱',
          body: trialShell(
            '<h1 style="font-family:Fraunces,Georgia,serif;font-size:23px;font-weight:600;color:#1B2E26;margin:0 0 14px;letter-spacing:-.4px;">Hola ' + primerNombreGoogle + ', ¿cómo va?</h1>'
            + '<p style="font-size:15px;line-height:1.7;color:#3A4A40;margin:0 0 14px;">Ya pasó la primera semana de tu prueba. Cosas que las coaches que mejor aprovechan Pathway hacen al principio:</p>'
            + '<ol style="padding-left:20px;line-height:1.9;font-size:14px;color:#3A4A40;margin:0 0 18px;">'
            + '<li>Generan su primer <strong>informe IA</strong> con un cliente real (30 segundos)</li>'
            + '<li>Conectan <strong>Calendly y Stripe</strong> para que los clientes agenden y paguen directo</li>'
            + '<li>Personalizan colores y logo en Configuración</li>'
            + '</ol>'
            + '<p style="margin:0 0 18px;"><a href="https://pathwaycareercoach.com/panel-v2.html" style="display:inline-block;padding:12px 24px;background:#2D6A4F;color:#fff;border-radius:10px;text-decoration:none;font-weight:700;font-family:Inter,sans-serif;">Ir a mi panel →</a></p>'
            + '<p style="font-size:13px;color:#5A6A60;margin:0;line-height:1.6;">¿Algo se traba? Responde este mail y te ayudo.</p>'
          )
        },
        {
          days: 13,
          plantilla: 'trial_day_13',
          subject: 'Tu prueba de Pathway termina mañana ⏰',
          body: trialShell(
            '<h1 style="font-family:Fraunces,Georgia,serif;font-size:23px;font-weight:600;color:#1B2E26;margin:0 0 14px;letter-spacing:-.4px;">' + primerNombreGoogle + ', tu prueba termina en 24 h</h1>'
            + '<p style="font-size:15px;line-height:1.7;color:#3A4A40;margin:0 0 16px;">Si Pathway te está sirviendo, deja tu suscripción lista para no perder el acceso al panel mañana.</p>'
            + '<p style="font-size:14px;line-height:1.7;color:#3A4A40;margin:0 0 18px;">Hay dos planes; eliges el que mejor te queda — cancelas cuando quieras, sin permanencia.</p>'
            + trialCta
            + '<p style="font-size:13px;color:#5A6A60;margin:18px 0 0;line-height:1.6;">Si no quieres seguir, no hace falta hacer nada — el acceso se cierra mañana y no se cobra nada.</p>'
          )
        },
        {
          days: 15,
          plantilla: 'trial_day_15_post',
          subject: 'Tu prueba terminó · ¿Quieres seguir en Pathway?',
          body: trialShell(
            '<h1 style="font-family:Fraunces,Georgia,serif;font-size:23px;font-weight:600;color:#1B2E26;margin:0 0 14px;letter-spacing:-.4px;">' + primerNombreGoogle + ', tu prueba terminó</h1>'
            + '<p style="font-size:15px;line-height:1.7;color:#3A4A40;margin:0 0 14px;">Como no te pedimos tarjeta, no se cobró nada. Tu cuenta y tu data <strong>siguen guardadas unos días</strong> por si decides volver.</p>'
            + '<p style="font-size:15px;line-height:1.7;color:#3A4A40;margin:0 0 14px;">Si quieres seguir usando Pathway con tus clientes:</p>'
            + trialCta
            + '<p style="font-size:13px;color:#5A6A60;margin:18px 0 12px;line-height:1.6;">¿Algo te trabó? Responde este mail y te ayudo — me sirve mucho el feedback.</p>'
            + '<p style="font-size:13px;color:#5A6A60;margin:0;line-height:1.6;">Si por ahora no, ningún problema. Gracias por probarlo. 🌱</p>'
          )
        }
      ];
      var trialQueueInserts = trialEmails.map(function(e){
        return {
          coach_id: usuario.id,
          to_email: email,
          to_nombre: name,
          subject: e.subject,
          body: e.body,
          scheduled_at: new Date(nowMs + e.days * 24 * 60 * 60 * 1000).toISOString(),
          plantilla_id: e.plantilla
        };
      });
      if (TRIAL_DRIP_ENABLED) {
        fetch(SB + '/rest/v1/email_queue', {
          method: 'POST',
          headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
          body: JSON.stringify(trialQueueInserts)
        }).catch(function(){});
      }
    } catch(e) {
      return showError('Error creando cuenta: ' + e.message);
    }
  }

  // Etapa 2 — ligar la cuenta a Supabase Auth (auth_id) para habilitar RLS.
  // El login con email/contraseña ya lo hace via migrate-user-to-auth; acá lo
  // hacemos para los que entran con Google (su auth_id = el id del usuario de la
  // sesión de Supabase Auth que ya creó el OAuth). Best-effort, no bloquea.
  try {
    if(usuario && usuario.id && user.id && usuario.auth_id !== user.id){
      fetch(SB + '/rest/v1/usuarios?id=eq.' + encodeURIComponent(usuario.id), {
        method: 'PATCH',
        headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + SJWT, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
        body: JSON.stringify({ auth_id: user.id })
      }).catch(function(){});
      // Enlace robusto vía RPC SECURITY DEFINER: salta la RLS que bloquea el
      // PATCH de arriba (a admins por rol<>'admin', y a emails desajustados).
      // Sin auth_id el coach no ve ni puede crear clientes. Idempotente.
      fetch(SB + '/rest/v1/rpc/pw_link_auth_id', {
        method: 'POST',
        headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + SJWT, 'Content-Type': 'application/json' },
        body: '{}'
      }).catch(function(){});
    }
  } catch(e) {}

  // Guardar sesion en localStorage (mismo formato que login.html)
  var _userObj = {
    id: usuario.id,
    email: usuario.email,
    rol: usuario.rol,
    nombre: usuario.nombre,
    activo: true,
    configuracion: usuario.configuracion || {}
  };
  localStorage.setItem('mj_user', JSON.stringify(_userObj));

  // En iOS/Safari con Apple signin, la sesión de Supabase Auth puede no
  // persistirse bien entre página y página. Guardar el JWT explícitamente
  // para que el panel-v2 pueda recuperarlo como fallback.
  try {
    if(SJWT && SJWT !== KEY) {
      localStorage.setItem('pw_apple_jwt', SJWT);
    }
  } catch(e) {}

  // Destino:
  //   - Coach/admin nuevo o existente → /panel-v2.html
  //   - Cliente → /cliente.html
  // (Antes los nuevos via Google iban a Stripe. Con trial-sin-tarjeta, van
  //  directo al panel — el cobro se ofrece al final del trial.)
  var _v = (isNew ? 'welcome=1&v=' : 'v=') + Date.now();
  var dest;
  if(usuario.rol === 'cliente'){
    setLoadingMsg('¡Hola! Te llevamos a tu espacio...');
    // Google trae la foto del cliente: la ponemos en candidatos si no tiene, O si
    // la que tiene es una URL de Google (esas vencen/rotan → se refrescan en cada
    // login para que no queden rotas). Respeta una foto propia (no-Google).
    // Best-effort, no bloquea el ingreso.
    if(photoUrl){
      fetch(SB + '/rest/v1/candidatos?email=eq.' + encodeURIComponent(email) + '&or=(foto_perfil.is.null,foto_perfil.like.*googleusercontent.com*)', {
        method: 'PATCH',
        headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + SJWT, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
        body: JSON.stringify({ foto_perfil: photoUrl })
      }).catch(function(){});
    }
    // Cada cliente va al portal de SU nicho. La fuente real es candidatos.nicho
    // (la config del usuario puede no tenerlo si lo creó el panel sin nicho).
    var _ct = (usuario.configuracion && usuario.configuracion.coach_type) || '';
    if(!_ct || _ct === 'carrera'){
      try {
        var _nr = await fetch(SB + '/rest/v1/candidatos?email=eq.' + encodeURIComponent(email) + '&select=nicho&limit=1', { headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + SJWT } });
        var _na = await _nr.json();
        if(Array.isArray(_na) && _na.length && _na[0].nicho) _ct = _na[0].nicho;
      } catch(e) {}
    }
    if(!_ct) _ct = 'carrera';
    var _em = '&email=' + encodeURIComponent((''+(usuario.email||'')).toLowerCase().trim());
    if(_ct === 'fitness') dest = '/pathway-fit-cliente.html?' + _v + _em;
    else if(_ct === 'financiero') dest = '/pathway-fin-cliente.html?' + _v + _em;
    else dest = '/cliente.html?' + _v;
  } else if(usuario.rol === 'empleado'){
    // Empleado (equipo comercial): panel propio mínimo con las plantillas.
    setLoadingMsg('¡Hola! Te llevamos a tus plantillas...');
    dest = '/empleado.html?' + _v;
  } else {
    setLoadingMsg(isNew ? '¡Te damos la bienvenida! Te llevamos al panel...' : '¡Hola de nuevo! Te llevamos al panel...');
    dest = '/panel-v2.html?' + _v;
  }
  // Login fresco → presupuesto nuevo de reintento para el panel/portal
  // (mismo motivo que en login.html: el 401 por carrera de token reintenta 1 vez).
  try{ sessionStorage.removeItem('pw_auth_retry'); }catch(e){}

  // En iOS/Safari con Apple signin, el localStorage puede no sincronizarse bien
  // entre páginas si el redirect es muy rápido. Dar un poco más de tiempo para
  // que la sesión se persista antes de redirigir (especialmente para Apple).
  var delayMs = (provider === 'apple' || /iphone|ipad|ipod/i.test(navigator.userAgent)) ? 1200 : 800;
  setTimeout(function(){
    window.location.href = dest;
  }, delayMs);
}

// Esperar a que el SDK de Supabase cargue
if(window.supabase){
  handleCallback();
} else {
  window.addEventListener('load', function(){
    if(window.supabase){
      handleCallback();
    } else {
      showError('No pudimos cargar Supabase. Verifica tu conexión.');
    }
  });
}
</script>
</body>
</html>
