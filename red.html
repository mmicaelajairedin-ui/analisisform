<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red de coaches · Pathway</title>
<meta name="robots" content="index,follow">
<style>
  :root{ --verde:#2D6A4F; --verde-d:#1B4332; --crema:#F7F4EC; --carbon:#1F2A23; --suave:#5B6B60; --borde:#E7E1D4; --accent:#2D6A4F; }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--crema);color:var(--carbon);-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .wrap{max-width:960px;margin:0 auto;padding:0 20px}
  header.top{background:#fff;border-bottom:1px solid var(--borde);padding:22px 0}
  .brand{display:flex;align-items:center;gap:14px}
  .brand img{height:46px;width:auto;max-width:180px;object-fit:contain}
  .brand-badge{width:46px;height:46px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:800;flex-shrink:0}
  .brand h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.3px}
  .brand .sub{font-size:12.5px;color:var(--suave);margin-top:2px}
  .hero{padding:34px 0 8px}
  .hero h2{font-size:26px;margin:0 0 8px;font-weight:700;letter-spacing:-.5px}
  .hero p{font-size:15px;color:var(--suave);line-height:1.6;margin:0;max-width:640px}
  .banner{margin:18px 0;border-radius:12px;padding:13px 16px;font-size:13.5px;font-weight:600}
  .banner.ok{background:#E4F1E9;color:var(--verde-d);border:1px solid #BFE0CC}
  .banner.cancel{background:#FBEEED;color:#9C4A44;border:1px solid #E6C9C6}
  .banner.warn{background:#FBF3DD;color:#8A6D1E;border:1px solid #EBDCA8}
  .grid{display:grid;grid-template-columns:1fr;gap:16px;padding:14px 0 40px}
  @media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
  .coach{background:#fff;border:1px solid var(--borde);border-radius:16px;padding:20px;box-shadow:0 1px 3px rgba(20,40,30,.05)}
  .coach-hd{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .coach-hd img{width:52px;height:52px;border-radius:50%;object-fit:cover;flex-shrink:0}
  .coach-hd .ini{width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:700;flex-shrink:0}
  .coach-hd .n{font-size:17px;font-weight:700;line-height:1.2}
  .coach-hd .t{font-size:12.5px;color:var(--suave);margin-top:2px}
  .svc{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--borde)}
  .svc .info{min-width:0}
  .svc .sn{font-size:14px;font-weight:600}
  .svc .sd{font-size:12px;color:var(--suave);margin-top:2px}
  .svc .price{font-size:16px;font-weight:800;color:var(--accent);white-space:nowrap}
  .btn{border:0;cursor:pointer;font-family:inherit;font-weight:700;border-radius:10px;padding:9px 16px;font-size:13.5px;background:var(--accent);color:#fff;white-space:nowrap}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
  .empty{padding:50px 20px;text-align:center;color:var(--suave);font-size:15px}
  footer{padding:26px 0;text-align:center;font-size:12px;color:var(--suave);border-top:1px solid var(--borde)}
  footer a{color:var(--verde);font-weight:600;text-decoration:none}
  /* modal de pago */
  .ov{position:fixed;inset:0;background:rgba(20,40,30,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
  .ov.on{display:flex}
  .modal{background:#fff;border-radius:18px;max-width:420px;width:100%;padding:24px;box-shadow:0 30px 70px rgba(20,50,30,.3)}
  .modal h3{margin:0 0 4px;font-size:19px;font-weight:700}
  .modal .m-sub{font-size:13px;color:var(--suave);margin:0 0 16px;line-height:1.5}
  .modal label{display:block;font-size:12px;font-weight:700;color:var(--suave);margin:12px 0 5px}
  .modal input{width:100%;height:44px;border:1px solid var(--borde);border-radius:10px;padding:0 13px;font-size:14px;font-family:inherit;outline:none}
  .modal input:focus{border-color:var(--accent)}
  .modal .row{display:flex;gap:10px;margin-top:20px}
  .modal .row .btn{flex:1;justify-content:center;text-align:center;height:44px}
  .m-err{color:#B4453D;font-size:12.5px;margin-top:10px;min-height:14px}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="brand" id="brand">
  <span class="brand-badge" id="brand-badge">·</span>
  <div><h1 id="brand-name">Red de coaches</h1><div class="sub">Coaching profesional · con Pathway</div></div>
</div></div></header>

<div class="wrap">
  <div id="banner-slot"></div>
  <section class="hero"><h2 id="hero-h">Elige tu coach y empieza</h2>
    <p id="hero-p">Reserva y paga de forma segura tu sesión o programa con el coach de la red que mejor encaje con vos.</p></section>
  <section class="grid" id="grid"><div class="empty">Cargando…</div></section>
</div>

<footer><div class="wrap">Pagos seguros procesados por Stripe · <a href="https://pathwaycareercoach.com" target="_blank" rel="noopener">Pathway</a></div></footer>

<!-- Modal de pago -->
<div class="ov" id="ov"><div class="modal">
  <h3 id="pm-title">Contratar</h3>
  <p class="m-sub" id="pm-sub"></p>
  <label>Tu nombre</label><input id="pm-name" type="text" placeholder="Nombre y apellido" autocomplete="name">
  <label>Tu email</label><input id="pm-email" type="email" placeholder="tu@email.com" autocomplete="email">
  <div class="m-err" id="pm-err"></div>
  <div class="row"><button class="btn ghost" id="pm-cancel" type="button">Cancelar</button><button class="btn" id="pm-pay" type="button">Ir a pagar →</button></div>
</div></div>

<script>
var SB='https://api.pathwaycareercoach.com';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkeG5yc25qZHZ0cWh4dW54bndqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNDk5MzksImV4cCI6MjA5MDcyNTkzOX0.t82X1x-PDgFDGYhKC7YXoRKhga9I8Hjet60QUYvtZLU';
function esc(s){return (''+(s==null?'':s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function slugFromPath(){var m=(location.pathname||'').match(/\/red\/([^\/?#]+)/i);return m?decodeURIComponent(m[1]):'';}
function money(n,cur){var c=(cur||'eur').toUpperCase();var sym={EUR:'€',USD:'$',GBP:'£',MXN:'$',ARS:'$',COP:'$',CLP:'$',PEN:'S/',BRL:'R$',UYU:'$',CAD:'$',CHF:'CHF '}[c]||(c+' ');return sym+(Number(n)||0).toLocaleString('es-ES');}
var STATE={slug:'',org:null,coaches:[],cobrosOn:false};

function banner(){
  var q=new URLSearchParams(location.search).get('pago');
  var slot=document.getElementById('banner-slot');
  if(q==='ok') slot.innerHTML='<div class="banner ok">¡Pago recibido! Tu coach te va a contactar para arrancar. Revisa tu email.</div>';
  else if(q==='cancel') slot.innerHTML='<div class="banner cancel">Pago cancelado — no se te cobró nada. Podés intentarlo cuando quieras.</div>';
}
function applyBrand(){
  var o=STATE.org||{}, m=o.marca||{};
  if(m.color){ document.documentElement.style.setProperty('--accent', m.color); }
  document.getElementById('brand-name').textContent=o.nombre||'Red de coaches';
  var badge=document.getElementById('brand-badge');
  if(m.logo){ var img=document.createElement('img'); img.src=m.logo; img.alt=o.nombre||'Red'; badge.replaceWith(img); }
  else { badge.textContent=((o.nombre||'R').trim().charAt(0)||'R').toUpperCase(); }
  document.title=(o.nombre||'Red de coaches')+' · Pathway';
}
function render(){
  var g=document.getElementById('grid');
  if(!STATE.coaches.length){ g.innerHTML='<div class="empty">Esta red todavía no publicó servicios. Volvé pronto.</div>'; return; }
  if(!STATE.cobrosOn){ document.getElementById('banner-slot').insertAdjacentHTML('beforeend','<div class="banner warn">Los pagos online de esta red se están terminando de activar. Escribile a tu coach para coordinar.</div>'); }
  g.innerHTML=STATE.coaches.map(function(c){
    var av=c.foto?('<img src="'+esc(c.foto)+'" alt="'+esc(c.nombre)+'">'):('<span class="ini">'+esc((c.nombre||'C').trim().charAt(0).toUpperCase())+'</span>');
    var svcs=c.servicios.map(function(s){
      var per=s.recurrente?' <span style="font-size:11px;color:var(--suave);font-weight:600">/ 4 sem</span>':'';
      var btn=STATE.cobrosOn
        ? '<button class="btn" onclick="openPay(\''+esc(c.id)+'\','+s.idx+')">Contratar</button>'
        : '<button class="btn" disabled>Contratar</button>';
      return '<div class="svc"><div class="info"><div class="sn">'+esc(s.name)+'</div>'+(s.desc?'<div class="sd">'+esc(s.desc)+'</div>':'')+'</div>'+
             '<div style="display:flex;align-items:center;gap:12px"><span class="price">'+money(s.price,s.moneda)+per+'</span>'+btn+'</div></div>';
    }).join('');
    return '<div class="coach"><div class="coach-hd">'+av+'<div><div class="n">'+esc(c.nombre)+'</div>'+(c.titulo?'<div class="t">'+esc(c.titulo)+'</div>':'')+'</div></div>'+svcs+'</div>';
  }).join('');
}
var PAY={coachId:'',idx:-1,svc:null};
function openPay(coachId,idx){
  var c=STATE.coaches.filter(function(x){return String(x.id)===String(coachId);})[0]; if(!c)return;
  var s=c.servicios.filter(function(x){return x.idx===idx;})[0]; if(!s)return;
  PAY={coachId:coachId,idx:idx,svc:s,coach:c};
  document.getElementById('pm-title').textContent='Contratar · '+s.name;
  document.getElementById('pm-sub').textContent=s.name+' con '+c.nombre+' · '+money(s.price,s.moneda)+(s.recurrente?' cada 4 semanas':'')+'. Pago seguro con Stripe.';
  document.getElementById('pm-err').textContent='';
  document.getElementById('ov').classList.add('on');
}
function closePay(){document.getElementById('ov').classList.remove('on');}
function doPay(){
  var name=(document.getElementById('pm-name').value||'').trim();
  var email=(document.getElementById('pm-email').value||'').trim();
  var err=document.getElementById('pm-err');
  if(name.length<2){err.textContent='Escribe tu nombre.';return;}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){err.textContent='Escribe un email válido.';return;}
  var btn=document.getElementById('pm-pay'); btn.disabled=true; btn.textContent='Abriendo pago…';
  fetch(SB+'/functions/v1/red-checkout',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+KEY},
    body:JSON.stringify({action:'create',slug:STATE.slug,coach_id:PAY.coachId,servicio_idx:PAY.idx,cliente:{nombre:name,email:email}})})
    .then(function(r){return r.json().catch(function(){return null;});})
    .then(function(j){ if(j&&j.url){ location.href=j.url; return; } btn.disabled=false; btn.textContent='Ir a pagar →'; err.textContent=(j&&j.error)?j.error:'No se pudo abrir el pago. Prueba de nuevo.'; })
    .catch(function(){ btn.disabled=false; btn.textContent='Ir a pagar →'; err.textContent='Error de red. Revisa tu conexión.'; });
}
// ¿Estamos en el dominio propio de una red (Pro)? Si el host no es de Pathway,
// la red se identifica por su dominio (no hace falta /red/<slug> en la URL).
function customHost(){
  var h=(location.hostname||'').toLowerCase();
  if(!h||h==='localhost'||/^\d+\.\d+\.\d+\.\d+$/.test(h)) return '';
  if(/(^|\.)pathwaycareercoach\.com$/.test(h)||/\.pages\.dev$/.test(h)) return '';
  return h;
}
function load(){
  banner();
  var dom=customHost();
  STATE.slug=slugFromPath();
  if(!dom && !STATE.slug){ document.getElementById('grid').innerHTML='<div class="empty">Enlace de red inválido.</div>'; return; }
  var body = dom ? {action:'info',dominio:dom} : {action:'info',slug:STATE.slug};
  fetch(SB+'/functions/v1/red-checkout',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+KEY},body:JSON.stringify(body)})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(j){
      if(!j||!j.ok){ document.getElementById('grid').innerHTML='<div class="empty">No encontramos esta red. Verifica el enlace.</div>'; return; }
      STATE.org=j.org; STATE.coaches=j.coaches||[]; STATE.cobrosOn=!!j.cobros_on;
      STATE.slug=(j.org&&(j.org.slug||j.org.id))||STATE.slug; // para el checkout (dominio propio no trae slug en la URL)
      applyBrand(); render();
    })
    .catch(function(){ document.getElementById('grid').innerHTML='<div class="empty">No se pudo cargar la red. Revisa tu conexión.</div>'; });
}
document.getElementById('pm-cancel').onclick=closePay;
document.getElementById('pm-pay').onclick=doPay;
document.getElementById('ov').addEventListener('click',function(e){if(e.target===document.getElementById('ov'))closePay();});
load();
</script>
</body>
</html>
