<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservá tu sesión · Pathway</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bosque:#1B4332; --bosque2:#2D6A4F; --sendero:#52B788; --carbon:#1B2E26;
    --niebla:#FAFDF9; --niebla2:#F0F5EF; --soft:#5A6A60; --muted:#9AA8A0;
    --borde:rgba(45,106,79,.14); --serif:'Fraunces',Georgia,serif; --sans:'Inter',-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--sans);background:
    radial-gradient(120% 60% at 50% 0%, #EEF6EE 0%, var(--niebla) 55%) no-repeat, var(--niebla);
    color:var(--carbon);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:26px 16px 70px;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:470px;width:100%;}
  /* Desktop: tarjeta horizontal (info a la izquierda, reserva a la derecha).
     Móvil: apilado vertical (lo de siempre). */
  @media(min-width:760px){ .wrap{max-width:920px;} }
  /* Pantallas simples (cargando / gracias / error) quedan angostas y centradas */
  .card:not(.book-card){max-width:480px;margin-left:auto;margin-right:auto;}
  .brand{display:flex;align-items:center;justify-content:center;margin-bottom:18px;}
  .brand img{height:30px;width:auto;}
  .card{background:#fff;border:1px solid var(--borde);border-radius:22px;box-shadow:0 14px 46px rgba(20,55,38,.09);padding:0 0 28px;overflow:hidden;display:flex;flex-direction:column;}
  .card.two-col{padding:0;}
  .hd{background:linear-gradient(160deg,#2D6A4F 0%,#1B4332 100%);padding:22px 20px;text-align:center;color:#fff;position:relative;}
  .hd .av{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.9);box-shadow:0 6px 20px rgba(0,0,0,.18);margin:0 auto 11px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;background:#3C7A5C;color:#fff;font-family:var(--serif);}
  .hd h1{font-family:var(--serif);font-size:22px;font-weight:500;letter-spacing:-.4px;line-height:1.15;}
  /* Bloque de dudas dentro del panel verde (no queda la foto sola) */
  .hd .help{margin:16px 0 0;padding:15px 0 0;border:none;border-top:1px solid rgba(255,255,255,.22);border-radius:0;background:transparent;text-align:left;}
  .hd .help h4{color:#fff;font-size:13px;font-weight:700;margin-bottom:4px;}
  .hd .help p{color:rgba(255,255,255,.82);font-size:11.5px;line-height:1.45;margin-bottom:10px;}
  .hd .help-btns{flex-direction:column;gap:7px;}
  .hd .help-btns a{width:100%;min-width:0;}
  .hd .hb-ghost{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.32);color:#fff;}
  .hd .hb-ghost:hover{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.55);}
  .hd .hb-green{background:#fff;color:var(--bosque);}
  .hd .hb-green:hover{background:#eef5ef;}
  .hd .type-pill{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.16);backdrop-filter:blur(4px);border-radius:100px;padding:5px 12px;font-size:12px;font-weight:600;margin-top:10px;}
  .hd .type-pill .cdot{width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.22);}
  .body{padding:18px 22px 0;}
  .lbl{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:15px 0 7px;display:flex;align-items:center;gap:6px;}
  .lbl:first-child{margin-top:2px;}
  .days{display:flex;gap:8px;overflow-x:auto;padding-bottom:5px;scrollbar-width:thin;}
  .day{flex-shrink:0;width:52px;height:52px;border:1.5px solid var(--borde);border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .13s;}
  .day:hover{border-color:var(--sendero);transform:translateY(-2px);}
  .day.on{background:var(--bosque);border-color:var(--bosque);color:#fff;box-shadow:0 6px 16px rgba(27,67,50,.24);}
  .day .dn{font-size:9px;text-transform:uppercase;letter-spacing:.3px;opacity:.65;font-weight:700;}
  .day .dd{font-size:17px;font-weight:700;line-height:1.15;}
  .slots{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
  .slot{border:1.5px solid var(--borde);border-radius:10px;background:#fff;padding:9px 4px;font-size:13px;font-weight:600;cursor:pointer;transition:all .13s;color:var(--carbon);font-family:inherit;}
  .slot:hover{border-color:var(--sendero);}
  .slot.on{background:var(--bosque);border-color:var(--bosque);color:#fff;box-shadow:0 6px 16px rgba(27,67,50,.2);}
  .more{grid-column:1/-1;text-align:center;background:none;border:none;color:var(--bosque2);font-size:12.5px;font-weight:700;cursor:pointer;padding:8px;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:5px;}
  .more:hover{text-decoration:underline;}
  .field{margin-bottom:8px;}
  .field label{display:block;font-size:12px;font-weight:600;margin-bottom:4px;color:var(--carbon);}
  .field input{width:100%;padding:10px 12px;border:1.5px solid var(--borde);border-radius:10px;font-size:13.5px;font-family:inherit;outline:none;transition:border-color .13s;background:var(--niebla);}
  .field input:focus{border-color:var(--sendero);background:#fff;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:11px 16px;border-radius:11px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;border:none;text-decoration:none;transition:all .16s;}
  .btn-primary{background:var(--bosque);color:#fff;margin-top:6px;box-shadow:0 8px 22px rgba(27,67,50,.22);}
  .btn-primary:hover{background:#153726;transform:translateY(-1px);}
  .btn-primary:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none;}
  .msg{font-size:13px;margin-top:10px;text-align:center;color:#C0756E;min-height:16px;font-weight:600;}
  .help{margin:14px 22px 4px;padding:12px 15px;border:1px dashed var(--borde);border-radius:13px;background:var(--niebla2);}
  .help h4{font-size:13px;font-weight:700;margin-bottom:3px;color:var(--carbon);}
  .help p{font-size:12px;color:var(--soft);line-height:1.45;margin-bottom:9px;}
  .help-btns{display:flex;gap:9px;flex-wrap:wrap;}
  .help-btns a{flex:1;min-width:130px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 12px;border-radius:11px;font-size:13px;font-weight:600;text-decoration:none;transition:all .13s;}
  .hb-ghost{background:#fff;border:1.5px solid var(--borde);color:var(--carbon);}
  .hb-ghost:hover{border-color:var(--sendero);}
  .hb-green{background:var(--bosque2);color:#fff;}
  .hb-green:hover{background:var(--bosque);}
  .who-row{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:4px;}
  .who-pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--borde);border-radius:100px;padding:5px 13px 5px 5px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--carbon);transition:all .13s;}
  .who-pill:hover{border-color:var(--sendero);}
  .who-pill.on{border-color:var(--bosque);background:var(--niebla2);box-shadow:0 0 0 1px var(--bosque);}
  .foot{text-align:center;font-size:11px;color:var(--muted);margin-top:22px;}
  .ok-ico{width:64px;height:64px;border-radius:50%;background:rgba(82,183,136,.16);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 16px;}
  .spin{width:28px;height:28px;border:3px solid rgba(45,106,79,.2);border-top-color:var(--bosque2);border-radius:50%;animation:s .8s linear infinite;margin:40px auto;}
  @keyframes s{to{transform:rotate(360deg)}}
  .center{text-align:center;padding:34px 26px;}
  .center h1{font-family:var(--serif);font-size:24px;font-weight:500;margin-bottom:8px;}
  .center .sub{font-size:13.5px;color:var(--soft);line-height:1.6;}
  .center .hint{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.5;}
  /* ===== Diseño reserva 3 columnas (equipo · reserva · resumen) ===== */
  .card.book-card{padding:0;display:block;}
  .book{display:grid;grid-template-columns:238px 1fr 240px;}
  /* Col izquierda: equipo (verde) */
  .bk-people{background:linear-gradient(165deg,#2D6A4F 0%,#1B4332 100%);color:#fff;padding:22px 17px;}
  .bk-people .t{font-size:14.5px;font-weight:700;line-height:1.25;margin-bottom:3px;}
  .bk-people .s{font-size:11px;color:rgba(255,255,255,.72);margin-bottom:14px;line-height:1.4;}
  .pcard{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border:1.5px solid transparent;border-radius:13px;padding:8px 10px;margin-bottom:8px;cursor:pointer;transition:all .13s;text-align:left;width:100%;font-family:inherit;color:#fff;}
  .pcard:hover{background:rgba(255,255,255,.15);}
  .pcard.on{border-color:#fff;background:rgba(255,255,255,.2);}
  .pcard img,.pcard .pini{width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#3C7A5C;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--serif);font-size:15px;}
  .pcard .pn{font-size:13px;font-weight:700;line-height:1.15;}
  .pcard .pr{font-size:10.5px;color:rgba(255,255,255,.72);margin-top:1px;}
  .pcard .pchk{margin-left:auto;width:17px;height:17px;border-radius:50%;border:2px solid rgba(255,255,255,.45);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;}
  .pcard.on .pchk{background:#fff;color:var(--bosque);border-color:#fff;}
  /* Col centro: reserva */
  .bk-main{padding:22px 24px 24px;min-width:0;}
  .bk-steps{display:flex;gap:8px;font-size:10.5px;color:var(--muted);font-weight:700;margin-bottom:14px;flex-wrap:wrap;}
  .bk-steps b{color:var(--bosque);}
  .bk-main h2{font-family:var(--serif);font-size:21px;font-weight:500;margin-bottom:2px;}
  .bk-main .sub2{font-size:12.5px;color:var(--soft);margin-bottom:8px;}
  /* Col derecha: resumen */
  .bk-side{background:var(--niebla2);padding:20px 18px;border-left:1px solid var(--borde);}
  .bk-sum-t{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:11px;}
  .bk-sum-row{display:flex;align-items:center;gap:9px;font-size:12.5px;margin-bottom:9px;color:var(--carbon);line-height:1.3;}
  .bk-sum-row .ic{width:16px;flex-shrink:0;text-align:center;opacity:.7;}
  .bk-sum-av{width:34px;height:34px;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--bosque);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--serif);font-size:14px;}
  .learn{background:#fff;border:1px solid var(--borde);border-radius:13px;padding:12px 14px;margin-top:15px;}
  .learn h5{font-size:12px;font-weight:700;margin-bottom:8px;color:var(--carbon);}
  .learn ul{list-style:none;}
  .learn li{font-size:11.5px;color:var(--soft);margin-bottom:6px;display:flex;gap:7px;align-items:flex-start;line-height:1.35;}
  .learn li .ck{color:var(--sendero);font-weight:800;flex-shrink:0;}
  .wa-line{display:flex;align-items:center;gap:9px;margin-top:15px;font-size:12px;color:var(--soft);}
  .wa-line a{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:#25D366;color:#fff;text-decoration:none;flex-shrink:0;font-size:15px;}
  @media(max-width:900px){ .book{grid-template-columns:1fr;} .bk-side{border-left:none;border-top:1px solid var(--borde);} }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><img src="/logo-horizontal.png" alt="Pathway"></div>
  <div class="card" id="card"><div class="spin"></div></div>
  <div class="foot">Reservas con Pathway · pathwaycareercoach.com</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
var SB='https://api.pathwaycareercoach.com';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkeG5yc25qZHZ0cWh4dW54bndqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNDk5MzksImV4cCI6MjA5MDcyNTkzOX0.t82X1x-PDgFDGYhKC7YXoRKhga9I8Hjet60QUYvtZLU';
function $(id){ return document.getElementById(id); }
function esc(s){ return (''+(s==null?'':s)).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function qp(k){ try{ return new URLSearchParams(location.search).get(k); }catch(e){ return null; } }

var COACH='', FIRST='', EMAIL='', PHOTO='', SLUG='', WA='', TYPE=null, DUR=30, COLOR='#2D6A4F', PRO=false, FORCE_TYPE=null, CUR=null, ROLE='';
var sel={day:null, time:null}, showAll=false;

function initials(n){ var p=(''+(n||'')).trim().split(/\s+/); return (((p[0]||'')[0]||'')+((p[1]||'')[0]||'')).toUpperCase()||'·'; }
function durFrom(label){ var m=(''+(label||'')).match(/(\d+)\s*min/i); return m?parseInt(m[1],10):(/(\d+)\s*h/i.test(''+label)?60:30); }

var TEAM=false, CID='', TIDX=-1;
// Traemos la fila del coach/empleado. (El token de Google vive dentro de
// configuracion; el aislarlo se hace aparte — ver nota en el chat.)
// IMPORTANTE: se define ANTES del IIFE de abajo, porque ese IIFE llama a
// loadTeam()/loadCoach() que usan SAFE_SELECT de inmediato. Si se define después,
// vale `undefined` y la query sale como select=undefined → error 42703.
var SAFE_SELECT='id,nombre,email,foto_url,rol,configuracion';
var DISP=null;
var TAKEN={}; // { instanteMs: true } de las citas ya tomadas del coach (anti doble-booking)
function _slotTs(dayIdx, tstr){ var L=dayList(), d=L[dayIdx]; if(!d) return null; var hm=(''+tstr).split(':'); return new Date(d.d.getFullYear(),d.d.getMonth(),d.d.getDate(),parseInt(hm[0],10)||0,parseInt(hm[1],10)||0).getTime(); }
function _tzLabel(){ try{ var z=Intl.DateTimeFormat().resolvedOptions().timeZone; return z?(' ('+z+')'):''; }catch(e){ return ''; } }
function loadCitas(){ TAKEN={}; if(!CID) return; fetch(SB+'/rest/v1/citas?coach_id=eq.'+encodeURIComponent(CID)+'&estado=neq.cancelada&select=inicio',{ headers:{ apikey:KEY, Authorization:'Bearer '+KEY } }).then(function(r){ return r.ok?r.json():[]; }).then(function(rows){ var T={}; (rows||[]).forEach(function(c){ if(!c||!c.inicio) return; var t=new Date(c.inicio).getTime(); if(!isNaN(t)) T[t]=true; }); TAKEN=T; renderPicker(); }).catch(function(){}); }
function normDisp(d){
  var def={days:[1,2,3,4,5],from:'09:00',to:'18:00'};
  if(!d || typeof d!=='object') return def;
  var days=(Object.prototype.toString.call(d.days)==='[object Array]'&&d.days.length)?d.days.map(Number):def.days;
  return { days:days, from:(/^\d{1,2}:\d{2}$/.test(d.from||'')?d.from:def.from), to:(/^\d{1,2}:\d{2}$/.test(d.to||'')?d.to:def.to) };
}
function memPhoto(u){ var c=u.configuracion||{}; return u.foto_url||c.foto_url||c.foto_perfil||''; }
function roleLabel(u){ var c=u.configuracion||{}; if(c.titulo_profesional) return c.titulo_profesional; return (u.rol==='admin')?'Fundadora de Pathway':(u.rol==='empleado')?'Responsable comercial':'Equipo Pathway'; }

function applyCoachRow(u, t){
  CUR=u; ROLE=roleLabel(u);
  COACH=u.nombre||'Pathway'; FIRST=(''+COACH).split(' ')[0]; EMAIL=(u.email||'').trim();
  var cfg=u.configuracion||{};
  PHOTO=memPhoto(u); SLUG=cfg.slug||''; PRO=(cfg.plan==='pro'); CID=u.id||CID;
  WA=((cfg.whatsapp||cfg.telefono||'')+'').replace(/[^0-9]/g,'');
  DISP=normDisp(cfg.disponibilidad);
  var types=(Object.prototype.toString.call(cfg.event_types)==='[object Array]'&&cfg.event_types.length)?cfg.event_types
    :(TEAM?[{label:'Demo Pathway 15 min',color:'#2D6A4F',icon:'📅'}]:[{label:'Sesión 45 min',color:'#8C7B80'}]);
  // Si el link es de un tipo COMPARTIDO (varias personas atienden), usamos ese
  // tipo para todos (mismo nombre/color/duración), y cada persona con SU horario.
  if(FORCE_TYPE){ TYPE=FORCE_TYPE; TIDX=0; }
  else { TIDX=(t>=0&&t<types.length)?t:0; TYPE=types[TIDX]; }
  DUR=durFrom(TYPE.label); COLOR=TYPE.color||'#2D6A4F';
  sel={day:null,time:null}; showAll=false;
  renderPicker();
  loadCitas(); // trae los horarios ya tomados de este coach → se marcan ocupados
}
function _rowsOrErr(r){ if(r.ok) return r.json(); return r.text().then(function(t){ return {_err:true,status:r.status,msg:t}; }); }
function loadCoach(c,t){
  CID=c;
  fetch(SB+'/rest/v1/usuarios?id=eq.'+encodeURIComponent(c)+'&select='+SAFE_SELECT+'&limit=1',
    { headers:{ apikey:KEY, Authorization:'Bearer '+KEY } })
    .then(_rowsOrErr)
    .then(function(res){
      if(res&&res._err){ fail('No pudimos cargar la reserva (error '+res.status+'). '+esc((''+(res.msg||'')).slice(0,160))); return; }
      if(!res||!res.length){ fail('No encontramos a esta persona. Revisá el link.'); return; }
      var owner=res[0]; var ocfg=owner.configuracion||{};
      var otypes=(Object.prototype.toString.call(ocfg.event_types)==='[object Array]')?ocfg.event_types:[];
      var st=(t>=0&&t<otypes.length)?otypes[t]:null;
      var ppl=(st&&Object.prototype.toString.call(st.people)==='[object Array]')?st.people.filter(Boolean):[];
      // Tipo COMPARTIDO: si el tipo tiene varias personas, mostramos el selector
      // con todas ellas (mismo tipo para todas), cada una con su disponibilidad.
      if(ppl.length>1){ FORCE_TYPE=st; loadPeople(ppl, owner); return; }
      applyCoachRow(owner,t);
    })
    .catch(function(){ fail('No pudimos cargar la página de reservas. Reintentá en un momento.'); });
}
// Carga a las personas de un tipo compartido y arma el selector (como el team).
function loadPeople(ids, owner){
  TEAM=true;
  fetch(SB+'/rest/v1/usuarios?id=in.('+ids.map(encodeURIComponent).join(',')+')&select='+SAFE_SELECT,
    { headers:{ apikey:KEY, Authorization:'Bearer '+KEY } })
    .then(_rowsOrErr)
    .then(function(res){
      var rows=(Object.prototype.toString.call(res)==='[object Array]')?res:[];
      // Ordenar según el orden de `ids` (dueño primero).
      TEAM_MEMBERS=ids.map(function(id){ return rows.filter(function(r){return String(r.id)===String(id);})[0]; }).filter(Boolean);
      if(!TEAM_MEMBERS.length){ if(owner) applyCoachRow(owner,-1); return; }
      applyCoachRow(TEAM_MEMBERS[0],-1);
    })
    .catch(function(){ if(owner) applyCoachRow(owner,-1); });
}
var TEAM_MEMBERS=[];
function loadTeam(){
  fetch(SB+'/rest/v1/usuarios?rol=in.(admin,empleado)&activo=eq.true&select='+SAFE_SELECT+'&order=rol.asc',
    { headers:{ apikey:KEY, Authorization:'Bearer '+KEY } })
    .then(_rowsOrErr)
    .then(function(res){
      if(res&&res._err){ fail('No pudimos cargar el equipo (error '+res.status+'). '+esc((''+(res.msg||'')).slice(0,120))); return; }
      TEAM_MEMBERS=(Object.prototype.toString.call(res)==='[object Array]')?res:[];
      if(!TEAM_MEMBERS.length){ fail('No hay nadie disponible para reservar todavía.'); return; }
      // Sin pantalla previa: cargamos directo a la primera persona y el selector
      // queda ARRIBA para cambiar sin volver atrás.
      applyCoachRow(TEAM_MEMBERS[0],-1);
    })
    .catch(function(){ fail('No pudimos cargar el equipo. Reintentá en un momento.'); });
}
// Selector de persona (arriba), solo en modo equipo con más de uno.
function teamBar(){
  if(!TEAM || TEAM_MEMBERS.length<2) return '';
  var pills=TEAM_MEMBERS.map(function(u,i){
    var on=(String(u.id)===String(CID)); var ph=memPhoto(u);
    var av=ph?"<img src='"+esc(ph)+"' alt='' style='width:26px;height:26px;border-radius:50%;object-fit:cover'>"
      :"<span style='width:26px;height:26px;border-radius:50%;background:#2D6A4F;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:11px'>"+esc(initials(u.nombre))+"</span>";
    return "<button class='who-pill"+(on?' on':'')+"' data-pick='"+i+"'>"+av+"<span>"+esc((''+(u.nombre||'')).split(' ')[0])+"</span></button>";
  }).join('');
  return "<div class='lbl' style='margin-top:2px'>¿Con quién?</div><div class='who-row'>"+pills+"</div>";
}

function fail(t){
  $('card').className='card';
  $('card').innerHTML="<div class='center'><div class='ok-ico' style='background:rgba(192,117,110,.14)'>😕</div>"+
    "<h1>Ups</h1><p class='sub'>"+esc(t)+"</p></div>";
}

function _hm(s){ var p=(''+s).split(':'); return parseInt(p[0],10)*60+parseInt(p[1]||'0',10); }
function dayList(){
  var out=[], now=new Date(); now.setHours(0,0,0,0);
  var disp=DISP||{days:[1,2,3,4,5]}; var days=(disp.days&&disp.days.length)?disp.days:[1,2,3,4,5];
  var DN=['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];
  for(var i=0;i<28;i++){ var d=new Date(now.getTime()+i*86400000); if(days.indexOf(d.getDay())<0) continue; out.push({d:d, dn:(i===0?'HOY':DN[d.getDay()]), dd:d.getDate()}); if(out.length>=10) break; }
  return out;
}
function slotList(){
  var out=[], disp=DISP||{from:'09:00',to:'18:00'};
  var f=_hm(disp.from||'09:00'), t=_hm(disp.to||'18:00'), step=Math.max(DUR,15);
  // "Hasta 00:00" (medianoche) o una franja que cruza la medianoche: la hora de
  // fin es menor o igual que la de inicio → tratarla como fin del día (+24 h),
  // si no el bucle no genera ningún horario y la página sale vacía.
  if(t<=f) t+=1440;
  for(var m=f; m+DUR<=t; m+=step){ var mm=m%1440; out.push(('0'+Math.floor(mm/60)).slice(-2)+':'+('0'+(mm%60)).slice(-2)); }
  return out;
}
function avHtml(){
  if(PHOTO) return "<img class='av' src='"+esc(PHOTO)+"' alt='"+esc(COACH)+"' onerror=\"this.outerHTML=&quot;<div class='av'>"+esc(initials(COACH))+"</div>&quot;\">";
  return "<div class='av'>"+esc(initials(COACH))+"</div>";
}
function renderPicker(){
  var days=dayList();
  var daysHtml=days.map(function(x,i){ var on=(sel.day===i); return "<div class='day"+(on?' on':'')+"' data-day='"+i+"'><div class='dn'>"+x.dn+"</div><div class='dd'>"+x.dd+"</div></div>"; }).join('');
  var all=slotList(), VIS=8;
  var shown=showAll?all:all.slice(0,VIS);
  var slotsHtml=shown.map(function(s){ var on=(sel.time===s); var ts=(sel.day!=null)?_slotTs(sel.day,s):null; if(ts!=null&&TAKEN[ts]) return "<button class='slot' disabled title='Ya reservado' style='opacity:.38;text-decoration:line-through;cursor:not-allowed'>"+s+"</button>"; return "<button class='slot"+(on?' on':'')+"' data-slot='"+s+"'>"+s+"</button>"; }).join('');
  if(!showAll && all.length>VIS) slotsHtml+="<button class='more' data-more='1'>Ver más horarios ("+(all.length-VIS)+") ▾</button>";
  else if(showAll && all.length>VIS) slotsHtml+="<button class='more' data-more='0'>Ver menos ▴</button>";
  var can=(sel.day!=null&&sel.time);
  var waNum=WA||'34623816019';
  var waHref='https://wa.me/'+waNum+'?text='+encodeURIComponent('Hola '+FIRST+', tengo una duda antes de reservar una sesión.');
  var emptyDays=!days.length;
  var isDemo=!!(FORCE_TYPE||(TEAM&&TEAM_MEMBERS.length>1));

  // ── Izquierda: equipo ──
  var people=(TEAM&&TEAM_MEMBERS.length)?TEAM_MEMBERS:(CUR?[CUR]:[]);
  var multi=people.length>1;
  var peopleCards=people.map(function(m){
    var on=(String(m.id)===String(CID)); var ph=memPhoto(m);
    var av=ph?"<img src='"+esc(ph)+"' alt=''>":"<span class='pini'>"+esc(initials(m.nombre))+"</span>";
    return "<button class='pcard"+(on?' on':'')+"' data-pid='"+esc(m.id)+"'>"+av+
      "<div style='min-width:0'><div class='pn'>"+esc(m.nombre||'Pathway')+"</div><div class='pr'>"+esc(roleLabel(m))+"</div></div>"+
      "<span class='pchk'>"+(on?"✓":"")+"</span></button>";
  }).join('');
  var leftCol="<div class='bk-people'>"+
    "<div class='t'>"+(multi?"Elegí con quién querés tu demo":"Reservá tu espacio")+"</div>"+
    "<div class='s'>"+(multi?"Nuestro equipo está para ayudarte.":"Elegí el día y la hora que te queden bien.")+"</div>"+
    peopleCards+"</div>";

  // ── Centro: reserva ──
  var pick = emptyDays
    ? "<div class='lbl'>Disponibilidad</div><div style='font-size:13px;color:var(--soft);padding:6px 0 10px'>"+esc(FIRST)+" todavía no cargó días disponibles. Probá con otra persona o escribile.</div>"
    : "<div class='lbl'>Elegí el día</div><div class='days' id='days'>"+daysHtml+"</div>"+
      "<div class='lbl'>Elegí el horario</div><div class='slots' id='slots'>"+slotsHtml+"</div>"+
      "<div style='font-size:11px;color:#7A8A80;margin-top:7px'>🕐 Horarios en tu zona horaria"+esc(_tzLabel())+"</div>"+
      "<div class='lbl'>Tus datos</div>"+
      "<div class='field'><input id='f-name' placeholder='Nombre y apellido'></div>"+
      "<div class='field'><input id='f-email' type='email' placeholder='Tu email'></div>"+
      "<div class='field'><input id='f-msg' placeholder='¿De qué querés hablar? (opcional)'></div>"+
      "<button class='btn btn-primary' id='confirm'"+(can?'':' disabled')+">Continuar →</button>"+
      "<div class='msg' id='msg'></div>";
  var centerCol="<div class='bk-main'>"+
    "<div class='bk-steps'><b>1 · Elegí</b><span>·</span><span>2 · Tus datos</span><span>·</span><span>3 · Confirmar</span></div>"+
    "<h2>Reservá tu "+(isDemo?"demo":"sesión")+"</h2>"+
    "<div class='sub2'>Conocé Pathway y descubrí cómo podemos ayudarte.</div>"+
    pick+"</div>";

  // ── Derecha: resumen ──
  var _hasWhen=(sel.day!=null&&sel.time);
  var sumWhen=_hasWhen?(days[sel.day].d.toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'})+' · '+sel.time+' h'):"Elegí día y hora";
  var sumAv=PHOTO?"<img class='bk-sum-av' src='"+esc(PHOTO)+"' alt=''>":"<span class='bk-sum-av'>"+esc(initials(COACH))+"</span>";
  var rightCol="<div class='bk-side'>"+
    "<div class='bk-sum-t'>Tu reserva</div>"+
    "<div class='bk-sum-row'>"+sumAv+"<div style='min-width:0'><div style='font-weight:700'>Con "+esc(FIRST)+"</div><div style='font-size:11px;color:var(--muted)'>"+esc(ROLE)+"</div></div></div>"+
    "<div class='bk-sum-row'><span class='ic'>📅</span><span style='"+(_hasWhen?"text-transform:capitalize;":"color:var(--muted);")+"'>"+esc(sumWhen)+"</span></div>"+
    "<div class='bk-sum-row'><span class='ic'>🗓️</span><span>"+esc(TYPE.label||'Sesión')+"</span></div>"+
    "<div class='learn'><h5>¿Qué vas a conocer?</h5><ul>"+
      "<li><span class='ck'>✓</span> Cómo funciona Pathway</li>"+
      "<li><span class='ck'>✓</span> Casos de éxito reales</li>"+
      "<li><span class='ck'>✓</span> Resolución de tus dudas</li>"+
    "</ul></div>"+
    "<div class='wa-line'><a href='"+esc(waHref)+"' target='_blank' rel='noopener' title='WhatsApp'>💬</a><span>¿Tenés dudas? Escribinos por WhatsApp.</span></div>"+
  "</div>";

  $('card').className='card book-card';
  $('card').innerHTML="<div class='book'>"+leftCol+centerCol+rightCol+"</div>";

  var bp=document.querySelector('.bk-people');
  if(bp) bp.addEventListener('click',function(e){ var p=e.target.closest('[data-pid]'); if(!p) return; var id=p.getAttribute('data-pid'); var m=people.filter(function(x){return String(x.id)===String(id);})[0]; if(m) applyCoachRow(m,-1); });
  if($('days')) $('days').addEventListener('click',function(e){ var d=e.target.closest('[data-day]'); if(!d) return; sel.day=parseInt(d.getAttribute('data-day'),10); renderPicker(); });
  if($('slots')) $('slots').addEventListener('click',function(e){
    var mo=e.target.closest('[data-more]'); if(mo){ showAll=(mo.getAttribute('data-more')==='1'); renderPicker(); return; }
    var s=e.target.closest('[data-slot]'); if(!s) return; sel.time=s.getAttribute('data-slot'); renderPicker();
  });
  if($('confirm')) $('confirm').addEventListener('click', confirmar);
}

// UTC (con Z): así el evento de Google del coach cae en el MISMO instante que se
// guarda en `citas` (start.toISOString()). Sin la Z, Google lo interpretaba en la
// zona del coach y el evento quedaba corrido respecto de la reserva.
function fmt(x){ function p(n){return('0'+n).slice(-2);} return x.getUTCFullYear()+p(x.getUTCMonth()+1)+p(x.getUTCDate())+'T'+p(x.getUTCHours())+p(x.getUTCMinutes())+'00Z'; }
function fechaLinda(x){ return x.toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'})+' · '+('0'+x.getHours()).slice(-2)+':'+('0'+x.getMinutes()).slice(-2)+' h'; }

function confirmar(){
  var name=($('f-name').value||'').trim(), email=($('f-email').value||'').trim();
  var msg=($('f-msg')&&$('f-msg').value||'').trim();
  if(!name){ $('msg').textContent='Escribí tu nombre.'; return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ $('msg').textContent='Escribí un email válido.'; return; }
  if(sel.day==null||!sel.time){ $('msg').textContent='Elegí día y hora.'; return; }
  var days=dayList(), d=days[sel.day].d, hm=sel.time.split(':');
  var start=new Date(d.getFullYear(),d.getMonth(),d.getDate(),parseInt(hm[0],10),parseInt(hm[1],10));
  var end=new Date(start.getTime()+DUR*60000);
  var tlabel=TYPE.label||'Sesión', fechaTxt=fechaLinda(start);
  var title=tlabel+' · '+name+' con '+FIRST;
  var gurl='https://calendar.google.com/calendar/u/0/r/eventedit?text='+encodeURIComponent(title)+
    '&dates='+fmt(start)+'/'+fmt(end)+'&details='+encodeURIComponent('Reserva desde Pathway.\nNombre: '+name+'\nEmail: '+email+(msg?('\nComentario: '+msg):''));
  if(EMAIL) gurl+='&add='+encodeURIComponent(EMAIL);

  var _cid=(CID||qp('c')), _iso=start.toISOString();
  var _commit=function(){
    // 1) Registro best-effort en la base (para que el coach lo vea aunque no use Google).
    try{
      fetch(SB+'/rest/v1/citas',{ method:'POST', headers:{ apikey:KEY, Authorization:'Bearer '+KEY, 'content-type':'application/json', Prefer:'return=minimal' },
        body:JSON.stringify({ coach_id:_cid, nombre:name, email:email, tipo:tlabel, inicio:_iso }) }).catch(function(){});
    }catch(e){}
    TAKEN[start.getTime()]=true;
    // 2) Emails de confirmación (Brevo) — al que reserva y al coach.
    sendEmails(name, email, tlabel, fechaTxt, gurl);
    // 3) Google Calendar para que quede en el calendario del coach.
    var w=window.open(gurl,'_blank'); if(!w){ location.href=gurl; }
    ok(name, start, gurl);
  };
  // Re-chequeo anti doble-booking JUSTO antes de confirmar: si el hueco se ocupó
  // recién (otra persona reservó mientras), no confirmamos y pedimos elegir otro.
  $('msg').textContent='Confirmando…';
  fetch(SB+'/rest/v1/citas?coach_id=eq.'+encodeURIComponent(_cid)+'&inicio=eq.'+encodeURIComponent(_iso)+'&estado=neq.cancelada&select=id',
    { headers:{ apikey:KEY, Authorization:'Bearer '+KEY } })
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(ex){
      if(ex && ex.length){ $('msg').textContent='Ese horario se acaba de ocupar 😕 Elegí otro, por favor.'; TAKEN[start.getTime()]=true; sel.time=null; renderPicker(); return; }
      _commit();
    })
    .catch(function(){ _commit(); }); // si no pudimos verificar, seguimos best-effort
}

  var brand=(PRO?COACH:'Pathway');
  // Al cliente
  var htmlCli='<div style="background:#FAFDF9;padding:26px 16px;font-family:Inter,-apple-system,Segoe UI,Arial,sans-serif;color:#1B2E26">'+
    '<div style="max-width:480px;margin:0 auto;background:#fff;border-radius:16px;overflow:hidden;border:1px solid #E4EFE4">'+
    '<div style="background:linear-gradient(160deg,#2D6A4F,#1B4332);padding:24px;text-align:center;color:#fff">'+
      '<div style="font-size:13px;letter-spacing:1px;text-transform:uppercase;opacity:.85">Pathway</div>'+
      '<div style="font-family:Georgia,serif;font-size:22px;margin-top:6px">¡Reserva confirmada! 🎉</div></div>'+
    '<div style="padding:24px">'+
      '<p style="font-size:15px;margin:0 0 14px">Hola '+esc(name)+',</p>'+
      '<p style="font-size:14px;line-height:1.6;color:#42504A;margin:0 0 18px">Reservaste tu <strong>'+esc(tlabel)+'</strong> con '+esc(FIRST)+'. Te esperamos:</p>'+
      '<div style="background:#F0F5EF;border-radius:12px;padding:16px 18px;margin-bottom:18px">'+
        '<div style="font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:#7A8A80;font-weight:700">Cuándo</div>'+
        '<div style="font-size:16px;font-weight:700;color:#1B4332;text-transform:capitalize">'+esc(fechaTxt)+'</div></div>'+
      '<a href="'+esc(gurl)+'" style="display:inline-block;background:#1B4332;color:#fff;text-decoration:none;padding:12px 22px;border-radius:10px;font-weight:700;font-size:14px">Agregar a mi Google Calendar</a>'+
      '<p style="font-size:12.5px;color:#8A968E;margin-top:18px;line-height:1.5">Si necesitás reprogramar, respondé este email y coordinamos.</p>'+
    '</div></div></div>';
  postEmail({ to:email, to_name:name, subject:'✅ Reserva confirmada · '+tlabel+' con '+FIRST, html:htmlCli, reply_to:(EMAIL||'hi@pathwaycareercoach.com'), signature:'none' });
  // Al coach
  if(EMAIL){
    var htmlCoach='<div style="font-family:Inter,-apple-system,Segoe UI,Arial,sans-serif;color:#1B2E26">'+
      '<h2 style="font-family:Georgia,serif;color:#1B4332">Nueva reserva 📅</h2>'+
      '<p><strong>'+esc(name)+'</strong> reservó una <strong>'+esc(tlabel)+'</strong>.</p>'+
      '<p style="background:#F0F5EF;border-radius:10px;padding:12px 14px;text-transform:capitalize"><strong>'+esc(fechaTxt)+'</strong></p>'+
      '<p style="font-size:14px">Contacto: <a href="mailto:'+esc(email)+'">'+esc(email)+'</a></p>'+
      '<p style="font-size:13px;color:#5A6A60">La sesión también intentó agregarse a tu Google Calendar. Revisá tu agenda en el panel.</p>';
    postEmail({ to:EMAIL, to_name:COACH, subject:'📅 Nueva reserva de '+name, html:htmlCoach, reply_to:email, signature:'pathway' });
  }
}
function postEmail(payload){
  try{
    fetch(SB+'/functions/v1/send-email',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) }).catch(function(){});
  }catch(e){}
}

function ok(name, start, gurl){
  $('card').className='card';
  $('card').innerHTML=
    "<div class='center'><div class='ok-ico'>🎉</div>"+
    "<h1>¡Reserva enviada!</h1>"+
    "<p class='sub'>Elegiste <strong style='text-transform:capitalize'>"+esc(fechaLinda(start))+"</strong>.<br>Te mandamos un email de confirmación a tu correo.</p>"+
    "<a class='btn btn-primary' href='"+esc(gurl)+"' target='_blank' rel='noopener' style='margin-top:20px'>Agregar a Google Calendar</a>"+
    "<p class='hint'>¿No se abrió Google? Ya te llega la confirmación por email"+(EMAIL?(", o escribile a "+esc(FIRST)+" a <strong>"+esc(EMAIL)+"</strong>"):"")+".</p></div>";
}

// Arranque (al FINAL, cuando SAFE_SELECT y todas las funciones ya están definidas).
// ?c=<id> → reservar directo con esa persona. ?team=1 → elegir con quién y reservar.
(function(){
  var c=qp('c'); var t=parseInt(qp('t'),10); if(isNaN(t)) t=-1;
  var team=qp('team');
  if(c){ loadCoach(c,t); return; }
  if(team){ TEAM=true; loadTeam(); return; }
  fail('Este link no es válido. Pedile que te compartan el link de reservas de nuevo.');
})();
