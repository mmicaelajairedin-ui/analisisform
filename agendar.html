<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservá tu sesión · Pathway</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bosque:#1B4332; --bosque2:#2D6A4F; --sendero:#52B788; --carbon:#1B2E26;
    --niebla:#FAFDF9; --niebla2:#F0F5EF; --soft:#5A6A60; --muted:#9AA8A0;
    --borde:rgba(45,106,79,.14); --serif:'Fraunces',Georgia,serif; --sans:'Inter',-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--sans);background:
    radial-gradient(120% 60% at 50% 0%, #EEF6EE 0%, var(--niebla) 55%) no-repeat, var(--niebla);
    color:var(--carbon);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:26px 16px 70px;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:470px;width:100%;}
  .brand{display:flex;align-items:center;gap:7px;justify-content:center;font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--bosque2);margin-bottom:18px;}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--sendero);box-shadow:0 0 0 4px rgba(82,183,136,.16);}
  .card{background:#fff;border:1px solid var(--borde);border-radius:22px;box-shadow:0 14px 46px rgba(20,55,38,.09);padding:0 0 28px;overflow:hidden;}
  .hd{background:linear-gradient(160deg,#2D6A4F 0%,#1B4332 100%);padding:30px 26px 26px;text-align:center;color:#fff;position:relative;}
  .hd .av{width:82px;height:82px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.9);box-shadow:0 6px 20px rgba(0,0,0,.18);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;background:#3C7A5C;color:#fff;font-family:var(--serif);}
  .hd h1{font-family:var(--serif);font-size:25px;font-weight:500;letter-spacing:-.5px;line-height:1.15;}
  .hd .type-pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);backdrop-filter:blur(4px);border-radius:100px;padding:7px 15px;font-size:13px;font-weight:600;margin-top:12px;}
  .hd .type-pill .cdot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.22);}
  .body{padding:24px 26px 0;}
  .lbl{font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);margin:20px 0 9px;display:flex;align-items:center;gap:7px;}
  .lbl:first-child{margin-top:4px;}
  .days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin;}
  .day{flex-shrink:0;min-width:56px;border:1.5px solid var(--borde);border-radius:14px;background:#fff;padding:9px 6px;text-align:center;cursor:pointer;transition:all .13s;}
  .day:hover{border-color:var(--sendero);transform:translateY(-1px);}
  .day.on{background:var(--bosque);border-color:var(--bosque);color:#fff;box-shadow:0 6px 16px rgba(27,67,50,.22);}
  .day .dn{font-size:10px;text-transform:uppercase;letter-spacing:.4px;opacity:.65;font-weight:600;}
  .day .dd{font-size:18px;font-weight:700;line-height:1.35;}
  .slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .slot{border:1.5px solid var(--borde);border-radius:11px;background:#fff;padding:10px 4px;font-size:13.5px;font-weight:600;cursor:pointer;transition:all .13s;color:var(--carbon);font-family:inherit;}
  .slot:hover{border-color:var(--sendero);}
  .slot.on{background:var(--bosque);border-color:var(--bosque);color:#fff;box-shadow:0 6px 16px rgba(27,67,50,.2);}
  .more{grid-column:1/-1;text-align:center;background:none;border:none;color:var(--bosque2);font-size:12.5px;font-weight:700;cursor:pointer;padding:8px;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:5px;}
  .more:hover{text-decoration:underline;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:var(--carbon);}
  .field input{width:100%;padding:12px 14px;border:1.5px solid var(--borde);border-radius:12px;font-size:14px;font-family:inherit;outline:none;transition:border-color .13s;background:var(--niebla);}
  .field input:focus{border-color:var(--sendero);background:#fff;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:14px 18px;border-radius:13px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;border:none;text-decoration:none;transition:all .16s;}
  .btn-primary{background:var(--bosque);color:#fff;margin-top:8px;box-shadow:0 8px 22px rgba(27,67,50,.22);}
  .btn-primary:hover{background:#153726;transform:translateY(-1px);}
  .btn-primary:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none;}
  .msg{font-size:13px;margin-top:10px;text-align:center;color:#C0756E;min-height:16px;font-weight:600;}
  .help{margin:22px 26px 0;padding:16px 18px;border:1px dashed var(--borde);border-radius:16px;background:var(--niebla2);}
  .help h4{font-size:13.5px;font-weight:700;margin-bottom:4px;color:var(--carbon);}
  .help p{font-size:12.5px;color:var(--soft);line-height:1.5;margin-bottom:11px;}
  .help-btns{display:flex;gap:9px;flex-wrap:wrap;}
  .help-btns a{flex:1;min-width:130px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 12px;border-radius:11px;font-size:13px;font-weight:600;text-decoration:none;transition:all .13s;}
  .hb-ghost{background:#fff;border:1.5px solid var(--borde);color:var(--carbon);}
  .hb-ghost:hover{border-color:var(--sendero);}
  .hb-green{background:var(--bosque2);color:#fff;}
  .hb-green:hover{background:var(--bosque);}
  .foot{text-align:center;font-size:11px;color:var(--muted);margin-top:22px;}
  .ok-ico{width:64px;height:64px;border-radius:50%;background:rgba(82,183,136,.16);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 16px;}
  .spin{width:28px;height:28px;border:3px solid rgba(45,106,79,.2);border-top-color:var(--bosque2);border-radius:50%;animation:s .8s linear infinite;margin:40px auto;}
  @keyframes s{to{transform:rotate(360deg)}}
  .center{text-align:center;padding:34px 26px;}
  .center h1{font-family:var(--serif);font-size:24px;font-weight:500;margin-bottom:8px;}
  .center .sub{font-size:13.5px;color:var(--soft);line-height:1.6;}
  .center .hint{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="dot"></span> Pathway</div>
  <div class="card" id="card"><div class="spin"></div></div>
  <div class="foot">Reservas con Pathway · pathwaycareercoach.com</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
var SB='https://api.pathwaycareercoach.com';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkeG5yc25qZHZ0cWh4dW54bndqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNDk5MzksImV4cCI6MjA5MDcyNTkzOX0.t82X1x-PDgFDGYhKC7YXoRKhga9I8Hjet60QUYvtZLU';
function $(id){ return document.getElementById(id); }
function esc(s){ return (''+(s==null?'':s)).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function qp(k){ try{ return new URLSearchParams(location.search).get(k); }catch(e){ return null; } }

var COACH='', FIRST='', EMAIL='', PHOTO='', SLUG='', TYPE=null, DUR=30, COLOR='#2D6A4F', PRO=false;
var sel={day:null, time:null}, showAll=false;

function initials(n){ var p=(''+(n||'')).trim().split(/\s+/); return (((p[0]||'')[0]||'')+((p[1]||'')[0]||'')).toUpperCase()||'·'; }
function durFrom(label){ var m=(''+(label||'')).match(/(\d+)\s*min/i); return m?parseInt(m[1],10):(/(\d+)\s*h/i.test(''+label)?60:30); }

(function(){
  var c=qp('c'); if(!c){ fail('Este link no es válido. Pedile al coach que te comparta el link de reservas de nuevo.'); return; }
  var t=parseInt(qp('t'),10); if(isNaN(t)) t=-1;
  fetch(SB+'/rest/v1/usuarios?id=eq.'+encodeURIComponent(c)+'&select=nombre,email,foto_url,configuracion&limit=1',
    { headers:{ apikey:KEY, Authorization:'Bearer '+KEY } })
    .then(function(r){ return r.ok?r.json():[]; })
    .then(function(rows){
      if(!rows || !rows.length){ fail('No encontramos a este coach. Revisá el link.'); return; }
      var u=rows[0]; COACH=u.nombre||'Tu coach'; FIRST=(''+COACH).split(' ')[0]; EMAIL=(u.email||'').trim();
      var cfg=u.configuracion||{};
      PHOTO=u.foto_url||cfg.foto_url||cfg.foto_perfil||''; SLUG=cfg.slug||''; PRO=!!(cfg.plan==='pro'||cfg.pro);
      var types=(Object.prototype.toString.call(cfg.event_types)==='[object Array]'&&cfg.event_types.length)?cfg.event_types:[{label:'Sesión 45 min',color:'#8C7B80'}];
      TYPE=(t>=0&&t<types.length)?types[t]:types[0];
      DUR=durFrom(TYPE.label); COLOR=TYPE.color||'#2D6A4F';
      renderPicker();
    })
    .catch(function(){ fail('No pudimos cargar la página de reservas. Reintentá en un momento.'); });
})();

function fail(t){
  $('card').innerHTML="<div class='center'><div class='ok-ico' style='background:rgba(192,117,110,.14)'>😕</div>"+
    "<h1>Ups</h1><p class='sub'>"+esc(t)+"</p></div>";
}

function dayList(){
  var out=[], now=new Date(); now.setHours(0,0,0,0);
  var DN=['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];
  for(var i=0;i<21;i++){ var d=new Date(now.getTime()+i*86400000); if(d.getDay()===0||d.getDay()===6) continue; out.push({d:d, dn:(i===0?'HOY':DN[d.getDay()]), dd:d.getDate()}); if(out.length>=10) break; }
  return out;
}
function slotList(){
  var out=[], step=Math.max(DUR,30);
  for(var m=9*60; m+DUR<=18*60; m+=step){ out.push(('0'+Math.floor(m/60)).slice(-2)+':'+('0'+(m%60)).slice(-2)); }
  return out;
}
function avHtml(){
  if(PHOTO) return "<img class='av' src='"+esc(PHOTO)+"' alt='"+esc(COACH)+"' onerror=\"this.outerHTML=&quot;<div class='av'>"+esc(initials(COACH))+"</div>&quot;\">";
  return "<div class='av'>"+esc(initials(COACH))+"</div>";
}
function renderPicker(){
  var days=dayList();
  var daysHtml=days.map(function(x,i){ var on=(sel.day===i); return "<div class='day"+(on?' on':'')+"' data-day='"+i+"'><div class='dn'>"+x.dn+"</div><div class='dd'>"+x.dd+"</div></div>"; }).join('');
  var all=slotList(), VIS=8;
  var shown=showAll?all:all.slice(0,VIS);
  var slotsHtml=shown.map(function(s){ var on=(sel.time===s); return "<button class='slot"+(on?' on':'')+"' data-slot='"+s+"'>"+s+"</button>"; }).join('');
  if(!showAll && all.length>VIS) slotsHtml+="<button class='more' data-more='1'>Ver más horarios ("+(all.length-VIS)+") ▾</button>";
  else if(showAll && all.length>VIS) slotsHtml+="<button class='more' data-more='0'>Ver menos ▴</button>";
  var can=(sel.day!=null&&sel.time);
  var explore=SLUG?('https://pathwaycareercoach.com/coach/'+encodeURIComponent(SLUG)):'https://pathwaycareercoach.com';
  var mailHref='mailto:'+encodeURIComponent(EMAIL||'hi@pathwaycareercoach.com')+'?subject='+encodeURIComponent('Consulta antes de reservar')+'&body='+encodeURIComponent('Hola '+FIRST+', tengo una duda antes de reservar: ');
  $('card').innerHTML=
    "<div class='hd'>"+avHtml()+
      "<h1>Reservá con "+esc(FIRST)+"</h1>"+
      "<div class='type-pill'><span class='cdot' style='background:"+COLOR+"'></span>"+esc(TYPE.label||'Sesión')+"</div></div>"+
    "<div class='body'>"+
      "<div class='lbl'>📅 Elegí el día</div><div class='days' id='days'>"+daysHtml+"</div>"+
      "<div class='lbl'>🕑 Elegí la hora</div><div class='slots' id='slots'>"+slotsHtml+"</div>"+
      "<div class='lbl'>Tus datos</div>"+
      "<div class='field'><label>Tu nombre</label><input id='f-name' placeholder='Nombre y apellido'></div>"+
      "<div class='field'><label>Tu email</label><input id='f-email' type='email' placeholder='vos@email.com'></div>"+
      "<button class='btn btn-primary' id='confirm'"+(can?'':' disabled')+">Reservar mi sesión</button>"+
      "<div class='msg' id='msg'></div>"+
    "</div>"+
    "<div class='help'>"+
      "<h4>¿Tenés dudas o querés ver más?</h4>"+
      "<p>Escribile a "+esc(FIRST)+" antes de reservar, o conocé todo lo que Pathway ofrece.</p>"+
      "<div class='help-btns'>"+
        "<a class='hb-ghost' href='"+esc(mailHref)+"'>💬 Tengo una duda</a>"+
        "<a class='hb-green' href='"+esc(explore)+"' target='_blank' rel='noopener'>✨ Explorar Pathway</a>"+
      "</div>"+
    "</div>";
  $('days').addEventListener('click',function(e){ var d=e.target.closest('[data-day]'); if(!d) return; sel.day=parseInt(d.getAttribute('data-day'),10); renderPicker(); });
  $('slots').addEventListener('click',function(e){
    var mo=e.target.closest('[data-more]'); if(mo){ showAll=(mo.getAttribute('data-more')==='1'); renderPicker(); return; }
    var s=e.target.closest('[data-slot]'); if(!s) return; sel.time=s.getAttribute('data-slot'); renderPicker();
  });
  $('confirm').addEventListener('click', confirmar);
}

function fmt(x){ return x.getFullYear()+('0'+(x.getMonth()+1)).slice(-2)+('0'+x.getDate()).slice(-2)+'T'+('0'+x.getHours()).slice(-2)+('0'+x.getMinutes()).slice(-2)+'00'; }
function fechaLinda(x){ return x.toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'})+' · '+('0'+x.getHours()).slice(-2)+':'+('0'+x.getMinutes()).slice(-2)+' h'; }

function confirmar(){
  var name=($('f-name').value||'').trim(), email=($('f-email').value||'').trim();
  if(!name){ $('msg').textContent='Escribí tu nombre.'; return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ $('msg').textContent='Escribí un email válido.'; return; }
  if(sel.day==null||!sel.time){ $('msg').textContent='Elegí día y hora.'; return; }
  var days=dayList(), d=days[sel.day].d, hm=sel.time.split(':');
  var start=new Date(d.getFullYear(),d.getMonth(),d.getDate(),parseInt(hm[0],10),parseInt(hm[1],10));
  var end=new Date(start.getTime()+DUR*60000);
  var tlabel=TYPE.label||'Sesión', fechaTxt=fechaLinda(start);
  var title=tlabel+' · '+name+' con '+FIRST;
  var gurl='https://calendar.google.com/calendar/u/0/r/eventedit?text='+encodeURIComponent(title)+
    '&dates='+fmt(start)+'/'+fmt(end)+'&details='+encodeURIComponent('Reserva desde Pathway.\nNombre: '+name+'\nEmail: '+email);
  if(EMAIL) gurl+='&add='+encodeURIComponent(EMAIL);

  // 1) Registro best-effort en la base (para que el coach lo vea aunque no use Google).
  try{
    fetch(SB+'/rest/v1/citas',{ method:'POST', headers:{ apikey:KEY, Authorization:'Bearer '+KEY, 'content-type':'application/json', Prefer:'return=minimal' },
      body:JSON.stringify({ coach_id:qp('c'), nombre:name, email:email, tipo:tlabel, inicio:start.toISOString() }) }).catch(function(){});
  }catch(e){}

  // 2) Emails de confirmación (Brevo) — al que reserva y al coach.
  sendEmails(name, email, tlabel, fechaTxt, gurl);

  // 3) Google Calendar para que quede en el calendario del coach.
  var w=window.open(gurl,'_blank'); if(!w){ location.href=gurl; }
  ok(name, start, gurl);
}

function sendEmails(name, email, tlabel, fechaTxt, gurl){
  var brand=(PRO?COACH:'Pathway');
  // Al cliente
  var htmlCli='<div style="background:#FAFDF9;padding:26px 16px;font-family:Inter,-apple-system,Segoe UI,Arial,sans-serif;color:#1B2E26">'+
    '<div style="max-width:480px;margin:0 auto;background:#fff;border-radius:16px;overflow:hidden;border:1px solid #E4EFE4">'+
    '<div style="background:linear-gradient(160deg,#2D6A4F,#1B4332);padding:24px;text-align:center;color:#fff">'+
      '<div style="font-size:13px;letter-spacing:1px;text-transform:uppercase;opacity:.85">Pathway</div>'+
      '<div style="font-family:Georgia,serif;font-size:22px;margin-top:6px">¡Reserva confirmada! 🎉</div></div>'+
    '<div style="padding:24px">'+
      '<p style="font-size:15px;margin:0 0 14px">Hola '+esc(name)+',</p>'+
      '<p style="font-size:14px;line-height:1.6;color:#42504A;margin:0 0 18px">Reservaste tu <strong>'+esc(tlabel)+'</strong> con '+esc(FIRST)+'. Te esperamos:</p>'+
      '<div style="background:#F0F5EF;border-radius:12px;padding:16px 18px;margin-bottom:18px">'+
        '<div style="font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:#7A8A80;font-weight:700">Cuándo</div>'+
        '<div style="font-size:16px;font-weight:700;color:#1B4332;text-transform:capitalize">'+esc(fechaTxt)+'</div></div>'+
      '<a href="'+esc(gurl)+'" style="display:inline-block;background:#1B4332;color:#fff;text-decoration:none;padding:12px 22px;border-radius:10px;font-weight:700;font-size:14px">Agregar a mi Google Calendar</a>'+
      '<p style="font-size:12.5px;color:#8A968E;margin-top:18px;line-height:1.5">Si necesitás reprogramar, respondé este email y coordinamos.</p>'+
    '</div></div></div>';
  postEmail({ to:email, to_name:name, subject:'✅ Reserva confirmada · '+tlabel+' con '+FIRST, html:htmlCli, reply_to:(EMAIL||'hi@pathwaycareercoach.com'), signature:'none' });
  // Al coach
  if(EMAIL){
    var htmlCoach='<div style="font-family:Inter,-apple-system,Segoe UI,Arial,sans-serif;color:#1B2E26">'+
      '<h2 style="font-family:Georgia,serif;color:#1B4332">Nueva reserva 📅</h2>'+
      '<p><strong>'+esc(name)+'</strong> reservó una <strong>'+esc(tlabel)+'</strong>.</p>'+
      '<p style="background:#F0F5EF;border-radius:10px;padding:12px 14px;text-transform:capitalize"><strong>'+esc(fechaTxt)+'</strong></p>'+
      '<p style="font-size:14px">Contacto: <a href="mailto:'+esc(email)+'">'+esc(email)+'</a></p>'+
      '<p style="font-size:13px;color:#5A6A60">La sesión también intentó agregarse a tu Google Calendar. Revisá tu agenda en el panel.</p>';
    postEmail({ to:EMAIL, to_name:COACH, subject:'📅 Nueva reserva de '+name, html:htmlCoach, reply_to:email, signature:'pathway' });
  }
}
function postEmail(payload){
  try{
    fetch(SB+'/functions/v1/send-email',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) }).catch(function(){});
  }catch(e){}
}

function ok(name, start, gurl){
  $('card').innerHTML=
    "<div class='center'><div class='ok-ico'>🎉</div>"+
    "<h1>¡Reserva enviada!</h1>"+
    "<p class='sub'>Elegiste <strong style='text-transform:capitalize'>"+esc(fechaLinda(start))+"</strong>.<br>Te mandamos un email de confirmación a tu correo.</p>"+
    "<a class='btn btn-primary' href='"+esc(gurl)+"' target='_blank' rel='noopener' style='margin-top:20px'>Agregar a Google Calendar</a>"+
    "<p class='hint'>¿No se abrió Google? Ya te llega la confirmación por email"+(EMAIL?(", o escribile a "+esc(FIRST)+" a <strong>"+esc(EMAIL)+"</strong>"):"")+".</p></div>";
}
</script>
</body>
</html>
