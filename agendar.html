<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/pw-consent.js"></script>
<script src="/pw-pixel.js"></script>
<title>Reserva tu sesión · Pathway</title>
<link rel="icon" href="/favicon-app.svg?v=8" type="image/svg+xml">
<meta name="theme-color" content="#2D6A4F">
<meta name="robots" content="noindex">
<!-- agendar.html quedó reemplazado por reservar.html (única fuente de la reserva:
     mismo diseño, reserva interna, zona horaria del visitante). Redirigimos acá
     conservando TODOS los parámetros (c, t, utm_*, etc.) para que cualquier link
     viejo a /agendar.html siga funcionando y quede coherente con el resto. -->
<script>
  var DESTINO = "/reservar.html" + (location.search || "") + (location.hash || "");
  location.replace(DESTINO);
</script>
<meta http-equiv="refresh" content="0;url=/reservar.html">
<style>
  body{font-family:'Inter',-apple-system,'Segoe UI',sans-serif;background:#FAFDF9;color:#1B2E26;min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0;}
  .box{text-align:center;}
  .spin{width:26px;height:26px;border:3px solid rgba(45,106,79,.2);border-top-color:#2D6A4F;border-radius:50%;animation:s .8s linear infinite;margin:0 auto 14px;}
  @keyframes s{to{transform:rotate(360deg)}}
  a{color:#2D6A4F;}
  p{font-size:14px;color:#5A6A60;}
</style>
</head>
<body>
  <div class="box">
    <div class="spin"></div>
    <p>Llevándote a la reserva… <a href="/reservar.html">Toca acá si no avanza</a>.</p>
  </div>
</body>
</html>
