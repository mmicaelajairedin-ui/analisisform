<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservá tu sesión · Pathway</title>
<meta name="robots" content="noindex">
<style>
  :root{ --bosque:#2D6A4F; --sendero:#52B788; --carbon:#1B2E26; --niebla:#FAFDF9; --niebla2:#F0F5EF; --soft:#5A6A60; --muted:#9AA8A0; --borde:rgba(45,106,79,.14); }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,'Segoe UI',Inter,sans-serif;background:var(--niebla);color:var(--carbon);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px 60px;}
  .card{background:#fff;border:1px solid var(--borde);border-radius:20px;box-shadow:0 10px 40px rgba(20,55,38,.08);max-width:460px;width:100%;padding:30px 26px;margin-top:20px;}
  .brand{display:flex;align-items:center;gap:8px;justify-content:center;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--bosque);margin-bottom:16px;}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--sendero);}
  .who{text-align:center;margin-bottom:6px;}
  .who .av{width:54px;height:54px;border-radius:50%;background:var(--bosque);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;margin:0 auto 10px;}
  h1{font-size:20px;font-weight:600;letter-spacing:-.3px;margin-bottom:3px;}
  .sub{font-size:13px;color:var(--soft);line-height:1.5;margin-bottom:8px;}
  .type-pill{display:inline-flex;align-items:center;gap:7px;background:var(--niebla2);border-radius:100px;padding:6px 13px;font-size:13px;font-weight:600;margin:6px auto 20px;}
  .type-pill .cdot{width:9px;height:9px;border-radius:50%;}
  .lbl{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;}
  .days{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;}
  .day{flex-shrink:0;min-width:52px;border:1.5px solid var(--borde);border-radius:12px;background:#fff;padding:8px 6px;text-align:center;cursor:pointer;transition:all .12s;}
  .day:hover{border-color:var(--sendero);}
  .day.on{background:var(--bosque);border-color:var(--bosque);color:#fff;}
  .day .dn{font-size:10px;text-transform:uppercase;letter-spacing:.4px;opacity:.7;}
  .day .dd{font-size:17px;font-weight:700;line-height:1.3;}
  .slots{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
  .slot{border:1.5px solid var(--borde);border-radius:10px;background:#fff;padding:9px 4px;font-size:13px;font-weight:600;cursor:pointer;transition:all .12s;color:var(--carbon);}
  .slot:hover{border-color:var(--sendero);}
  .slot.on{background:var(--bosque);border-color:var(--bosque);color:#fff;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:var(--carbon);}
  .field input{width:100%;padding:11px 13px;border:1.5px solid var(--borde);border-radius:11px;font-size:14px;font-family:inherit;outline:none;}
  .field input:focus{border-color:var(--sendero);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:13px 18px;border-radius:12px;font-size:14.5px;font-weight:700;font-family:inherit;cursor:pointer;border:none;text-decoration:none;transition:all .15s;}
  .btn-primary{background:var(--bosque);color:#fff;margin-top:16px;}
  .btn-primary:hover{background:#245a42;}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--soft);font-weight:500;margin-top:8px;}
  .msg{font-size:13px;margin-top:12px;text-align:center;color:#C0756E;min-height:16px;}
  .hint{font-size:11.5px;color:var(--muted);text-align:center;margin-top:16px;line-height:1.5;}
  .ok-ico{width:60px;height:60px;border-radius:50%;background:rgba(82,183,136,.16);display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 16px;}
  .spin{width:26px;height:26px;border:3px solid rgba(45,106,79,.2);border-top-color:var(--bosque);border-radius:50%;animation:s .8s linear infinite;margin:30px auto;}
  @keyframes s{to{transform:rotate(360deg)}}
  .center{text-align:center;}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="brand"><span class="dot"></span> Pathway</div>
  <div class="spin"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
var SB='https://ddxnrsnjdvtqhxunxnwj.supabase.co';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkeG5yc25qZHZ0cWh4dW54bndqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNDk5MzksImV4cCI6MjA5MDcyNTkzOX0.t82X1x-PDgFDGYhKC7YXoRKhga9I8Hjet60QUYvtZLU';
var _AG_COLORS=["#2D6A4F","#8C7B80","#C99A2E","#3F5DA9","#C0756E","#4C8C6E"];
function $(id){ return document.getElementById(id); }
function esc(s){ return (''+(s==null?'':s)).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function qp(k){ try{ return new URLSearchParams(location.search).get(k); }catch(e){ return null; } }

var COACH=null, EMAIL='', TYPE=null, DUR=30, COLOR='#2D6A4F';
var sel={day:null, time:null};

function initials(n){ var p=(''+(n||'')).trim().split(/\s+/); return ((p[0]||'')[0]||'')+((p[1]||'')[0]||''); }
function durFrom(label){ var m=(''+(label||'')).match(/(\d+)\s*min/i); return m?parseInt(m[1],10):(/(\d+)\s*h/i.test(''+label)?60:30); }

// Cargar coach + tipo de evento
(function(){
  var c=qp('c'); if(!c){ fail('Este link no es válido. Pedile al coach que te comparta el link de reservas de nuevo.'); return; }
  var t=parseInt(qp('t'),10); if(isNaN(t)) t=-1;
  fetch(SB+'/rest/v1/usuarios?id=eq.'+encodeURIComponent(c)+'&select=nombre,email,configuracion&limit=1',
    { headers:{ apikey:KEY, Authorization:'Bearer '+KEY } })
    .then(function(r){ return r.ok?r.json():[]; })
    .then(function(rows){
      if(!rows || !rows.length){ fail('No encontramos a este coach. Revisá el link.'); return; }
      var u=rows[0]; COACH=u.nombre||'Tu coach'; EMAIL=(u.email||'').trim();
      var cfg=u.configuracion||{}; var types=(Object.prototype.toString.call(cfg.event_types)==='[object Array]'&&cfg.event_types.length)?cfg.event_types
        :[{label:'Sesión 45 min',color:'#8C7B80'}];
      TYPE=(t>=0&&t<types.length)?types[t]:types[0];
      DUR=durFrom(TYPE.label); COLOR=TYPE.color||'#2D6A4F';
      renderPicker();
    })
    .catch(function(){ fail('No pudimos cargar la página de reservas. Reintentá en un momento.'); });
})();

function fail(t){
  $('card').innerHTML="<div class='brand'><span class='dot'></span> Pathway</div>"+
    "<div class='center'><div class='ok-ico' style='background:rgba(192,117,110,.14)'>😕</div>"+
    "<h1>Ups</h1><p class='sub'>"+esc(t)+"</p></div>";
}

function dayList(){
  var out=[], now=new Date(); now.setHours(0,0,0,0);
  var DN=['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];
  for(var i=0;i<14;i++){ var d=new Date(now.getTime()+i*86400000); if(d.getDay()===0||d.getDay()===6) continue; out.push({d:d, dn:(i===0?'HOY':DN[d.getDay()]), dd:d.getDate()}); if(out.length>=8) break; }
  return out;
}
function slotList(){
  var out=[], step=Math.max(DUR,30);
  for(var m=9*60; m+DUR<=18*60; m+=step){ out.push(('0'+Math.floor(m/60)).slice(-2)+':'+('0'+(m%60)).slice(-2)); }
  return out;
}
function renderPicker(){
  var days=dayList();
  var daysHtml=days.map(function(x,i){ var on=(sel.day===i); return "<div class='day"+(on?' on':'')+"' data-day='"+i+"'><div class='dn'>"+x.dn+"</div><div class='dd'>"+x.dd+"</div></div>"; }).join('');
  var slotsHtml=slotList().map(function(s){ var on=(sel.time===s); return "<button class='slot"+(on?' on':'')+"' data-slot='"+s+"'>"+s+"</button>"; }).join('');
  var can=(sel.day!=null&&sel.time);
  $('card').innerHTML=
    "<div class='brand'><span class='dot'></span> Pathway</div>"+
    "<div class='who'><div class='av'>"+esc(initials(COACH).toUpperCase()||'·')+"</div>"+
      "<h1>Reservá con "+esc((''+COACH).split(' ')[0])+"</h1>"+
      "<div class='type-pill'><span class='cdot' style='background:"+COLOR+"'></span>"+esc(TYPE.label||'Sesión')+"</div></div>"+
    "<div class='lbl'>Elegí el día</div><div class='days' id='days'>"+daysHtml+"</div>"+
    "<div class='lbl'>Elegí la hora</div><div class='slots' id='slots'>"+slotsHtml+"</div>"+
    "<div class='lbl'>Tus datos</div>"+
    "<div class='field'><label>Tu nombre</label><input id='f-name' placeholder='Nombre y apellido'></div>"+
    "<div class='field'><label>Tu email</label><input id='f-email' type='email' placeholder='vos@email.com'></div>"+
    "<button class='btn btn-primary' id='confirm'"+(can?'':' disabled')+">Confirmar reserva</button>"+
    "<div class='msg' id='msg'></div>"+
    "<div class='hint'>Al confirmar, la sesión queda agendada y le llega la invitación a "+esc((''+COACH).split(' ')[0])+".</div>";
  $('days').addEventListener('click',function(e){ var d=e.target.closest('[data-day]'); if(!d) return; sel.day=parseInt(d.getAttribute('data-day'),10); renderPicker(); });
  $('slots').addEventListener('click',function(e){ var s=e.target.closest('[data-slot]'); if(!s) return; sel.time=s.getAttribute('data-slot'); renderPicker(); });
  $('confirm').addEventListener('click', confirmar);
}

function fmt(x){ return x.getFullYear()+('0'+(x.getMonth()+1)).slice(-2)+('0'+x.getDate()).slice(-2)+'T'+('0'+x.getHours()).slice(-2)+('0'+x.getMinutes()).slice(-2)+'00'; }
function confirmar(){
  var name=($('f-name').value||'').trim(), email=($('f-email').value||'').trim();
  if(!name){ $('msg').textContent='Escribí tu nombre.'; return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ $('msg').textContent='Escribí un email válido.'; return; }
  if(sel.day==null||!sel.time){ $('msg').textContent='Elegí día y hora.'; return; }
  var days=dayList(), d=days[sel.day].d, hm=sel.time.split(':');
  var start=new Date(d.getFullYear(),d.getMonth(),d.getDate(),parseInt(hm[0],10),parseInt(hm[1],10));
  var end=new Date(start.getTime()+DUR*60000);
  var title=(TYPE.label||'Sesión')+' · '+name+' con '+(''+COACH).split(' ')[0];
  var details='Reserva hecha desde Pathway.\nNombre: '+name+'\nEmail: '+email;
  var url='https://calendar.google.com/calendar/u/0/r/eventedit'+
    '?text='+encodeURIComponent(title)+
    '&dates='+fmt(start)+'/'+fmt(end)+
    '&details='+encodeURIComponent(details);
  if(EMAIL) url+='&add='+encodeURIComponent(EMAIL);
  // Guardar la solicitud (best-effort) para que el coach la vea aunque no use Google.
  try{
    fetch(SB+'/rest/v1/citas',{ method:'POST', headers:{ apikey:KEY, Authorization:'Bearer '+KEY, 'content-type':'application/json', Prefer:'return=minimal' },
      body:JSON.stringify({ coach_id:qp('c'), nombre:name, email:email, tipo:(TYPE.label||''), inicio:start.toISOString() }) }).catch(function(){});
  }catch(e){}
  var w=window.open(url,'_blank'); if(!w){ /* popup bloqueado: navegamos */ location.href=url; }
  ok(name, start);
}
function ok(name, start){
  var f=start.toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'})+' · '+('0'+start.getHours()).slice(-2)+':'+('0'+start.getMinutes()).slice(-2);
  $('card').innerHTML=
    "<div class='brand'><span class='dot'></span> Pathway</div>"+
    "<div class='center'><div class='ok-ico'>🎉</div>"+
    "<h1>¡Reserva enviada!</h1>"+
    "<p class='sub'>Elegiste <strong>"+esc(f)+"</strong>.<br>Se abrió Google Calendar para confirmar — dale <strong>Guardar</strong> y le llega la invitación a "+esc((''+COACH).split(' ')[0])+".</p>"+
    "<p class='hint'>¿No se abrió Google? Escribile a "+esc((''+COACH).split(' ')[0])+(EMAIL?(" a <strong>"+esc(EMAIL)+"</strong>"):'')+" y coordinás el horario.</p></div>";
}
</script>
</body>
</html>
