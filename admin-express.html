<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="/pw-icons.css?v=1">
<script src="/pw-icons.js?v=1"></script>

<meta name="viewport" content="width=device-width, initial-scale=1.0"><style>html{scrollbar-gutter:stable;overflow-x:hidden;max-width:100%;}body{overflow-x:hidden;max-width:100%;}</style>
<link rel="icon" href="/favicon-app.svg?v=6" type="image/svg+xml">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="robots" content="noindex">
<title>Admin · Pack Express</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bosque:#2D6A4F;--sendero:#52B788;--carbon:#1B2E26;--niebla:#FAFDF9;--texto-suave:#5A5A55;--borde:rgba(45,106,79,.12);}
body{font-family:'Inter',-apple-system,sans-serif;color:#1B2E26;background:var(--niebla);font-size:14px;line-height:1.5;}
a{color:var(--bosque);text-decoration:none;}

.nav{position:sticky;top:0;z-index:50;background:rgba(250,253,249,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--borde);}
.nav-inner{max-width:1100px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.nav-brand{font-family:'Fraunces',serif;font-size:20px;color:var(--carbon);letter-spacing:-.6px;font-weight:500;}
.nav-back{font-size:13px;color:var(--texto-suave);}
.nav-back:hover{color:var(--bosque);}

.container{max-width:1100px;margin:0 auto;padding:32px 24px 80px;}
h1{font-family:'Fraunces',serif;font-size:32px;font-weight:500;letter-spacing:-1px;line-height:1.15;margin-bottom:6px;color:var(--carbon);}
h1 .accent{color:var(--sendero);}
.lead{color:var(--texto-suave);font-size:14px;margin-bottom:28px;}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:32px;}
.stat{background:#fff;border:1.5px solid var(--borde);border-radius:14px;padding:18px 22px;}
.stat-num{font-family:'Fraunces',serif;font-size:32px;font-weight:500;color:var(--carbon);line-height:1;letter-spacing:-1px;}
.stat-lbl{font-size:11px;color:var(--texto-suave);text-transform:uppercase;letter-spacing:.8px;font-weight:600;margin-top:6px;}
.stat-sub{font-size:12px;color:var(--bosque);margin-top:4px;font-weight:500;}

.table-wrap{background:#fff;border:1.5px solid var(--borde);border-radius:14px;overflow:hidden;}
.table{width:100%;border-collapse:collapse;font-size:13px;}
.table th{text-align:left;padding:12px 16px;background:rgba(45,106,79,.04);border-bottom:1.5px solid var(--borde);font-size:11px;text-transform:uppercase;letter-spacing:.8px;font-weight:700;color:var(--texto-suave);}
.table td{padding:14px 16px;border-bottom:1px solid var(--borde);vertical-align:middle;}
.table tr:last-child td{border-bottom:none;}
.table tr:hover td{background:rgba(82,183,136,.04);}
.email{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;color:var(--carbon);}
.btn-action{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;background:var(--bosque);color:#fff;border:none;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;text-decoration:none;font-family:'Inter',sans-serif;margin-right:6px;white-space:nowrap;}
.btn-action:hover{background:var(--carbon);color:#fff;}
.btn-secondary{background:transparent;color:var(--bosque);border:1.5px solid var(--borde);}
.btn-secondary:hover{background:var(--niebla);border-color:var(--bosque);color:var(--bosque);}
.btn-danger{background:#c0756e;}
.btn-danger:hover{background:#a85a52;}
.empty{padding:48px 24px;text-align:center;color:var(--texto-suave);font-size:14px;}
.loading{padding:48px 24px;text-align:center;color:var(--texto-suave);}
.tag{display:inline-block;padding:3px 10px;border-radius:100px;font-size:10px;font-weight:700;letter-spacing:.5px;}
.tag-ok{background:rgba(82,183,136,.15);color:var(--bosque);}
.tag-pend{background:rgba(233,196,106,.18);color:#8C6D2E;}

.locked{padding:60px 24px;text-align:center;}
.locked h2{font-family:'Fraunces',serif;font-size:24px;color:var(--carbon);margin-bottom:10px;}
.locked p{color:var(--texto-suave);}
</style>
</head>
<body>

<nav class="nav"><div class="nav-inner">
  <a href="/" class="nav-brand">pathway<span style="color:#52B788;">.</span></a>
  <a href="panel-v2.html" class="nav-back">← Volver al panel</a>
</div></nav>

<div class="container" id="main">
  <div class="loading">Verificando permisos...</div>
</div>

<script>
(function(){
  'use strict';
  var SB='https://api.pathwaycareercoach.com';
  var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkeG5yc25qZHZ0cWh4dW54bndqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNDk5MzksImV4cCI6MjA5MDcyNTkzOX0.t82X1x-PDgFDGYhKC7YXoRKhga9I8Hjet60QUYvtZLU';

  function escH(s){return String(s||'').replace(/[&<>"]/g,function(c){return c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':'&quot;';});}
  function fmtDate(s){if(!s)return '—';var d=new Date(s);if(isNaN(d))return '—';return d.toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'});}
  function relativeTime(s){
    if(!s)return '—';
    var d=new Date(s);if(isNaN(d))return '—';
    var diff=Date.now()-d.getTime();
    var min=Math.floor(diff/60000);
    if(min<1)return 'recién';
    if(min<60)return 'hace '+min+' min';
    var hr=Math.floor(min/60);
    if(hr<24)return 'hace '+hr+' h';
    var days=Math.floor(hr/24);
    if(days<30)return 'hace '+days+' día'+(days===1?'':'s');
    var mon=Math.floor(days/30);
    return 'hace '+mon+' mes'+(mon===1?'':'es');
  }

  var ME=null;
  try{var u=localStorage.getItem('mj_user');if(u)ME=JSON.parse(u);}catch(e){}
  if(!ME||ME.rol!=='admin'){
    document.getElementById('main').innerHTML='<div class="locked"><h2>'+PWI.svg('lock')+' Solo para admin</h2><p>Esta página es para gestión interna del Pack Express.</p></div>';
    return;
  }

  function renderEmpty(){
    document.getElementById('main').innerHTML=''
      +'<h1>Pack Express<span class="accent">.</span></h1>'
      +'<p class="lead">Aún no hay compradores. Cuando alguien complete el Pack, aparece acá.</p>';
  }

  function render(rows){
    var total=rows.length;
    // Filtrar últimos 7d / 30d
    var now=Date.now();
    var d7=now-7*24*60*60*1000;
    var d30=now-30*24*60*60*1000;
    var last7=rows.filter(function(r){return r.created_at && new Date(r.created_at).getTime()>=d7;}).length;
    var last30=rows.filter(function(r){return r.created_at && new Date(r.created_at).getTime()>=d30;}).length;
    var ingresoTotal=total*40;

    var h='<h1>Pack Express<span class="accent">.</span></h1>';
    h+='<p class="lead">Compradores del Pack Express €40. Click "Ver como cliente" para ver lo que recibió cada uno.</p>';
    h+='<div class="stats">';
    h+='<div class="stat"><div class="stat-num">'+total+'</div><div class="stat-lbl">Total Packs</div><div class="stat-sub">€'+ingresoTotal+' brutos</div></div>';
    h+='<div class="stat"><div class="stat-num">'+last7+'</div><div class="stat-lbl">Últimos 7 días</div></div>';
    h+='<div class="stat"><div class="stat-num">'+last30+'</div><div class="stat-lbl">Últimos 30 días</div></div>';
    h+='</div>';

    // Botón para otorgar acceso manual (a friends, demos, etc.) sin pago.
    h+='<div style="background:#fff;border:1.5px solid var(--borde);border-radius:14px;padding:18px 20px;margin-bottom:24px;">';
    h+='<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">';
    h+='<div><div style="font-size:13px;font-weight:700;color:var(--carbon);">Otorgar acceso manual</div>';
    h+='<div style="font-size:12px;color:var(--texto-suave);margin-top:2px;">Para amigos o demos, sin pago. Marca el email como "paid_at = ahora".</div></div>';
    h+='<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">';
    h+='<input id="grant-email" type="email" placeholder="email@ejemplo.com" style="padding:9px 12px;border:1.5px solid var(--borde);border-radius:8px;font-size:13px;font-family:Inter,sans-serif;width:220px;outline:none;">';
    h+='<button onclick="grantAccess()" class="btn-action" style="padding:10px 16px;font-size:12px;">+ Otorgar</button>';
    h+='</div></div></div>';

    if(!rows.length){
      h+='<div class="table-wrap"><div class="empty">Aún no hay Packs generados. Cuando alguien complete el flow de €40, aparece acá.</div></div>';
      document.getElementById('main').innerHTML=h;
      return;
    }

    h+='<div class="table-wrap"><table class="table">';
    h+='<thead><tr><th>Email</th><th>Nombre</th><th>Generado</th><th>Estado</th><th style="text-align:right;">Acciones</th></tr></thead><tbody>';
    rows.sort(function(a,b){return new Date(b.created_at||0)-new Date(a.created_at||0);});
    rows.forEach(function(r){
      var hasCv=!!r.cv_optimizado;
      var hasCarta=!!r.carta;
      var hasLi=!!r.linkedin_analisis;
      var status=hasCv&&hasCarta?'<span class="tag tag-ok">Completo</span>':'<span class="tag tag-pend">Parcial</span>';
      var emailEnc=encodeURIComponent(r.email||'');
      var paquetes=[];
      if(hasCv)paquetes.push('CV');
      if(hasCarta)paquetes.push('Carta');
      if(hasLi)paquetes.push('LinkedIn');
      h+='<tr>';
      h+='<td><div class="email">'+escH(r.email||'—')+'</div></td>';
      h+='<td>'+escH(r.nombre||'—')+'<div style="font-size:11px;color:var(--texto-suave);margin-top:2px;">'+paquetes.join(' · ')+'</div></td>';
      h+='<td>'+fmtDate(r.created_at)+'<div style="font-size:11px;color:var(--texto-suave);">'+relativeTime(r.created_at)+'</div></td>';
      h+='<td>'+status+'</td>';
      h+='<td style="text-align:right;white-space:nowrap;">';
      h+='<a href="cv-express.html?paid=1&email='+emailEnc+'" target="_blank" rel="noopener" class="btn-action">Ver Pack</a>';
      h+='<a href="linkedin-viewer.html?email='+emailEnc+'" target="_blank" rel="noopener" class="btn-action btn-secondary">LinkedIn</a>';
      h+='<button onclick="deleteRow(\''+(r.email||'').replace(/'/g,"\\'")+'\')" class="btn-action btn-danger" title="Borrar (irreversible)">×</button>';
      h+='</td>';
      h+='</tr>';
    });
    h+='</tbody></table></div>';
    document.getElementById('main').innerHTML=h;
  }

  window.deleteRow=function(email){
    if(!confirm('¿Borrar el Pack de '+email+'? Esta acción es irreversible.'))return;
    fetch(SB+'/rest/v1/cv_express?email=eq.'+encodeURIComponent(email),{
      method:'DELETE',
      headers:{apikey:KEY,Authorization:'Bearer '+KEY,Prefer:'return=minimal'}
    }).then(function(r){
      if(r.ok)load();
      else alert('Error al borrar: '+r.status);
    }).catch(function(){alert('Error de conexión');});
  };

  // Otorgar acceso manual a un email (sin pago). Útil para friends y demos.
  // Crea un row en cv_express con paid_at=now, marca explícitamente el
  // pago_monto a 0 para distinguirlo de pagos reales.
  // Además ENVÍA un email de invitación automático vía send-email (Brevo)
  // con el link directo al Pack Express.
  window.grantAccess=function(){
    var input=document.getElementById('grant-email');
    var email=(input.value||'').trim().toLowerCase();
    if(!email||email.indexOf('@')===-1){alert('Email inválido');return;}
    if(!confirm('¿Otorgar acceso a '+email+' sin pago y enviarle el email de invitación?'))return;
    var btn=document.querySelector('button[onclick="grantAccess()"]');
    if(btn){btn.disabled=true;btn.textContent='Otorgando...';}
    // Verificar si ya existe (para no duplicar)
    fetch(SB+'/rest/v1/cv_express?email=eq.'+encodeURIComponent(email)+'&select=email&limit=1',{
      headers:{apikey:KEY,Authorization:'Bearer '+KEY}
    }).then(function(r){return r.ok?r.json():[];})
      .then(function(rows){
        var exists=rows.length>0;
        var body={paid_at:new Date().toISOString(),pago_monto:0};
        if(!exists)body.email=email;
        var url=SB+'/rest/v1/cv_express'+(exists?'?email=eq.'+encodeURIComponent(email):'');
        return fetch(url,{
          method:exists?'PATCH':'POST',
          headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',Prefer:'return=minimal'},
          body:JSON.stringify(body)
        });
      })
      .then(function(r){
        if(!r.ok) throw new Error('grant_failed_'+r.status);
        // Acceso otorgado OK → ahora mandamos el email de invitación.
        return enviarInvitacionExpress(email);
      })
      .then(function(emailOk){
        input.value='';
        if(btn){btn.disabled=false;btn.textContent='+ Otorgar';}
        if(emailOk){
          alert('✓ Acceso otorgado y email de invitación enviado a '+email+'.');
        } else {
          alert('✓ Acceso otorgado a '+email+'.\n\n⚠️ El email automático falló. Pasale el link manualmente:\n\nhttps://pathwaycareercoach.com/cv-express.html?paid=1&email='+encodeURIComponent(email));
        }
        load();
      })
      .catch(function(err){
        if(btn){btn.disabled=false;btn.textContent='+ Otorgar';}
        alert('Error: '+(err.message||'conexión')+'\n\nSi el acceso se otorgó, pasale el link manual:\nhttps://pathwaycareercoach.com/cv-express.html?paid=1&email='+encodeURIComponent(email));
      });
  };

  // Envía el email de invitación al Pack Express vía send-email edge function
  // (Brevo). Devuelve Promise<boolean> — true si se envió OK.
  function enviarInvitacionExpress(email){
    var link='https://pathwaycareercoach.com/cv-express.html?paid=1&email='+encodeURIComponent(email);
    var nombre=(email.split('@')[0]||'').replace(/[._-]+/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();});
    var html=''
      +'<h2 style="font-family:Fraunces,Georgia,serif;color:#1B4332;margin:0 0 14px;">Hola '+escH(nombre)+',</h2>'
      +'<p style="font-size:15px;line-height:1.65;">Tu acceso al <strong>Pack Express de Pathway</strong> ya está activo. 🚀</p>'
      +'<p style="font-size:15px;line-height:1.65;margin-top:10px;">Con el Pack vas a generar en minutos:</p>'
      +'<ul style="font-size:14px;line-height:1.9;padding-left:20px;margin:10px 0;">'
      +'<li><strong>Tu CV optimizado</strong> — listo para pasar filtros ATS</li>'
      +'<li><strong>Tu carta de presentación</strong> — adaptada a tu perfil</li>'
      +'<li><strong>Análisis de tu LinkedIn</strong> — titular, "Acerca de" y keywords</li>'
      +'</ul>'
      +'<p style="margin-top:22px;"><a href="'+link+'" style="display:inline-block;padding:13px 28px;background:#2D6A4F;color:#fff;border-radius:10px;text-decoration:none;font-weight:700;font-family:Inter,sans-serif;">Empezar mi Pack Express →</a></p>'
      +'<p style="font-size:11px;color:#AAAAAA;margin-top:16px;line-height:1.5;">Si el botón no funciona, copia este link en tu navegador:<br><span style="color:#AAAAAA;word-break:break-all;">'+escH(link)+'</span></p>'
      +'<p style="font-size:13px;color:#666;margin-top:18px;">Cualquier duda, responde este mail. — Equipo Pathway</p>';
    return fetch(SB+'/functions/v1/send-email',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        to:email,
        to_name:nombre,
        subject:'🚀 Tu Pack Express de Pathway está listo',
        html:html,
        from_email:'hi@pathwaycareercoach.com',
        from_name:'Pathway',
        reply_to:'hi@pathwaycareercoach.com'
      })
    }).then(function(r){return r.ok;}).catch(function(){return false;});
  }

  function load(){
    document.getElementById('main').innerHTML='<div class="loading">Cargando compradores...</div>';
    fetch(SB+'/rest/v1/cv_express?select=*&order=created_at.desc',{
      headers:{apikey:KEY,Authorization:'Bearer '+KEY}
    }).then(function(r){return r.ok?r.json():[];})
      .then(render)
      .catch(function(e){
        console.error('[admin-express]',e);
        document.getElementById('main').innerHTML='<h1>Pack Express<span class="accent">.</span></h1><p class="lead">Error al cargar la data. Revisa la consola.</p>';
      });
  }

  load();
})();
</script>

</body>
</html>
