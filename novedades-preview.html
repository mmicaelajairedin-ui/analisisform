<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Novedades · Preview — Pathway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   NOVEDADES — cajón lateral con feed editorial rotativo (preview)
   Formato "mezcla": drawer + feed de tarjetas (diseño de Micaela) donde la
   1ª tarjeta de cada edición es un hero grande. Rota cada lunes · 4 ediciones.
   Tokens Pathway reales (colors_and_type.css) · Fraunces + Inter · fondo crema.
   Recompensas SOLO cumplibles: referido +15 d (Stripe), acciones = puntos,
   catálogo = premios propios (sin Notion/LinkedIn/iPad).
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --pw-bosque:#2D6A4F; --pw-bosque-dark:#1B4332; --pw-sendero:#52B788;
  --pw-amanecer:#E9C46A; --pw-oro:#D4A24C; --pw-plata:#A8AFB5; --pw-bronce:#B97A3D;
  --pw-carbon:#1B2E26;
  --crema:#FAF7F0; --crema-2:#F4EEE1; --crema-3:#EFE7D6;
  --pw-niebla-2:#F0F7F2; --pw-niebla-3:#E8F2EC;
  --pw-text-soft:#5A5A55; --pw-text-muted:#8A8A82;
  --pw-border:rgba(45,106,79,.13); --pw-border-strong:rgba(45,106,79,.25);
  --pw-success-bg:rgba(82,183,136,.14); --pw-warning-bg:rgba(233,196,106,.20);
  --pw-serif:"Fraunces","Georgia","Times New Roman",serif;
  --pw-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --pw-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,"Menlo",monospace;
  --sh-xs:0 1px 2px rgba(45,106,79,.06);
  --sh-sm:0 4px 14px rgba(45,106,79,.08);
  --sh-md:0 6px 20px rgba(45,106,79,.11);
  --sh-lg:0 12px 24px rgba(45,106,79,.14);
  --sh-hero:0 20px 44px -18px rgba(45,106,79,.24);
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--pw-sans);color:var(--pw-carbon);background:var(--crema);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden}

/* ── App fantasma detrás (contexto del panel del coach) ────────────────── */
.ghost{position:fixed;inset:0;display:flex}
.ghost-side{width:230px;height:100%;background:#fff;border-right:1px solid var(--pw-border);padding:22px 16px;display:flex;flex-direction:column;gap:4px}
.ghost-logo{display:flex;align-items:center;gap:9px;margin-bottom:20px;font:600 19px var(--pw-serif)}
.ghost-nav{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;font-size:14px;color:var(--pw-text-soft)}
.ghost-nav.on{background:var(--pw-niebla-2);color:var(--pw-carbon);font-weight:600}
.ghost-main{flex:1;padding:26px 34px}
.ghost-h{font:500 26px var(--pw-serif);letter-spacing:-.5px}
.ghost-sub{color:var(--pw-text-soft);font-size:14px;margin-top:4px}
.ghost-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:26px}
.ghost-card{height:96px;background:#fff;border:1px solid var(--pw-border);border-radius:14px;box-shadow:var(--sh-xs)}
.ghost-wide{height:230px;background:#fff;border:1px solid var(--pw-border);border-radius:14px;box-shadow:var(--sh-xs);margin-top:16px}
.ghost-dim{position:fixed;inset:0;background:rgba(27,46,38,.28);backdrop-filter:blur(1.5px);z-index:10}

/* ── EL CAJÓN ──────────────────────────────────────────────────────────── */
.drawer{position:fixed;top:0;right:0;height:100%;width:404px;max-width:100%;z-index:15;
  display:flex;flex-direction:column;
  background:
    radial-gradient(520px 300px at 100% -6%, #EFF6F1 0%, transparent 60%),
    radial-gradient(420px 260px at 0% 108%, #F6EFDD 0%, transparent 58%),
    var(--crema);
  border-left:1px solid var(--pw-border);
  box-shadow:-26px 0 60px -22px rgba(45,106,79,.30);
  transition:transform .5s var(--ease)}
.drawer.closed{transform:translateX(112%)}

.dw-head{padding:18px 20px 14px;border-bottom:1px solid var(--pw-border);
  background:rgba(250,247,240,.86);backdrop-filter:blur(10px);position:relative;z-index:2}
.dw-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.dw-title{font:500 25px var(--pw-serif);letter-spacing:-.6px;line-height:1.1}
.dw-title .dot{color:var(--pw-sendero)}
.dw-kick{color:var(--pw-text-soft);font-size:13px;margin-top:2px}
.dw-actions{display:flex;align-items:center;gap:6px}
.dw-viewall{font-size:13px;font-weight:600;color:var(--pw-bosque);white-space:nowrap;text-decoration:none;cursor:pointer}
.dw-x{width:32px;height:32px;border-radius:50%;background:transparent;border:1px solid var(--pw-border);color:var(--pw-text-soft);cursor:pointer;display:grid;place-items:center;transition:.2s var(--ease)}
.dw-x:hover{border-color:var(--pw-border-strong);color:var(--pw-bosque)}
.dw-x svg{width:15px;height:15px}

.tabs{display:flex;gap:7px;margin-top:16px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{height:0}
.tab{flex:0 0 auto;display:inline-flex;align-items:center;padding:7px 14px;border-radius:100px;
  font:600 13px var(--pw-sans);cursor:pointer;white-space:nowrap;transition:.2s var(--ease);
  background:#fff;color:var(--pw-text-soft);border:1px solid var(--pw-border)}
.tab.on{background:var(--pw-bosque-dark);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(45,106,79,.22)}
.dw-meta{display:flex;align-items:center;justify-content:space-between;margin-top:11px}
.dw-rot{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--pw-text-muted)}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--pw-sendero);animation:pw-pulse 2s infinite}
@keyframes pw-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.dw-seen{background:none;border:none;font-size:11.5px;color:var(--pw-bosque);font-weight:600;cursor:pointer}

/* ── FEED ──────────────────────────────────────────────────────────────── */
.feed{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 18px 26px;display:flex;flex-direction:column;gap:14px;position:relative;z-index:1}
.feed::-webkit-scrollbar{width:8px}
.feed::-webkit-scrollbar-thumb{background:rgba(45,106,79,.18);border-radius:100px}
.feed>*{animation:pw-up .5s var(--ease) both}
.feed>*:nth-child(2){animation-delay:.05s}
.feed>*:nth-child(3){animation-delay:.1s}
.feed>*:nth-child(4){animation-delay:.15s}
.feed>*:nth-child(5){animation-delay:.2s}
@keyframes pw-up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.card{position:relative;background:#fff;border:1px solid var(--pw-border);border-radius:16px;
  box-shadow:var(--sh-sm);padding:16px;display:flex;flex-direction:column;gap:11px}
.dismiss{position:absolute;top:9px;right:9px;width:25px;height:25px;border-radius:50%;
  background:rgba(244,238,225,.85);border:1px solid var(--pw-border);color:var(--pw-text-muted);
  font-size:11px;line-height:1;cursor:pointer;display:grid;place-items:center;z-index:4;transition:.15s}
.dismiss:hover{color:var(--pw-carbon);background:#fff}
.dismiss-lt{background:rgba(255,255,255,.16);border:none;color:rgba(255,255,255,.85)}
.eyebrow{font:700 11px var(--pw-sans);text-transform:uppercase;letter-spacing:1.2px;color:var(--pw-bosque)}
.semana{font:700 10px var(--pw-sans);text-transform:uppercase;letter-spacing:1px;color:var(--pw-text-muted)}
.cattag{display:inline-flex;padding:3px 9px;border-radius:100px;background:var(--pw-success-bg);color:var(--pw-bosque);font:700 9.5px var(--pw-sans);text-transform:uppercase;letter-spacing:.7px}
.tagline{display:flex;align-items:center;gap:7px}
.body{font:400 13px/1.5 var(--pw-sans);color:var(--pw-text-soft);margin:0}
.cta{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;justify-content:center;
  padding:11px 18px;border-radius:11px;background:var(--pw-bosque-dark);color:#fff;
  font:600 14px var(--pw-sans);border:none;cursor:pointer;margin-top:2px;transition:.2s var(--ease);box-shadow:0 6px 16px rgba(27,67,50,.22)}
.cta:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(27,67,50,.28)}
.cta svg{width:17px;height:17px}
.cta-block{width:100%;align-self:stretch;height:48px;margin-top:6px}
.link{font-size:13px;font-weight:600;color:var(--pw-bosque);text-decoration:none;cursor:pointer}
.checkdot{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--pw-success-bg);color:var(--pw-bosque);font-size:11px;font-weight:700;display:grid;place-items:center}
.chip-pts{flex:0 0 auto;display:inline-flex;align-items:center;padding:3px 9px;border-radius:100px;background:var(--pw-warning-bg);color:#9a7b28;font:700 12px var(--pw-sans)}
.savepill{display:inline-flex;align-items:center;gap:7px;align-self:flex-start;padding:6px 12px;border-radius:100px;background:var(--pw-success-bg);color:var(--pw-bosque-dark);font:700 12px var(--pw-sans)}
.savepill svg{width:15px;height:15px}

/* reacciones */
.reacts{display:flex;gap:8px;flex-wrap:wrap}
.react{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:100px;
  border:1px solid var(--pw-border);background:#fff;color:var(--pw-text-soft);
  font:13px var(--pw-sans);cursor:pointer;transition:.15s var(--ease)}
.react b{font-weight:600;font-variant-numeric:tabular-nums}
.react:hover{transform:translateY(-1px);box-shadow:var(--sh-xs)}
.react.on{background:rgba(82,183,136,.16);border-color:rgba(45,106,79,.38);color:var(--pw-bosque-dark)}

/* ── HERO (1ª tarjeta de cada edición) ─────────────────────────────────── */
.hero{padding:18px 18px 16px;gap:12px;box-shadow:var(--sh-hero);border-color:rgba(255,255,255,.7)}
.hero-title{font:600 27px/1.06 var(--pw-serif);letter-spacing:-.7px;color:var(--pw-carbon);margin:2px 0 0}
.hero-title .dot{color:var(--pw-sendero)}
.hero-sub{font:400 14px/1.5 var(--pw-sans);color:var(--pw-text-soft);margin:0}
.hero-art{position:relative;border-radius:13px;overflow:hidden;margin-top:2px}

/* calendario */
.cal{position:relative;background:var(--crema);border:1px solid var(--pw-border);border-radius:12px;padding:12px 12px 30px}
.cal-dow,.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal-dow{font:600 9px var(--pw-sans);color:var(--pw-text-muted);text-transform:uppercase;margin-bottom:5px}
.cal-days{font:500 11px var(--pw-sans);color:var(--pw-text-soft)}
.cal-days span{padding:4px 0;position:relative}
.cal-days .mut{color:var(--pw-text-muted)}
.cal-days .book::after{content:"";position:absolute;bottom:1px;left:50%;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:var(--pw-sendero)}
.cal-days .today{display:flex;align-items:center;justify-content:center;padding:0}
.cal-days .today i{width:22px;height:22px;border-radius:50%;background:var(--pw-bosque);color:#fff;font-weight:700;display:grid;place-items:center;font-style:normal}
.cal-slot{position:absolute;right:10px;bottom:-14px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--pw-border);border-radius:10px;padding:6px 9px;box-shadow:var(--sh-md)}
.cal-slot .av{width:26px;height:26px;border-radius:50%;background:var(--pw-sendero);color:#fff;font:700 11px var(--pw-sans);display:grid;place-items:center}
.cal-slot .t{font:700 10px var(--pw-sans);color:var(--pw-bosque)}
.cal-slot .n{font:600 11px var(--pw-sans)}
.cal-slot .m{font-size:9.5px;color:var(--pw-text-muted)}

/* cabra scene */
.goat-scene{position:relative;height:150px;display:grid;place-items:center;
  background:radial-gradient(150px 120px at 50% 46%,rgba(82,183,136,.16),transparent 70%)}
.goat{width:112px;height:auto;filter:drop-shadow(0 12px 16px rgba(27,67,50,.20));animation:bob 4s var(--ease) infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.spark{position:absolute;font-size:14px;animation:tw 3s var(--ease) infinite}
@keyframes tw{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.12)}}
.chip-float{position:absolute;background:#fff;border-radius:100px;box-shadow:var(--sh-md);padding:5px 11px 5px 6px;font:700 11px var(--pw-sans);display:flex;align-items:center;gap:6px}
.chip-float .cf{width:19px;height:19px;border-radius:50%;background:var(--pw-success-bg);color:var(--pw-bosque);display:grid;place-items:center;font-size:10px}
.gift{position:absolute;bottom:4px;font-size:34px;filter:drop-shadow(0 6px 9px rgba(27,67,50,.18));animation:bob 3.4s var(--ease) infinite .3s}

/* podio */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:9px;height:172px;padding:8px 8px 0}
.pod{display:flex;flex-direction:column;align-items:center;flex:1;max-width:92px}
.pod-av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:800 15px var(--pw-sans);color:#fff;margin-bottom:7px;position:relative;border:2.5px solid #fff;box-shadow:var(--sh-sm)}
.pod-med{position:absolute;bottom:-5px;right:-5px;font-size:17px}
.pod-nm{font:700 10.5px var(--pw-sans);text-align:center;margin-bottom:6px;line-height:1.1}
.pod-bl{width:100%;border-radius:11px 11px 0 0;display:grid;place-items:start center;padding-top:9px;color:#fff;font:700 20px var(--pw-serif);position:relative}
.pod-pt{position:absolute;bottom:7px;font:700 9px var(--pw-sans);opacity:.9}
.pod-1 .pod-bl{height:120px;background:linear-gradient(180deg,var(--pw-oro),#C08A2E)}
.pod-2 .pod-bl{height:92px;background:linear-gradient(180deg,#B9C0C6,var(--pw-plata))}
.pod-3 .pod-bl{height:70px;background:linear-gradient(180deg,#CE9560,var(--pw-bronce))}
.pod-1 .pod-av{background:linear-gradient(135deg,#2D6A4F,#52B788);width:52px;height:52px}
.pod-2 .pod-av{background:linear-gradient(135deg,#5E6B74,#93A0A6)}
.pod-3 .pod-av{background:linear-gradient(135deg,#B97A3D,#D19A63)}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.confetti i{position:absolute;top:-10px;width:6px;height:6px;border-radius:1px;opacity:.7;animation:fall 4s linear infinite}
@keyframes fall{to{transform:translateY(200px) rotate(240deg)}}

/* tu posición */
.younow{background:linear-gradient(140deg,#FFFDF6,#FBF3DC);border:1px solid rgba(233,196,106,.5);box-shadow:var(--sh-sm)}
.younow-pos{font:500 30px var(--pw-serif);line-height:1;margin-top:4px}
.track{height:8px;border-radius:100px;background:rgba(45,106,79,.12);overflow:hidden;margin-top:12px}
.track i{display:block;height:100%;border-radius:100px;background:var(--pw-amanecer)}
.younow-cap{font-size:12px;color:var(--pw-text-soft);margin-top:6px}
.younow-cap b{color:var(--pw-carbon)}

/* cómo sumar puntos */
.howto{display:flex;gap:6px;margin-top:2px}
.howto-c{flex:1;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 2px}
.howto-c svg{width:22px;height:22px;stroke:var(--pw-bosque)}
.howto-c .l{font-size:11.5px;line-height:1.3;color:var(--pw-carbon)}
.howto-sep{width:1px;background:var(--pw-border);align-self:stretch}

/* referido */
.refer{border-radius:16px;padding:18px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(140deg,#1B4332,#2D6A4F);box-shadow:var(--sh-lg)}
.refer::after{content:"";position:absolute;inset:0;background:radial-gradient(260px 150px at 92% -20%,rgba(82,183,136,.45),transparent 70%)}
.refer>*{position:relative}
.refer-k{font:700 11px var(--pw-sans);text-transform:uppercase;letter-spacing:1.2px;color:var(--pw-amanecer)}
.refer-h{font:500 20px/1.2 var(--pw-serif);letter-spacing:-.4px;margin:8px 0 0}
.refer-h i{font-style:italic}
.refer-x{font-size:13px;line-height:1.5;color:rgba(255,255,255,.82);margin:6px 0 0}
.refer-row{display:flex;gap:8px;align-items:center;margin-top:12px}
.refer-link{flex:1;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:9px 12px;font:12.5px var(--pw-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.refer-btn{flex:0 0 auto;padding:9px 15px;border-radius:10px;border:none;cursor:pointer;font:600 13px var(--pw-sans);background:var(--pw-amanecer);color:var(--pw-carbon);transition:.2s}
.refer-btn.done{background:var(--pw-sendero);color:#fff}

/* premios hero + catálogo */
.pz-hero{position:relative;overflow:hidden;background:linear-gradient(140deg,#FBF3DC 0%,#F0F7F2 60%,#E8F2EC 100%)}
.pz-pts{font:700 22px var(--pw-sans);margin-top:6px}
.pz-pts small{font-size:14px;color:var(--pw-text-soft);font-weight:400}
.pz-title{font:500 18px/1.18 var(--pw-serif);letter-spacing:-.3px;margin:2px 0 0}
.pz-art{position:absolute;right:2px;bottom:0;width:150px;height:150px;pointer-events:none}
.row{display:flex;gap:10px;overflow-x:auto;margin:0 -2px;padding:2px;scrollbar-width:none}
.row::-webkit-scrollbar{height:0}
.prize{flex:0 0 auto;width:132px;background:var(--crema);border:1px solid var(--pw-border);border-radius:12px;padding:13px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.prize-ic{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:#fff;border:1px solid var(--pw-border);font-size:20px}
.prize-t{font:600 12.5px var(--pw-sans);line-height:1.2}
.prize-m{font-size:10.5px;color:var(--pw-text-muted)}

/* encuesta */
.poll-opt{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:10px 13px;border-radius:9px;border:1px solid var(--pw-border);background:var(--crema);
  cursor:pointer;overflow:hidden;text-align:left;width:100%;font-family:var(--pw-sans)}
.poll-opt .fill{position:absolute;inset:0;background:rgba(82,183,136,.16);border-radius:9px;width:0;transition:width .5s var(--ease)}
.poll-opt .lb{position:relative;font-size:13.5px;color:var(--pw-carbon)}
.poll-opt .pc{position:relative;font:700 12.5px var(--pw-sans);color:var(--pw-bosque)}

.feed-foot{text-align:center;padding:6px 0 2px;font-size:11.5px;color:var(--pw-text-muted)}

/* pill reabrir */
.reopen{position:fixed;top:24px;right:24px;z-index:20;display:none;align-items:center;gap:9px;
  padding:11px 16px;border-radius:100px;background:var(--pw-bosque-dark);color:#fff;border:none;cursor:pointer;
  font:600 14px var(--pw-sans);box-shadow:var(--sh-lg)}
.reopen.show{display:flex}
.reopen .n{min-width:20px;height:20px;padding:0 6px;border-radius:100px;background:var(--pw-amanecer);color:var(--pw-carbon);font:700 12px var(--pw-sans);display:inline-flex;align-items:center;justify-content:center}
.reopen svg{width:16px;height:16px}

@media(max-width:440px){
  .ghost-side,.ghost-main{display:none}
  .drawer{width:100%;border-left:none}
}
</style>
</head>
<body>
<!-- App fantasma (contexto) -->
<div class="ghost">
  <div class="ghost-side">
    <div class="ghost-logo"><svg width="26" height="26" viewBox="0 0 32 32" fill="none"><circle cx="23" cy="9" r="4" fill="#E9C46A"/><path d="M2 27L11 12l6 9 3-5 8 11H2z" fill="#2D6A4F"/><path d="M9 27l6-10 5 8-2 2H9z" fill="#52B788"/></svg><span>pathway<span style="color:var(--pw-sendero)">.</span></span></div>
    <div class="ghost-nav on">📊 Resumen</div>
    <div class="ghost-nav">👥 Clientes</div>
    <div class="ghost-nav">🔗 Links</div>
    <div class="ghost-nav">💳 Pagos</div>
    <div class="ghost-nav">🔒 Web Analytics</div>
  </div>
  <div class="ghost-main">
    <div class="ghost-h">Hola, Micaela</div>
    <div class="ghost-sub">Este es el resumen de tu semana.</div>
    <div class="ghost-grid"><div class="ghost-card"></div><div class="ghost-card"></div><div class="ghost-card"></div></div>
    <div class="ghost-wide"></div>
  </div>
</div>
<div class="ghost-dim" id="dim"></div>

<!-- Pill reabrir -->
<button class="reopen" id="reopen" onclick="nvOpen()">
  <svg viewBox="0 0 24 24" fill="none" stroke="#E9C46A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/></svg>
  Novedades <span class="n">4</span>
</button>

<!-- EL CAJÓN -->
<div class="drawer" id="drawer">
  <div class="dw-head">
    <div class="dw-top">
      <div>
        <div class="dw-title">Novedades<span class="dot">.</span></div>
        <div class="dw-kick">Lo último de Pathway para ti</div>
      </div>
      <div class="dw-actions">
        <a class="dw-viewall" onclick="nvToast('Historial de novedades')">Ver todas</a>
        <button class="dw-x" onclick="nvClose()" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="dw-meta">
      <div class="dw-rot"><span class="pulse"></span> Rotación semanal · <span id="week-lbl">Edición 1 de 4</span></div>
      <button class="dw-seen" onclick="nvToast('Marcadas como leídas')">Marcar leídas</button>
    </div>
  </div>
  <div class="feed" id="feed"></div>
</div>

<script>
/* ═══════════════ helpers ═══════════════ */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function nvToast(m){var t=document.getElementById('nv-toast');
  if(!t){t=document.createElement('div');t.id='nv-toast';
    t.style.cssText='position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:#1B4332;color:#fff;padding:12px 20px;border-radius:13px;font:600 14px Inter,sans-serif;box-shadow:0 16px 40px rgba(0,0,0,.25);opacity:0;transition:.3s cubic-bezier(.16,1,.3,1);z-index:99;pointer-events:none';document.body.appendChild(t);}
  t.textContent=m;t.style.opacity='1';t.style.transform='translateX(-50%) translateY(0)';
  clearTimeout(t._t);t._t=setTimeout(function(){t.style.opacity='0';t.style.transform='translateX(-50%) translateY(20px)';},1600);}
function nvClose(){document.getElementById('drawer').classList.add('closed');document.getElementById('reopen').classList.add('show');document.getElementById('dim').style.opacity='0';}
function nvOpen(){document.getElementById('drawer').classList.remove('closed');document.getElementById('reopen').classList.remove('show');document.getElementById('dim').style.opacity='';}
function nvDismiss(btn){var c=btn.closest('.card,.refer,.younow');if(c){c.style.transition='.3s cubic-bezier(.16,1,.3,1)';c.style.opacity='0';c.style.transform='translateX(24px)';setTimeout(function(){c.remove();},280);}}
function nvReact(el){el.classList.toggle('on');var b=el.querySelector('b');var n=+b.dataset.n;b.textContent=el.classList.contains('on')?(n+1):n;}
function nvCopy(btn){btn.classList.add('done');btn.textContent='¡Copiado!';nvToast('Enlace de invitación copiado');setTimeout(function(){btn.classList.remove('done');btn.textContent='Copiar';},2000);}
function nvVote(btn,pct){var wrap=btn.parentNode;Array.prototype.forEach.call(wrap.children,function(o){var f=o.querySelector('.fill');var p=o.querySelector('.pc');if(f){f.style.width=f.dataset.pct+'%';}if(p){p.textContent=p.dataset.pct+'%';}o.style.fontWeight='';});btn.querySelector('.lb').style.fontWeight='700';nvToast('¡Gracias por tu voto!');}

function svg(d,cls){return "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'"+(cls?" class='"+cls+"'":"")+"><path d='"+d+"'/></svg>";}
var check="<span class='checkdot'>✓</span>";
function xbtn(light){return "<button class='dismiss"+(light?" dismiss-lt":"")+"' onclick='nvDismiss(this)'>✕</button>";}
function reacts(a,b,c){return "<div class='reacts'>"+
  "<div class='react' onclick='nvReact(this)'>❤️<b data-n='"+a+"'>"+a+"</b></div>"+
  "<div class='react' onclick='nvReact(this)'>🔥<b data-n='"+b+"'>"+b+"</b></div>"+
  "<div class='react' onclick='nvReact(this)'>💪<b data-n='"+c+"'>"+c+"</b></div></div>";}
function tagline(sem,cat){return "<div class='tagline'><span class='semana'>"+sem+"</span><span class='cattag'>"+cat+"</span></div>";}

/* ═══════════════ EDICIÓN 1 · PRODUCTO (Calendario) ═══════════════ */
function ed1(){
  var days='';
  var dim=[6,7,13,14,20,21,27,28];
  for(var d=1;d<=28;d++){var cls=[];if(dim.indexOf(d)>=0)cls.push('mut');if(d===9||d===25)cls.push('book');
    if(d===20){days+="<span class='today'><i>20</i></span>";continue;}
    days+="<span class='"+cls.join(' ')+"'>"+d+"</span>";}
  return ""+
  /* HERO */
  "<div class='card hero'>"+xbtn()+
    tagline('Semana 1','Nueva función')+
    "<div class='hero-title'>Adiós Calendly. Hola calendario Pathway<span class='dot'>.</span></div>"+
    "<p class='hero-sub'>Tus clientes reservan sesiones directamente desde Pathway. Sin apps externas, con tu marca.</p>"+
    "<div class='savepill'>"+svg('M12 3v18M15 9.5a3 3 0 0 0-3-1.5c-1.7 0-3 .9-3 2s1.3 2 3 2 3 1 3 2-1.3 2-3 2a3 3 0 0 1-3-1.5')+" Ahorrás los US$14/mes de Calendly</div>"+
    "<div class='hero-art'><div class='cal'>"+
      "<div class='cal-dow'><span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span></div>"+
      "<div class='cal-days'>"+days+"</div>"+
      "<div class='cal-slot'><span class='av'>A</span><div><div class='t'>09:00 · Lun 20</div><div class='n'>Alejandra</div><div class='m'>Llamada · 30 min</div></div></div>"+
    "</div></div>"+
    "<div style='display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px'>"+
      "<button class='cta' onclick=\"nvToast('Abriendo Agenda…')\">Activar calendario</button>"+reacts(31,12,9)+
    "</div>"+
  "</div>"+
  /* changelog */
  "<div class='card'>"+xbtn()+
    "<span class='eyebrow'>Mejoras de esta semana</span>"+
    "<div style='display:flex;flex-direction:column;gap:10px'>"+
      "<div style='display:flex;gap:10px;align-items:flex-start'>"+check+"<span style='font-size:13.5px'>Recordatorios automáticos de sesión por WhatsApp</span></div>"+
      "<div style='display:flex;gap:10px;align-items:flex-start'>"+check+"<span style='font-size:13.5px'>Exportá el informe de tu cliente en PDF</span></div>"+
      "<div style='display:flex;gap:10px;align-items:flex-start'>"+check+"<span style='font-size:13.5px'>Tu link público carga un 50% más rápido</span></div>"+
    "</div>"+
    "<a class='link' onclick=\"nvToast('Ver changelog')\">Ver todos los cambios →</a>"+
  "</div>"+
  /* reseña → SOLO PUNTOS */
  "<div class='card'>"+xbtn()+
    "<div style='display:flex;gap:14px;align-items:center'>"+
      "<div style='flex:0 0 auto;width:56px;height:56px;border-radius:14px;background:var(--pw-warning-bg);display:grid;place-items:center;font-size:26px'>⭐</div>"+
      "<div style='flex:1'><span class='eyebrow'>Sumá puntos</span><div style='font:500 17px/1.2 var(--pw-serif);margin-top:3px'>Dejá tu reseña y ganá <span style='color:var(--pw-bosque);font-style:italic'>+100 pts</span></div></div>"+
      "<div class='chip-pts'>+100</div>"+
    "</div>"+
    "<p class='body'>Contanos tu experiencia con Pathway. Publicamos las mejores en la web y sumás 100 puntos al ranking.</p>"+
    "<button class='cta' onclick=\"nvToast('Abriendo reseñas…')\">Escribir reseña</button>"+
  "</div>";
}

/* ═══════════════ EDICIÓN 2 · IA PATHWAY ═══════════════ */
function ed2(){
  return ""+
  "<div class='card hero'>"+xbtn()+
    tagline('Semana 2','Presentamos')+
    "<div class='hero-title'>IA Pathway<span class='dot'>.</span></div>"+
    "<p class='hero-sub'>Tu asistente entrenado para coaching de carrera. Redacta y prepara por vos; vos ponés el criterio.</p>"+
    "<div class='hero-art'><div class='goat-scene'>"+
      "<span class='spark' style='top:14px;left:48px'>✨</span>"+
      "<span class='spark' style='top:26px;right:44px;animation-delay:1s'>✨</span>"+
      "<img class='goat' src='assets/cabra/frente.gif' alt='La cabra de Pathway'>"+
      "<div class='chip-float' style='top:16px;right:14px'><span class='cf'>📄</span> Informe listo</div>"+
      "<div class='chip-float' style='bottom:12px;left:12px'><span class='cf'>in</span> LinkedIn</div>"+
    "</div></div>"+
    "<div style='display:flex;flex-direction:column;gap:9px'>"+
      "<div style='display:flex;gap:9px;align-items:center'>"+check+"<span style='font-size:13.5px'>Informes de diagnóstico</span></div>"+
      "<div style='display:flex;gap:9px;align-items:center'>"+check+"<span style='font-size:13.5px'>Revisión de CV y LinkedIn</span></div>"+
      "<div style='display:flex;gap:9px;align-items:center'>"+check+"<span style='font-size:13.5px'>Preparación de sesiones</span></div>"+
      "<div style='display:flex;gap:9px;align-items:center'>"+check+"<span style='font-size:13.5px'>Respuestas personalizadas</span></div>"+
    "</div>"+
    "<div style='display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:4px'>"+
      "<button class='cta' onclick=\"nvToast('Abriendo IA Pathway…')\">Probar IA Pathway</button>"+reacts(47,29,11)+
    "</div>"+
  "</div>"+
  /* tip */
  "<div class='card' style='background:var(--pw-niebla-2);flex-direction:row;align-items:center;gap:12px'>"+xbtn()+
    "<div style='flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:var(--pw-warning-bg);display:grid;place-items:center;color:var(--pw-bosque)'>"+svg('M9 18h6M10 22h4M15 14c.2-1 .7-1.7 1.4-2.5A4.6 4.6 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5A4.6 4.6 0 0 1 9 14')+"</div>"+
    "<div><span class='eyebrow'>Consejo del día</span><p style='font-size:13px;line-height:1.5;margin:3px 0 0'>Pedile a la IA el informe apenas termina la primera sesión: el cliente lo recibe el mismo día y percibe más valor.</p></div>"+
  "</div>";
}

/* ═══════════════ EDICIÓN 3 · RANKING ═══════════════ */
function ed3(){
  var conf='';var cols=['#52B788','#E9C46A','#2D6A4F','#D4A24C'];
  for(var i=0;i<9;i++){conf+="<i style='left:"+(8+i*10)+"%;background:"+cols[i%4]+";animation-delay:"+(i*.45)+"s'></i>";}
  return ""+
  "<div class='card hero'>"+xbtn()+
    tagline('Semana 3','Ranking semanal')+
    "<div class='hero-title'>Los coaches del mes<span class='dot'>.</span></div>"+
    "<p class='hero-sub'>Sumá puntos con cada logro y escalá el podio de la comunidad.</p>"+
    "<div class='hero-art'><div class='podium'><div class='confetti'>"+conf+"</div>"+
      pod('pod-2','MA','Marta A.','🥈','1.760')+
      pod('pod-1','JB','Juan B.','🥇','1.840')+
      pod('pod-3','PG','Pedro G.','🥉','1.700')+
    "</div></div>"+
    reacts(22,18,7)+
  "</div>"+
  /* tu posición */
  "<div class='card younow'>"+xbtn()+
    "<span class='eyebrow'>Tu posición</span>"+
    "<div class='younow-pos'>#7</div>"+
    "<div class='track'><i style='width:78%'></i></div>"+
    "<div class='younow-cap'>Te faltan <b>160 pts</b> para entrar al podio.</div>"+
  "</div>"+
  /* cómo sumar puntos (SOLO puntos) */
  "<div class='card'>"+xbtn()+
    "<span class='eyebrow'>Cómo sumar puntos</span>"+
    "<div class='howto'>"+
      howc('M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 7a4 4 0 1 0 0 .01M19 8v6M22 11h-6','Activar un cliente nuevo','+50')+
      "<div class='howto-sep'></div>"+
      howc('M12 2 15 9l7 .5-5.5 4.5 2 7L12 17l-6.5 4 2-7L2 9.5 9 9z','Dejar una reseña','+100')+
      "<div class='howto-sep'></div>"+
      howc('M17 21v-2a4 4 0 0 0-3-3.87M9 21v-2a4 4 0 0 1 3-3.87M9 7a3 3 0 1 0 0 .01M16 8a2.5 2.5 0 1 0 0 .01','Recomendar a otro coach','+150')+
    "</div>"+
  "</div>"+
  /* referido +15 días REAL */
  "<div class='refer'>"+xbtn(true)+
    "<div class='refer-k'>Recompensa de la semana</div>"+
    "<div class='refer-h'>Recomendá y ganá <i>+15 días</i><span style='color:var(--pw-sendero)'>.</span></div>"+
    "<p class='refer-x'>Cuando el coach que invitás <b>paga su primer mes</b>, a los dos se les extiende la suscripción 15 días. Sin límite, y sumás +150 pts.</p>"+
    "<div class='refer-row'><div class='refer-link'>pathwaycareercoach.com/r/micaela</div><button class='refer-btn' onclick='nvCopy(this)'>Copiar</button></div>"+
  "</div>";
}
function pod(cls,av,nm,med,pts){return "<div class='pod "+cls+"'><div class='pod-av'>"+av+"<span class='pod-med'>"+med+"</span></div><div class='pod-nm'>"+esc(nm)+"</div><div class='pod-bl'>"+(cls==='pod-1'?'1':cls==='pod-2'?'2':'3')+"<span class='pod-pt'>"+pts+"</span></div></div>";}
function howc(d,label,pts){return "<div class='howto-c'>"+svg(d)+"<div class='l'>"+esc(label)+"</div><div class='chip-pts'>"+pts+"</div></div>";}

/* ═══════════════ EDICIÓN 4 · PREMIOS (solo cumplibles) ═══════════════ */
function ed4(){
  return ""+
  "<div class='card hero pz-hero'>"+xbtn()+
    tagline('Semana 4','Premios')+
    "<div style='position:relative;z-index:2;max-width:230px'>"+
      "<div class='pz-pts'>1.240 <small>pts</small></div>"+
      "<div class='pz-title'>Canjeá tus puntos por premios<span class='dot' style='color:var(--pw-sendero)'>.</span></div>"+
      "<p class='body' style='margin-top:6px'>Cambialos por días gratis, descuentos y beneficios de Pathway.</p>"+
      "<button class='cta' onclick=\"nvToast('Abriendo catálogo…')\">Ver catálogo de premios</button>"+
    "</div>"+
    "<div class='pz-art'>"+
      "<span class='spark' style='left:10px;top:22px'>✨</span>"+
      "<span class='spark' style='left:34px;top:6px;animation-delay:1.1s'>⭐</span>"+
      "<img class='goat' src='assets/cabra/salta.gif' alt='La cabra de Pathway' style='position:absolute;right:2px;bottom:8px;width:78px;animation:none'>"+
      "<span class='gift' style='right:46px'>🎁</span>"+
    "</div>"+
  "</div>"+
  /* catálogo REAL */
  "<div class='card'>"+xbtn()+
    "<div style='display:flex;align-items:center;justify-content:space-between'><span class='eyebrow'>Premios destacados</span><a class='link' onclick=\"nvToast('Ver catálogo')\">Ver todos →</a></div>"+
    "<div class='row'>"+
      prize('🎁','15 días gratis','en tu plan','500 pts')+
      prize('🏷️','20% de descuento','próximo mes','700 pts')+
      prize('🎥','Sesión 1:1','con Micaela','900 pts')+
      prize('📄','Pack de plantillas','CV + emails','300 pts')+
      prize('⭐','Perfil destacado','1 semana','600 pts')+
    "</div>"+
  "</div>"+
  /* encuesta (gratis, engagement) */
  "<div class='card'>"+xbtn()+
    "<span class='eyebrow'>Encuesta rápida</span>"+
    "<div style='font:500 18px/1.25 var(--pw-serif)'>¿Qué construimos después?</div>"+
    "<div style='display:flex;flex-direction:column;gap:8px'>"+
      pollOpt('Recordatorios por WhatsApp',46)+
      pollOpt('App móvil para clientes',34)+
      pollOpt('Videollamada integrada',20)+
    "</div>"+
    "<div style='font-size:11.5px;color:var(--pw-text-muted)'>Tocá una opción para votar · 312 coaches votaron</div>"+
  "</div>";
}
function prize(ic,t,m,pts){return "<div class='prize'><div class='prize-ic'>"+ic+"</div><div class='prize-t'>"+esc(t)+"</div><div class='prize-m'>"+esc(m)+"</div><div class='chip-pts'>"+pts+"</div></div>";}
function pollOpt(label,pct){return "<button class='poll-opt' onclick='nvVote(this,"+pct+")'><span class='fill' data-pct='"+pct+"'></span><span class='lb'>"+esc(label)+"</span><span class='pc' data-pct='"+pct+"'></span></button>";}

/* ═══════════════ rotación + tabs ═══════════════ */
var EDS=[{t:'Producto',build:ed1},{t:'IA Pathway',build:ed2},{t:'Ranking',build:ed3},{t:'Premios',build:ed4}];
function isoWeek(){var n=new Date();var d=new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()));var day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);var ys=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil((((d-ys)/86400000)+1)/7);}
var cur=isoWeek()%EDS.length;
function renderTabs(){var w=document.getElementById('tabs');w.innerHTML='';EDS.forEach(function(e,i){var b=document.createElement('button');b.className='tab'+(i===cur?' on':'');b.textContent=e.t;b.onclick=function(){cur=i;render();};w.appendChild(b);});}
function render(){document.getElementById('feed').innerHTML=EDS[cur].build();document.getElementById('week-lbl').textContent='Edición '+(cur+1)+' de 4';Array.prototype.forEach.call(document.querySelectorAll('#tabs .tab'),function(b,i){b.classList.toggle('on',i===cur);});document.getElementById('feed').scrollTop=0;}
renderTabs();render();
</script>
</body>
</html>
