function setF(k,v){var l=get();if(!l)return;l[k]=v;save();if(["n","est","ig","lado"].indexOf(k)>=0)lst();if(k==="est"||k==="conv"||k==="dh"||k==="dpais"||k==="lado")mn();renderBoard();renderAlert();}
function delL(){var l=get();if(!l)return;if(!confirm("¿Borrar a "+l.n+"?"))return;DB.leads=DB.leads.filter(function(x){return x.id!==l.id;});cur=null;save();lst();mn();}
function addN(){var t=document.getElementById("ni").value.trim();if(!t)return;var l=get();l.notas.unshift([new Date().toLocaleDateString("es-ES")+" "+new Date().toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"}),t]);save();document.getElementById("ni").value="";rTl();rSug();}
function delN(i){var l=get();l.notas.splice(i,1);save();rTl();}

function lst(){
 var q=(document.getElementById("q").value||"").toLowerCase();
 var fb=document.getElementById("fl");
 fb.innerHTML='<button class="'+(FILT===""?"on":"")+'" onclick="FILT=\'\';lst()">Todos ('+DB.leads.length+')</button>'+
   ESTADOS.map(function(e){var c=DB.leads.filter(function(l){return l.est===e[0];}).length;return c?'<button class="'+(FILT===e[0]?"on":"")+'" onclick="FILT=\''+e[0]+'\';lst()">'+e[1]+' ('+c+')</button>':"";}).join("");
 var arr=DB.leads.filter(function(l){return (FILT===""||l.est===FILT)&&((l.n+" "+l.ig).toLowerCase().indexOf(q)>=0);});
 document.getElementById("cnt").textContent=DB.leads.length+" leads";
 document.getElementById("list").innerHTML=arr.length?arr.map(function(l){
   return '<div class="ld'+(l.id===cur?' on':'')+'" onclick="sel(\''+l.id+'\')"><div class="n">'+ladoDot(l)+esc(l.n)+
   ' <span class="pill s-'+l.est+'">'+estLbl(l.est)+'</span></div><div class="m">'+esc(l.ig||l.tipo)+
   (l.est==="demo"&&!l.conv?' · <span class="warn">⚠ sin convocatoria</span>':"")+'</div></div>';
 }).join(""):'<p class="hint" style="text-align:center;margin-top:20px">Sin resultados.</p>';
}

function tzCalc(){
 var l=get();if(!l||!l.dh||!l.dpais)return "";
 var off=TZ[l.dpais];if(off===undefined)return "";
 var p=l.dh.split(":");if(p.length<2)return "";
 var mins=(+p[0])*60+(+p[1])+(2-off)*60; mins=((mins%1440)+1440)%1440;
 var h=Math.floor(mins/60),m=mins%60;
 return (l.ddia?l.ddia+" ":"")+("0"+h).slice(-2)+":"+("0"+m).slice(-2)+" hora España";
}

function mn(){
 var l=get(),m=document.getElementById("main");
 if(!l){m.innerHTML='<div class="empty"><div class="b">📇</div><p>Elegí un lead.</p></div>';return;}
 var tzr=tzCalc();
 m.innerHTML=
 '<div class="pn"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px">'+
 '<input class="nm" value="'+esc(l.n)+'" onchange="setF(\'n\',this.value)">'+
 '<button class="g t" style="color:var(--bd)" onclick="delL()">Borrar</button></div>'+
 '<div style="margin:-4px 0 12px;font-size:12px;display:flex;align-items:center;gap:7px;flex-wrap:wrap"><span style="color:var(--mu)">Último mensaje:</span><button class="t '+(l.lado==='ellos'?'p':'')+'" onclick="setF(\'lado\',\'ellos\')">🔴 Me escribió (responder)</button><button class="t '+(l.lado!=='ellos'?'p':'')+'" onclick="setF(\'lado\',\'yo\')">⚪ Le escribí (esperando)</button></div>'+
 '<div class="row3">'+sel3("Tipo","tipo",l.tipo,["Coach","Candidato","Empresa","Otro"])+
 selEst(l.est)+inp("Instagram / @","ig",l.ig)+'</div>'+
 '<div class="row3">'+inp("Ubicación","loc",l.loc)+inp("Email","mail",l.mail)+inp("Herramientas que usa","herr",l.herr)+'</div>'+
 txt("Contexto / situación","ctx",l.ctx)+inp("Próximo paso","px",l.px)+'</div>'+

 '<div class="pn"><h2>📅 Demo / reunión</h2>'+
 '<div style="margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="p t" onclick="window.open(CALENDLY,\'_blank\')">📅 Abrir mi Calendly</button><button class="t" onclick="cp(this,CALENDLY)">Copiar link de reserva</button></div>'+
 '<div class="row3">'+inp("Día (ej: lunes / martes 19)","ddia",l.ddia)+
 inp("Hora local de la persona (HH:MM)","dh",l.dh)+
 sel3("País de la persona","dpais",l.dpais,Object.keys(TZ))+'</div>'+
 (tzr?'<div class="tz">Hora de la persona: <b>'+esc(l.dh)+' ('+esc(l.dpais)+')</b><div class="tzr">= '+esc(tzr)+'</div></div>':'<p class="hint">Completá hora local + país y te calculo la hora en España (no te equivoques de horario).</p>')+
 '<div class="cv '+(l.conv?'si':'no')+'"><input type="checkbox" '+(l.conv?'checked':'')+' onchange="setF(\'conv\',this.checked)"> <b>'+(l.conv?'Convocatoria ENVIADA ✓':'⚠️ CONVOCATORIA SIN ENVIAR — mandala YA (tu problema #1)')+'</b></div></div>'+

 '<div class="pn"><h2>🗒️ Bitácora</h2><div class="nb"><textarea id="ni" placeholder="Qué te dijo / qué respondiste / en qué quedaron…"></textarea><button class="p" onclick="addN()">Agregar</button></div><ul class="tl" id="tl"></ul></div>'+

 '<div class="pn"><h2>💬 Asistente de respuestas</h2><div id="sug"></div><div id="ref" style="margin-top:12px"></div></div>';
 rTl();rSug();rRef();
}
function inp(L,k,v){return '<div class="fl"><label>'+L+'</label><input value="'+esc(v)+'" onchange="setF(\''+k+'\',this.value)"></div>';}
function txt(L,k,v){return '<div class="fl"><label>'+L+'</label><textarea onchange="setF(\''+k+'\',this.value)">'+esc(v)+'</textarea></div>';}
function sel3(L,k,v,o){return '<div class="fl"><label>'+L+'</label><select onchange="setF(\''+k+'\',this.value)"><option value=""></option>'+o.map(function(x){return '<option'+(x===v?' selected':'')+'>'+x+'</option>';}).join("")+'</select></div>';}
function selEst(v){return '<div class="fl"><label>Estado</label><select onchange="setF(\'est\',this.value)">'+ESTADOS.map(function(e){return '<option value="'+e[0]+'"'+(e[0]===v?' selected':'')+'>'+e[1]+'</option>';}).join("")+'</select></div>';}
function rTl(){var l=get(),t=document.getElementById("tl");if(!t)return;t.innerHTML=l.notas.length?l.notas.map(function(n,i){return '<li><button class="d" onclick="delN('+i+')">borrar</button><div class="ts">'+esc(n[0])+'</div><div class="tx">'+esc(n[1])+'</div></li>';}).join(""):'<li style="border:none;padding-left:0"><span class="hint">Sin notas.</span></li>';}

/* ===== Biblioteca de respuestas (lo que funciona, basado en tus charlas) ===== */
var KB=[
{id:"opener",kw:["nuevo","opener","frío","frio","arrancar","primer"],t:"Opener que funciona (análisis de mercado)",r:"Hola {nombre} 😊 Estoy haciendo un pequeño análisis de mercado sobre las plataformas/CRMs que usan los coaches en su día a día. ¿Me contás qué herramientas usás vos para gestionar a tus clientes? (¡tu mejor apertura — la gente baja la guardia y te cuenta su stack!)"},
{id:"modelo",kw:["marketplace","vendo a través","mis clientas usan","no me queda claro","cómo funciona","modelo"],t:"Aclarar el modelo (no es marketplace)",r:"¡Buenísima pregunta! Te aclaro: tus clientas SÍ usan la plataforma, pero entran a un portal con TU marca (tu logo, tus colores) — para ellas es tu espacio. Vos NO vendés 'a través' nuestro: seguís cobrando como ya lo hacés, con tu cuenta y tu precio. Pathway no toca tu dinero — 0% de comisión. Es tu herramienta de trabajo invisible. ¿Te lo muestro en 15 min y lo ves clarísimo? 😊"},
{id:"latam",kw:["caro","méxico","mexico","argentina","colombia","perú","peru","chile","latam","euro","€","precio","económico","economico"],t:"Objeción precio LatAm",r:"Te entiendo, en LatAm el € pega distinto. Pensalo así: Pathway no es un gasto más, REEMPLAZA las herramientas sueltas que ya usás y te devuelve 5-10 h por semana. Con que sumes 1 cliente al mes ya se paga sola, y cobrás el 100% (0% comisión). ¿Te lo muestro en 15 min y vemos tu caso concreto?"},
{id:"trial",kw:["gratis","prueba","trial","cuánto sale","cuanto sale","precio","cuesta","sin tarjeta"],t:"Trial / precio",r:"["+TRIAL+"]\n\nUna vez definido: 'Tiene {X} días gratis para probarla, y los planes arrancan en €58/mes sin comisión sobre lo que vos cobrás. En la demo te muestro cuál te conviene.'"},
{id:"calendly",kw:["agendar","reservar","calendario","calendly","disponibilidad","convocatoria","invitación","invitacion","cuando podemos"],t:"Mandar link de reserva (Calendly)",r:"¡Genial! Para no marear con horarios, reservá vos el que mejor te quede acá 👉 "+CALENDLY+" \nApenas confirmás te llega la invitación con el link automáticamente 😊 (así no se cuelga ninguna convocatoria)"},
{id:"reengage",kw:["registrada","registró","registro","ya se anotó","trial corriendo","probarla"],t:"Re-engage registrada (trial corre)",r:"¡Hola {nombre}! Para mostrarte en 15 min cómo sacarle el jugo a la plataforma, reservá el horario que prefieras acá 👉 "+CALENDLY+" \nEn la llamada te dejo tu portal listo con tu marca 😊 (NO preguntes '¿pudiste probarla?' — da salida fácil al no)"},
{id:"followup",kw:["no responde","sin respuesta","follow","seguir","insistir","esperando"],t:"Follow-up (con link)",r:"¡Hola {nombre}! 😊 ¿Te muestro la plataforma en 15 min? Reservá el horario que te quede cómodo directamente acá 👉 "+CALENDLY+" \n(Mandar el link cierra mucho más que '¿te interesa?')"},
{id:"calido",kw:["hola mica","cálida","calida","entusiasta","respondió bien","me encanta"],t:"Respuesta cálida → demo",r:"¡Hola {nombre}! 😊 Te escribo porque vi que sos career coach — justo armé Pathway, una plataforma pensada para coaches como vos. ¿Te late que te la muestre rápido (15 min) y me decís qué te parece? 🙌"},
{id:"comision",kw:["comisión","comision","porcentaje","cómo ganás","como ganas","cobran"],t:"Comisión / cómo gana Pathway",r:"La plataforma NO cobra comisión a coaches. Vos gestionás los pagos con un link desde tu usuario o cobrás por fuera y das acceso con tu código. Pathway no accede a tu cliente ni a tus pagos. Nosotros vivimos de una suscripción mensual fija (Basic €58 / Pro €89)."},
{id:"cierre",kw:["disponibilidad","agendar","calendario","cuándo","cuando","horario"],t:"Cerrar demo (con Calendly)",r:"¡Genial! Reservá el horario que mejor te quede acá 👉 "+CALENDLY+" \nAl confirmar te llega la invitación con el link automáticamente, así lo tenés sí o sí 😊"}
];
var REF=[
["Pitch 30 seg","Pathway = plataforma SaaS para coaches de carrera. Reemplaza 5+ apps por un panel; tu cliente entra a un portal con TU marca. La IA arma informe + CV + carta + LinkedIn en 30 seg. Vos cobrás directo — 0% comisión."],
["Precios","Basic €58/mes (hasta 5 clientes) · Pro €89/mes (ilimitados, white-label). Sin permanencia, 0% comisión, datos exportables 90 d."],
["Trial — POLÍTICA",TRIAL],
["Calendly (link de demo)","Mandá ESTE link para que reserven solas (resuelve el olvido de convocatoria — al reservar les llega la invitación con el link automáticamente): "+CALENDLY],
["Qué incluye","CV optimizado, análisis ATS, simulador de entrevistas, portal del cliente con su marca, panel de gestión, directorio público."],
["Diferenciales","0% comisión · marca del coach · IA en 30 seg · reemplaza 5+ apps (5-10 h/sem) · setup en 1 tarde."],
["Lo que FUNCIONA","Opener 'análisis de mercado' (mejor que piropo genérico). Piropo específico + 'explorar colaboración' para perfiles con audiencia. Llevar a demo, NO info-dump en el DM. Cerrar día/hora concreto."],
["Errores a evitar","NO prometer 'un mes/30 días' de trial suelto. NO decir 'vi tu perfil' si no lo viste. NO sobrevender 'te conseguimos clientes'. NUNCA cerrar demo sin mandar la convocatoria en el momento."],
["Autoridad","Micaela Jairedin: +17 años RR.HH./recruiting, ex Amazon, +800 procesos, bilingüe ES/EN."]
];
function ltext(){var l=get();if(!l)return"";return [l.est,l.ctx,l.px,l.herr,l.loc].concat(l.notas.map(function(n){return n[1];})).join(" ").toLowerCase();}
function fill(s){var l=get();return s.replace(/\{nombre\}/g,(l&&l.n?l.n.split(" ")[0]:"").replace(/[^\wáéíóúñ ]/gi,""));}
function rSug(){
 var b=document.getElementById("sug");if(!b)return;var l=get();var tx=ltext();
 var hits=KB.filter(function(k){return k.kw.some(function(w){return tx.indexOf(w)>=0;});});
 if(l&&l.est==="nuevo"&&hits.indexOf(KB[0])<0)hits.unshift(KB[0]);
 if(l&&l.est==="trial"&&hits.indexOf(KB[4])<0)hits.unshift(KB[4]);
 if(!hits.length){b.innerHTML='<p class="hint">Según el estado y tus notas te sugiero respuestas acá. Escribí en el contexto/notas lo que te dijo (ej. "caro", "no me queda claro el modelo", "registrada", "comisión").</p>';return;}
 b.innerHTML='<p class="hint" style="margin-bottom:7px">Sugeridas (tocá Copiar y pegá en el DM):</p>'+hits.map(function(k){var r=fill(k.r);return '<div class="sg"><div class="h">'+esc(k.t)+'<button class="t" onclick="cp(this,'+JSON.stringify(r).replace(/"/g,"&quot;")+')">Copiar</button></div><div class="b">'+esc(r)+'</div></div>';}).join("");
}
function rRef(){document.getElementById("ref").innerHTML='<p class="hint" style="margin-bottom:7px">Guion completo:</p>'+REF.map(function(r){return '<details class="ac"><summary>'+esc(r[0])+'<span>＋</span></summary><div class="c">'+esc(r[1])+'</div></details>';}).join("");}
function cp(btn,t){function d(){var o=btn.textContent;btn.textContent="✓";setTimeout(function(){btn.textContent=o;},1200);}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(d,function(){fb(t);d();});}else{fb(t);d();}}
function fb(t){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");}catch(e){}document.body.removeChild(a);}

function renderAlert(){
 var box=document.getElementById("alert");
 var pend=DB.leads.filter(function(l){return l.lado==='ellos'&&l.est!=='perdido'&&l.est!=='ganado';});
 var demoSin=DB.leads.filter(function(l){return l.est==="demo"&&!l.conv;});
 var trial=DB.leads.filter(function(l){return l.est==="trial";});
 if(!pend.length&&!demoSin.length&&!trial.length){box.innerHTML="";return;}
 var msg=[];
 if(pend.length)msg.push('<b>🔴 '+pend.length+' esperan TU respuesta:</b> '+pend.map(function(l){return esc(l.n);}).join(", "));
 if(demoSin.length)msg.push('<b>⚠️ '+demoSin.length+' demo(s) SIN convocatoria:</b> '+demoSin.map(function(l){return esc(l.n);}).join(", ")+' — mandala YA');
 if(trial.length)msg.push('🔵 '+trial.length+' en trial sin cerrar: '+trial.map(function(l){return esc(l.n);}).join(", "));
 box.className="alert";box.innerHTML=msg.join(' &nbsp;·&nbsp; ')+'<button class="x" onclick="this.parentNode.style.display=\'none\'">✕</button>';
}
function exp(){var b=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="pathway-leads-"+new Date().toISOString().slice(0,10)+".json";a.click();}
function impf(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d.leads)throw 0;DB=d;save();cur=null;lst();mn();renderAlert();alert("Importado.");}catch(x){alert("Archivo inválido.");}e.target.value="";};r.readAsText(f);}

function applyView(){var w=document.querySelector('.wrap'),b=document.getElementById('board'),btn=document.getElementById('vbtn');if(VIEW==='tablero'){w.style.display='none';b.style.display='flex';btn.textContent='☰ Ver lista';renderBoard();}else{w.style.display='grid';b.style.display='none';btn.textContent='▦ Tablero';}}
function toggleView(){VIEW=(VIEW==='tablero')?'lista':'tablero';applyView();}
function openFromBoard(id){VIEW='lista';applyView();sel(id);}
function renderBoard(){var el=document.getElementById('board');if(!el)return;el.innerHTML=ESTADOS.map(function(e){var arr=DB.leads.filter(function(l){return l.est===e[0];});return '<div class="col" ondragover="event.preventDefault();this.classList.add(\'over\')" ondragleave="this.classList.remove(\'over\')" ondrop="this.classList.remove(\'over\');dDrop(\''+e[0]+'\')"><div class="ch s-'+e[0]+'"><span>'+esc(e[1])+'</span><span>'+arr.length+'</span></div><div class="cc">'+(arr.length?arr.map(function(l){var id=l.id;return '<div class="bc" draggable="true" ondragstart="DRAG=\''+id+'\';this.classList.add(\'drag\')" ondragend="this.classList.remove(\'drag\')"><div class="bn" onclick="openFromBoard(\''+id+'\')">'+ladoDot(l)+esc(l.n)+(l.est==="demo"&&!l.conv?' ⚠️':'')+'</div><div class="bi">'+esc(l.ig||l.tipo)+'</div><div class="bmv"><button class="mv" title="Atrás" onclick="moveStage(\''+id+'\',-1)">◀</button><button class="mv" title="Avanzar" onclick="moveStage(\''+id+'\',1)">▶</button></div></div>';}).join(''):'<div class="empty0">—</div>')+'</div></div>';}).join('');}
function moveLead(id,est){var l=DB.leads.filter(function(x){return x.id===id;})[0];if(!l||l.est===est)return;l.est=est;save();renderBoard();if(id===cur){lst();mn();}renderAlert();}
function moveStage(id,dir){var l=DB.leads.filter(function(x){return x.id===id;})[0];if(!l)return;var i=0;ESTADOS.forEach(function(e,k){if(e[0]===l.est)i=k;});i=Math.max(0,Math.min(ESTADOS.length-1,i+dir));moveLead(id,ESTADOS[i][0]);}
function dDrop(est){if(DRAG){moveLead(DRAG,est);DRAG=null;}}
function ladoDot(l){var e=(l.lado==='ellos');return '<button class="dot '+(e?'d-r':'d-g')+'" title="'+(e?'Te escribió — falta TU respuesta':'Escribiste vos — esperando a la persona')+'" onclick="event.stopPropagation();flipLado(\''+l.id+'\')">●</button>';}
function flipLado(id){var l=DB.leads.filter(function(x){return x.id===id;})[0];if(!l)return;l.lado=(l.lado==='ellos')?'yo':'ellos';save();renderBoard();lst();renderAlert();if(id===cur)mn();}
lst();renderAlert();applyView();
</script>
