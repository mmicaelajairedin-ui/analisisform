<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon-app.svg?v=5" type="image/svg+xml">
<title>Encuentra tu coach ideal — Pathway</title>
<meta name="description" content="Directorio de coaches verificados en Pathway. Elige el coach que más te encaje.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--pw-bosque:#2D6A4F;--pw-sendero:#52B788;--pw-carbon:#1B2E26;--pw-niebla:#FAFDF9;--pw-texto:#1B2E26;--pw-texto-suave:#5A5A55;--pw-borde:rgba(45,106,79,.12);--pw-serif:'Fraunces',Georgia,serif;--pw-sans:'Inter',-apple-system,sans-serif;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--pw-sans);color:var(--pw-texto);background:var(--pw-niebla);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}
img{max-width:100%;display:block;}

.nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(250,253,249,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--pw-borde);}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:64px;max-width:1120px;margin:0 auto;padding:0 24px;}
.nav-brand{display:inline-flex;align-items:center;gap:8px;text-decoration:none;}
.nav-brand span{font-family:var(--pw-serif);font-size:22px;color:var(--pw-carbon);letter-spacing:-0.8px;font-weight:500;}
.nav-back{font-size:13px;color:var(--pw-texto-suave);transition:color .15s;}
.nav-back:hover{color:var(--pw-bosque);}

.container{max-width:1120px;margin:0 auto;padding:0 24px;}

.hero{padding:120px 0 60px;text-align:center;}
.hero h1{font-family:var(--pw-serif);font-size:clamp(32px,5vw,48px);font-weight:500;letter-spacing:-2px;line-height:1.1;color:var(--pw-carbon);max-width:650px;margin:0 auto 16px;}
.hero p{font-size:clamp(15px,2vw,18px);color:var(--pw-texto-suave);max-width:520px;margin:0 auto;line-height:1.65;}

.directorio{padding:48px 0 80px;}
.dir-header{text-align:center;margin-bottom:32px;}
.dir-header h2{font-family:var(--pw-serif);font-size:clamp(24px,3.5vw,32px);font-weight:500;letter-spacing:-1.5px;color:var(--pw-carbon);}
.coach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;max-width:1080px;margin:0 auto;}
.coach-card{background:#fff;border:1px solid var(--pw-borde);border-radius:16px;padding:20px;text-decoration:none;transition:all .2s;display:flex;flex-direction:column;}
.coach-card:hover{border-color:rgba(45,106,79,.3);box-shadow:0 10px 26px rgba(45,106,79,.10);transform:translateY(-2px);}
.coach-photo{width:100%;aspect-ratio:1;border-radius:12px;background:var(--pw-niebla);object-fit:cover;margin-bottom:16px;display:block;}
.coach-name{font-family:var(--pw-serif);font-size:18px;font-weight:500;color:var(--pw-carbon);line-height:1.2;margin-bottom:4px;}
.coach-title{font-size:13px;color:var(--pw-texto-suave);margin-bottom:12px;line-height:1.4;}
.coach-bio{font-size:14px;color:var(--pw-texto);line-height:1.5;flex:1;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.coach-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--pw-texto-suave);margin-top:auto;}
.coach-cta{display:inline-flex;align-items:center;justify-content:center;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;background:var(--pw-bosque);color:#fff;transition:background .2s;margin-top:12px;}
.coach-cta:hover{background:#1B4332;}

.footer{padding:32px 0 28px;border-top:1px solid var(--pw-borde);text-align:center;}
.footer p{font-size:12px;color:var(--pw-texto-suave);}
.footer a{color:var(--pw-bosque);text-decoration:underline;}

.state{padding:140px 24px 80px;text-align:center;}
.state h2{font-family:var(--pw-serif);font-size:26px;font-weight:500;letter-spacing:-.8px;color:var(--pw-carbon);margin-bottom:8px;}
.state p{font-size:14px;color:var(--pw-texto-suave);}
.spinner{width:26px;height:26px;border:3px solid var(--pw-borde);border-top:3px solid var(--pw-bosque);border-radius:50%;margin:0 auto;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

@media(max-width:640px){
  .hero{padding:88px 0 24px;}
  .coach-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="nav-brand">
      <svg width="22" height="22" viewBox="0 0 100 100" aria-hidden="true"><polygon points="36.2,35.2 52.8,54.3 52.8,81.8 7.4,81.8" fill="#215C44"/><polygon points="67.9,45.8 92.6,81.8 43.1,81.8" fill="#267A54"/><circle cx="75.4" cy="27.8" r="10.3" fill="#F8CA45"/></svg>
      <span>pathway<span style="color:#52B788;">.</span></span>
    </a>
    <a href="/" class="nav-back">← Volver al inicio</a>
  </div>
</nav>

<div id="loading" class="state"><div class="spinner" role="status" aria-label="Cargando"></div></div>

<main id="content" hidden>
  <section class="hero">
    <div class="container">
      <h1>Encuentra tu coach ideal</h1>
      <p>Explora coaches verificados en Pathway y elige el que más te encaje</p>
    </div>
  </section>

  <section class="directorio">
    <div class="container">
      <div class="coach-grid" id="coach-grid"></div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <p>Plataforma de coaching · <a href="/soy-coach.html">¿Sos coach? Empeza gratis</a></p>
    </div>
  </footer>
</main>

<script>
const SB = 'https://tbtxncfjbyhfgwquwmpe.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRidHhuY2ZqYnloZmd3cXV3bXBlIiwicm9sZSI6ImFub24iLCJpYXQiOjE2OTcwNDE4NzIsImV4cCI6MTk4MjYxNzg3Mn0.5cMnqJNVUVqTD0wJ_M8WXCXZEX-uMNg1P6B3M9OkDqE';

async function loadCoaches() {
  try {
    const url = `${SB}/rest/v1/usuarios?rol=in.(coach,admin)&activo=eq.true&perfil_publico_activo=eq.true&select=id,nombre,email,foto_url,bio,slug,configuracion&order=created_at.asc`;
    const r = await fetch(url, { headers:{ apikey:KEY, Authorization:'Bearer '+KEY } });
    if (!r.ok) throw new Error('HTTP '+r.status);
    const coaches = await r.json() || [];

    const grid = document.getElementById('coach-grid');
    if (!coaches.length) {
      grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:48px;color:#5A5A55;">No hay coaches disponibles en este momento.</div>';
      document.getElementById('loading').hidden = true;
      document.getElementById('content').hidden = false;
      return;
    }

    const html = coaches.map(c => {
      const slug = c.slug || c.email.split('@')[0];
      const foto = c.foto_url || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect fill="%23EFE9DD" width="200" height="200"/><circle cx="100" cy="70" r="40" fill="%235A5A55"/><path d="M40 180 Q40 120 100 120 Q160 120 160 180" fill="%235A5A55"/></svg>';
      const cfg = c.configuracion || {};
      const bio = (c.bio || '').substring(0, 80) + (c.bio && c.bio.length > 80 ? '...' : '');

      return `
        <a href="/coach/${slug}" class="coach-card">
          <img src="${foto}" alt="${c.nombre}" class="coach-photo" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 200%22><rect fill=%22%23EFE9DD%22 width=%22200%22 height=%22200%22/><circle cx=%22100%22 cy=%2270%22 r=%2240%22 fill=%22%235A5A55%22/><path d=%22M40 180 Q40 120 100 120 Q160 120 160 180%22 fill=%22%235A5A55%22/></svg>'">
          <div class="coach-name">${c.nombre || 'Coach'}</div>
          <div class="coach-title">${cfg.coach_type || 'Coach de carrera'}</div>
          <div class="coach-bio">${bio}</div>
          <div class="coach-cta">Ver perfil →</div>
        </a>
      `;
    }).join('');

    grid.innerHTML = html;
    document.getElementById('loading').hidden = true;
    document.getElementById('content').hidden = false;
  } catch (e) {
    console.error('Error cargando coaches:', e);
    document.getElementById('loading').innerHTML = '<div style="text-align:center;padding:48px;"><h2 style="font-size:20px;margin-bottom:16px;">Error al cargar</h2><p style="color:#5A5A55;margin-bottom:16px;">No pudimos cargar los coaches.</p><a href="#" onclick="location.reload();return false;" style="color:#2D6A4F;font-weight:600;text-decoration:underline;">Reintentar</a></div>';
  }
}

loadCoaches();
</script>
</body>
</html>
