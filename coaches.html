<style>
:root{--pw-bosque:#2D6A4F;--pw-sendero:#52B788;--pw-amanecer:#E9C46A;--pw-carbon:#1B2E26;--pw-niebla:#FAFDF9;--pw-texto:#1B2E26;--pw-texto-suave:#5A5A55;--pw-borde:rgba(45,106,79,.12);--pw-serif:'Fraunces',Georgia,serif;--pw-sans:'Inter',-apple-system,sans-serif;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--pw-sans);color:var(--pw-texto);background:var(--pw-niebla);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(250,253,249,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--pw-borde);}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:64px;max-width:1120px;margin:0 auto;padding:0 24px;}
.nav-brand{display:inline-flex;align-items:center;gap:8px;text-decoration:none;}
.nav-brand span{font-family:var(--pw-serif);font-size:22px;color:var(--pw-carbon);letter-spacing:-0.8px;font-weight:500;line-height:1;}
.nav-back{font-size:13px;color:var(--pw-texto-suave);transition:color .15s;}
.nav-back:hover{color:var(--pw-bosque);}

.container{max-width:1120px;margin:0 auto;padding:0 24px;}

/* HERO */
.hero{padding:120px 0 60px;text-align:center;}
.hero h1{font-family:var(--pw-serif);font-size:clamp(32px,5vw,48px);font-weight:500;letter-spacing:-2px;line-height:1.1;color:var(--pw-carbon);max-width:650px;margin:0 auto 16px;}
.hero p{font-size:clamp(15px,2vw,18px);color:var(--pw-texto-suave);max-width:520px;margin:0 auto;line-height:1.65;}

/* GRATIS BADGE */
.gratis{text-align:center;padding:24px 0 48px;}
.gratis-badge{display:inline-flex;align-items:center;gap:10px;background:rgba(82,183,136,.08);border:1px solid rgba(45,106,79,.15);border-radius:100px;padding:10px 24px;}
.gratis-badge .dot{width:8px;height:8px;border-radius:50%;background:var(--pw-sendero);}
.gratis-badge span{font-size:15px;font-weight:500;color:var(--pw-bosque);}

/* DIRECTORIO */
.directorio{padding:48px 0 80px;}
.dir-header{text-align:center;margin-bottom:32px;}
.dir-header h2{font-family:var(--pw-serif);font-size:clamp(24px,3.5vw,32px);font-weight:500;letter-spacing:-1.5px;color:var(--pw-carbon);}
.dir-header p{color:var(--pw-texto-suave);margin-top:6px;font-size:16px;}
.dir-filter{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:36px;overflow-x:auto;padding:4px 0;}
.filter-tab{background:#fff;border:1.5px solid var(--pw-borde);color:var(--pw-texto-suave);padding:8px 18px;border-radius:100px;font-size:13px;font-weight:500;font-family:var(--pw-sans);cursor:pointer;transition:all .15s;white-space:nowrap;}
.filter-tab:hover{border-color:var(--pw-bosque);color:var(--pw-bosque);}
.filter-tab.active{background:var(--pw-bosque);border-color:var(--pw-bosque);color:#fff;}

.coach-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:24px;max-width:800px;margin:0 auto;}
#coach-grid[data-locked="1"]{filter:blur(5px);pointer-events:none;user-select:none;}
.dir-wrap{position:relative;}
#dir-gate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(250,250,248,.45);}

.coach-card{position:relative;overflow:hidden;background:#fff;border:1.5px solid var(--pw-borde);border-radius:20px;padding:28px 26px 24px;display:flex;flex-direction:column;gap:16px;transition:all .2s;}
.coach-card:hover{border-color:rgba(45,106,79,.3);box-shadow:0 14px 36px rgba(45,106,79,.10);transform:translateY(-2px);}
.coach-card.is-clickable{cursor:pointer;}
/* Color POR TIPO de coach (nicho): franja superior + aro de la foto + pista CTA */
.coach-card::before{content:'';position:absolute;top:0;left:0;right:0;height:6px;background:var(--nicho-c,var(--pw-bosque));}
.coach-card .coach-photo-round{border-color:var(--nicho-c,#fff);}
.coach-cta-hint{margin-top:auto;display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--nicho-c,var(--pw-bosque));padding-top:4px;}
.coach-cta-hint svg{width:15px;height:15px;}
.coach-card.is-clickable:hover .coach-cta-hint{gap:9px;}
.coach-top{display:flex;align-items:flex-start;gap:16px;}
.coach-photo-round{width:96px;height:96px;border-radius:50%;overflow:hidden;flex-shrink:0;background:linear-gradient(135deg,#ececea,#f5f5f2);display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 6px 18px rgba(45,106,79,.14);}
.coach-photo-round img{width:100%;height:100%;object-fit:cover;display:block;}
.coach-photo-round svg{width:44px;height:44px;color:#b4b4ae;}
.coach-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
.coach-info h3{font-family:var(--pw-serif);font-size:22px;font-weight:500;letter-spacing:-0.8px;color:var(--pw-carbon);line-height:1.15;}
.coach-title{font-size:13px;color:var(--pw-texto-suave);font-weight:500;}
.coach-location{font-size:12px;color:var(--pw-texto-suave);display:inline-flex;align-items:center;gap:4px;margin-top:2px;}
.coach-rating{font-size:13px;color:#E9C46A;letter-spacing:1.5px;line-height:1;margin-top:4px;}
.coach-rating span{color:var(--pw-texto-suave);font-weight:500;margin-left:4px;letter-spacing:0;font-size:12px;}

/* Verificado — insignia real (todos los coaches del directorio están verificados por Pathway) */
.coach-verified{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--pw-bosque);background:rgba(82,183,136,.12);padding:2px 8px;border-radius:99px;line-height:1.3;}
.coach-verified svg{width:12px;height:12px;}
.coach-photo-round{position:relative;}
.coach-photo-check{position:absolute;right:-2px;bottom:-2px;width:26px;height:26px;border-radius:50%;background:var(--pw-bosque);border:2.5px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(45,106,79,.25);}
.coach-photo-check svg{width:13px;height:13px;color:#fff;}
/* Badge dinámico (Nuevo / Top valorado) — datos reales, sin inventar */
.coach-badge-top{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;align-self:flex-start;}
.coach-badge-top.nuevo{background:rgba(82,183,136,.14);color:var(--pw-bosque);}
.coach-badge-top.valorado{background:rgba(233,196,106,.20);color:#9a7a1e;}
/* Métricas reales (rating · clientes · experiencia) */
.coach-metrics{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--pw-texto-suave);}
.coach-metrics .m{display:inline-flex;align-items:center;gap:4px;}
.coach-metrics .m strong{color:var(--pw-carbon);font-weight:600;}
.coach-metrics .stars{color:#E9C46A;letter-spacing:1px;}

/* Bio con regla "Ver más" — clamp a 3 líneas; se expande en el sitio para que
   todas las cajas mantengan la misma altura hasta que el usuario decida ver más. */
.coach-bio{font-size:14px;color:var(--pw-texto);line-height:1.6;margin:0;}
.coach-bio.clamp{display:-webkit-box;-webkit-line-clamp:3;line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.coach-more{background:none;border:none;padding:0;margin-top:2px;font-family:var(--pw-sans);font-size:12px;font-weight:600;color:var(--pw-bosque);cursor:pointer;align-self:flex-start;}
.coach-more:hover{text-decoration:underline;}
.coach-title{font-size:13px;color:var(--pw-texto-suave);font-weight:500;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.coach-tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.tag{display:inline-block;background:rgba(45,106,79,.08);color:var(--pw-bosque);padding:4px 10px;border-radius:20px;font-size:11px;font-weight:500;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tag-more{background:transparent;color:var(--pw-texto-suave);font-size:11px;font-weight:600;padding:4px 4px;}

.coach-price-row{display:flex;gap:14px;padding:14px 16px;background:var(--pw-niebla);border:1px solid var(--pw-borde);border-radius:12px;}
.coach-price-row > div{flex:1;}
.coach-price-row .label{font-size:10px;color:var(--pw-texto-suave);font-weight:600;text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:3px;}
.coach-price-row strong{font-family:var(--pw-serif);font-size:22px;font-weight:500;color:var(--pw-bosque);letter-spacing:-0.5px;line-height:1;}

.coach-card .btn-primary{align-self:stretch;justify-content:center;}
.coach-card .btn-disabled{align-self:stretch;display:flex;align-items:center;justify-content:center;padding:12px 18px;border-radius:10px;font-size:14px;font-weight:500;background:#ececea;color:#9c9c96;border:none;cursor:not-allowed;font-family:var(--pw-sans);}

.coach-reviews{padding-top:14px;border-top:1px solid var(--pw-borde);}
.coach-reviews-label{font-size:10px;font-weight:600;color:var(--pw-texto-suave);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;}
.review-item{background:var(--pw-niebla);border-radius:10px;padding:12px 14px;margin-bottom:8px;}
.review-item:last-child{margin-bottom:0;}
.review-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.review-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#52B788,#2D6A4F);color:#fff;font-family:var(--pw-serif);font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.review-name{font-family:var(--pw-serif);font-size:13px;font-weight:500;color:var(--pw-carbon);line-height:1;margin-bottom:3px;}
.review-stars{font-size:11px;color:#E9C46A;letter-spacing:1px;line-height:1;}
.review-text{font-size:13px;color:var(--pw-texto);line-height:1.6;font-style:italic;margin:0;}

.coach-card--placeholder{opacity:.78;}
.coach-card--placeholder .coach-info h3,.coach-card--placeholder .coach-title,.coach-card--placeholder .coach-bio{color:#b4b4ae;}
.badge-coming{display:inline-block;font-size:10px;font-weight:600;color:var(--pw-bosque);background:rgba(82,183,136,.14);padding:3px 10px;border-radius:20px;letter-spacing:.5px;text-transform:uppercase;align-self:flex-start;}

.dir-empty{text-align:center;padding:40px 20px;color:var(--pw-texto-suave);font-size:14px;grid-column:1/-1;display:none;}

/* ── Toggle grilla / lista ── */
.dir-view{display:inline-flex;gap:2px;background:#fff;border:1.5px solid var(--pw-borde);border-radius:100px;padding:3px;}
.dir-view button{border:none;background:none;width:34px;height:28px;border-radius:100px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--pw-texto-suave);transition:all .15s;}
.dir-view button.active{background:var(--pw-bosque);color:#fff;}
.dir-view svg{width:16px;height:16px;}

/* Vista LISTA: cada coach en una fila compacta (foto chica, sin bio ni chips) */
.coach-grid.list-view{grid-template-columns:1fr;max-width:860px;gap:12px;}
.coach-grid.list-view .coach-card{flex-direction:row;align-items:center;flex-wrap:wrap;gap:16px;padding:16px 20px;}
.coach-grid.list-view .coach-top{flex:1 1 260px;min-width:0;}
.coach-grid.list-view .coach-photo-round{width:58px;height:58px;}
.coach-grid.list-view .coach-photo-check{width:20px;height:20px;}
.coach-grid.list-view .coach-photo-check svg{width:11px;height:11px;}
.coach-grid.list-view .coach-info h3{font-size:18px;}
.coach-grid.list-view .coach-bio,.coach-grid.list-view .coach-more,.coach-grid.list-view .coach-tags{display:none;}
.coach-grid.list-view .coach-metrics{flex:0 0 auto;margin:0;}
.coach-grid.list-view .coach-price-row{flex:0 0 auto;padding:0;background:none;border:none;}
.coach-grid.list-view .coach-price-row strong{font-size:18px;}
.coach-grid.list-view .coach-card > :last-child{margin-top:0!important;flex:0 0 auto;width:auto;}
.coach-grid.list-view .coach-card .btn-primary{white-space:nowrap;}
/* En lista la franja de color va a la izquierda (barra vertical) */
.coach-grid.list-view .coach-card{padding-left:24px;}
.coach-grid.list-view .coach-card::before{top:0;bottom:0;right:auto;width:5px;height:auto;}
@media(max-width:640px){
  .coach-grid.list-view .coach-metrics{flex-basis:100%;}
  .coach-grid.list-view .coach-card{gap:12px;padding:14px 16px;}
}

/* COMO */

.hero-proof{display:inline-flex;align-items:center;gap:10px;font-size:13px;color:var(--pw-bosque);margin-bottom:18px;font-weight:500;}
.hero-stars{color:var(--pw-amanecer);letter-spacing:1px;font-size:13px;}
.hero-ctas{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:32px;flex-wrap:wrap;}
.hero-ctas .btn-primary{display:inline-flex;align-items:center;gap:8px;padding:14px 28px;border-radius:10px;font-size:15px;font-weight:500;background:var(--pw-bosque);color:#fff;text-decoration:none;transition:all .15s;}
.hero-ctas .btn-primary:hover{background:#245840;transform:translateY(-1px);box-shadow:0 4px 16px rgba(45,106,79,.25);}
.hero-ctas .btn-secondary{font-size:14px;color:var(--pw-bosque);text-decoration:none;font-weight:500;border-bottom:1px dashed rgba(45,106,79,.35);padding-bottom:2px;transition:all .15s;}
.hero-ctas .btn-secondary:hover{color:var(--pw-carbon);border-bottom-color:var(--pw-bosque);}
.hero-trust{display:flex;align-items:center;justify-content:center;gap:24px;margin-top:32px;flex-wrap:wrap;font-size:12px;color:var(--pw-texto-suave);}
.hero-trust span{display:inline-flex;align-items:center;gap:6px;}

.why{padding:72px 0;background:#fff;border-top:1px solid var(--pw-borde);}
.why-header{text-align:center;margin-bottom:48px;max-width:600px;margin-left:auto;margin-right:auto;}
.why-header h2{font-family:var(--pw-serif);font-size:clamp(24px,3.5vw,32px);font-weight:500;letter-spacing:-1.5px;color:var(--pw-carbon);}
.why-header p{color:var(--pw-texto-suave);margin-top:8px;font-size:16px;line-height:1.6;}
.why-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;max-width:980px;margin:0 auto;}
.why-card{background:var(--pw-niebla);border:1.5px solid var(--pw-borde);border-radius:16px;padding:32px 28px;transition:all .2s;}
.why-card:hover{border-color:rgba(45,106,79,.3);box-shadow:0 8px 24px rgba(45,106,79,.06);transform:translateY(-2px);}
.why-icon{font-size:36px;margin-bottom:16px;line-height:1;}
.why-card h3{font-family:var(--pw-serif);font-size:20px;font-weight:500;color:var(--pw-carbon);letter-spacing:-.4px;margin-bottom:10px;line-height:1.3;}
.why-card p{font-size:14px;color:var(--pw-texto-suave);line-height:1.65;}

@media(max-width:768px){
  .why-grid{grid-template-columns:1fr;gap:16px;}
  .hero-ctas{flex-direction:column;gap:12px;}
  .hero-trust{gap:14px;font-size:11px;}
}

.como{background:var(--pw-niebla);padding:80px 0;}
.como-header{text-align:center;margin-bottom:56px;}
.como-header h2{font-family:var(--pw-serif);font-size:clamp(24px,3.5vw,32px);font-weight:500;letter-spacing:-1.5px;}
.como-header p{color:var(--pw-texto-suave);margin-top:6px;font-size:16px;}
.steps{display:flex;gap:32px;max-width:920px;margin:0 auto;}
.step{flex:1;text-align:center;padding:16px;}
.step-num{width:96px;height:96px;border-radius:24px;background:#fff;border:1.5px solid var(--pw-borde);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;box-shadow:0 6px 20px rgba(45,106,79,.06);}
.step-num svg{width:48px;height:48px;}
.step h4{font-family:var(--pw-serif);font-size:18px;font-weight:500;color:var(--pw-carbon);letter-spacing:-0.5px;line-height:1.3;}

/* QUÉ INCLUYE */
.include{padding:72px 0 80px;background:#fff;}
.include-header{text-align:center;margin-bottom:48px;}
.include-header h2{font-family:var(--pw-serif);font-size:clamp(24px,3.5vw,32px);font-weight:500;letter-spacing:-1.5px;}
.include-header p{color:var(--pw-texto-suave);margin-top:6px;font-size:16px;}
.include-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:960px;margin:0 auto;}
.include-item{background:var(--pw-niebla);border:1px solid var(--pw-borde);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;gap:8px;transition:all .2s;}
.include-item:hover{border-color:rgba(45,106,79,.25);transform:translateY(-2px);box-shadow:0 6px 20px rgba(45,106,79,.06);}
.include-icon{width:44px;height:44px;border-radius:12px;background:rgba(82,183,136,.14);display:flex;align-items:center;justify-content:center;margin-bottom:4px;}
.include-icon svg{width:22px;height:22px;color:var(--pw-bosque);}
.include-item h4{font-family:var(--pw-sans);font-size:15px;font-weight:600;color:var(--pw-carbon);letter-spacing:-0.2px;}
.include-item p{font-size:13px;color:var(--pw-texto-suave);line-height:1.55;}

/* FAQ MINI */
.faq-mini{padding:72px 0 80px;background:var(--pw-niebla);}
.faq-mini-header{text-align:center;margin-bottom:40px;}
.faq-mini-header h2{font-family:var(--pw-serif);font-size:clamp(24px,3.5vw,32px);font-weight:500;letter-spacing:-1.5px;}
.faq-mini-list{max-width:700px;margin:0 auto;display:flex;flex-direction:column;gap:8px;}
.faq-mini-item{background:#fff;border:1px solid var(--pw-borde);border-radius:12px;overflow:hidden;transition:border-color .15s;}
.faq-mini-item.open{border-color:rgba(45,106,79,.3);box-shadow:0 4px 16px rgba(45,106,79,.05);}
.faq-mini-q{width:100%;padding:16px 22px;background:transparent;border:none;text-align:left;font-family:var(--pw-sans);font-size:15px;font-weight:500;color:var(--pw-carbon);cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.faq-mini-q:hover{color:var(--pw-bosque);}
.faq-mini-icon{flex-shrink:0;width:20px;height:20px;color:var(--pw-bosque);transition:transform .2s;display:flex;align-items:center;justify-content:center;}
.faq-mini-item.open .faq-mini-icon{transform:rotate(45deg);}
.faq-mini-a{padding:0 22px;max-height:0;overflow:hidden;transition:max-height .25s ease,padding .25s ease;font-size:14px;color:var(--pw-texto-suave);line-height:1.7;}
.faq-mini-item.open .faq-mini-a{padding:0 22px 18px;max-height:300px;}

/* CTA */
.cta{padding:64px 0;text-align:center;}
.cta h2{font-family:var(--pw-serif);font-size:clamp(24px,3.5vw,32px);font-weight:500;letter-spacing:-1.5px;margin-bottom:8px;}

.btn-primary{display:inline-flex;align-items:center;gap:8px;padding:14px 28px;border-radius:10px;font-size:15px;font-weight:500;background:var(--pw-bosque);color:#fff;text-decoration:none;transition:all .15s;}
.btn-primary:hover{background:#245840;transform:translateY(-1px);box-shadow:0 4px 16px rgba(45,106,79,.25);}

/* FOOTER */
.footer{padding:32px 0;border-top:1px solid var(--pw-borde);text-align:center;}
.footer p{font-size:12px;color:var(--pw-texto-suave);}

/* === SHOWCASE ANIMADO (zoom in/out 4 escenas) === */
.pw-showcase{max-width:880px;margin:0 auto;position:relative;}
.pw-showcase-frame{position:relative;background:#fff;border:1px solid rgba(45,106,79,.18);border-radius:16px;overflow:hidden;box-shadow:0 24px 60px rgba(45,106,79,.16);}
.pw-browser-bar{background:#F5F5F3;border-bottom:1px solid rgba(45,106,79,.14);padding:10px 16px;display:flex;align-items:center;gap:6px;}
.pw-browser-bar .pw-dot{width:9px;height:9px;border-radius:50%;}
.pw-browser-bar .pw-url{flex:1;background:#fff;border:1px solid #E5E5E5;border-radius:6px;padding:5px 12px;font-size:11px;color:#999;margin-left:8px;}
.pw-stage{position:relative;aspect-ratio:16/10;overflow:hidden;background:#FAFAF8;}
.pw-scene{position:absolute;inset:0;opacity:0;transform:scale(.97);animation:pwSceneCycle 24s infinite cubic-bezier(.4,0,.2,1);will-change:opacity,transform;}
.pw-scene-1{animation-delay:0s;}
.pw-scene-2{animation-delay:-18s;}
.pw-scene-3{animation-delay:-12s;}
.pw-scene-4{animation-delay:-6s;}
.pw-scene-label{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(27,46,38,.92);color:#fff;font-size:11px;font-weight:600;padding:6px 14px;border-radius:20px;backdrop-filter:blur(6px);letter-spacing:.3px;white-space:nowrap;}
@keyframes pwSceneCycle{
  0%   {opacity:0;transform:scale(.97);}
  3%   {opacity:1;transform:scale(1);}
  20%  {opacity:1;transform:scale(1.015);}
  24%  {opacity:0;transform:scale(1.025);}
  100% {opacity:0;transform:scale(.97);}
}
.pw-showcase-dots{display:flex;justify-content:center;gap:8px;margin-top:18px;}
.pw-dot-indicator{width:32px;height:4px;border-radius:2px;background:#E5DCD2;animation:pwDotCycle 24s infinite ease-in-out;}
.pw-dot-1{animation-delay:0s;}
.pw-dot-2{animation-delay:-18s;}
.pw-dot-3{animation-delay:-12s;}
.pw-dot-4{animation-delay:-6s;}
@keyframes pwDotCycle{
  0%, 25%, 100% {background:#E5DCD2;}
  3%, 22% {background:#2D6A4F;}
}
/* Confetti que cae al cambiar de escena */
.pw-confetti{position:absolute;top:0;left:0;right:0;pointer-events:none;height:100%;overflow:hidden;}
.pw-confetti span{position:absolute;top:-15px;width:8px;height:8px;border-radius:2px;animation:pwConfettiFall 24s infinite linear;opacity:0;}
.pw-confetti span:nth-child(1){left:8%;background:#52B788;animation-delay:1s;}
.pw-confetti span:nth-child(2){left:18%;background:#E9C46A;animation-delay:1.3s;width:6px;height:6px;border-radius:50%;}
.pw-confetti span:nth-child(3){left:28%;background:#2D6A4F;animation-delay:1.6s;}
.pw-confetti span:nth-child(4){left:42%;background:#E9C46A;animation-delay:1.1s;width:6px;height:10px;}
.pw-confetti span:nth-child(5){left:55%;background:#52B788;animation-delay:1.7s;border-radius:50%;}
.pw-confetti span:nth-child(6){left:68%;background:#E9C46A;animation-delay:1.4s;}
.pw-confetti span:nth-child(7){left:78%;background:#2D6A4F;animation-delay:1.2s;width:5px;height:5px;border-radius:50%;}
.pw-confetti span:nth-child(8){left:88%;background:#52B788;animation-delay:1.9s;width:7px;height:9px;}
.pw-confetti span:nth-child(9){left:35%;background:#E9C46A;animation-delay:7s;width:6px;height:6px;border-radius:50%;}
.pw-confetti span:nth-child(10){left:60%;background:#52B788;animation-delay:13.2s;}
.pw-confetti span:nth-child(11){left:22%;background:#2D6A4F;animation-delay:19.4s;width:6px;height:6px;border-radius:50%;}
.pw-confetti span:nth-child(12){left:75%;background:#E9C46A;animation-delay:13.6s;}
@keyframes pwSparkle{
  0%,100% {transform:scale(1) rotate(0deg);}
  50% {transform:scale(1.2) rotate(8deg);}
}
@keyframes pwConfettiFall{
  0%   {opacity:0;transform:translateY(0) rotate(0deg);}
  3%   {opacity:1;}
  18%  {opacity:1;transform:translateY(60vh) rotate(540deg);}
  20%  {opacity:0;transform:translateY(70vh) rotate(720deg);}
  100% {opacity:0;}
}
@media(prefers-reduced-motion:reduce){
  .pw-scene,.pw-dot-indicator,.pw-confetti span{animation:none;}

}

<script>
// ── i18n ───────────────────────────────────────────────────
var I18N = {
  es: {
    'i18n-nav-back':'← Volver al inicio',
    'i18n-footer':'© 2025 Pathway Career Coach · <a href="/">Inicio</a> · <a href="soy-coach.html">Soy coach</a> · <a href="login.html">Ingresar</a>'
  },
  en: {

    'i18n-footer':'© 2025 Pathway Career Coach · <a href="/">Home</a> · <a href="soy-coach.html">I\'m a coach</a> · <a href="login.html">Sign in</a>'
  }
};

function setLng(lng){
  if(!I18N[lng])return;
  try{localStorage.setItem('mj_lang',lng);}catch(e){}
  document.documentElement.lang=lng;
  var dict=I18N[lng];
  Object.keys(dict).forEach(function(id){
    var el=document.getElementById(id);
    if(el)el.innerHTML=dict[id];
  });
  // Toggle visual del botón
  var bes=document.getElementById('lng-es'),ben=document.getElementById('lng-en');
  if(bes&&ben){
    var on={background:'#2D6A4F',color:'#fff',borderColor:'#2D6A4F'};
    var off={background:'#fff',color:'#888',borderColor:'rgba(45,106,79,.18)'};
    Object.assign((lng==='es'?bes:ben).style,on);
    Object.assign((lng==='es'?ben:bes).style,off);
  }
}

// Idioma inicial: localStorage → navigator → es
(function(){
  var saved='';try{saved=localStorage.getItem('mj_lang')||'';}catch(e){}
  var lng=saved;
  if(!lng){
    try{
      var nav=(navigator.language||navigator.userLanguage||'es').toLowerCase();
      lng=nav.indexOf('en')===0?'en':'es';
    }catch(e){lng='es';}
  }
  setLng(lng);
})();

// FAQ mini toggle
function toggleFaqMini(btn){
  var item = btn.parentElement;
  var wasOpen = item.classList.contains('open');
  document.querySelectorAll('.faq-mini-item').forEach(function(i){ i.classList.remove('open'); });
  if(!wasOpen) item.classList.add('open');
}

// ─── DIRECTORIO DINÁMICO DE COACHES ────────────────────────
// Lee usuarios con rol coach/admin + configuracion.visible_directorio !== false
// y los renderiza como tarjetas. Cada CTA Stripe lleva client_reference_id=<coach_id>
// para que el webhook pueda asignar el candidato al coach correcto.
var SB = 'https://api.pathwaycareercoach.com';
var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkeG5yc25qZHZ0cWh4dW54bndqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNDk5MzksImV4cCI6MjA5MDcyNTkzOX0.t82X1x-PDgFDGYhKC7YXoRKhga9I8Hjet60QUYvtZLU';

function escH(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
// Regla "Ver más": expande la bio en el sitio (todas las cajas empiezan con la
// misma altura clampada; el usuario decide ver el resto).
window._pwCoachBioMore = function(btn){
  var wrap = btn.parentNode;
  var bio = wrap && wrap.querySelector('.coach-bio');
  if(!bio) return;
  var clamped = bio.classList.toggle('clamp');
  btn.textContent = clamped ? 'Ver más' : 'Ver menos';
};
// Oculta el botón "Ver más" en las bios cortas (que no llegan a clamparse), para
// que solo aparezca donde de verdad hay texto recortado.
function _pwPruneBioMore(){
  document.querySelectorAll('.coach-bio.clamp').forEach(function(bio){
    var btn = bio.parentNode && bio.parentNode.querySelector('.coach-more');
    if(!btn) return;
    if(bio.scrollHeight <= bio.clientHeight + 2) btn.style.display = 'none';
  });
}
// Trae las stats REALES (rating, reseñas, clientes) del edge function de listado
// y las indexa por slug para enriquecer las tarjetas. Best-effort: si falla, las
// tarjetas se muestran igual (sin métricas), nunca con datos inventados.
async function fetchCoachStats(){
  try{
    var r = await fetch(SB + '/functions/v1/listar-coaches-publicos', { headers:{ apikey:KEY, Authorization:'Bearer '+KEY } });
    if(!r.ok) return {};
    var d = await r.json();
    var map = {};
    (Array.isArray(d.coaches) ? d.coaches : []).forEach(function(co){
      var sl = String(co.slug||'').trim().toLowerCase();
      if(sl && co.stats) map[sl] = co.stats;
    });
    return map;
  }catch(_e){ return {}; }
}
function ini(n){return String(n||'?').split(' ').map(function(w){return (w[0]||'').toUpperCase();}).join('').slice(0,2);}
function appendRef(url,coachId){
  if(!url)return '';
  var sep = url.indexOf('?')>=0 ? '&' : '?';
  return url + sep + 'client_reference_id=' + encodeURIComponent(coachId);
}
// Mostramos coaches con perfil completo: foto y bio. El pago ya no
// depende de un link propio del coach — los leads del directorio se
// gestionan por Pathway (modelo de solicitud + comisión).
function _coachCompleto(c){
  var cfg = c.configuracion || {};
  // Aparece apenas prende su perfil público (top-level o en configuracion).
  // Ya no exigimos Stripe ni foto: el modelo es suscripción, no comisión.
  return !!(c.perfil_publico_activo === true || cfg.perfil_publico_activo === true);
}
function buildCoachCard(c, statsMap, idx){
  var cfg = c.configuracion || {};
  var nombre = c.nombre || c.nombre_practica || 'Coach';
  var ct = (cfg.coach_type || (Array.isArray(cfg.especialidades) && cfg.especialidades[0]) || '').toString().toLowerCase();
  var nichoNorm = ct.indexOf('fitness')>=0 ? 'fitness' : (ct.indexOf('financ')>=0 ? 'financiero' : 'carrera');
  // Color POR TIPO de coach (categorización de Pathway, no marca del coach).
  // Paleta fija por nicho → cada tarjeta se identifica de un vistazo.
  var NICHO_COLOR = { carrera:'#2D6A4F', fitness:'#2C6E7F', financiero:'#B4832E' };
  var nichoColor = NICHO_COLOR[nichoNorm] || '#2D6A4F';
  // Título: si el coach cargó su título profesional (lo genera la IA en el panel),
  // lo usamos; si no, uno derivado del nicho. Se clampa a 2 líneas por CSS.
  var tituloBase = nichoNorm==='fitness' ? 'Coach de fitness' : nichoNorm==='financiero' ? 'Coach de finanzas' : 'Coach de carrera';
  var titulo = (typeof cfg.titulo_profesional==='string' && cfg.titulo_profesional.trim()) ? cfg.titulo_profesional.trim() : tituloBase;
  var bio = c.bio || 'Coach certificado en Pathway. Acompaña a profesionales en su transición de carrera.';
  var foto = c.foto_url || cfg.foto_url || cfg.foto_perfil || '';
  // País: un solo país real (cfg.pais ISO que pone el coach en su panel). Sin "Remoto".
  var PAIS_MAP = { ES:['espana','España'], AR:['argentina','Argentina'], MX:['mexico','México'], CL:['chile','Chile'], CO:['colombia','Colombia'], UY:['uruguay','Uruguay'], PE:['peru','Perú'] };
  var pm = PAIS_MAP[String(cfg.pais||'').toUpperCase()] || null;
  var paisesAttr = pm ? pm[0] : '';
  var paisesLbl = pm ? pm[1] : 'Internacional';
  var especialidades = Array.isArray(cfg.especialidades) ? cfg.especialidades : [];
  // Precio: del array `servicios` (donde el coach realmente carga sus precios).
  // Mostramos "Desde €X" (el más barato). Si no cargó ninguno, no se muestra nada.
  var servs = Array.isArray(cfg.servicios) ? cfg.servicios : [];
  var _MON_SYM={eur:'€',usd:'US$',gbp:'£',mxn:'MX$',ars:'AR$',cop:'COL$',clp:'CL$',pen:'S/',brl:'R$',uyu:'$U',cad:'CA$',chf:'CHF '};
  var _monC=String((servs.length&&servs[0]&&servs[0].moneda)||cfg.moneda||'eur').toLowerCase();
  var _monS=_MON_SYM[_monC]||(_monC.toUpperCase()+' ');
  var precios = servs.map(function(s){ return Number(s.precio != null ? s.precio : s.price); })
                     .filter(function(n){ return isFinite(n) && n > 0; });
  if(!precios.length){ // fallback a campos viejos por si algún coach los tiene
    [cfg.precio_sesion, cfg.precio_mentoria].forEach(function(p){ var n=Number(p); if(isFinite(n)&&n>0) precios.push(n); });
  }
  var priceRow = precios.length
    ? '<div class="coach-price-row"><div><span class="label">Desde</span><strong>'+escH(_monS)+escH(String(Math.min.apply(null,precios)))+'</strong></div></div>'
    : '';
  var fotoHtml = foto
    ? '<img src="'+escH(foto)+'" alt="'+escH(nombre)+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">'
    : '<div style="width:100%;height:100%;border-radius:50%;background:rgba(45,106,79,.1);color:var(--pw-bosque);display:flex;align-items:center;justify-content:center;font-family:var(--pw-serif);font-size:24px;font-weight:600;">'+escH(ini(nombre))+'</div>';
  // Especialidades: máximo 3 chips visibles + "+N" para que las cajas queden
  // parejas aunque un coach cargue muchas.
  var tagsHtml;
  if(especialidades.length){
    var _shown = especialidades.slice(0,3).map(function(t){return '<span class="tag">'+escH(t)+'</span>';}).join('');
    var _rest = especialidades.length - 3;
    tagsHtml = _shown + (_rest>0 ? '<span class="tag-more">+'+_rest+'</span>' : '');
  } else {
    tagsHtml = '<span class="tag">Coaching</span>';
  }
  // ── Métricas REALES (de listar-coaches-publicos, merge por slug). Solo se
  //    muestran si existen; nunca se inventan. ──────────────────────────────
  var slug0 = String(c.slug || cfg.slug || '').trim().toLowerCase();
  var st = (statsMap && slug0 && statsMap[slug0]) ? statsMap[slug0] : null;
  var metricsHtml = '';
  var badgeTop = '';
  if(st){
    var parts = [];
    if(st.avg_rating != null && st.reviews_count > 0){
      var full = Math.round(st.avg_rating);
      parts.push('<span class="m"><span class="stars">'+('★'.repeat(full)+'☆'.repeat(Math.max(0,5-full)))+'</span> <strong>'+escH(String(st.avg_rating))+'</strong> ('+st.reviews_count+')</span>');
    }
    if(st.clientes_total > 0){
      parts.push('<span class="m"><strong>'+st.clientes_total+'</strong> '+(st.clientes_total===1?'cliente':'clientes')+'</span>');
    }
    metricsHtml = parts.length ? '<div class="coach-metrics">'+parts.join('')+'</div>' : '';
    // Badge dinámico — 100% real:
    //   · "Top valorado" si tiene ≥3 reseñas y promedio ≥4.8
    //   · "Nuevo" si aún no tiene clientes registrados
    if(st.avg_rating != null && st.avg_rating >= 4.8 && st.reviews_count >= 3){
      badgeTop = '<span class="coach-badge-top valorado">★ Top valorado</span>';
    } else if(st.clientes_total === 0){
      badgeTop = '<span class="coach-badge-top nuevo">Nuevo</span>';
    }
  }
  // Años de experiencia (real, si lo cargó) → chip de credibilidad.
  var anios = Number(cfg.anios_experiencia || c.anios_experiencia || 0);
  var aniosHtml = (isFinite(anios) && anios > 0)
    ? '<span class="m"><strong>'+anios+'</strong> '+(anios===1?'año':'años')+' exp.</span>'
    : '';
  if(aniosHtml){
    metricsHtml = metricsHtml
      ? metricsHtml.replace('</div>', aniosHtml+'</div>')
      : '<div class="coach-metrics">'+aniosHtml+'</div>';
  }
  // CTA: llevar a la página pública del coach (perfil + precios + comprar/contactar).
  // El slug puede estar en columna top-level o en configuracion. Si no hay slug
  // (perfil público sin configurar) caemos al flujo viejo de solicitud manual.
  var slug = String(c.slug || cfg.slug || '').trim().toLowerCase();
  var ctaPrincipal = slug
    ? '<a class="btn-primary" href="/coach/'+escH(slug)+'">Ver perfil y precios<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg></a>'
    : '<button class="btn-primary" data-coach-id="'+escH(c.id)+'" data-coach-nombre="'+escH(nombre)+'" onclick="_pwSolicitarCoach(this)">Solicitar este coach<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg></button>';
  var ctaSecundario = '';
  // Badge "En tu país" — viene del backend (country_match) cuando el
  // país del candidato (Cloudflare CF-IPCountry) matchea el del coach.
  // Es un nudge visual; no implica ningún hard filter (igual aparecen
  // todos), solo señaliza por qué este coach está en los primeros lugares.
  var paisMatchBadge = c.country_match
    ? '<span style="display:inline-flex;align-items:center;gap:5px;background:rgba(45,106,79,.10);color:var(--pw-bosque);font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;margin-bottom:6px"><span style="font-size:13px">📍</span> En tu país</span>'
    : '';
  // Check de verificado sobre la foto (todos los del directorio están verificados
  // por Pathway: perfil público activo + suscripción vigente).
  var checkHtml = '<span class="coach-photo-check" title="Coach verificado por Pathway"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg></span>';
  var verifiedChip = '<span class="coach-verified"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>Verificado</span>';
  // Valores para ordenar (datos reales; precio vacío = va al final en "precio").
  var _precioMin = precios.length ? Math.min.apply(null, precios) : '';
  var _sortAttrs = ' data-rating="'+(st&&st.avg_rating?st.avg_rating:0)+'" data-reviews="'+(st?st.reviews_count:0)+'" data-clientes="'+(st?st.clientes_total:0)+'" data-precio="'+_precioMin+'" data-idx="'+(idx||0)+'"';
  // Toda la tarjeta es clickeable → al perfil del coach (si tiene slug). Sin
  // botón "Ver perfil": queda un texto-enlace sutil como pista.
  var cardHref = slug ? '/coach/'+escH(slug) : '';
  var _hrefAttr = cardHref ? ' data-href="'+cardHref+'"' : '';
  return '<article class="coach-card'+(cardHref?' is-clickable':'')+'" style="--nicho-c:'+nichoColor+'" data-pais="'+escH(paisesAttr)+'" data-nicho="'+escH(nichoNorm)+'" data-coach-id="'+escH(c.id)+'"'+_hrefAttr+_sortAttrs+'>'
    + '<div class="coach-top">'
    +   '<div class="coach-photo-round">'+fotoHtml+checkHtml+'</div>'
    +   '<div class="coach-info">'
    +     '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'+paisMatchBadge+badgeTop+'</div>'
    +     '<h3>'+escH(nombre)+'</h3>'
    +     '<p class="coach-title">'+escH(titulo)+'</p>'
    +     '<p class="coach-location">'
    +       '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2C8 2 5 5 5 9c0 5.3 7 13 7 13s7-7.7 7-13c0-4-3-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>'
    +       escH(paisesLbl)+' · '+verifiedChip
    +     '</p>'
    +   '</div>'
    + '</div>'
    + metricsHtml
    + '<div><p class="coach-bio clamp">'+escH(bio)+'</p><button type="button" class="coach-more" onclick="_pwCoachBioMore(this)">Ver más</button></div>'
    + '<div class="coach-tags">'+tagsHtml+'</div>'
    + priceRow
    + (cardHref
        ? '<a class="coach-cta-hint" href="'+cardHref+'">Ver perfil y precios <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg></a>'
        : '<div style="margin-top:auto;display:flex;flex-direction:column;gap:10px">'+ctaPrincipal+ctaSecundario+'</div>')
    + '</article>';
}

function buildPlaceholderCard(){
  return '<article class="coach-card coach-card--placeholder" data-pais="placeholder" aria-hidden="true">'
    + '<div class="coach-top">'
    +   '<div class="coach-photo-round">'
    +     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>'
    +   '</div>'
    +   '<div class="coach-info">'
    +     '<span class="badge-coming">Próximamente</span>'
    +     '<h3>Nuevo coach</h3>'
    +     '<p class="coach-title">En camino</p>'
    +   '</div>'
    + '</div>'
    + '<p class="coach-bio">Estamos sumando más coaches al directorio. ¿Quieres ser el próximo? <a href="soy-coach.html" style="color:var(--pw-bosque);text-decoration:underline;">Regístrate aquí</a>.</p>'
    + '<button class="btn-disabled" disabled>Próximamente</button>'
    + '</article>';
}

function attachFilterTabs(){
  var empty = document.getElementById('dir-empty');
  var fPais='todos', fNicho='todos';
  function applyFilters(){
    var visibles = 0;
    document.querySelectorAll('.coach-card').forEach(function(card){
      var isPlaceholder = card.classList.contains('coach-card--placeholder');
      var paises = (card.dataset.pais || '').split(/\s+/);
      var nicho = (card.dataset.nicho || '');
      var okPais = (fPais==='todos') || (!isPlaceholder && paises.indexOf(fPais)!==-1) || (fPais==='latam' && !isPlaceholder && paises.some(function(p){return ['argentina','mexico','colombia','chile','peru','uruguay'].indexOf(p)>=0;}));
      var okNicho = (fNicho==='todos') || (!isPlaceholder && nicho===fNicho);
      var show = okPais && okNicho;
      card.style.display = show ? '' : 'none';
      if(show) visibles++;
    });
    if(empty) empty.style.display = visibles === 0 ? 'block' : 'none';
    _dirUpdateCount();
  }
  document.querySelectorAll('.filter-tab[data-pais]').forEach(function(tab){
    tab.onclick = function(){
      document.querySelectorAll('.filter-tab[data-pais]').forEach(function(t){ t.classList.remove('active'); });
      tab.classList.add('active'); fPais = tab.dataset.pais; applyFilters();
    };
  });
  document.querySelectorAll('.filter-tab[data-nicho]').forEach(function(tab){
    tab.onclick = function(){
      document.querySelectorAll('.filter-tab[data-nicho]').forEach(function(t){ t.classList.remove('active'); });
      tab.classList.add('active'); fNicho = tab.dataset.nicho; applyFilters();
    };
  });
}

// Oculta los filtros (áreas / países) que no tienen ningún coach. Solo deja
// los que existen + el "Todos".
function pruneFilters(){
  var cards = Array.prototype.slice.call(document.querySelectorAll('.coach-card'))
    .filter(function(c){ return !c.classList.contains('coach-card--placeholder'); });
  var nichos = {}, paises = {};
  cards.forEach(function(c){
    var n = (c.dataset.nicho||'').trim(); if(n) nichos[n] = 1;
    (c.dataset.pais||'').split(/\s+/).forEach(function(p){ if(p) paises[p] = 1; });
  });
  var anyLatam = ['argentina','mexico','colombia','chile','peru','uruguay'].some(function(p){ return paises[p]; });
  document.querySelectorAll('.filter-tab[data-nicho]').forEach(function(t){
    if(t.dataset.nicho==='todos') return;
    t.style.display = nichos[t.dataset.nicho] ? '' : 'none';
  });
  document.querySelectorAll('.filter-tab[data-pais]').forEach(function(t){
    if(t.dataset.pais==='todos') return;
    var show = t.dataset.pais==='latam' ? anyLatam : !!paises[t.dataset.pais];
    t.style.display = show ? '' : 'none';
  });
}
// ── Toolbar del directorio: contador + ordenar ────────────────────────────
// Cuenta las tarjetas visibles (respeta los filtros de país/nicho).
function _dirUpdateCount(){
  var el = document.getElementById('dir-count'); if(!el) return;
  var vis = Array.prototype.slice.call(document.querySelectorAll('.coach-card'))
    .filter(function(c){ return c.style.display !== 'none'; }).length;
  el.textContent = vis === 1 ? '1 coach disponible' : (vis + ' coaches disponibles');
}
// Reordena las tarjetas por el criterio elegido. "Recomendados" = orden original
// (data-idx). El resto usa datos reales (rating, clientes, precio). La tarjeta
// dir-empty siempre queda al final.
function _dirSortCards(){
  var grid = document.getElementById('coach-grid'); if(!grid) return;
  var sel = document.getElementById('dir-sort'); var mode = sel ? sel.value : 'reco';
  var num = function(el,a){ return parseFloat(el.getAttribute(a)) || 0; };
  var cards = Array.prototype.slice.call(grid.querySelectorAll('.coach-card'));
  cards.sort(function(a,b){
    if(mode==='rating'){ var r=num(b,'data-rating')-num(a,'data-rating'); return r || (num(b,'data-reviews')-num(a,'data-reviews')); }
    if(mode==='clientes'){ return num(b,'data-clientes')-num(a,'data-clientes'); }
    if(mode==='precio'){ var pa=parseFloat(a.getAttribute('data-precio')); var pb=parseFloat(b.getAttribute('data-precio')); if(isNaN(pa))pa=Infinity; if(isNaN(pb))pb=Infinity; return pa-pb; }
    return num(a,'data-idx')-num(b,'data-idx');
  });
  cards.forEach(function(c){ grid.appendChild(c); });
  var empty = document.getElementById('dir-empty'); if(empty) grid.appendChild(empty);
}
// Toda la tarjeta clickeable → al perfil. Deja pasar clicks en <a>/<button>
// (la pista "Ver perfil", el "Ver más" de la bio, o "Solicitar coach").
function _dirWireCardNav(){
  var grid = document.getElementById('coach-grid'); if(!grid || grid._navWired) return;
  grid._navWired = true;
  grid.addEventListener('click', function(ev){
    if(ev.target.closest && ev.target.closest('a, button')) return;
    var card = ev.target.closest ? ev.target.closest('.coach-card[data-href]') : null;
    if(card){ var href = card.getAttribute('data-href'); if(href) window.location.href = href; }
  });
}
// Alterna grilla/lista. Guarda la preferencia para que se recuerde.
function _dirSetView(mode){
  var grid = document.getElementById('coach-grid'); if(!grid) return;
  mode = (mode === 'list') ? 'list' : 'grid';
  grid.classList.toggle('list-view', mode === 'list');
  document.querySelectorAll('#dir-view button').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-view') === mode);
  });
  try { localStorage.setItem('pw_dir_view', mode); } catch(_e){}
}
function _dirWireToolbar(){
  var bar = document.getElementById('dir-toolbar');
  var hasCards = document.querySelectorAll('.coach-card').length > 0;
  if(bar) bar.style.display = hasCards ? 'flex' : 'none';
  var sel = document.getElementById('dir-sort');
  if(sel && !sel._wired){ sel._wired = true; sel.onchange = _dirSortCards; }
  var vw = document.getElementById('dir-view');
  if(vw && !vw._wired){
    vw._wired = true;
    vw.addEventListener('click', function(ev){
      var b = ev.target.closest ? ev.target.closest('button[data-view]') : null;
      if(b) _dirSetView(b.getAttribute('data-view'));
    });
  }
  // Aplica la preferencia guardada (por defecto grilla).
  var saved = 'grid'; try { saved = localStorage.getItem('pw_dir_view') || 'grid'; } catch(_e){}
  _dirSetView(saved);
}
// Coaches ocultos manualmente del directorio público: no se muestran aunque
// tengan el perfil público activo (p. ej. coaches que aún no están disponibles
// para nuevos candidatos). Para volver a mostrar a alguien, sacarlo de la lista.
// Lo ideal de fondo: apagar perfil_publico_activo en la base.
var COACH_OCULTOS = ['maria isabel','madrigal'];
async function loadCoachesDirectory(){
  try {
    var url = SB + '/rest/v1/usuarios_publicos?rol=in.(coach,admin)&activo=eq.true&select=id,nombre,email,foto_url,nombre_practica,bio,slug,perfil_publico_activo,configuracion&order=created_at.asc';
    var r = await fetch(url, { headers:{ apikey:KEY, Authorization:'Bearer '+KEY } });
    if(r.status===404||r.status===406){ r = await fetch(url.replace('/usuarios_publicos?','/usuarios?'), { headers:{ apikey:KEY, Authorization:'Bearer '+KEY } }); } // vista sin aplicar → cae a usuarios (RLS de directorio + columnas seguras)
    if(!r.ok) throw new Error('HTTP '+r.status);
    var coaches = await r.json();
    if(!Array.isArray(coaches)) coaches = [];
    // Solo coaches visibles Y con perfil completo y cobrable
    coaches = coaches.filter(function(c){
      var cfg0 = c.configuracion || {};
      if(cfg0.visible_directorio === false) return false;
      var _id = ((c.nombre||'')+' '+(c.nombre_practica||'')+' '+(c.email||'')).toLowerCase();
      if(_id.indexOf('demo') >= 0 || _id.indexOf('test') >= 0 || _id.indexOf('prueba') >= 0) return false;
      if(COACH_OCULTOS.some(function(x){ return x && _id.indexOf(x) >= 0; })) return false;
      return _coachCompleto(c);
    });
    // Curación invisible: priorizar coaches del país del candidato. Si no
    // hay ninguno en su país, se muestran todos (nunca pantalla vacía).
    var _cp = ''; try { _cp = (localStorage.getItem('pw_cand_pais') || '').toLowerCase(); } catch(_e){}
    if(_cp && _cp !== 'otro'){
      var _m = coaches.filter(function(c){
        var cf = c.configuracion || {};
        var mk = Array.isArray(cf.mercados) ? cf.mercados : (cf.mercado ? [cf.mercado] : []);
        return mk.some(function(x){ return String(x || '').toLowerCase().indexOf(_cp) >= 0; });
      });
      if(_m.length) coaches = _m;
    }
    var grid = document.getElementById('coach-grid');
    if(!grid) return;
    // Stats reales (rating/clientes) en paralelo — enriquecen las tarjetas.
    var statsMap = await fetchCoachStats();
    var html = coaches.map(function(c, i){ return buildCoachCard(c, statsMap, i); }).join('')
      + '<div class="dir-empty" id="dir-empty">Todavía no hay coaches en este país. <a href="#directorio" style="color:var(--pw-bosque);text-decoration:underline;">Ver todos</a></div>';
    grid.innerHTML = html;
    attachFilterTabs();
    pruneFilters();
    _pwPruneBioMore();
    _dirWireToolbar();
    _dirWireCardNav();
    _dirUpdateCount();
  } catch (e) {
    console.warn('No se pudo cargar el directorio dinámico:', e);
    // Antes quedaba el grid en blanco sin avisar. Mostramos un mensaje + reintentar.
    var _g=document.getElementById('coach-grid');
    if(_g && !_g.children.length) _g.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:48px 16px;color:#5A6A60;font-size:15px">No pudimos cargar los coaches en este momento. <a href="#" onclick="location.reload();return false;" style="color:#2D6A4F;font-weight:600">Reintentar</a>.</div>';
    attachFilterTabs();
  }
}

// ── Muro de registro del directorio ──────────────────────────
// El candidato ve el directorio como mockup difuminado; al registrarse
// se guarda el lead y se cargan los coaches reales. localStorage recuerda
// el registro para no volver a pedirlo.
function _pwAbrirDirectorio(){
  var gate = document.getElementById('dir-gate');
  var grid = document.getElementById('coach-grid');
  if(gate && gate.parentNode) gate.parentNode.removeChild(gate);
  if(grid) grid.setAttribute('data-locked','0');
  loadCoachesDirectory();
}
// Fase 1 (manual): el candidato solicita un coach. No hay pago acá —
// se registra el lead en contactos_chat y Pathway lo gestiona a mano
// (avisar al coach, esperar que acepte en 24 h, cobrar por Pathway).
window._pwSolicitarCoach = function(btn){
  if(!btn || btn.disabled) return;
  var cid = btn.getAttribute('data-coach-id') || '';
  var cnm = btn.getAttribute('data-coach-nombre') || '';
  var nm = '', em = '';
  try { nm = localStorage.getItem('pw_cand_nombre') || ''; em = localStorage.getItem('pw_cand_email') || ''; } catch(_e){}
  btn.disabled = true; btn.style.opacity = '.6'; btn.textContent = 'Enviando…';
  var done = function(){ btn.textContent = '✓ Solicitud enviada — te contactamos'; };
  fetch(SB + '/rest/v1/contactos_chat', {
    method: 'POST',
    headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
    body: JSON.stringify({ contacto: (nm ? nm + ' · ' : '') + (em || 'sin email') + ' → SOLICITA coach: ' + cnm + ' [' + cid + ']', pagina: 'solicitud-coach' })
  }).then(done, done);
};
window._pwRegCandidato = function(e){
  e.preventDefault();
  var em = (document.getElementById('dir-email').value || '').trim();
  var nm = (document.getElementById('dir-nombre').value || '').trim();
  var msg = document.getElementById('dir-form-msg');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){
    if(msg){ msg.textContent = 'Ingresa un email válido.'; msg.style.color = '#c0756e'; }
    return false;
  }
  var btn = document.querySelector('#dir-form button[type=submit]');
  if(btn){ btn.disabled = true; btn.style.opacity = '.6'; btn.textContent = 'Desbloqueando…'; }
  fetch(SB + '/rest/v1/contactos_chat', {
    method: 'POST',
    headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
    body: JSON.stringify({ contacto: (nm ? nm + ' · ' : '') + em, pagina: 'soy-candidato' })
  }).catch(function(){});
  try { localStorage.setItem('pw_cand_reg', '1'); localStorage.setItem('pw_cand_nombre', nm); localStorage.setItem('pw_cand_email', em); } catch(_e){}
  _pwAbrirDirectorio();
  return false;
};
(function(){
  var reg = false; try { reg = localStorage.getItem('pw_cand_reg') === '1'; } catch(_e){}
  if(!reg){ window.location.replace('soy-candidato.html'); return; }
  loadCoachesDirectory();
})();
