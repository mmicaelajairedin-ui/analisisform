name: Migrate calendar to public embed (one-shot)

on:
  push:
    branches: [auto/migrate-calendar-public]
    paths:
      - '.github/workflows/migrate-calendar-public.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auto/migrate-calendar-public

      - name: Write patch script
        run: |
          cat > /tmp/patch.js <<'PATCH_EOF'
          const fs = require('fs');
          const FILE = 'panel.html';
          let html = fs.readFileSync(FILE, 'utf8');

          function replaceOnce(from, to, label){
            const idx = html.indexOf(from);
            if (idx === -1) throw new Error('NO MATCH para [' + label + ']');
            const idx2 = html.indexOf(from, idx + 1);
            if (idx2 !== -1) throw new Error('MULTIPLES MATCHES para [' + label + ']');
            html = html.slice(0, idx) + to + html.slice(idx + from.length);
            console.log('OK ' + label);
          }

          replaceOnce(
            "    var cfg=Object.assign({},(ME&&ME.configuracion)||{},lsCfg);    var calUrl=cfg.calendly_url||'';\n",
            "    var cfg=Object.assign({},(ME&&ME.configuracion)||{},lsCfg);    var calUrl=cfg.calendly_url||'';\n    var embedUrl=cfg.calendar_embed_url||'';\n",
            '1) embedUrl var en panel home'
          );

          const oldAgenda = "    // ── Mi agenda — proximas llamadas (Google Calendar via /api/calendar) ──\n" +
          "    html+='<div id=\"agenda-card\" style=\"background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:20px 22px;margin-bottom:32px;\">';\n" +
          "    html+='<div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;\">';\n" +
          "    html+='<div style=\"font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;\">📅 Mi agenda — próximas llamadas</div>';\n" +
          "    html+='<a href=\"https://calendar.google.com/calendar/u/0/r\" target=\"_blank\" rel=\"noopener\" style=\"font-size:11px;color:var(--accent);font-weight:600;text-decoration:none;\">Ver en Google Calendar →</a>';\n" +
          "    html+='</div>';\n" +
          "    html+='<div id=\"agenda-list\" style=\"display:grid;gap:8px;\">';\n" +
          "    for(var _i=0;_i<3;_i++){\n" +
          "      html+='<div style=\"background:#F5F0F0;border-radius:10px;height:54px;opacity:.55;\"></div>';\n" +
          "    }\n" +
          "    html+='</div></div>';\n";

          const newAgenda = "    // ── Mi calendario (embebido publico) ──\n" +
          "    html+='<div id=\"agenda-card\" style=\"background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:20px 22px;margin-bottom:32px;\">';\n" +
          "    html+='<div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;\">';\n" +
          "    html+='<div style=\"font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;\">📅 Mi calendario</div>';\n" +
          "    html+='<a href=\"https://calendar.google.com/calendar/u/0/r\" target=\"_blank\" rel=\"noopener\" style=\"font-size:11px;color:var(--accent);font-weight:600;text-decoration:none;\">Abrir Google Calendar →</a>';\n" +
          "    html+='</div>';\n" +
          "    if(embedUrl){\n" +
          "      html+='<div style=\"border-radius:10px;overflow:hidden;border:1px solid var(--border);\">';\n" +
          "      html+='<iframe src=\"'+escH(embedUrl)+'\" style=\"border:0;width:100%;height:500px;display:block;\" frameborder=\"0\" scrolling=\"no\"></iframe>';\n" +
          "      html+='</div>';\n" +
          "    } else {\n" +
          "      html+='<div style=\"padding:24px 18px;text-align:center;background:#FAF8F8;border-radius:10px;font-size:13px;color:var(--muted);line-height:1.55;\">Conectá tu calendario en <button onclick=\"showSection(\\\\'config\\\\')\" style=\"background:none;border:none;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;padding:0;font-family:inherit;font-size:inherit;\">Configuración</button> para verlo acá.</div>';\n" +
          "    }\n" +
          "    html+='</div>';\n";

          replaceOnce(oldAgenda, newAgenda, '2) card Mi agenda -> iframe embed');

          replaceOnce(
            "    // Hidratar agenda (Google Calendar via /api/calendar)\n    if(typeof _loadAgenda==='function') _loadAgenda();\n",
            "    // (Agenda ahora se renderiza inline con iframe embed; _loadAgenda eliminado)\n",
            '3) sacar llamada _loadAgenda'
          );

          const startMarker = "// ── Hidratar agenda desde Google Calendar (Supabase Edge Function /calendar) ──\nfunction _loadAgenda(){";
          const startIdx = html.indexOf(startMarker);
          if (startIdx === -1) throw new Error('NO MATCH inicio _loadAgenda');
          const endMarker = "\n}\n\nfunction _renderLinks";
          const endIdx = html.indexOf(endMarker, startIdx);
          if (endIdx === -1) throw new Error('NO MATCH cierre _loadAgenda');
          const before = html.slice(0, startIdx);
          const after = html.slice(endIdx + 2);
          html = before + "// (funcion _loadAgenda eliminada: agenda ahora es iframe embed)\n" + after;
          console.log('OK 4) eliminada funcion _loadAgenda');

          replaceOnce(
            "    var gcalUrl=cfg.gcal_ical_url||'';",
            "    var embedUrl=cfg.calendar_embed_url||'';",
            '5) var gcalUrl en config'
          );

          const oldConfigUI = "    // ─── AGENDA · SINCRONIZACIÓN GOOGLE CALENDAR ───\n" +
          "    h+='<div style=\"background:#fff;border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:14px;\">';\n" +
          "    h+='<div style=\"font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;\">Agenda · Sincronización</div>';\n" +
          "    h+='<div style=\"font-size:13px;color:var(--muted);margin-bottom:14px;\">Conectá tu Google Calendar para ver todas tus llamadas (Calendly + manuales + invitaciones) directamente en el panel home, sin abrir Google.</div>';\n" +
          "    h+='<label style=\"display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;\">URL secreta iCal de Google Calendar</label>';\n" +
          "    h+='<input id=\"cfg-gcal\" type=\"url\" value=\"'+escH(gcalUrl)+'\" placeholder=\"https://calendar.google.com/calendar/ical/.../basic.ics\" style=\"width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:Inter,sans-serif;\">';\n";

          const newConfigUI = "    // ─── AGENDA · CALENDARIO PUBLICO EMBEBIDO ───\n" +
          "    h+='<div style=\"background:#fff;border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:14px;\">';\n" +
          "    h+='<div style=\"font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;\">Agenda · Calendario público</div>';\n" +
          "    h+='<div style=\"font-size:13px;color:var(--muted);margin-bottom:14px;\">Pegá el link público de tu calendario para mostrarlo embebido en tu panel. Solo se muestran los eventos que vos marcaste como públicos.</div>';\n" +
          "    h+='<label style=\"display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;\">Link público de Google Calendar (opcional)</label>';\n" +
          "    h+='<input id=\"cfg-cal-embed\" type=\"url\" value=\"'+escH(embedUrl)+'\" placeholder=\"https://calendar.google.com/calendar/embed?src=...\" style=\"width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:Inter,sans-serif;\">';\n";

          replaceOnce(oldConfigUI, newConfigUI, '6) bloque Config UI');

          const oldHelp = "    h+='<div style=\"font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5;\">¿Cómo obtengo este URL? <a href=\"#\" onclick=\"alert(\\'Andá a calendar.google.com → engranaje arriba a la derecha → Configuración → en el menú izquierdo elegí tu calendario → bajá a Integrar el calendario → copiá la Dirección secreta en formato iCal (NO la pública). Va a verse así: https://calendar.google.com/calendar/ical/.../private-XXX/basic.ics\\'); return false;\" style=\"color:var(--accent);font-weight:600;text-decoration:none;\">Ver pasos →</a></div>';\n    h+='<div style=\"font-size:11px;color:var(--muted);margin-top:6px;\">🔒 Esta URL es privada. Solo se usa desde el servidor para leer tus eventos.</div>';\n";

          const newHelp = "    h+='<div style=\"font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5;\">¿Cómo obtengo este link? <a href=\"#\" onclick=\"alert(\\'En calendar.google.com → engranaje arriba a la derecha → Configuración → elegí tu calendario en el menú izquierdo → bajá a Integrar el calendario → copiá la URL en Código para insertar (la que está dentro del src= del iframe, NO el iframe completo). Va a verse así: https://calendar.google.com/calendar/embed?src=...\\'); return false;\" style=\"color:var(--accent);font-weight:600;text-decoration:none;\">Ver pasos →</a></div>';\n    h+='<div style=\"font-size:11px;color:var(--muted);margin-top:6px;\">🌐 Este link es público — solo se ven los eventos que marcaste como visibles para cualquiera.</div>';\n";

          replaceOnce(oldHelp, newHelp, '7) help text');

          replaceOnce(
            "  var gcalUrl=((document.getElementById('cfg-gcal')||{}).value||'').trim();",
            "  var embedUrl=((document.getElementById('cfg-cal-embed')||{}).value||'').trim();",
            '8) lectura DOM en _saveConfig'
          );

          replaceOnce(
            "    calendly_url:calUrl,\n    gcal_ical_url:gcalUrl,",
            "    calendly_url:calUrl,\n    calendar_embed_url:embedUrl,",
            '9) campo en fullCfg localStorage'
          );

          replaceOnce(
            "    color_marca:color,logo_url:logoUrl,calendly_url:calUrl,gcal_ical_url:gcalUrl,",
            "    color_marca:color,logo_url:logoUrl,calendly_url:calUrl,calendar_embed_url:embedUrl,",
            '10) campo en configuracion Supabase'
          );

          fs.writeFileSync(FILE, html);
          console.log('Todos los reemplazos aplicados.');
          PATCH_EOF
          node /tmp/patch.js

      - name: Verify changes
        run: |
          if grep -n "gcal_ical_url\|cfg-gcal\b\|_loadAgenda(" panel.html; then
            echo "ERROR: quedaron restos"
            exit 1
          fi
          echo "OK: sin restos del campo viejo"
          grep -cn "calendar_embed_url\|cfg-cal-embed\|embedUrl" panel.html || true

      - name: Validate JS syntax
        run: |
          node <<'EOF'
          const fs = require('fs');
          const html = fs.readFileSync('panel.html','utf8');
          const matches = html.match(/<script\b[^>]*>[\s\S]*?<\/script>/gi) || [];
          let failed = 0;
          for (const s of matches) {
            const openTag = s.match(/<script\b[^>]*>/i)[0];
            if (/\ssrc\s*=/i.test(openTag)) continue;
            if (/\stype\s*=\s*["']?(module|application\/(json|ld\+json)|text\/(template|html))/i.test(openTag)) continue;
            const body = s.replace(/^<script\b[^>]*>/i,'').replace(/<\/script>\s*$/i,'');
            if (!body.trim()) continue;
            try { new Function(body); } catch (e) { console.error('SYNTAX:', e.message); failed++; }
          }
          if (failed > 0) process.exit(1);
          console.log('Sintaxis OK');
          EOF

      - name: Self-delete workflow + commit & push to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/migrate-calendar-public.yml
          git add panel.html
          if git diff --staged --quiet; then
            echo "Nada que commitear"
            exit 0
          fi
          git commit -m "refactor(panel): migrar calendar iCal privado a embed publico"
          git push origin auto/migrate-calendar-public
