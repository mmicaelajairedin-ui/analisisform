name: Deploy IAP Backend — Manual Only

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "apply-iap-fixes" to confirm'
        required: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Validate confirmation
        if: ${{ github.event.inputs.confirm != 'apply-iap-fixes' }}
        run: |
          echo "❌ Confirmation required. Type 'apply-iap-fixes' in the input field."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: |
          curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
          sudo apt-get install -y nodejs
          npm install -g supabase

      - name: Validate migrations locally
        run: |
          set -euo pipefail

          echo "📋 Checking pending migrations..."

          # List all migrations and parse Remote column
          # Expected format: Local | Remote | Timestamp
          # Pending migrations have Remote = "" (empty)
          PENDING_LOCAL=$(supabase migration list --linked 2>/dev/null | awk -F'|' '/^[0-9]+/ {
            local=$1; remote=$2; gsub(/^[[:space:]]+|[[:space:]]+$/, "", local); gsub(/^[[:space:]]+|[[:space:]]+$/, "", remote)
            if (remote == "") print local
          }' | sort)

          if [ -z "$PENDING_LOCAL" ]; then
            echo "❌ No pending migrations found. IAP fixes already applied?"
            exit 1
          fi

          echo "✅ Pending migrations:"
          echo "$PENDING_LOCAL"

          # Validate we have EXACTLY the two required migrations
          REQUIRED_1="20261001_iap_subscriptions"
          REQUIRED_2="20261023_add_last_signed_date"

          COUNT=$(echo "$PENDING_LOCAL" | wc -l)

          if [ "$COUNT" -ne 2 ]; then
            echo "❌ Expected exactly 2 pending migrations, found $COUNT"
            echo "   Required: $REQUIRED_1, $REQUIRED_2"
            echo "   Found: $PENDING_LOCAL"
            exit 1
          fi

          # Verify both required migrations are present
          if ! echo "$PENDING_LOCAL" | grep -q "$REQUIRED_1"; then
            echo "❌ Missing required migration: $REQUIRED_1"
            exit 1
          fi

          if ! echo "$PENDING_LOCAL" | grep -q "$REQUIRED_2"; then
            echo "❌ Missing required migration: $REQUIRED_2"
            exit 1
          fi

          echo "✅ Both required migrations present and pending"

      - name: Verify production environment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "❌ Missing SUPABASE_URL or SUPABASE_ACCESS_TOKEN secrets"
            exit 1
          fi

          # Verify it's production (analisisform project)
          if ! echo "$SUPABASE_URL" | grep -q "analisisform"; then
            echo "❌ Not targeting production (analisisform). URL: $SUPABASE_URL"
            exit 1
          fi

          echo "✅ Production environment verified (analisisform)"

      - name: Apply migrations to production
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          echo "⚠️  Applying IAP migrations to production..."

          # Push only the pending migrations (both should be ready)
          # db push --linked applies all pending migrations in order
          supabase db push --linked

          if [ $? -eq 0 ]; then
            echo "✅ Migrations applied successfully"
          else
            echo "❌ Migration apply failed"
            exit 1
          fi

      - name: Verify migrations applied
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          echo "📋 Verifying migrations..."

          # Wait a moment for replicas to sync
          sleep 5

          # Check that no migrations are still pending
          PENDING=$(supabase migration list --linked 2>/dev/null | awk -F'|' '/^[0-9]+/ {
            remote=$2; gsub(/^[[:space:]]+|[[:space:]]+$/, "", remote)
            if (remote == "") print remote
          }' | wc -l)

          if [ "$PENDING" -gt 0 ]; then
            echo "❌ Migrations still pending after apply: $PENDING"
            exit 1
          fi

          echo "✅ All migrations applied (no pending migrations)"

      - name: Success notification
        run: |
          echo ""
          echo "=========================================="
          echo "✅ IAP Backend Deployment Complete"
          echo "=========================================="
          echo ""
          echo "Applied migrations:"
          echo "  • 20261001_iap_subscriptions"
          echo "  • 20261023_add_last_signed_date"
          echo ""
          echo "Next steps:"
          echo "  1. TIER 1 tests on Mac (Gonzalo) to verify webhook works"
          echo "  2. TIER 2 tests with Apple Sandbox (real JWS)"
          echo "  3. Production monitoring for 24h"
          echo ""
