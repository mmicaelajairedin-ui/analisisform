name: Deploy IAP (Manual Only)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  id-token: write
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: fix/iap-webhook-security

      - name: Set up Supabase CLI
        run: |
          npm install -g supabase

      - name: Configure Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase projects list --linked > /dev/null 2>&1 || {
            echo "ERROR: Cannot access Supabase. Check SUPABASE_ACCESS_TOKEN secret."
            exit 1
          }

      - name: Check pending migrations
        id: check_migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Get list of remote migrations (already applied to production)
          REMOTE_MIGRATIONS=$(supabase migration list --linked 2>&1)

          if ! echo "$REMOTE_MIGRATIONS" | grep -q "Remote"; then
            echo "ERROR: Cannot read migration list from Supabase."
            echo "Output: $REMOTE_MIGRATIONS"
            exit 1
          fi

          # Extract remote column (everything after "Remote" header)
          REMOTE_APPLIED=$(echo "$REMOTE_MIGRATIONS" | awk '/Remote/{flag=1; next} /^$/{flag=0} flag' | grep -o '^[^ ]*' | sort)

          # Get local migrations
          LOCAL_MIGRATIONS=$(ls supabase/migrations/*.sql 2>/dev/null | xargs -n1 basename | sort)

          # Expected migrations for IAP backend (in order)
          EXPECTED_MIGRATIONS="20261001_iap_subscriptions.sql
          20261023_add_last_signed_date.sql"

          EXPECTED=$(echo "$EXPECTED_MIGRATIONS" | grep -v '^$' | sort)

          echo "=== Local Migrations ==="
          echo "$LOCAL_MIGRATIONS"
          echo ""
          echo "=== Expected Migrations ==="
          echo "$EXPECTED"
          echo ""
          echo "=== Remote (Already Applied) ==="
          echo "$REMOTE_APPLIED"
          echo ""

          # Verify only expected migrations exist locally
          if ! echo "$LOCAL_MIGRATIONS" | grep -qF "20261001_iap_subscriptions.sql"; then
            echo "ERROR: Missing 20261001_iap_subscriptions.sql"
            exit 1
          fi

          if ! echo "$LOCAL_MIGRATIONS" | grep -qF "20261023_add_last_signed_date.sql"; then
            echo "ERROR: Missing 20261023_add_last_signed_date.sql"
            exit 1
          fi

          # Verify no other migrations in this range
          OTHER_MIGRATIONS=$(echo "$LOCAL_MIGRATIONS" | grep "^202610" | grep -v -E "^20261001_iap_subscriptions\.sql$|^20261023_add_last_signed_date\.sql$")

          if [ ! -z "$OTHER_MIGRATIONS" ]; then
            echo "ERROR: Unexpected migrations found: $OTHER_MIGRATIONS"
            echo "Only 20261001 and 20261023 are allowed."
            exit 1
          fi

          echo "✅ Migration check passed"

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy apple-iap-webhook --no-verify-jwt

      - name: Verify deployment
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Check that function is deployed
          supabase functions list --linked | grep -q "apple-iap-webhook" && \
            echo "✅ apple-iap-webhook deployed" || \
            (echo "ERROR: Deployment failed"; exit 1)

      - name: Summary
        run: |
          echo "## IAP Backend Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- Function: apple-iap-webhook (FIX 1, FIX 2)" >> $GITHUB_STEP_SUMMARY
          echo "- Migrations: 20261001, 20261023" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ✅ Deployed" >> $GITHUB_STEP_SUMMARY
