name: Validate HTML inline JS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Inline JS syntax check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate inline JS syntax in all HTML files
        run: |
          node <<'EOF'
          const fs = require('fs');
          const path = require('path');

          function findHtmls(dir, results = []) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.name.startsWith('.') || entry.name === 'node_modules') continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) findHtmls(full, results);
              else if (entry.name.endsWith('.html')) results.push(full);
            }
            return results;
          }

          const htmls = findHtmls('.');
          let failed = 0;
          let totalScripts = 0;

          for (const file of htmls) {
            const html = fs.readFileSync(file, 'utf8');
            const matches = html.match(/<script\b[^>]*>[\s\S]*?<\/script>/gi) || [];
            for (let i = 0; i < matches.length; i++) {
              const s = matches[i];
              const openTag = s.match(/<script\b[^>]*>/i)[0];
              // Skip external scripts and non-JS types (module-imports trip new Function)
              if (/\ssrc\s*=/i.test(openTag)) continue;
              // Solo se valida JS EJECUTABLE: sin type, o type javascript. Cualquier
              // otro type (module, json, ld+json, text/template, y plantillas como
              // text/pw-email) NO es JavaScript → se salta. Antes era una lista negra
              // que no cubría los templates de email y daba falsos 'Unexpected token <'.
              const _tp = openTag.match(/\stype\s*=\s*["']?([^"'\s>]+)/i);
              if (_tp && !/^(text|application)\/javascript$/i.test(_tp[1])) continue;
              const body = s.replace(/^<script\b[^>]*>/i, '').replace(/<\/script>\s*$/i, '');
              if (!body.trim()) continue;
              totalScripts++;
              try {
                new Function(body);
              } catch (e) {
                console.error('✗ ' + file + ' :: script #' + i + ' :: ' + e.message);
                failed++;
              }
            }
          }

          if (failed > 0) {
            console.error('\n' + failed + ' script(s) con errores de sintaxis.');
            process.exit(1);
          }
          console.log('✓ ' + totalScripts + ' script(s) inline validados en ' + htmls.length + ' archivo(s) HTML — sin errores.');
          EOF
