name: Wider Resumen wrapper + remove admin calendar (one-shot)

on:
  push:
    branches: [auto/wider-calendar-remove-admin]
    paths:
      - '.github/workflows/wider-cal.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auto/wider-calendar-remove-admin

      - name: Write patch script
        run: |
          cat > /tmp/patch.js <<'PATCH_EOF'
          const fs = require('fs');
          const FILE = 'panel.html';
          let html = fs.readFileSync(FILE, 'utf8');

          function replaceOnce(from, to, label){
            const idx = html.indexOf(from);
            if (idx === -1) throw new Error('NO MATCH para [' + label + ']');
            const idx2 = html.indexOf(from, idx + 1);
            if (idx2 !== -1) throw new Error('MULTIPLES MATCHES para [' + label + ']');
            html = html.slice(0, idx) + to + html.slice(idx + from.length);
            console.log('OK ' + label);
          }

          // 1) Ampliar max-width del wrapper Resumen (solo aparece 1 vez en main)
          replaceOnce(
            "var html='<div style=\"padding:8px 4px 40px;max-width:960px;\">';",
            "var html='<div style=\"padding:8px 4px 40px;max-width:1240px;\">';",
            '1) Wrapper Resumen 960px -> 1240px'
          );

          // 2) Eliminar bloque Calendario de la empresa (admin-only)
          const adminBlock =
          "    // ── CALENDARIO DE LA EMPRESA (solo admin: Micaela) ──\n" +
          "    if(ME && ME.email==='mmicaela.jairedin@gmail.com'){\n" +
          "      html+='<div style=\"background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:14px 18px;margin-bottom:18px;box-shadow:0 2px 8px rgba(0,0,0,.04);\">';\n" +
          "      html+='<div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;user-select:none;\" onclick=\"(function(h){var f=document.getElementById(\\'_admin_cal_frame\\');var a=h.querySelector(\\'.cal-arrow\\');var open=f.style.display!==\\'none\\';f.style.display=open?\\'none\\':\\'block\\';a.textContent=open?\\'▾\\':\\'▴\\';})(this)\">';\n" +
          "      html+='<div style=\"display:flex;align-items:center;gap:10px;\">';\n" +
          "      html+='<div style=\"font-size:22px;\">&#128197;</div>';\n" +
          "      html+='<div><div style=\"font-size:14px;font-weight:800;color:var(--title);font-family:Montserrat,sans-serif;letter-spacing:-.01em;\">Calendario de la empresa</div>';\n" +
          "      html+='<div style=\"font-size:11px;color:var(--muted);\">Disponibilidad compartida del equipo Pathway</div></div>';\n" +
          "      html+='</div>';\n" +
          "      html+='<div style=\"display:flex;align-items:center;gap:6px;color:var(--accent);font-size:12px;font-weight:700;\">Ver disponibilidad <span class=\"cal-arrow\">&#9662;</span></div>';\n" +
          "      html+='</div>';\n" +
          "      html+='<div id=\"_admin_cal_frame\" style=\"display:none;margin-top:14px;border-radius:10px;overflow:hidden;border:1px solid var(--border);\">';\n" +
          "      html+='<iframe src=\"https://calendar.google.com/calendar/embed?height=600&wkst=1&ctz=Europe%2FMadrid&showPrint=0&src=aGlAcGF0aHdheWNhcmVlcmNvYWNoLmNvbQ&src=Nmo3M2gwNzlzbzZrZW1xNHJqdTMycGNoOGNAZ3JvdXAuY2FsZW5kYXIuZ29vZ2xlLmNvbQ&src=dDY0a3NtZjI4MHVqamR2djhnNTNqdGZzYzl1MHUzZGxAaW1wb3J0LmNhbGVuZGFyLmdvb2dsZS5jb20&color=%238e24aa&color=%23f4511e&color=%234285f4\" style=\"border:0;width:100%;height:600px;display:block;\" frameborder=\"0\" scrolling=\"no\"></iframe>';\n" +
          "      html+='</div>';\n" +
          "      html+='</div>';\n" +
          "    }\n";

          replaceOnce(adminBlock, '', '2) Eliminar bloque admin calendar');

          fs.writeFileSync(FILE, html);
          console.log('Patch aplicado.');
          PATCH_EOF
          node /tmp/patch.js

      - name: Validate JS syntax
        run: |
          node <<'EOF'
          const fs = require('fs');
          const html = fs.readFileSync('panel.html','utf8');
          const matches = html.match(/<script\b[^>]*>[\s\S]*?<\/script>/gi) || [];
          let failed = 0;
          for (const s of matches) {
            const openTag = s.match(/<script\b[^>]*>/i)[0];
            if (/\ssrc\s*=/i.test(openTag)) continue;
            if (/\stype\s*=\s*["']?(module|application\/(json|ld\+json)|text\/(template|html))/i.test(openTag)) continue;
            const body = s.replace(/^<script\b[^>]*>/i,'').replace(/<\/script>\s*$/i,'');
            if (!body.trim()) continue;
            try { new Function(body); } catch (e) { console.error('SYNTAX:', e.message); failed++; }
          }
          if (failed > 0) process.exit(1);
          console.log('Sintaxis OK');
          EOF

      - name: Self-delete workflow + commit & push to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wider-cal.yml
          git add panel.html
          if git diff --staged --quiet; then
            echo "Nada que commitear"
            exit 0
          fi
          git commit -m "feat(panel): ampliar wrapper Resumen a 1240px y eliminar calendario admin"
          git push origin auto/wider-calendar-remove-admin
