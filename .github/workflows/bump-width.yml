name: Bump wrapper width to 1400px (one-shot)

on:
  push:
    branches: [auto/wider-calendar-remove-admin]
    paths:
      - '.github/workflows/bump-width.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auto/wider-calendar-remove-admin

      - name: Patch
        run: |
          node <<'EOF'
          const fs = require('fs');
          let html = fs.readFileSync('panel.html','utf8');
          const from = "var html='<div style=\"padding:8px 4px 40px;max-width:1240px;\">';";
          const to   = "var html='<div style=\"padding:8px 4px 40px;max-width:1400px;\">';";
          const i = html.indexOf(from);
          if (i === -1) throw new Error('NO MATCH');
          if (html.indexOf(from, i+1) !== -1) throw new Error('MULTIPLES');
          html = html.slice(0,i) + to + html.slice(i+from.length);
          fs.writeFileSync('panel.html', html);
          console.log('OK 1240->1400');
          EOF

      - name: Validate JS
        run: |
          node <<'EOF'
          const fs = require('fs');
          const html = fs.readFileSync('panel.html','utf8');
          const matches = html.match(/<script\b[^>]*>[\s\S]*?<\/script>/gi) || [];
          let failed = 0;
          for (const s of matches) {
            const openTag = s.match(/<script\b[^>]*>/i)[0];
            if (/\ssrc\s*=/i.test(openTag)) continue;
            if (/\stype\s*=\s*["']?(module|application\/(json|ld\+json)|text\/(template|html))/i.test(openTag)) continue;
            const body = s.replace(/^<script\b[^>]*>/i,'').replace(/<\/script>\s*$/i,'');
            if (!body.trim()) continue;
            try { new Function(body); } catch (e) { console.error('SYNTAX:', e.message); failed++; }
          }
          if (failed > 0) process.exit(1);
          console.log('OK sintaxis');
          EOF

      - name: Self-delete + commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bump-width.yml
          git add panel.html
          git diff --staged --quiet && exit 0
          git commit -m "feat(panel): subir wrapper Resumen 1240px -> 1400px"
          git push origin auto/wider-calendar-remove-admin
