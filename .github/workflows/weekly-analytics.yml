name: "📊 Weekly Analytics Agent"

# Dispara la edge function analytics-weekly cada lunes 8:00 UTC.
# Por el limite de 150s de Supabase Edge Functions, llamamos a la function
# UNA VEZ POR ZONA (en steps separados). Cada invocacion procesa una sola
# zona y manda su email correspondiente.
#
# Secrets requeridos en el repo:
#   SUPABASE_PROJECT_URL    https://<proyecto>.supabase.co
#   AGENT_TRIGGER_SECRET    mismo valor que el secret de Supabase
#
# Trigger manual: Actions → Weekly Analytics Agent → Run workflow

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-analytics:
    name: "Disparar reporte semanal"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "Setup secrets (sanitizar)"
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          AGENT_TRIGGER_SECRET: ${{ secrets.AGENT_TRIGGER_SECRET }}
        run: |
          URL=$(printf '%s' "$SUPABASE_PROJECT_URL" | tr -d '[:space:]' | sed 's:/*$::')
          SECRET=$(printf '%s' "$AGENT_TRIGGER_SECRET" | tr -d '[:space:]')
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "::error::Faltan secrets SUPABASE_PROJECT_URL o AGENT_TRIGGER_SECRET"
            exit 1
          fi
          echo "URL chars: ${#URL} | Secret chars: ${#SECRET}"
          # Exportar a outputs para los steps siguientes
          echo "URL=$URL" >> $GITHUB_ENV
          echo "SECRET=$SECRET" >> $GITHUB_ENV

      - name: "📊 Reporte de Pathway"
        run: |
          # Una invocacion por zona — cada una tiene 150s de wall time
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            "${URL}/functions/v1/analytics-weekly?zone=pathwaycareercoach.com" \
            -H "X-Trigger-Secret: ${SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 200) || {
              echo "::error::curl Pathway fallo con exit code $?"
              exit 1
            }
          status=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "HTTP $status"
          echo "$body"
          if [ "$status" != "200" ]; then
            echo "::error::Pathway devolvió status $status"
            exit 1
          fi

      - name: "📊 Reporte de Micaela"
        # Continua aunque Pathway haya fallado — son independientes
        if: always()
        run: |
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            "${URL}/functions/v1/analytics-weekly?zone=micaelajairedin.com" \
            -H "X-Trigger-Secret: ${SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 200) || {
              echo "::error::curl Micaela fallo con exit code $?"
              exit 1
            }
          status=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "HTTP $status"
          echo "$body"
          if [ "$status" != "200" ]; then
            echo "::error::Micaela devolvió status $status"
            exit 1
          fi
