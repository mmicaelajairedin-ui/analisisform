name: Comparar Sonnet 4.5 vs 5.5 (llamadas reales)

# Ejecuta las cuatro funciones de texto —la versión anterior y la migrada— con
# casos INVENTADOS y llamadas REALES a la API de Anthropic, y deja un informe
# con las dos salidas lado a lado, latencias, tokens y coste.
#
# NO TOCA PRODUCCIÓN: Supabase va simulado (ninguna tabla se lee ni se
# escribe), no se invoca ninguna Edge Function desplegada y no se despliega
# nada. Lo único real es la llamada al modelo, y CUESTA DINERO (≈ 1-2 USD con
# 1 repetición), con el secreto ANTHROPIC_API_KEY de este repositorio.
#
# Por eso NO corre en cada push: solo a mano, o cuando cambia el fichero
# `scripts/comparar-sonnet-5-5.ejecutar`, que se crea a propósito una vez
# autorizado el gasto.

on:
  push:
    branches: ['claude/**']
    paths: ['scripts/comparar-sonnet-5-5.ejecutar']
  workflow_dispatch:
    inputs:
      repeticiones:
        description: 'Repeticiones por caso y modelo'
        required: false
        default: '1'

permissions:
  # write SOLO para publicar los resultados en su propia rama
  # (claude/resultados-sonnet-5-5). No toca main ni la rama de la migración.
  contents: write

jobs:
  comparar:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar que el secreto existe
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Falta el secreto ANTHROPIC_API_KEY. La comparación no se ejecuta."
            exit 1
          fi
      - name: Comparación
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REF_ORIGINAL: b39f024
          REPS: ${{ inputs.repeticiones || '1' }}
          ADAPTATIVO_LOW: '0'
          PRESUPUESTO_USD: '4'
        run: |
          node --experimental-strip-types --no-warnings scripts/comparar-sonnet-4-5-vs-5-5.mjs | tee salida.txt
          {
            echo '## Sonnet 4.5 vs 5.5'
            echo '```'
            sed -n '/^RESUMEN/,$p' salida.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparacion-sonnet-5-5
          path: |
            salida.txt
            resultados-sonnet-5-5/
      # El artifact no se puede descargar desde una sesión de Claude (el proxy
      # deniega su almacenamiento), así que los resultados se publican también
      # en una rama aparte, huérfana, que solo contiene esto.
      - name: Publicar resultados en claude/resultados-sonnet-5-5
        if: always()
        run: |
          set -e
          dir=$(mktemp -d)
          cp -r resultados-sonnet-5-5 salida.txt "$dir"/ 2>/dev/null || true
          cd "$dir"
          git init -q
          git checkout -q -b claude/resultados-sonnet-5-5
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -qm "Resultados Sonnet 4.5 vs 5.5 · ${GITHUB_SHA::7} · run ${GITHUB_RUN_NUMBER}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" claude/resultados-sonnet-5-5
