name: Deploy edge functions

# Deploya las edge functions a Supabase automáticamente cuando se mergea a main.
# Lista COMPLETA: hay un step por cada carpeta de supabase/functions/ (antes
# faltaban ~10 y quedaban sin publicar). Al sumar una función nueva, agregá su
# step acá (el guardrail 'deploy: todas las funciones estan en el workflow' avisa
# si te olvidas).
#
# Convención: todas van con --no-verify-jwt (cada función se autoriza sola por
# dentro con service-role / secret). Requiere el secret SUPABASE_ACCESS_TOKEN.
# El project ref es público (ya está en el frontend) → hardcodeado.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Deploy admin-coach-op
        run: supabase functions deploy admin-coach-op --project-ref ddxnrsnjdvtqhxunxnwj --no-verify-jwt
      - name: Deploy admin-express-op
        run: supabase functions deploy admin-express-op --project-ref ddxnrsnjdvtqhxunxnwj --no-verify-jwt
