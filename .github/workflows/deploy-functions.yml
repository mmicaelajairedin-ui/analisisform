name: Deploy edge functions

# Deploya las edge functions a Supabase automáticamente cuando se
# mergea a main. Requiere el secret SUPABASE_ACCESS_TOKEN (cargado
# una vez en repo → Settings → Secrets → Actions).
# El project ref es público (ya está en el frontend) → hardcodeado.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/connect-onboard/**'
      - 'supabase/functions/connect-checkout/**'
      - 'supabase/functions/notif-coach/**'
      - 'supabase/functions/obtener-perfil-coach/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy connect-onboard
        run: supabase functions deploy connect-onboard --project-ref ddxnrsnjdvtqhxunxnwj --no-verify-jwt
      - name: Deploy connect-checkout
        run: supabase functions deploy connect-checkout --project-ref ddxnrsnjdvtqhxunxnwj --no-verify-jwt
      - name: Deploy notif-coach
        run: supabase functions deploy notif-coach --project-ref ddxnrsnjdvtqhxunxnwj --no-verify-jwt
      - name: Deploy obtener-perfil-coach
        run: supabase functions deploy obtener-perfil-coach --project-ref ddxnrsnjdvtqhxunxnwj --no-verify-jwt

