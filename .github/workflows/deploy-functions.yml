name: Deploy edge functions

# Deploya las edge functions a Supabase automáticamente cuando se
# mergea a main. Requiere el secret SUPABASE_ACCESS_TOKEN (cargado
# una vez en repo → Settings → Secrets → Actions).
# El project ref es público (ya está en el frontend) → hardcodeado.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/connect-onboard/**'
      - 'supabase/functions/connect-checkout/**'
      - 'supabase/functions/stripe-webhook/**'
      - 'supabase/functions/coach-lifecycle/**'
      - 'supabase/functions/unsubscribe/**'
      - 'supabase/functions/notif-coach/**'
      - 'supabase/functions/notif-new-client/**'
      - 'supabase/functions/notif-landing-lead/**'
      - 'supabase/functions/obtener-perfil-coach/**'
      - 'supabase/functions/contacto-coach/**'
      - 'supabase/functions/migrate-user-to-auth/**'
      - 'supabase/functions/crear-coach/**'
      - 'supabase/functions/password-reset/**'
      - 'supabase/functions/health-check/**'
      - 'supabase/functions/send-email/**'
      - 'supabase/functions/send-queued-emails/**'
      - 'supabase/functions/send-push/**'
      - 'supabase/functions/categorizar-gastos/**'
      - 'supabase/functions/recordatorios-citas/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
        env:
          # Autentica la consulta de "última release" del CLI → sube el rate limit
          # de la API de GitHub (60/h anónimo → 5000/h) y evita el fallo intermitente
          # "Failed to resolve latest Supabase CLI release: rate limit exceeded".
          GITHUB_TOKEN: ${{ github.token }}
      - name: Deploy connect-onboard
        run: supabase functions deploy connect-onboard --project-ref ddxnrsnjdvtqhxunxnwj --no-verify-jwt
      - name: Deploy stripe-webhook
        run: supabase functions deploy stripe-webhook --project-ref ddxnrsnjdvtqhxunxnwj --no-verify-jwt
      - name: Deploy coach-lifecycle
        run: supabase functions deploy coach-lifecycle --project-ref ddxnrsnjdvtqhxunxnwj --no-verify-jwt
      - name: Deploy unsubscribe
        run: supabase functions deploy unsubscribe --project-ref ddxnrsnjdvtqhxunxnwj --no-verify-jwt
      - name: Deploy connect-checkout
        run: supabase functions deploy connect-checkout --project-ref ddxnrsnjdvtqhxunxnwj --no-verify-jwt
      - name: Deploy notif-coach
        run: supabase functions deploy notif-coach --project-ref ddxnrsnjdvtqhxunxnwj --no-verify-jwt
      - name: Deploy notif-new-client
        run: supabase functions deploy notif-new-client --project-ref ddxnrsnjdvtqhxunxnwj --no-verify-jwt
      - name: Deploy notif-landing-lead
        run: supabase functions deploy notif-landing-lead --project-ref ddxnrsnjdvtqhxunxnwj --no-verify-jwt
      - name: Deploy obtener-perfil-coach
        run: supabase functions deploy obtener-perfil-coach --project-ref ddxnrsnjdvtqhxunxnwj --no-verify-jwt
      - name: Deploy contacto-coach
        run: supabase functions deploy contacto-coach --project-ref ddxnrsnjdvtqhxunxnwj --no-verify-jwt
      - name: Deploy migrate-user-to-auth
        run: supabase functions deploy migrate-user-to-auth --project-ref ddxnrsnjdvtqhxunxnwj --no-verify-jwt
      - name: Deploy crear-coach
        run: supabase functions deploy crear-coach --project-ref ddxnrsnjdvtqhxunxnwj --no-verify-jwt
      - name: Deploy password-reset
        run: supabase functions deploy password-reset --project-ref ddxnrsnjdvtqhxunxnwj --no-verify-jwt
      - name: Deploy health-check
        run: supabase functions deploy health-check --project-ref ddxnrsnjdvtqhxunxnwj --no-verify-jwt
      - name: Deploy send-email
        run: supabase functions deploy send-email --project-ref ddxnrsnjdvtqhxunxnwj --no-verify-jwt
      - name: Deploy send-queued-emails
        run: supabase functions deploy send-queued-emails --project-ref ddxnrsnjdvtqhxunxnwj --no-verify-jwt
      - name: Deploy send-push
        run: supabase functions deploy send-push --project-ref ddxnrsnjdvtqhxunxnwj --no-verify-jwt
      - name: Deploy categorizar-gastos
        run: supabase functions deploy categorizar-gastos --project-ref ddxnrsnjdvtqhxunxnwj --no-verify-jwt
      - name: Deploy recordatorios-citas
        run: supabase functions deploy recordatorios-citas --project-ref ddxnrsnjdvtqhxunxnwj --no-verify-jwt

