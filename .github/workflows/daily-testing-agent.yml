name: "🧪 Testing Agent Diario — Plataforma MJ"

# Ejecuta todos los días a las 10:00 AM hora de España (UTC+2)
# 08:00 UTC = 10:00 CEST (horario de verano)
# 09:00 UTC = 10:00 CET (horario de invierno)
on:
  schedule:
    - cron: '0 8 * * *'   # 10:00 AM CEST (verano)
  workflow_dispatch:        # Permite ejecución manual desde GitHub

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  test-platform:
    name: "Ejecutar tests de la plataforma"
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: "📥 Checkout del código"
        uses: actions/checkout@v4

      - name: "📦 Instalar Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: "📦 Instalar dependencias"
        run: npm install

      - name: "🎭 Instalar navegadores de Playwright"
        run: npx playwright install --with-deps chromium

      - name: "🧪 Ejecutar tests"
        id: run-tests
        run: |
          mkdir -p tests/results
          # El JSON va a SU fichero y los errores del cargador al log del job.
          # Mezclarlos con 2>&1 y taparlos con `|| true` fue lo que dejo once dias
          # de "healthy" sin ejecutar un solo test: el SyntaxError que abortaba el
          # descubrimiento acababa dentro del JSON y nadie lo miraba. (INC-026)
          RUNNER_EXIT=0
          npx playwright test --reporter=json \
            > tests/results/test-results.json \
            2> tests/results/runner-stderr.txt || RUNNER_EXIT=$?
          echo "runner_exit=$RUNNER_EXIT" >> $GITHUB_OUTPUT
          if [ -s tests/results/runner-stderr.txt ]; then
            echo "::group::Salida de error de Playwright"
            cat tests/results/runner-stderr.txt
            echo "::endgroup::"
          fi
          if [ "$RUNNER_EXIT" -ne 0 ]; then
            echo "::warning::Playwright termino con codigo $RUNNER_EXIT"
          fi
          echo "Tests ejecutados (exit $RUNNER_EXIT)"
        env:
          BASE_URL: "https://pathwaycareercoach.com/"
          # TEST_ACCOUNTS: JSON con todas las cuentas de prueba (coach + los 3
          # portales de cliente). Es lo que usa el tester-bot. Tiene prioridad
          # sobre los TEST_COACH_*/TEST_CLIENT_* (que quedan por compatibilidad).
          TEST_ACCOUNTS: ${{ secrets.TEST_ACCOUNTS }}
          TEST_COACH_EMAIL: ${{ secrets.TEST_COACH_EMAIL }}
          TEST_COACH_PASSWORD: ${{ secrets.TEST_COACH_PASSWORD }}
          TEST_CLIENT_EMAIL: ${{ secrets.TEST_CLIENT_EMAIL }}
          TEST_CLIENT_PASSWORD: ${{ secrets.TEST_CLIENT_PASSWORD }}
          # Dueño de la red (multicoach/gym) — opcional.
          TEST_GYM_EMAIL: ${{ secrets.TEST_GYM_EMAIL }}
          TEST_GYM_PASSWORD: ${{ secrets.TEST_GYM_PASSWORD }}

      - name: "📊 Generar reporte"
        id: generate-report
        run: |
          node tests/generate-report.js || true

          # Leer resumen para el step de email
          if [ -f tests/results/summary.json ]; then
            STATUS=$(cat tests/results/summary.json | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['status'])")
            TOTAL=$(cat tests/results/summary.json | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['totalTests'])")
            PASSED=$(cat tests/results/summary.json | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['passed'])")
            FAILED=$(cat tests/results/summary.json | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['failed'])")

            echo "status=$STATUS" >> $GITHUB_OUTPUT
            echo "total=$TOTAL" >> $GITHUB_OUTPUT
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
          else
            echo "status=error" >> $GITHUB_OUTPUT
            echo "total=0" >> $GITHUB_OUTPUT
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
          fi

      - name: "🔧 Auto-fixer: reparar problemas simples"
        id: auto-fix
        if: steps.generate-report.outputs.failed != '0'
        run: |
          node tests/auto-fixer.js || true

          # Leer resultados del auto-fixer
          FIXES_COUNT=0
          PENDING_COUNT=0
          if [ -f tests/results/fixes-applied.json ]; then
            FIXES_COUNT=$(python3 -c "import json;print(len(json.load(open('tests/results/fixes-applied.json'))))")
          fi
          if [ -f tests/results/pending-issues.json ]; then
            PENDING_COUNT=$(python3 -c "import json;print(len(json.load(open('tests/results/pending-issues.json'))))")
          fi

          echo "fixes=$FIXES_COUNT" >> $GITHUB_OUTPUT
          echo "pending=$PENDING_COUNT" >> $GITHUB_OUTPUT
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: "🔀 Crear PR con auto-fixes"
        id: create-pr
        if: steps.auto-fix.outputs.fixes != '0' && steps.auto-fix.outputs.fixes != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date +'%Y-%m-%d')
          BRANCH="auto-fix/${DATE}"

          # Verificar si hay cambios reales
          if [ -z "$(git status --porcelain -- '*.html' '*.js' '*.css' ':!tests/' ':!.github/' ':!package.json')" ]; then
            echo "No hay cambios en archivos de la plataforma"
            echo "pr_created=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Crear branch y commit
          git config user.name "Testing Agent MJ"
          git config user.email "testing-agent@micaelajairedin.com"
          git checkout -b "$BRANCH"
          git add -A -- '*.html' '*.js' '*.css' ':!tests/' ':!.github/' ':!package.json'

          # Generar mensaje del commit con los fixes
          FIXES_DESC=""
          if [ -f tests/results/fixes-applied.json ]; then
            FIXES_DESC=$(python3 -c "
          import json
          fixes = json.load(open('tests/results/fixes-applied.json'))
          for f in fixes:
              print(f'- {f[\"explanation\"]} ({f[\"file\"]})')
          ")
          fi

          git commit -m "fix: auto-reparaciones del Testing Agent ($DATE)

          Fixes aplicados automáticamente:
          $FIXES_DESC

          Generado por el Testing Agent Diario"

          git push origin "$BRANCH"

          # Crear PR
          PR_BODY=$(cat <<'PREOF'
          ## Auto-reparaciones del Testing Agent

          El testing diario detectó problemas simples y los reparó automáticamente.

          ### Fixes aplicados
          PREOF
          )

          if [ -f tests/results/fixes-applied.json ]; then
            FIXES_TABLE=$(python3 -c "
          import json
          fixes = json.load(open('tests/results/fixes-applied.json'))
          print('| Archivo | Problema | Fix aplicado |')
          print('|---------|----------|-------------|')
          for f in fixes:
              print(f'| \`{f[\"file\"]}\` | {f[\"category\"]} | {f[\"explanation\"]} |')
          ")
            PR_BODY="$PR_BODY
          $FIXES_TABLE"
          fi

          PR_BODY="$PR_BODY

          ---
          > **Revisa los cambios y mergea cuando estés conforme.**
          > _Generado automáticamente por el Testing Agent_"

          PR_URL=$(gh pr create \
            --title "🔧 Auto-fix: reparaciones del testing diario ($DATE)" \
            --body "$PR_BODY" \
            --label "testing-agent" \
            --base main \
            --head "$BRANCH")

          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "pr_created=true" >> $GITHUB_OUTPUT
          echo "PR creado: $PR_URL"

          # Volver al branch original para los siguientes steps
          git checkout main

      - name: "📊 Re-generar reporte con info de auto-fixes"
        if: steps.auto-fix.outputs.fixes != '0' && steps.auto-fix.outputs.fixes != ''
        run: |
          node tests/generate-report.js || true

      - name: "🩺 Revisión de salud de usuarios"
        id: health
        if: always()
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          AGENT_TRIGGER_SECRET: ${{ secrets.AGENT_TRIGGER_SECRET }}
        run: |
          mkdir -p tests/results
          URL=$(printf '%s' "$SUPABASE_PROJECT_URL" | tr -d '[:space:]' | sed 's:/*$::')
          SECRET=$(printf '%s' "$AGENT_TRIGGER_SECRET" | tr -d '[:space:]')
          COUNT=0
          if [ -n "$URL" ] && [ -n "$SECRET" ]; then
            curl -sS -X POST "${URL}/functions/v1/health-check" -H "X-Trigger-Secret: ${SECRET}" -H "Content-Type: application/json" --max-time 60 -o tests/results/health-resp.json || echo '{}' > tests/results/health-resp.json
            node -e "let d={};try{d=JSON.parse(require('fs').readFileSync('tests/results/health-resp.json','utf8'))}catch(e){};require('fs').writeFileSync('tests/results/health.html',(d&&d.html)||'');require('fs').writeFileSync('tests/results/health-count.txt',String((d&&d.count)||0))" || true
            [ -f tests/results/health-count.txt ] && COUNT=$(cat tests/results/health-count.txt)
          else
            echo "Faltan secrets SUPABASE_PROJECT_URL / AGENT_TRIGGER_SECRET — salto la salud"
          fi
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: "📧 Enviar reporte por email (Brevo)"
        if: always()
        run: |
          STATUS="${{ steps.generate-report.outputs.status }}"
          PASSED="${{ steps.generate-report.outputs.passed }}"
          TOTAL="${{ steps.generate-report.outputs.total }}"

          if [ "$STATUS" = "healthy" ]; then
            EMOJI="✅"
          elif [ "$STATUS" = "warning" ]; then
            EMOJI="⚠️"
          else
            EMOJI="🔴"
          fi

          SUBJECT="$EMOJI Reporte Testing Pathway — ${PASSED}/${TOTAL} tests OK"
          HC="${{ steps.health.outputs.count }}"
          if [ -n "$HC" ] && [ "$HC" != "0" ]; then
            SUBJECT="$SUBJECT · 🩺 $HC para revisar"
          fi

          # HTML del email = bloque de salud (si hay) + reporte de tests
          REPORT_HTML=$(python3 -c "import json,os; ps=[open(f).read() for f in ['tests/results/health.html','tests/results/report.html'] if os.path.exists(f) and open(f).read().strip()]; print(json.dumps('<hr>'.join(ps) if ps else '<p>No se generó reporte.</p>'))")

          curl -s -X POST "https://api.brevo.com/v3/smtp/email" \
            -H "accept: application/json" \
            -H "api-key: ${{ secrets.BREVO_API_KEY }}" \
            -H "content-type: application/json" \
            -d "{
              \"sender\": {\"name\": \"Testing Agent Pathway\", \"email\": \"notificaciones@pathwaycareercoach.com\"},
              \"to\": [{\"email\": \"notificaciones@pathwaycareercoach.com\", \"name\": \"Pathway Notificaciones\"}],
              \"subject\": \"$SUBJECT\",
              \"htmlContent\": $REPORT_HTML
            }" || echo "Error enviando email"

      - name: "🏷️ Asegurar que existen los labels"
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "testing-agent" --description "Issues creados por el Testing Agent diario" --color "d73a4a" --force 2>/dev/null || true
          gh label create "bug" --description "Something isn't working" --color "d73a4a" --force 2>/dev/null || true

      - name: "🐛 Crear Issue para problemas complejos"
        if: steps.auto-fix.outputs.pending != '0' && steps.auto-fix.outputs.pending != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f tests/results/issue-title.txt ] && [ -f tests/results/issue-body.md ]; then
            TITLE=$(cat tests/results/issue-title.txt)
            BODY=$(cat tests/results/issue-body.md)

            # Verificar si ya existe un issue abierto del testing agent para evitar duplicados
            EXISTING=$(gh issue list --label "testing-agent" --state open --limit 1 --json number -q '.[0].number' 2>/dev/null || echo "")

            if [ -n "$EXISTING" ]; then
              # Actualizar el issue existente con un comentario
              gh issue comment "$EXISTING" --body "## Actualización — $(date +'%d/%m/%Y %H:%M')

            $BODY"
              echo "Comentario añadido al issue #$EXISTING"
            else
              # Crear issue nuevo
              gh issue create \
                --title "$TITLE" \
                --body "$BODY" \
                --label "testing-agent,bug"
              echo "Issue creado con éxito"
            fi
          else
            echo "No hay archivos de issue para crear"
          fi

      - name: "✅ Cerrar Issue si todos los tests pasan"
        # Antes bastaba con failed==0, y con 0 tests descubiertos failed ES 0: el
        # agente cerraba el issue diciendo "todos los tests pasan" sin haber
        # ejecutado ninguno. Ahora exige salud de verdad. (INC-026, R-33)
        if: steps.generate-report.outputs.status == 'healthy'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Si hay un issue abierto del testing agent, cerrarlo
          EXISTING=$(gh issue list --label "testing-agent" --state open --limit 1 --json number -q '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "✅ **Todos los tests pasan.** Issue cerrado automáticamente por el Testing Agent.

            Resultado: ${{ steps.generate-report.outputs.passed }}/${{ steps.generate-report.outputs.total }} tests OK"
            echo "Issue #$EXISTING cerrado (todos los tests pasan)"
          else
            echo "No hay issues abiertos del testing agent"
          fi

      - name: "📤 Subir resultados como artifact"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_number }}
          path: |
            tests/results/
          retention-days: 30

      - name: "📝 Resumen en GitHub Actions"
        if: always()
        run: |
          if [ -f tests/results/report.txt ]; then
            echo "## 🧪 Reporte de Testing Diario" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Métrica | Valor |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Estado | ${{ steps.generate-report.outputs.status }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Total tests | ${{ steps.generate-report.outputs.total }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Pasaron | ${{ steps.generate-report.outputs.passed }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Fallaron | ${{ steps.generate-report.outputs.failed }} |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "<details><summary>Ver reporte completo</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat tests/results/report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          fi

      - name: "🚦 Poner el job en rojo si el resultado es critico"
        # Ultimo a proposito: el correo, el issue y el artifact ya se emitieron.
        # Sin esto el job sale verde pase lo que pase, que es como un runner caido
        # pasa inadvertido durante once dias. (INC-026)
        if: always() && steps.generate-report.outputs.status == 'critical'
        run: |
          echo "::error::Resultado critico — total ${{ steps.generate-report.outputs.total }}, fallos ${{ steps.generate-report.outputs.failed }}, runner exit ${{ steps.run-tests.outputs.runner_exit }}"
          exit 1
