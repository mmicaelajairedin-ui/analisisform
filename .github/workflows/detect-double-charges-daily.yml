name: Daily Double Charge Detection

on:
  schedule:
    # Run daily at 01:00 UTC (after analytics-weekly at 08:00 UTC)
    - cron: '0 1 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  detect-double-charges:
    runs-on: ubuntu-latest
    steps:
      - name: Run double charge detection
        run: |
          curl -X POST \
            -H "X-Detect-Secret: ${{ secrets.DETECT_SECRET }}" \
            -H "Content-Type: application/json" \
            ${{ secrets.SUPABASE_PROJECT_URL }}/functions/v1/detect-double-charges

      - name: Report status
        if: always()
        run: |
          echo "Detection job completed at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
