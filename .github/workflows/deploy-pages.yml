name: Deploy site (Cloudflare Pages)

# Publica el SITIO (HTML/CSS/JS) a Cloudflare Pages automáticamente en cada push
# a main — igual que deploy-functions.yml hace con el backend. Reemplaza la subida
# manual del zip. Usa el MISMO proyecto (analisisform), así el dominio custom
# (pathwaycareercoach.com) no se toca.
#
# Requiere DOS secrets en el repo → Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN   token con permiso "Account · Cloudflare Pages · Edit"
#   CLOUDFLARE_ACCOUNT_ID  el Account ID (Cloudflare → Workers & Pages → a la
#                          derecha "Account ID", o está en la URL del dashboard)
#
# Cómo crear el token: Cloudflare → My Profile → API Tokens → Create Token →
#   plantilla "Edit Cloudflare Workers" NO; usar "Create Custom Token" con
#   permiso  Account > Cloudflare Pages > Edit.  Copiar el token → pegarlo como
#   secret CLOUDFLARE_API_TOKEN en GitHub.

on:
  push:
    branches: [main]
    # No re-publicar el sitio cuando SOLO cambió backend/dev (esos van por otro lado).
    paths-ignore:
      - 'supabase/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/**'
      - 'leads/**'
      - '.github/workflows/deploy-functions.yml'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Armar carpeta del sitio (solo lo público)
        run: |
          mkdir -p dist
          # Copiamos TODO menos backend/dev/privado. El sitio es estático: los
          # .html/.js/.css y assets/ van tal cual a la raíz del deploy.
          rsync -a \
            --exclude='.git' \
            --exclude='dist' \
            --exclude='node_modules' \
            --exclude='supabase' \
            --exclude='tests' \
            --exclude='scripts' \
            --exclude='docs' \
            --exclude='leads' \
            --exclude='.github' \
            --exclude='*.md' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='playwright.config.js' \
            --exclude='pw-local.config.js' \
            ./ dist/
          echo "Archivos a publicar:"; ls dist/*.html | wc -l

      - name: Publicar en Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch=main → deploy de PRODUCCIÓN (actualiza el dominio custom).
          command: pages deploy dist --project-name=analisisform --branch=main
