name: Checks
# Detectores automaticos que corren en cada push/PR. Si alguno falla, frena el
# merge ANTES de que el error llegue a produccion. Son deterministas: no pueden
# decir "todo bien" si no lo esta.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Sintaxis JS (una pagina rota = todos afectados)
        run: node scripts/check-syntax.js
      - name: Smoke test (botones y assets que no existen)
        run: node scripts/check-smoke.js
      - name: Guardian de regresiones (bugs ya resueltos)
        run: node scripts/check-guardrails.js

      # S3 · comportamiento, no presencia: invoca pathway-handoff de verdad con un
      # PostgREST de mentira y comprueba que una cuenta dada de baja recibe 403.
      # El guardarrail de arriba mira el codigo; esto lo ejecuta.
      - name: S3 · el handoff no emite para una cuenta de baja
        run: node scripts/probar-handoff-activo.mjs
      - name: Paridad de la plataforma (cableado + invariantes)
        run: node scripts/check-parity.js
      - name: Icon System (una sola librería Lucide, spec consistente)
        run: node scripts/check-icons.js
