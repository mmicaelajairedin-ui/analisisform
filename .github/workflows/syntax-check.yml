name: Check JS syntax
# Bloquea el merge si algún .html tiene un error de sintaxis JavaScript
# (un solo error rompe la página entera para todas las coaches/clientes).
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check inline JS syntax in all .html
        run: node scripts/check-syntax.js
