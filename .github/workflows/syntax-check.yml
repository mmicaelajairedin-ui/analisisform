name: Checks
# Detectores automaticos que corren en cada push/PR. Si alguno falla, frena el
# merge ANTES de que el error llegue a produccion. Son deterministas: no pueden
# decir "todo bien" si no lo esta.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sintaxis JS (una pagina rota = todos afectados)
        run: node scripts/check-syntax.js
      - name: Smoke test (botones y assets que no existen)
        run: node scripts/check-smoke.js
      - name: Guardian de regresiones (bugs ya resueltos)
        run: node scripts/check-guardrails.js
