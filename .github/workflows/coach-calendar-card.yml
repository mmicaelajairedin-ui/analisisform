name: Coach calendar card (one-shot)

on:
  push:
    branches: [auto/coach-calendar-card]
    paths:
      - '.github/workflows/coach-calendar-card.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auto/coach-calendar-card

      - name: Write patch script
        run: |
          cat > /tmp/patch.js <<'PATCH_EOF'
          const fs = require('fs');
          const FILE = 'panel.html';
          let html = fs.readFileSync(FILE, 'utf8');

          function replaceOnce(from, to, label){
            const idx = html.indexOf(from);
            if (idx === -1) throw new Error('NO MATCH para [' + label + ']');
            const idx2 = html.indexOf(from, idx + 1);
            if (idx2 !== -1) throw new Error('MULTIPLES MATCHES para [' + label + ']');
            html = html.slice(0, idx) + to + html.slice(idx + from.length);
            console.log('OK ' + label);
          }

          // Card actual de "Mi calendario" — solo iframe centrado, sin proxima reunion ni agendar
          const oldCard =
          "    // ── Mi calendario (embebido publico) ──\n" +
          "    html+='<div id=\"agenda-card\" style=\"background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:20px 22px;margin-bottom:32px;\">';\n" +
          "    html+='<div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;\">';\n" +
          "    html+='<div style=\"font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;\">📅 Mi calendario</div>';\n" +
          "    html+='<a href=\"https://calendar.google.com/calendar/u/0/r\" target=\"_blank\" rel=\"noopener\" style=\"font-size:11px;color:var(--accent);font-weight:600;text-decoration:none;\">Abrir Google Calendar →</a>';\n" +
          "    html+='</div>';\n" +
          "    if(embedUrl){\n" +
          "      html+='<div style=\"border-radius:10px;overflow:hidden;border:1px solid var(--border);\">';\n" +
          "      html+='<iframe src=\"'+escH(embedUrl)+'\" style=\"border:0;width:100%;height:500px;display:block;\" frameborder=\"0\" scrolling=\"no\"></iframe>';\n" +
          "      html+='</div>';\n" +
          "    } else {\n" +
          "      html+='<div style=\"padding:24px 18px;text-align:center;background:#FAF8F8;border-radius:10px;font-size:13px;color:var(--muted);line-height:1.55;\">Conectá tu calendario en <button onclick=\"showSection(\\'config\\')\" style=\"background:none;border:none;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;padding:0;font-family:inherit;font-size:inherit;\">Configuración</button> para verlo acá.</div>';\n" +
          "    }\n" +
          "    html+='</div>';\n";

          const newCard =
          "    // ── Mi calendario (embebido publico) + Proxima reunion + Agendar ──\n" +
          "    // Calcular proxima sesion (la mas cercana en el futuro, de cualquier cliente)\n" +
          "    var _proxSes=null, _nowTs=Date.now();\n" +
          "    uniq.forEach(function(c){\n" +
          "      var arr=[]; try{ arr=JSON.parse(c.sesiones_registro||'[]'); }catch(e){}\n" +
          "      arr.forEach(function(s){\n" +
          "        if(!s.fecha) return;\n" +
          "        var iso=s.fecha+(s.hora?'T'+s.hora:'T23:59');\n" +
          "        var d=new Date(iso);\n" +
          "        if(isNaN(d)||d.getTime()<_nowTs) return;\n" +
          "        if(!_proxSes||d.getTime()<_proxSes._t){ _proxSes={ _t:d.getTime(), d:d, c:c, s:s }; }\n" +
          "      });\n" +
          "    });\n" +
          "    var _DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];\n" +
          "    var _MESES2=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];\n" +
          "    html+='<div id=\"agenda-card\" style=\"background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:20px 22px;margin-bottom:32px;\">';\n" +
          "    html+='<div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;\">';\n" +
          "    html+='<div style=\"font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;\">📅 Mi calendario</div>';\n" +
          "    html+='<a href=\"https://calendar.google.com/calendar/u/0/r\" target=\"_blank\" rel=\"noopener\" style=\"font-size:11px;color:var(--accent);font-weight:600;text-decoration:none;\">Abrir Google Calendar →</a>';\n" +
          "    html+='</div>';\n" +
          "    html+='<div class=\"coach-cal-grid\" style=\"display:grid;grid-template-columns:1fr 260px;gap:18px;align-items:start;\">';\n" +
          "    // Columna izquierda: iframe o placeholder\n" +
          "    if(embedUrl){\n" +
          "      html+='<div style=\"border-radius:10px;overflow:hidden;border:1px solid var(--border);min-width:0;\">';\n" +
          "      html+='<iframe src=\"'+escH(embedUrl)+'\" style=\"border:0;width:100%;height:440px;display:block;\" frameborder=\"0\" scrolling=\"no\"></iframe>';\n" +
          "      html+='</div>';\n" +
          "    } else {\n" +
          "      html+='<div style=\"padding:32px 18px;text-align:center;background:#FAF8F8;border-radius:10px;font-size:13px;color:var(--muted);line-height:1.55;min-height:200px;display:flex;align-items:center;justify-content:center;\"><div>Conectá tu calendario en <button onclick=\"showSection(\\'config\\')\" style=\"background:none;border:none;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;padding:0;font-family:inherit;font-size:inherit;\">Configuración</button> para verlo acá.</div></div>';\n" +
          "    }\n" +
          "    // Columna derecha: Proxima reunion + Boton agendar\n" +
          "    html+='<div style=\"display:flex;flex-direction:column;gap:14px;\">';\n" +
          "    // Box proxima reunion\n" +
          "    html+='<div style=\"background:#FAF8F8;border-radius:12px;padding:16px 18px;\">';\n" +
          "    html+='<div style=\"font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px;\">Próxima reunión</div>';\n" +
          "    if(_proxSes){\n" +
          "      var _pd=_proxSes.d;\n" +
          "      var _diasFalt=Math.ceil((_pd.getTime()-_nowTs)/86400000);\n" +
          "      var _etiq=_diasFalt<=0?'Hoy':(_diasFalt===1?'Mañana':_DIAS[_pd.getDay()]);\n" +
          "      html+='<div style=\"font-family:\\'Fraunces\\',Georgia,serif;font-size:18px;font-weight:500;color:var(--title);line-height:1.25;margin-bottom:6px;letter-spacing:-.2px;\">'+escH(_proxSes.c.nombre||_proxSes.c.email||'Cliente')+'</div>';\n" +
          "      html+='<div style=\"font-size:13px;color:var(--body);font-weight:500;\">'+_etiq+' · '+_pd.getDate()+' '+_MESES2[_pd.getMonth()]+(_proxSes.s.hora?' · <span style=\"color:var(--accent);font-weight:600;\">'+escH(_proxSes.s.hora)+'</span>':'')+'</div>';\n" +
          "    } else {\n" +
          "      html+='<div style=\"font-size:13px;color:var(--muted);line-height:1.5;\">Sin reuniones próximas agendadas.</div>';\n" +
          "    }\n" +
          "    html+='</div>';\n" +
          "    // Boton agendar\n" +
          "    if(calUrl){\n" +
          "      html+='<a href=\"'+escH(calUrl)+'\" target=\"_blank\" rel=\"noopener\" style=\"background:var(--accent);color:#fff;padding:12px 16px;border-radius:10px;font-weight:600;font-size:13px;text-decoration:none;text-align:center;display:block;font-family:Inter,sans-serif;\">+ Agendar reunión</a>';\n" +
          "    } else {\n" +
          "      html+='<button onclick=\"showSection(\\'config\\')\" style=\"background:transparent;border:1.5px dashed var(--border);color:var(--muted);padding:12px 16px;border-radius:10px;font-weight:600;font-size:12px;cursor:pointer;text-align:center;font-family:Inter,sans-serif;\">Configurá tu Calendly</button>';\n" +
          "    }\n" +
          "    html+='</div>';\n" +
          "    html+='</div>';\n" +
          "    html+='</div>';\n";

          replaceOnce(oldCard, newCard, '1) Card calendario coach');

          fs.writeFileSync(FILE, html);
          console.log('Patch aplicado.');
          PATCH_EOF
          node /tmp/patch.js

      - name: Validate JS syntax
        run: |
          node <<'EOF'
          const fs = require('fs');
          const html = fs.readFileSync('panel.html','utf8');
          const matches = html.match(/<script\b[^>]*>[\s\S]*?<\/script>/gi) || [];
          let failed = 0;
          for (const s of matches) {
            const openTag = s.match(/<script\b[^>]*>/i)[0];
            if (/\ssrc\s*=/i.test(openTag)) continue;
            if (/\stype\s*=\s*["']?(module|application\/(json|ld\+json)|text\/(template|html))/i.test(openTag)) continue;
            const body = s.replace(/^<script\b[^>]*>/i,'').replace(/<\/script>\s*$/i,'');
            if (!body.trim()) continue;
            try { new Function(body); } catch (e) { console.error('SYNTAX:', e.message); failed++; }
          }
          if (failed > 0) process.exit(1);
          console.log('Sintaxis OK');
          EOF

      - name: Self-delete workflow + commit & push to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/coach-calendar-card.yml
          git add panel.html
          if git diff --staged --quiet; then
            echo "Nada que commitear"
            exit 0
          fi
          git commit -m "feat(panel): card calendario coach con proxima reunion y boton agendar"
          git push origin auto/coach-calendar-card
