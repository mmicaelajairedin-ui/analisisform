name: "⏰ Recordatorios de citas"

# Dispara la edge function recordatorios-citas cada ~15 min. La function manda
# los recordatorios por email de las sesiones reservadas por el link:
#   - 24 h antes  ("es mañana")
#   - 1 h antes   ("es en un rato")
# Es idempotente (marca rem_24h_at / rem_1h_at), así que aunque el cron se
# atrase o corra de más, no repite recordatorios.
#
# Secrets requeridos en el repo (ya existen para los otros agentes):
#   SUPABASE_PROJECT_URL   https://<proyecto>.supabase.co
#   AGENT_TRIGGER_SECRET   mismo valor que el secret en Supabase
#
# Setup (una vez): supabase functions deploy recordatorios-citas --no-verify-jwt
# Trigger manual: Actions → Recordatorios de citas → Run workflow

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enviar-recordatorios:
    name: "Enviar recordatorios de sesiones"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Setup secrets (sanitizar)"
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          AGENT_TRIGGER_SECRET: ${{ secrets.AGENT_TRIGGER_SECRET }}
        run: |
          URL=$(printf '%s' "$SUPABASE_PROJECT_URL" | tr -d '[:space:]' | sed 's:/*$::')
          SECRET=$(printf '%s' "$AGENT_TRIGGER_SECRET" | tr -d '[:space:]')
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "::error::Faltan secrets SUPABASE_PROJECT_URL o AGENT_TRIGGER_SECRET"
            exit 1
          fi
          echo "URL=$URL" >> $GITHUB_ENV
          echo "SECRET=$SECRET" >> $GITHUB_ENV

      - name: "⏰ Disparar recordatorios"
        run: |
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            "${URL}/functions/v1/recordatorios-citas" \
            -H "X-Trigger-Secret: ${SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 200) || {
              echo "::error::curl recordatorios-citas falló con exit code $?"
              exit 1
            }
          status=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "HTTP $status"
          echo "$body"
          if [ "$status" != "200" ]; then
            echo "::error::recordatorios-citas devolvió status $status"
            exit 1
          fi
