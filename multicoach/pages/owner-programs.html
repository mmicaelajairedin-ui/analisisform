<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programas - MultiCoach</title>
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="stylesheet" href="../styles/layout.css">
  <style>
    .program-card {
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .program-card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }

    .program-badge {
      display: inline-block;
      background: var(--primary);
      color: white;
      padding: var(--space-xs) var(--space-md);
      border-radius: var(--radius-full);
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-bold);
      margin-bottom: var(--space-md);
    }

    .program-title {
      font-size: var(--font-size-lg);
      font-weight: var(--font-weight-bold);
      color: var(--dark);
      margin: 0 0 var(--space-sm) 0;
    }

    .program-week {
      display: inline-block;
      background: var(--accent);
      color: white;
      padding: var(--space-xs) var(--space-md);
      border-radius: var(--radius-md);
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-bold);
      margin-bottom: var(--space-md);
    }

    .program-metrics {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-sm);
      margin-bottom: var(--space-md);
    }

    .metric-small-card {
      background: var(--light-gray);
      padding: var(--space-sm);
      border-radius: var(--radius-md);
      text-align: center;
    }

    .metric-small-label {
      font-size: var(--font-size-xs);
      color: var(--gray-600);
      margin-bottom: var(--space-xs);
    }

    .metric-small-value {
      font-size: var(--font-size-lg);
      font-weight: var(--font-weight-bold);
      color: var(--dark);
    }

    .coaches-list {
      display: flex;
      gap: var(--space-xs);
      margin-bottom: var(--space-md);
      flex-wrap: wrap;
    }

    .coach-badge {
      background: var(--gray-200);
      padding: var(--space-xs) var(--space-sm);
      border-radius: var(--radius-full);
      font-size: var(--font-size-xs);
      color: var(--gray-700);
    }

    .program-row {
      background: white;
      padding: var(--space-lg);
      border-radius: var(--radius-lg);
      margin-bottom: var(--space-md);
      border-left: 4px solid var(--primary);
      cursor: pointer;
      transition: all 0.2s;
    }

    .program-row:hover {
      box-shadow: var(--shadow-md);
    }

    .program-row-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-md);
    }

    .program-row-title {
      font-size: var(--font-size-base);
      font-weight: var(--font-weight-bold);
      color: var(--dark);
      margin: 0;
    }

    .program-row-status {
      display: flex;
      gap: var(--space-sm);
      align-items: center;
    }

    .program-stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-md);
      padding-top: var(--space-md);
      border-top: 1px solid var(--gray-100);
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .stat-label {
      font-size: var(--font-size-xs);
      color: var(--gray-600);
      font-weight: var(--font-weight-medium);
    }

    .stat-value {
      font-size: var(--font-size-base);
      font-weight: var(--font-weight-bold);
      color: var(--dark);
    }

    .timeline-visual {
      display: flex;
      gap: var(--space-xs);
      align-items: center;
      margin-top: var(--space-md);
    }

    .week-box {
      flex: 1;
      padding: var(--space-sm);
      background: var(--light-gray);
      border-radius: var(--radius-sm);
      text-align: center;
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-bold);
      color: var(--gray-700);
    }

    .week-box.active {
      background: var(--primary);
      color: white;
    }

    .week-box.completed {
      background: var(--success);
      color: white;
    }
  </style>
</head>
<body>
  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon">🏢</div>
        <div class="sidebar-logo-text">MultiCoach</div>
      </div>

      <nav class="sidebar-nav">
        <li class="sidebar-nav-item">
          <a class="sidebar-nav-link" data-page="owner-coaches">
            <span class="sidebar-nav-icon">🏠</span>
            <span>Dashboard</span>
          </a>
        </li>
        <li class="sidebar-nav-item">
          <a class="sidebar-nav-link" data-page="owner-coaches">
            <span class="sidebar-nav-icon">👥</span>
            <span>Coaches</span>
          </a>
        </li>
        <li class="sidebar-nav-item">
          <a class="sidebar-nav-link" data-page="owner-clients">
            <span class="sidebar-nav-icon">👤</span>
            <span>Clientes</span>
          </a>
        </li>
        <li class="sidebar-nav-item">
          <a class="sidebar-nav-link active" data-page="owner-programs">
            <span class="sidebar-nav-icon">📚</span>
            <span>Programas</span>
          </a>
        </li>
        <li class="sidebar-nav-item">
          <a class="sidebar-nav-link" data-page="owner-analytics">
            <span class="sidebar-nav-icon">📈</span>
            <span>Analytics</span>
          </a>
        </li>
        <li class="sidebar-nav-item">
          <a class="sidebar-nav-link" data-page="owner-billing">
            <span class="sidebar-nav-icon">💳</span>
            <span>Facturación</span>
          </a>
        </li>
        <li class="sidebar-nav-item">
          <a class="sidebar-nav-link" data-page="owner-brand">
            <span class="sidebar-nav-icon">🎨</span>
            <span>Marca</span>
          </a>
        </li>
        <li class="sidebar-nav-item">
          <a class="sidebar-nav-link" data-page="owner-settings">
            <span class="sidebar-nav-icon">⚙️</span>
            <span>Configuración</span>
          </a>
        </li>
      </nav>

      <div class="sidebar-user">
        <div class="sidebar-user-info">
          <div class="sidebar-user-avatar">👤</div>
          <div>
            <div class="sidebar-user-name">Micaela</div>
            <div class="sidebar-user-role">Owner</div>
          </div>
        </div>
        <div class="sidebar-user-actions">
          <button class="sidebar-user-btn">Perfil</button>
          <button class="sidebar-user-btn">Salir</button>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Header -->
      <header class="header">
        <h1 class="header-title">Programas</h1>
        <div class="header-actions">
          <div class="header-search">
            <input type="text" id="searchInput" placeholder="Buscar programas...">
          </div>
          <span class="header-icon">🔔</span>
          <span class="header-icon">⚙️</span>
        </div>
      </header>

      <!-- Page Content -->
      <div class="page-content">
        <!-- KPI Grid -->
        <div class="kpi-grid" id="kpiGrid">
          <!-- Rendered by JS -->
        </div>

        <!-- Filter Controls -->
        <div class="page-controls">
          <div class="page-controls-group">
            <label for="statusFilter">Estado:</label>
            <select id="statusFilter" name="status">
              <option value="">Todos</option>
              <option value="active">Activos</option>
              <option value="completed">Completados</option>
            </select>
          </div>
        </div>

        <!-- View Toggle -->
        <div style="display: flex; gap: var(--space-md); margin-bottom: var(--space-lg); align-items: center;">
          <button class="btn btn-sm" id="tableViewBtn">📊 Tabla</button>
          <button class="btn btn-sm btn-secondary" id="cardViewBtn">🗂️ Tarjetas</button>
        </div>

        <!-- Table View -->
        <div id="tableView">
          <!-- Rendered by JS -->
        </div>

        <!-- Card View -->
        <div id="cardView" style="display: none;">
          <!-- Rendered by JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../js/mock-data.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/components.js"></script>

  <script>
    let filteredPrograms = [...PROGRAMS];
    let viewMode = 'table';

    document.addEventListener('DOMContentLoaded', () => {
      renderKPIs();
      renderPrograms();
      initializeEventListeners();
    });

    function renderKPIs() {
      const totalClients = PROGRAMS.reduce((sum, p) => sum + p.totalClients, 0);
      const totalCompleted = PROGRAMS.reduce((sum, p) => sum + p.completedClients, 0);
      const avgCompletion = Math.round(PROGRAMS.reduce((sum, p) => sum + p.completionRate, 0) / PROGRAMS.length);

      const html = `
        <div class="kpi-card">
          <div class="kpi-label">Programas Activos</div>
          <div class="kpi-value">${PROGRAMS.filter(p => p.status === 'active').length}</div>
          <div class="kpi-change neutral">en ejecución</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Clientes en Programas</div>
          <div class="kpi-value">${formatNumber(totalClients)}</div>
          <div class="kpi-change neutral">total</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Tasa Completitud Promedio</div>
          <div class="kpi-value">${avgCompletion}%</div>
          <div class="kpi-change positive">de avance</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Clientes Completados</div>
          <div class="kpi-value">${formatNumber(totalCompleted)}</div>
          <div class="kpi-change positive">exitosos</div>
        </div>
      `;
      document.getElementById('kpiGrid').innerHTML = html;
    }

    function renderPrograms() {
      if (viewMode === 'table') {
        renderTableView();
      } else {
        renderCardView();
      }
    }

    function renderTableView() {
      const html = `
        <div>
          ${filteredPrograms.map(program => `
            <div class="program-row">
              <div class="program-row-header">
                <div>
                  <p class="program-row-title">${escapeHtml(program.name)} - Semana ${program.week}</p>
                </div>
                <div class="program-row-status">
                  ${renderStatus(program.status)}
                </div>
              </div>

              <div class="program-stats-row">
                <div class="stat-item">
                  <span class="stat-label">Clientes Activos</span>
                  <span class="stat-value">${program.activeClients}/${program.totalClients}</span>
                </div>
                <div class="stat-item">
                  <span class="stat-label">Completitud Promedio</span>
                  <span class="stat-value">${program.completionRate}%</span>
                </div>
                <div class="stat-item">
                  <span class="stat-label">Coaches Asignados</span>
                  <span class="stat-value">${program.coaches.length}</span>
                </div>
                <div class="stat-item">
                  <span class="stat-label">Duración Promedio</span>
                  <span class="stat-value">${program.avgDuration} min</span>
                </div>
              </div>

              <div class="timeline-visual">
                <div class="week-box${program.week > 1 ? ' completed' : ''}">S1</div>
                <div class="week-box${program.week > 2 ? ' completed' : program.week === 2 ? ' active' : ''}">S2</div>
                <div class="week-box${program.week > 3 ? ' completed' : program.week === 3 ? ' active' : ''}">S3</div>
                <div class="week-box${program.week > 4 ? ' completed' : program.week === 4 ? ' active' : ''}">S4</div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
      document.getElementById('tableView').innerHTML = html;
    }

    function renderCardView() {
      const html = `
        <div class="grid-container two-col">
          ${filteredPrograms.map(program => `
            <div class="card program-card">
              <div class="program-badge">${program.status === 'active' ? '🟢 Activo' : '✅ Completado'}</div>
              <h3 class="program-title">${escapeHtml(program.name)}</h3>
              <div class="program-week">Semana ${program.week} de 4</div>

              <div class="program-metrics">
                <div class="metric-small-card">
                  <div class="metric-small-label">Clientes Activos</div>
                  <div class="metric-small-value">${program.activeClients}</div>
                </div>
                <div class="metric-small-card">
                  <div class="metric-small-label">Total</div>
                  <div class="metric-small-value">${program.totalClients}</div>
                </div>
                <div class="metric-small-card">
                  <div class="metric-small-label">Completitud</div>
                  <div class="metric-small-value">${program.completionRate}%</div>
                </div>
                <div class="metric-small-card">
                  <div class="metric-small-label">Duración</div>
                  <div class="metric-small-value">${program.avgDuration}m</div>
                </div>
              </div>

              <div style="margin-bottom: var(--space-md);">
                <p style="font-size: var(--font-size-xs); color: var(--gray-600); margin: 0 0 var(--space-xs) 0; font-weight: var(--font-weight-medium);">COACHES ASIGNADOS</p>
                <div class="coaches-list">
                  ${program.coaches.map(coachId => {
                    const coach = findCoach(coachId);
                    return coach ? `<span class="coach-badge">${coach.avatar} ${coach.name}</span>` : '';
                  }).join('')}
                </div>
              </div>

              <div class="progress-bar">
                <div class="progress-bar-fill" style="width: ${program.completionRate}%"></div>
              </div>
              <p style="font-size: var(--font-size-xs); color: var(--gray-600); margin-top: var(--space-xs);">
                ${program.completedClients} cliente(s) completado(s)
              </p>
            </div>
          `).join('')}
        </div>
      `;
      document.getElementById('cardView').innerHTML = html;
    }

    function filterPrograms() {
      const searchTerm = document.getElementById('searchInput').value;
      const statusFilter = document.getElementById('statusFilter').value;

      filteredPrograms = PROGRAMS.filter(program => {
        const matchesSearch = !searchTerm ||
          program.name.toLowerCase().includes(searchTerm.toLowerCase());
        const matchesStatus = !statusFilter || program.status === statusFilter;
        return matchesSearch && matchesStatus;
      });

      renderPrograms();
    }

    function toggleViewMode(mode) {
      viewMode = mode;
      document.getElementById('tableViewBtn').classList.toggle('btn-secondary', mode !== 'table');
      document.getElementById('tableViewBtn').classList.toggle('btn-primary', mode === 'table');
      document.getElementById('cardViewBtn').classList.toggle('btn-secondary', mode !== 'card');
      document.getElementById('cardViewBtn').classList.toggle('btn-primary', mode === 'card');

      document.getElementById('tableView').style.display = mode === 'table' ? 'block' : 'none';
      document.getElementById('cardView').style.display = mode === 'card' ? 'block' : 'none';
      renderPrograms();
    }

    function initializeEventListeners() {
      document.getElementById('searchInput').addEventListener('input', filterPrograms);
      document.getElementById('statusFilter').addEventListener('change', filterPrograms);
      document.getElementById('tableViewBtn').addEventListener('click', () => toggleViewMode('table'));
      document.getElementById('cardViewBtn').addEventListener('click', () => toggleViewMode('card'));
    }
  </script>
</body>
</html>
