<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coaches - MultiCoach</title>
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="stylesheet" href="../styles/layout.css">
  <style>
    .coach-card {
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .coach-card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }

    .coach-header {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      margin-bottom: var(--space-lg);
    }

    .coach-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8C7B80 0%, #D4CCCA 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      flex-shrink: 0;
    }

    .coach-info {
      flex: 1;
    }

    .coach-name {
      font-size: var(--font-size-lg);
      font-weight: var(--font-weight-bold);
      color: var(--dark);
      margin: 0 0 var(--space-xs) 0;
    }

    .coach-specialty {
      font-size: var(--font-size-sm);
      color: var(--gray-600);
      margin: 0;
    }

    .coach-metrics {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-md);
      margin-bottom: var(--space-lg);
    }

    .metric-small {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .metric-small-label {
      font-size: var(--font-size-xs);
      color: var(--gray-500);
      font-weight: var(--font-weight-medium);
      text-transform: uppercase;
    }

    .metric-small-value {
      font-size: var(--font-size-xl);
      font-weight: var(--font-weight-bold);
      color: var(--dark);
    }

    .coach-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-md);
      margin-bottom: var(--space-md);
    }

    .coach-progress {
      flex: 1;
    }

    .progress-label {
      font-size: var(--font-size-xs);
      color: var(--gray-600);
      margin-bottom: var(--space-xs);
      display: flex;
      justify-content: space-between;
    }

    .coach-table-row {
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .coach-table-row:hover {
      background-color: var(--light-gray);
    }

    .rating {
      display: flex;
      align-items: center;
      gap: var(--space-xs);
      font-size: var(--font-size-sm);
      color: var(--dark);
    }

    .rating-star {
      color: #F39C12;
    }

    .view-btn {
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon">🏢</div>
        <div class="sidebar-logo-text">MultiCoach</div>
      </div>

      <nav class="sidebar-nav">
        <li class="sidebar-nav-item">
          <a class="sidebar-nav-link active" data-page="owner-coaches">
            <span class="sidebar-nav-icon">🏠</span>
            <span>Dashboard</span>
          </a>
        </li>
        <li class="sidebar-nav-item">
          <a class="sidebar-nav-link" data-page="owner-coaches">
            <span class="sidebar-nav-icon">👥</span>
            <span>Coaches</span>
          </a>
        </li>
        <li class="sidebar-nav-item">
          <a class="sidebar-nav-link" data-page="owner-clients">
            <span class="sidebar-nav-icon">👤</span>
            <span>Clientes</span>
          </a>
        </li>
        <li class="sidebar-nav-item">
          <a class="sidebar-nav-link" data-page="owner-programs">
            <span class="sidebar-nav-icon">📚</span>
            <span>Programas</span>
          </a>
        </li>
        <li class="sidebar-nav-item">
          <a class="sidebar-nav-link" data-page="owner-analytics">
            <span class="sidebar-nav-icon">📈</span>
            <span>Analytics</span>
          </a>
        </li>
        <li class="sidebar-nav-item">
          <a class="sidebar-nav-link" data-page="owner-billing">
            <span class="sidebar-nav-icon">💳</span>
            <span>Facturación</span>
          </a>
        </li>
        <li class="sidebar-nav-item">
          <a class="sidebar-nav-link" data-page="owner-brand">
            <span class="sidebar-nav-icon">🎨</span>
            <span>Marca</span>
          </a>
        </li>
        <li class="sidebar-nav-item">
          <a class="sidebar-nav-link" data-page="owner-settings">
            <span class="sidebar-nav-icon">⚙️</span>
            <span>Configuración</span>
          </a>
        </li>
      </nav>

      <div class="sidebar-user">
        <div class="sidebar-user-info">
          <div class="sidebar-user-avatar">👤</div>
          <div>
            <div class="sidebar-user-name">Micaela</div>
            <div class="sidebar-user-role">Owner</div>
          </div>
        </div>
        <div class="sidebar-user-actions">
          <button class="sidebar-user-btn">Perfil</button>
          <button class="sidebar-user-btn">Salir</button>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Header -->
      <header class="header">
        <h1 class="header-title">Coaches</h1>
        <div class="header-actions">
          <div class="header-search">
            <input type="text" id="searchInput" placeholder="Buscar coaches...">
          </div>
          <span class="header-icon">🔔</span>
          <span class="header-icon">⚙️</span>
        </div>
      </header>

      <!-- Page Content -->
      <div class="page-content">
        <!-- KPI Grid -->
        <div class="kpi-grid" id="kpiGrid">
          <!-- Rendered by JS -->
        </div>

        <!-- Filter Controls -->
        <div class="page-controls">
          <div class="page-controls-group">
            <label for="statusFilter">Estado:</label>
            <select id="statusFilter" name="status">
              <option value="">Todos</option>
              <option value="active">Activos</option>
              <option value="inactive">Inactivos</option>
            </select>
          </div>
          <div class="page-controls-group">
            <label for="capacityFilter">Capacidad:</label>
            <select id="capacityFilter" name="capacity">
              <option value="">Todos</option>
              <option value="available">Con disponibilidad</option>
              <option value="full">Cupo lleno</option>
            </select>
          </div>
          <div class="page-controls-group">
            <label for="sortFilter">Ordenar por:</label>
            <select id="sortFilter" name="sort">
              <option value="name">Nombre A-Z</option>
              <option value="nps">NPS (Mayor a menor)</option>
              <option value="retention">Retención (Mayor a menor)</option>
              <option value="clients">Clientes (Mayor a menor)</option>
            </select>
          </div>
        </div>

        <!-- View Toggle -->
        <div style="display: flex; gap: var(--space-md); margin-bottom: var(--space-lg); align-items: center;">
          <button class="btn btn-sm" id="tableViewBtn">📊 Tabla</button>
          <button class="btn btn-sm btn-secondary" id="cardViewBtn">🗂️ Tarjetas</button>
        </div>

        <!-- Table View -->
        <div id="tableView">
          <!-- Rendered by JS -->
        </div>

        <!-- Card View -->
        <div id="cardView" style="display: none;">
          <!-- Rendered by JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../js/mock-data.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/components.js"></script>

  <script>
    // State
    let filteredCoaches = [...COACHES];
    let viewMode = 'table';

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      renderKPIs();
      renderCoaches();
      initializeEventListeners();
    });

    // Render KPIs
    function renderKPIs() {
      const kpis = calcOrgKPIs();
      const html = `
        <div class="kpi-card">
          <div class="kpi-label">Total Coaches</div>
          <div class="kpi-value">${formatNumber(kpis.activeCoaches)}</div>
          <div class="kpi-change neutral">Activos</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Clientes Asignados</div>
          <div class="kpi-value">${formatNumber(kpis.totalClients)}</div>
          <div class="kpi-change neutral">En total</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">NPS Promedio</div>
          <div class="kpi-value">${kpis.avgNps}</div>
          <div class="kpi-change positive">de 5.0</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Tasa Retención</div>
          <div class="kpi-value">${kpis.avgRetention}%</div>
          <div class="kpi-change positive">promedio</div>
        </div>
      `;
      document.getElementById('kpiGrid').innerHTML = html;
    }

    // Render coaches
    function renderCoaches() {
      if (viewMode === 'table') {
        renderTableView();
      } else {
        renderCardView();
      }
    }

    // Render table view
    function renderTableView() {
      const columns = [
        { label: 'Nombre', key: 'name', render: (val, row) => `${row.avatar} ${val}` },
        { label: 'Especialidad', key: 'specialty' },
        { label: 'Estado', key: 'status', render: (val) => renderStatus(val) },
        { label: 'Clientes', key: 'clientsAssigned', render: (val, row) => `${val}/${row.capacity}` },
        { label: 'NPS', key: 'nps', render: (val) => `<span class="rating"><span class="rating-star">⭐</span> ${val}</span>` },
        { label: 'Retención', key: 'retentionRate', render: (val) => `${val}%` },
        { label: '', key: 'id', render: (val) => `<button class="btn btn-sm btn-primary view-btn" onclick="viewCoachDetail('${val}')">Ver perfil</button>` }
      ];

      const html = Table.render(filteredCoaches, columns);
      document.getElementById('tableView').innerHTML = html;
    }

    // Render card view
    function renderCardView() {
      const html = `
        <div class="grid-container three-col">
          ${filteredCoaches.map(coach => `
            <div class="card coach-card" onclick="viewCoachDetail('${coach.id}')">
              <div class="coach-header">
                <div class="coach-avatar">${coach.avatar}</div>
                <div class="coach-info">
                  <h3 class="coach-name">${escapeHtml(coach.name)}</h3>
                  <p class="coach-specialty">${escapeHtml(coach.specialty)}</p>
                </div>
              </div>

              ${renderStatus(coach.status)}

              <div class="coach-metrics">
                <div class="metric-small">
                  <div class="metric-small-label">Clientes</div>
                  <div class="metric-small-value">${coach.clientsAssigned}/${coach.capacity}</div>
                </div>
                <div class="metric-small">
                  <div class="metric-small-label">NPS</div>
                  <div class="metric-small-value">⭐ ${coach.nps}</div>
                </div>
                <div class="metric-small">
                  <div class="metric-small-label">Retención</div>
                  <div class="metric-small-value">${coach.retentionRate}%</div>
                </div>
                <div class="metric-small">
                  <div class="metric-small-label">Completitud</div>
                  <div class="metric-small-value">${coach.completionRate}%</div>
                </div>
              </div>

              <div class="coach-progress">
                <div class="progress-label">
                  <span>Utilización</span>
                  <span>${getCoachUtilization(coach)}%</span>
                </div>
                <div class="progress-bar">
                  <div class="progress-bar-fill" style="width: ${getCoachUtilization(coach)}%"></div>
                </div>
              </div>

              <button class="btn btn-primary" style="width: 100%; margin-top: var(--space-md);">Ver perfil →</button>
            </div>
          `).join('')}
        </div>
      `;
      document.getElementById('cardView').innerHTML = html;
    }

    // Filter coaches
    function filterCoaches() {
      const searchTerm = document.getElementById('searchInput').value;
      const statusFilter = document.getElementById('statusFilter').value;
      const capacityFilter = document.getElementById('capacityFilter').value;
      const sortFilter = document.getElementById('sortFilter').value;

      filteredCoaches = COACHES.filter(coach => {
        // Search
        const matchesSearch = !searchTerm ||
          coach.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
          coach.email.toLowerCase().includes(searchTerm.toLowerCase()) ||
          coach.specialty.toLowerCase().includes(searchTerm.toLowerCase());

        // Status filter
        const matchesStatus = !statusFilter || coach.status === statusFilter;

        // Capacity filter
        let matchesCapacity = true;
        if (capacityFilter === 'available') {
          matchesCapacity = getCoachUtilization(coach) < 90;
        } else if (capacityFilter === 'full') {
          matchesCapacity = getCoachUtilization(coach) >= 90;
        }

        return matchesSearch && matchesStatus && matchesCapacity;
      });

      // Sort
      if (sortFilter === 'nps') {
        filteredCoaches.sort((a, b) => b.nps - a.nps);
      } else if (sortFilter === 'retention') {
        filteredCoaches.sort((a, b) => b.retentionRate - a.retentionRate);
      } else if (sortFilter === 'clients') {
        filteredCoaches.sort((a, b) => b.clientsAssigned - a.clientsAssigned);
      } else {
        filteredCoaches.sort((a, b) => a.name.localeCompare(b.name));
      }

      renderCoaches();
    }

    // View coach detail
    function viewCoachDetail(coachId) {
      navigateTo('owner-coach-detail', { coachId });
    }

    // Toggle view mode
    function toggleViewMode(mode) {
      viewMode = mode;
      document.getElementById('tableViewBtn').classList.toggle('btn-secondary', mode !== 'table');
      document.getElementById('tableViewBtn').classList.toggle('btn-primary', mode === 'table');
      document.getElementById('cardViewBtn').classList.toggle('btn-secondary', mode !== 'card');
      document.getElementById('cardViewBtn').classList.toggle('btn-primary', mode === 'card');

      document.getElementById('tableView').style.display = mode === 'table' ? 'block' : 'none';
      document.getElementById('cardView').style.display = mode === 'card' ? 'block' : 'none';
      renderCoaches();
    }

    // Initialize event listeners
    function initializeEventListeners() {
      document.getElementById('searchInput').addEventListener('input', filterCoaches);
      document.getElementById('statusFilter').addEventListener('change', filterCoaches);
      document.getElementById('capacityFilter').addEventListener('change', filterCoaches);
      document.getElementById('sortFilter').addEventListener('change', filterCoaches);
      document.getElementById('tableViewBtn').addEventListener('click', () => toggleViewMode('table'));
      document.getElementById('cardViewBtn').addEventListener('click', () => toggleViewMode('card'));
    }
  </script>
</body>
</html>
