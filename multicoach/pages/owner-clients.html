<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes - MultiCoach</title>
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="stylesheet" href="../styles/layout.css">
  <style>
    .client-card {
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .client-card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }

    .client-card-header {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      margin-bottom: var(--space-lg);
    }

    .client-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #27AE60 0%, #D4CCCA 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      flex-shrink: 0;
    }

    .client-info {
      flex: 1;
    }

    .client-name {
      font-size: var(--font-size-lg);
      font-weight: var(--font-weight-bold);
      color: var(--dark);
      margin: 0 0 var(--space-xs) 0;
    }

    .client-role {
      font-size: var(--font-size-sm);
      color: var(--gray-600);
      margin: 0;
    }

    .client-metrics {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-md);
      margin-bottom: var(--space-lg);
    }

    .metric-small {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .metric-small-label {
      font-size: var(--font-size-xs);
      color: var(--gray-500);
      font-weight: var(--font-weight-medium);
      text-transform: uppercase;
    }

    .metric-small-value {
      font-size: var(--font-size-lg);
      font-weight: var(--font-weight-bold);
      color: var(--dark);
    }

    .client-progress {
      margin-bottom: var(--space-md);
    }

    .progress-label {
      font-size: var(--font-size-xs);
      color: var(--gray-600);
      margin-bottom: var(--space-xs);
      display: flex;
      justify-content: space-between;
    }

    .risk-badge {
      display: inline-block;
      padding: var(--space-xs) var(--space-sm);
      border-radius: var(--radius-full);
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-bold);
      margin-top: var(--space-sm);
    }

    .risk-low {
      background-color: rgba(39, 174, 96, 0.1);
      color: var(--success);
    }

    .risk-medium {
      background-color: rgba(243, 156, 18, 0.1);
      color: var(--warning);
    }

    .risk-high {
      background-color: rgba(231, 76, 60, 0.1);
      color: var(--danger);
    }

    .dates-text {
      font-size: var(--font-size-xs);
      color: var(--gray-600);
      margin-top: var(--space-xs);
    }

    .view-btn {
      white-space: nowrap;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      padding: var(--space-xs) var(--space-sm);
      background: rgba(39, 174, 96, 0.1);
      color: var(--success);
      border-radius: var(--radius-md);
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-bold);
    }

    .status-badge.completed {
      background: rgba(140, 123, 128, 0.1);
      color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon">🏢</div>
        <div class="sidebar-logo-text">MultiCoach</div>
      </div>

      <nav class="sidebar-nav">
        <li class="sidebar-nav-item">
          <a class="sidebar-nav-link" data-page="owner-coaches">
            <span class="sidebar-nav-icon">🏠</span>
            <span>Dashboard</span>
          </a>
        </li>
        <li class="sidebar-nav-item">
          <a class="sidebar-nav-link" data-page="owner-coaches">
            <span class="sidebar-nav-icon">👥</span>
            <span>Coaches</span>
          </a>
        </li>
        <li class="sidebar-nav-item">
          <a class="sidebar-nav-link active" data-page="owner-clients">
            <span class="sidebar-nav-icon">👤</span>
            <span>Clientes</span>
          </a>
        </li>
        <li class="sidebar-nav-item">
          <a class="sidebar-nav-link" data-page="owner-programs">
            <span class="sidebar-nav-icon">📚</span>
            <span>Programas</span>
          </a>
        </li>
        <li class="sidebar-nav-item">
          <a class="sidebar-nav-link" data-page="owner-analytics">
            <span class="sidebar-nav-icon">📈</span>
            <span>Analytics</span>
          </a>
        </li>
        <li class="sidebar-nav-item">
          <a class="sidebar-nav-link" data-page="owner-billing">
            <span class="sidebar-nav-icon">💳</span>
            <span>Facturación</span>
          </a>
        </li>
        <li class="sidebar-nav-item">
          <a class="sidebar-nav-link" data-page="owner-brand">
            <span class="sidebar-nav-icon">🎨</span>
            <span>Marca</span>
          </a>
        </li>
        <li class="sidebar-nav-item">
          <a class="sidebar-nav-link" data-page="owner-settings">
            <span class="sidebar-nav-icon">⚙️</span>
            <span>Configuración</span>
          </a>
        </li>
      </nav>

      <div class="sidebar-user">
        <div class="sidebar-user-info">
          <div class="sidebar-user-avatar">👤</div>
          <div>
            <div class="sidebar-user-name">Micaela</div>
            <div class="sidebar-user-role">Owner</div>
          </div>
        </div>
        <div class="sidebar-user-actions">
          <button class="sidebar-user-btn">Perfil</button>
          <button class="sidebar-user-btn">Salir</button>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Header -->
      <header class="header">
        <h1 class="header-title">Clientes</h1>
        <div class="header-actions">
          <div class="header-search">
            <input type="text" id="searchInput" placeholder="Buscar clientes...">
          </div>
          <span class="header-icon">🔔</span>
          <span class="header-icon">⚙️</span>
        </div>
      </header>

      <!-- Page Content -->
      <div class="page-content">
        <!-- KPI Grid -->
        <div class="kpi-grid" id="kpiGrid">
          <!-- Rendered by JS -->
        </div>

        <!-- Filter Controls -->
        <div class="page-controls">
          <div class="page-controls-group">
            <label for="statusFilter">Estado:</label>
            <select id="statusFilter" name="status">
              <option value="">Todos</option>
              <option value="active">Activos</option>
              <option value="completed">Completados</option>
            </select>
          </div>
          <div class="page-controls-group">
            <label for="riskFilter">Nivel de Riesgo:</label>
            <select id="riskFilter" name="risk">
              <option value="">Todos</option>
              <option value="low">Bajo</option>
              <option value="medium">Medio</option>
              <option value="high">Alto</option>
            </select>
          </div>
          <div class="page-controls-group">
            <label for="coachFilter">Coach:</label>
            <select id="coachFilter" name="coach">
              <option value="">Todos los coaches</option>
              ${COACHES.map(coach => `<option value="${coach.id}">${coach.name}</option>`).join('')}
            </select>
          </div>
          <div class="page-controls-group">
            <label for="sortFilter">Ordenar por:</label>
            <select id="sortFilter" name="sort">
              <option value="name">Nombre A-Z</option>
              <option value="progress">Progreso (Mayor a menor)</option>
              <option value="risk">Riesgo (Mayor a menor)</option>
              <option value="start">Fecha de inicio (Recientes)</option>
            </select>
          </div>
        </div>

        <!-- View Toggle -->
        <div style="display: flex; gap: var(--space-md); margin-bottom: var(--space-lg); align-items: center;">
          <button class="btn btn-sm" id="tableViewBtn">📊 Tabla</button>
          <button class="btn btn-sm btn-secondary" id="cardViewBtn">🗂️ Tarjetas</button>
        </div>

        <!-- Table View -->
        <div id="tableView">
          <!-- Rendered by JS -->
        </div>

        <!-- Card View -->
        <div id="cardView" style="display: none;">
          <!-- Rendered by JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../js/mock-data.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/components.js"></script>

  <script>
    let filteredClients = [...CLIENTS];
    let viewMode = 'table';

    document.addEventListener('DOMContentLoaded', () => {
      renderKPIs();
      renderClients();
      initializeEventListeners();
    });

    function renderKPIs() {
      const active = CLIENTS.filter(c => c.status === 'active').length;
      const completed = CLIENTS.filter(c => c.status === 'completed').length;
      const avgProgress = Math.round(CLIENTS.reduce((sum, c) => sum + c.progress, 0) / CLIENTS.length);
      const atRisk = CLIENTS.filter(c => c.riskLevel === 'high').length;

      const html = `
        <div class="kpi-card">
          <div class="kpi-label">Total Clientes</div>
          <div class="kpi-value">${formatNumber(CLIENTS.length)}</div>
          <div class="kpi-change neutral">${active} activos</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Completados</div>
          <div class="kpi-value">${formatNumber(completed)}</div>
          <div class="kpi-change positive">programas finalizados</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Progreso Promedio</div>
          <div class="kpi-value">${avgProgress}%</div>
          <div class="kpi-change neutral">de completitud</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">En Riesgo</div>
          <div class="kpi-value">${formatNumber(atRisk)}</div>
          <div class="kpi-change negative">nivel alto</div>
        </div>
      `;
      document.getElementById('kpiGrid').innerHTML = html;
    }

    function renderClients() {
      if (viewMode === 'table') {
        renderTableView();
      } else {
        renderCardView();
      }
    }

    function renderTableView() {
      const columns = [
        { label: 'Nombre', key: 'name', render: (val, row) => `${row.avatar} ${val}` },
        { label: 'Coach', key: 'coachName' },
        { label: 'Rol', key: 'role' },
        { label: 'Programa', key: 'program' },
        { label: 'Progreso', key: 'progress', render: (val) => `${val}%` },
        { label: 'Riesgo', key: 'riskLevel', render: (val) => {
          const risk = getRiskLabel(val);
          const color = getRiskColor(val);
          return `<span style="color: ${color}; font-weight: bold;">${risk}</span>`;
        }},
        { label: 'Estado', key: 'status', render: (val) => renderStatus(val) },
        { label: '', key: 'id', render: (val) => `<button class="btn btn-sm btn-primary view-btn" onclick="viewClientDetail('${val}')">Ver perfil</button>` }
      ];

      const html = Table.render(filteredClients, columns);
      document.getElementById('tableView').innerHTML = html;
    }

    function renderCardView() {
      const html = `
        <div class="grid-container three-col">
          ${filteredClients.map(client => {
            const coach = findCoach(client.coachId);
            const riskClass = `risk-${client.riskLevel}`;
            return `
              <div class="card client-card" onclick="viewClientDetail('${client.id}')">
                <div class="client-card-header">
                  <div class="client-avatar">${client.avatar}</div>
                  <div class="client-info">
                    <h3 class="client-name">${escapeHtml(client.name)}</h3>
                    <p class="client-role">${escapeHtml(client.role)}</p>
                  </div>
                </div>

                <div style="display: flex; gap: var(--space-sm); margin-bottom: var(--space-md);">
                  <span class="status-badge${client.status === 'completed' ? ' completed' : ''}">
                    ${getStatusLabel(client.status)}
                  </span>
                  <span class="risk-badge ${riskClass}">
                    Riesgo: ${getRiskLabel(client.riskLevel)}
                  </span>
                </div>

                <div class="client-metrics">
                  <div class="metric-small">
                    <div class="metric-small-label">Semana</div>
                    <div class="metric-small-value">${client.programWeek}</div>
                  </div>
                  <div class="metric-small">
                    <div class="metric-small-label">Progreso</div>
                    <div class="metric-small-value">${client.progress}%</div>
                  </div>
                </div>

                <div class="client-progress">
                  <div class="progress-bar">
                    <div class="progress-bar-fill" style="width: ${client.progress}%"></div>
                  </div>
                  <div class="dates-text">
                    Desde ${formatDateShort(client.startDate)} al ${formatDateShort(client.endDate)}
                  </div>
                </div>

                <div style="font-size: var(--font-size-xs); color: var(--gray-600); padding-top: var(--space-sm); border-top: 1px solid var(--gray-100);">
                  Coach: ${escapeHtml(coach?.name || 'No asignado')}
                </div>

                <button class="btn btn-primary" style="width: 100%; margin-top: var(--space-md);">Ver perfil →</button>
              </div>
            `;
          }).join('')}
        </div>
      `;
      document.getElementById('cardView').innerHTML = html;
    }

    function filterClients() {
      const searchTerm = document.getElementById('searchInput').value;
      const statusFilter = document.getElementById('statusFilter').value;
      const riskFilter = document.getElementById('riskFilter').value;
      const coachFilter = document.getElementById('coachFilter').value;
      const sortFilter = document.getElementById('sortFilter').value;

      filteredClients = CLIENTS.filter(client => {
        const matchesSearch = !searchTerm ||
          client.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
          client.email.toLowerCase().includes(searchTerm.toLowerCase()) ||
          client.role.toLowerCase().includes(searchTerm.toLowerCase());

        const matchesStatus = !statusFilter || client.status === statusFilter;
        const matchesRisk = !riskFilter || client.riskLevel === riskFilter;
        const matchesCoach = !coachFilter || client.coachId === coachFilter;

        return matchesSearch && matchesStatus && matchesRisk && matchesCoach;
      });

      // Sort
      if (sortFilter === 'progress') {
        filteredClients.sort((a, b) => b.progress - a.progress);
      } else if (sortFilter === 'risk') {
        const riskOrder = { high: 3, medium: 2, low: 1 };
        filteredClients.sort((a, b) => riskOrder[b.riskLevel] - riskOrder[a.riskLevel]);
      } else if (sortFilter === 'start') {
        filteredClients.sort((a, b) => new Date(b.startDate) - new Date(a.startDate));
      } else {
        filteredClients.sort((a, b) => a.name.localeCompare(b.name));
      }

      renderClients();
    }

    function viewClientDetail(clientId) {
      navigateTo('owner-client-detail', { clientId });
    }

    function toggleViewMode(mode) {
      viewMode = mode;
      document.getElementById('tableViewBtn').classList.toggle('btn-secondary', mode !== 'table');
      document.getElementById('tableViewBtn').classList.toggle('btn-primary', mode === 'table');
      document.getElementById('cardViewBtn').classList.toggle('btn-secondary', mode !== 'card');
      document.getElementById('cardViewBtn').classList.toggle('btn-primary', mode === 'card');

      document.getElementById('tableView').style.display = mode === 'table' ? 'block' : 'none';
      document.getElementById('cardView').style.display = mode === 'card' ? 'block' : 'none';
      renderClients();
    }

    function initializeEventListeners() {
      document.getElementById('searchInput').addEventListener('input', filterClients);
      document.getElementById('statusFilter').addEventListener('change', filterClients);
      document.getElementById('riskFilter').addEventListener('change', filterClients);
      document.getElementById('coachFilter').addEventListener('change', filterClients);
      document.getElementById('sortFilter').addEventListener('change', filterClients);
      document.getElementById('tableViewBtn').addEventListener('click', () => toggleViewMode('table'));
      document.getElementById('cardViewBtn').addEventListener('click', () => toggleViewMode('card'));
    }
  </script>
</body>
</html>
