<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Pathway">
  <!-- Círculo completo (rx = mitad del ancho) — fondo blanco redondo. -->
  <rect width="1024" height="1024" rx="512" fill="#FFFFFF"/>
  <!-- Logo de Pathway re-centrado matemáticamente sobre el centro 512,512.
       viewBox interno: contenido en x[10..82] (centro 46), y[22..82] (centro 52).
       scale=10 → ancho 720 (70%), alto 600 (59%). margen ≥ 15% (safe-zone OK). -->
  <g transform="translate(52, -8) scale(10)">
    <polygon points="10,82 32,52 54,82" fill="#52B788"/>
    <polygon points="34,82 58,28 82,82" fill="#2D6A4F"/>
    <circle cx="58" cy="22" r="5" fill="#E9C46A"/>
  </g>
</svg>
