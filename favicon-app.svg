<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Pathway">
  <!-- Fondo blanco con safe-zone del 10% para "maskable": el ícono del logo
       queda en el centro 80% para que los SO que apliquen una máscara
       circular o de squircle no recorten partes importantes. -->
  <rect width="1024" height="1024" rx="180" ry="180" fill="#FFFFFF"/>
  <g transform="translate(112, 112) scale(8)">
    <polygon points="10,82 32,52 54,82" fill="#52B788"/>
    <polygon points="34,82 58,28 82,82" fill="#2D6A4F"/>
    <circle cx="58" cy="22" r="5" fill="#E9C46A"/>
  </g>
</svg>
