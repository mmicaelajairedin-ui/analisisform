<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pathway · Leads & Conversaciones (interno)</title>
<link rel="icon" href="favicon.svg">
<style>
  :root{
    --accent:#8C7B80; --accent-d:#6f6065; --bg:#f6f4f2; --card:#fff;
    --line:#e7e2df; --ink:#2c2829; --muted:#8a8284; --ok:#3f8f6b;
    --warn:#c98a2e; --bad:#b9534f; --soft:#f0ecea;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 20px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
  header h1{font-size:16px;font-weight:600}
  header h1 b{color:var(--accent)}
  .tag{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:2px 8px;border-radius:99px}
  .grow{flex:1}
  button{font-family:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);
    color:var(--ink);padding:8px 12px;border-radius:8px;font-size:13px;transition:.15s}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.primary:hover{background:var(--accent-d)}
  button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
  button.tiny{padding:4px 8px;font-size:11px}
  .wrap{display:grid;grid-template-columns:300px 1fr;gap:0;min-height:calc(100vh - 57px)}
  .side{background:var(--card);border-right:1px solid var(--line);padding:14px;overflow:auto}
  .side .search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;
    font-family:inherit;font-size:13px;margin-bottom:10px}
  .lead{padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:.12s}
  .lead:hover{border-color:var(--accent)}
  .lead.active{border-color:var(--accent);background:var(--soft)}
  .lead .nm{font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:6px}
  .lead .mt{font-size:11px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
  .pill{font-size:10px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
  .st-nuevo{color:#3a6ea5;border-color:#cdddf0;background:#eef4fb}
  .st-conversacion{color:var(--warn);border-color:#f0e2c8;background:#fdf6e8}
  .st-propuesta{color:#7a5bb0;border-color:#e3d8f2;background:#f5f0fb}
  .st-ganado{color:var(--ok);border-color:#cfe8dd;background:#edf7f2}
  .st-perdido{color:var(--bad);border-color:#f0d4d3;background:#fbeeed}
  .main{padding:22px;overflow:auto}
  .empty{color:var(--muted);text-align:center;margin-top:80px}
  .empty .big{font-size:34px;margin-bottom:10px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
  .panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:14px;font-weight:600}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .fld{margin-bottom:12px}
  .fld label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:500}
  .fld input,.fld select,.fld textarea{width:100%;padding:9px 11px;border:1px solid var(--line);
    border-radius:8px;font-family:inherit;font-size:13px;background:var(--card);color:var(--ink)}
  .fld textarea{resize:vertical;min-height:64px}
  .name-in{font-size:20px!important;font-weight:600;border:none!important;padding:0!important;background:transparent!important}
  .notebox{display:flex;gap:8px;margin-bottom:12px}
  .notebox textarea{flex:1;min-height:54px}
  .timeline{list-style:none}
  .timeline li{border-left:2px solid var(--line);padding:0 0 16px 16px;position:relative}
  .timeline li:before{content:'';width:9px;height:9px;border-radius:50%;background:var(--accent);
    position:absolute;left:-5.5px;top:3px}
  .timeline li:last-child{padding-bottom:0}
  .timeline .ts{font-size:11px;color:var(--muted);margin-bottom:3px}
  .timeline .tx{white-space:pre-wrap}
  .timeline .del{float:right;color:var(--muted);font-size:11px;background:none;border:none;padding:0 4px}
  .sug{border:1px solid #e3dad0;background:#fbf7f1;border-radius:10px;padding:12px 14px;margin-bottom:10px}
  .sug .h{font-weight:600;font-size:13px;margin-bottom:5px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .sug .b{font-size:13px;color:#4a4446}
  .acc{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
  .acc summary{padding:11px 14px;cursor:pointer;font-weight:600;font-size:13px;list-style:none;display:flex;justify-content:space-between}
  .acc summary::-webkit-details-marker{display:none}
  .acc[open] summary{border-bottom:1px solid var(--line);background:var(--soft)}
  .acc .ac{padding:12px 14px;font-size:13px;color:#4a4446;white-space:pre-wrap}
  .acc .ac b{color:var(--ink)}
  .hint{font-size:11px;color:var(--muted);margin-top:6px}
  .danger{color:var(--bad)}
  @media(max-width:760px){
    .wrap{grid-template-columns:1fr}
    .side{border-right:none;border-bottom:1px solid var(--line);max-height:38vh}
    .row{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<header>
  <h1><b>Pathway</b> · Leads &amp; Conversaciones</h1>
  <span class="tag">Uso interno · datos en este navegador</span>
  <span class="grow"></span>
  <button class="tiny" onclick="exportData()">⬇ Backup</button>
  <button class="tiny" onclick="document.getElementById('imp').click()">⬆ Importar</button>
  <input type="file" id="imp" accept="application/json" style="display:none" onchange="importData(event)">
</header>

<div class="wrap">
  <aside class="side">
    <button class="primary" style="width:100%;margin-bottom:10px" onclick="newLead()">+ Nuevo lead</button>
    <input class="search" id="q" placeholder="Buscar por nombre…" oninput="renderList()">
    <div id="list"></div>
  </aside>

  <main class="main" id="main">
    <div class="empty">
      <div class="big">🗂️</div>
      <p>Elegí un lead de la izquierda o creá uno nuevo.</p>
      <p class="hint">Anotás lo que te dice (qué herramientas usa, su situación, dudas).<br>
      Al volver a entrar a ese nombre ves tus notas + respuestas sugeridas para la reunión.</p>
    </div>
  </main>
</div>

<script>
"use strict";
var KEY="pathway_leads_v1";
var DB=load();
var current=null;

function load(){try{var r=localStorage.getItem(KEY);return r?JSON.parse(r):{leads:[]};}catch(e){return {leads:[]};}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){alert("No se pudo guardar (almacenamiento lleno o bloqueado).");}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return (s||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function fmt(ts){var d=new Date(ts);return d.toLocaleDateString("es-ES",{day:"2-digit",month:"short"})+" "+d.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});}

var ESTADOS=[["nuevo","Nuevo"],["conversacion","En conversación"],["propuesta","Propuesta enviada"],["ganado","Ganado"],["perdido","Perdido"]];

function newLead(){
  var n=prompt("Nombre del lead:");
  if(!n) return;
  var l={id:uid(),nombre:n.trim(),tipo:"Coach",canal:"WhatsApp",estado:"nuevo",
    herramientas:"",contexto:"",proximo:"",fecha:"",notas:[],creado:Date.now()};
  DB.leads.unshift(l);save();current=l.id;renderList();renderMain();
}
function selLead(id){current=id;renderList();renderMain();}
function getLead(){return DB.leads.filter(function(l){return l.id===current;})[0];}

function delLead(){
  var l=getLead();if(!l)return;
  if(!confirm("¿Borrar a “"+l.nombre+"” y todas sus notas?"))return;
  DB.leads=DB.leads.filter(function(x){return x.id!==l.id;});save();current=null;renderList();renderMain();
}

function field(k,v){var l=getLead();if(!l)return;l[k]=v;save();
  if(k==="nombre"||k==="estado")renderList();
  if(["herramientas","contexto"].indexOf(k)>=0)renderSug();}

function addNote(){
  var ta=document.getElementById("noteIn");var t=ta.value.trim();if(!t)return;
  var l=getLead();l.notas.unshift({ts:Date.now(),text:t});save();ta.value="";
  renderTimeline();renderSug();renderList();
}
function delNote(ts){var l=getLead();l.notas=l.notas.filter(function(n){return n.ts!==ts;});save();renderTimeline();renderSug();}

function renderList(){
  var q=(document.getElementById("q").value||"").toLowerCase();
  var box=document.getElementById("list");
  var arr=DB.leads.filter(function(l){return l.nombre.toLowerCase().indexOf(q)>=0;});
  if(!arr.length){box.innerHTML='<p class="hint" style="text-align:center;margin-top:20px">'+(DB.leads.length?"Sin resultados.":"Todavía no hay leads.")+'</p>';return;}
  box.innerHTML=arr.map(function(l){
    var est=ESTADOS.filter(function(e){return e[0]===l.estado;})[0]||ESTADOS[0];
    var last=l.notas[0]?fmt(l.notas[0].ts):"sin notas";
    return '<div class="lead'+(l.id===current?' active':'')+'" onclick="selLead(\''+l.id+'\')">'+
      '<div class="nm">'+esc(l.nombre)+'<span class="pill st-'+l.estado+'">'+est[1]+'</span></div>'+
      '<div class="mt"><span>'+esc(l.tipo)+'</span><span>·</span><span>'+esc(l.canal)+'</span><span>·</span><span>'+last+'</span></div>'+
      '</div>';
  }).join("");
}

function renderMain(){
  var l=getLead();
  var m=document.getElementById("main");
  if(!l){m.innerHTML='<div class="empty"><div class="big">🗂️</div><p>Elegí un lead o creá uno nuevo.</p></div>';return;}
  m.innerHTML=
  '<div class="panel">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px">'+
      '<input class="name-in" value="'+esc(l.nombre)+'" onchange="field(\'nombre\',this.value)">'+
      '<button class="ghost danger tiny" onclick="delLead()">Borrar lead</button>'+
    '</div>'+
    '<div class="row">'+
      fsel("Tipo de lead","tipo",l.tipo,["Coach","Candidato","Otro"])+
      fsel("Canal","canal",l.canal,["WhatsApp","Instagram DM","Email","Llamada","LinkedIn","Otro"])+
    '</div>'+
    '<div class="row">'+
      fselEstado(l.estado)+
      finp("Próximo contacto (fecha)","fecha",l.fecha,"date")+
    '</div>'+
    finp("Herramientas que usa hoy (Notion, Excel, Calendly…)","herramientas",l.herramientas,"text")+
    ftxt("Contexto / situación (cuántos clientes, qué busca, presupuesto…)","contexto",l.contexto)+
    finp("Próximo paso","proximo",l.proximo,"text")+
  '</div>'+

  '<div class="panel">'+
    '<h2>Bitácora de la conversación</h2>'+
    '<div class="notebox"><textarea id="noteIn" placeholder="Qué te dijo, qué le respondiste, acuerdos…"></textarea>'+
      '<button class="primary" onclick="addNote()">Agregar</button></div>'+
    '<ul class="timeline" id="tl"></ul>'+
  '</div>'+

  '<div class="panel">'+
    '<h2>💡 Ayuda para la reunión</h2>'+
    '<div id="sug"></div>'+
    '<div id="ref" style="margin-top:14px"></div>'+
  '</div>';
  renderTimeline();renderSug();renderRef();
}

function finp(lbl,k,v,t){return '<div class="fld"><label>'+lbl+'</label><input type="'+t+'" value="'+esc(v)+'" onchange="field(\''+k+'\',this.value)"></div>';}
function ftxt(lbl,k,v){return '<div class="fld"><label>'+lbl+'</label><textarea onchange="field(\''+k+'\',this.value)">'+esc(v)+'</textarea></div>';}
function fsel(lbl,k,v,opts){return '<div class="fld"><label>'+lbl+'</label><select onchange="field(\''+k+'\',this.value)">'+
  opts.map(function(o){return '<option'+(o===v?' selected':'')+'>'+o+'</option>';}).join("")+'</select></div>';}
function fselEstado(v){return '<div class="fld"><label>Estado</label><select onchange="field(\'estado\',this.value)">'+
  ESTADOS.map(function(e){return '<option value="'+e[0]+'"'+(e[0]===v?' selected':'')+'>'+e[1]+'</option>';}).join("")+'</select></div>';}

function renderTimeline(){
  var l=getLead();var tl=document.getElementById("tl");if(!tl)return;
  if(!l.notas.length){tl.innerHTML='<li style="border:none;padding-left:0"><span class="hint">Sin notas todavía. La primera nota queda fechada automáticamente.</span></li>';return;}
  tl.innerHTML=l.notas.map(function(n){
    return '<li><button class="del" onclick="delNote('+n.ts+')">borrar</button>'+
      '<div class="ts">'+fmt(n.ts)+'</div><div class="tx">'+esc(n.text)+'</div></li>';
  }).join("");
}

/* ---- Base de conocimiento de ventas (resumen del guion) ---- */
var KB=[
 {id:"precio",kw:["caro","precio","cuesta","cuánto","cuanto","costo","presupuesto","vale","58","89"],
  t:"Objeción: «es caro»",
  r:"Recuperás 5-8 h por cliente/mes en tareas operativas. Con un solo cliente ya se paga la suscripción; el ROI son las horas que volvés a poder cobrar como coaching. Y 0% de comisión: lo que cobrás a tus clientes es 100% tuyo. Planes: Basic €58 (hasta 5 clientes), Pro €89 (ilimitados), 14 días gratis."},
 {id:"comision",kw:["comisión","comision","porcentaje","se queda","cobran de","%","fee"],
  t:"Objeción: «¿me cobran comisión?»",
  r:"No. Pathway es una suscripción plana. Cobrás directo a tus clientes con tu Stripe + tu Calendly. Pathway no toca esa transacción ni te cobra un porcentaje sobre tus ventas."},
 {id:"herramientas",kw:["notion","excel","sheets","drive","trello","airtable","ya uso","me arreglo","clickup","crm","whatsapp solo"],
  t:"Objeción: «ya uso Notion/Excel/Calendly»",
  r:"Eso son 5+ apps y repetir el setup con cada cliente nuevo. Pathway lo unifica + suma IA que arma informe, CV, carta y LinkedIn en 30 seg + un portal con TU marca que tus clientes no tienen con Notion. Dejás de depender de tu memoria."},
 {id:"marca",kw:["marca","logo","white","branding","ven pathway","mi nombre","personalizar"],
  t:"Tema: marca propia / white-label",
  r:"En el plan Pro (€89) es white-label completo: tu logo, tus colores, tu link en el portal del cliente. Pathway funciona como infraestructura invisible. En Basic se usa el branding por defecto de Pathway."},
 {id:"cancelar",kw:["cancelar","permanencia","contrato","atado","compromiso","ato","baja"],
  t:"Objeción: «¿y si quiero cancelar?»",
  r:"Sin permanencia. Cancelás desde el panel cuando quieras y mantenés acceso hasta el fin del período ya pagado. Los datos de tus clientes son tuyos: exportables hasta 90 días."},
 {id:"tiempo",kw:["tiempo","aprender","complicado","difícil","dificil","configurar","setup","técnico","tecnico","no sé"],
  t:"Objeción: «no tengo tiempo / es complicado»",
  r:"Tu cuenta y tu link público quedan listos en ~5 minutos. Sin dev, sin Webflow, sin armar Stripe. Hay una demo de 11 minutos sin agendar nada para verlo funcionando."},
 {id:"trial",kw:["probar","prueba","trial","gratis","garantía","garantia","no me convence","demo","ver primero"],
  t:"Cierre: prueba sin riesgo",
  r:"14 días gratis para probar todo: tu perfil + hasta 5 clientes + herramientas IA. Tarjeta requerida pero NO se cobra hasta el día 14. Si no convence, se cancela sin penalidad."},
 {id:"candidato_sin_resultados",kw:["meses","no me llaman","no responden","no responde","sin resultados","nadie","desempleo","frustrad"],
  t:"Candidato: «llevo meses sin respuesta»",
  r:"Cuanto más tiempo sin respuesta, más claro se ve qué hay que ajustar. No es intentarlo más: es cambiar cómo estás jugando el proceso. Empezamos con una llamada gratis de 30 min para ver si encaja."},
 {id:"idioma",kw:["idioma","inglés","ingles","english","bilingüe","bilingue","internacional"],
  t:"Candidato: idioma",
  r:"Se trabaja en español o inglés indistintamente. Para roles internacionales se prepara el perfil y las entrevistas directamente en inglés."},
 {id:"candidato",kw:["candidato","busco trabajo","empleo","trabajo","cv","entrevista","linkedin"],
  t:"Flujo candidato",
  r:"Mentoría 1:1 en 3 etapas (perfil/posicionamiento → network/búsqueda → storytelling/entrevistas) en 4-6 semanas + portal privado con IA. Resultados promedio: +3 entrevistas, 5× más respuestas, 90+ score ATS. Empieza con llamada gratis de 30 min."}
];

var REF=[
 ["Pitch en 30 seg","Pathway es la plataforma SaaS para coaches de carrera. Reemplaza 5+ herramientas sueltas por un panel; cada cliente entra a un portal con la marca del coach. La IA genera informe + CV + carta + LinkedIn en 30 seg. El coach cobra directo — Pathway no toca ese dinero."],
 ["Precios","Basic €58/mes (hasta 5 clientes, sin white-label, soporte email). Pro €89/mes (clientes ilimitados, white-label, envío de emails desde el panel, URL propia, soporte WhatsApp+email). Ambos: 14 días gratis (tarjeta requerida, no se cobra hasta el día 14), sin permanencia, 0% comisión, datos exportables 90 días.\n⚠️ No prometer 'ilimitado a €58': eso era de materiales viejos."],
 ["Diferenciales","0% comisión · marca del coach (no la de Pathway) · IA arma roadmap en 30 seg · reemplaza 5+ apps (ahorro 5-8 h/cliente/mes) · setup en 1 tarde · construido por una recruiter real."],
 ["Cliente ideal","Coaches de carrera, mentores, consultores de transición, RR.HH. independientes que YA cobran por su tiempo. Menos encaje: sin clientes ni servicio definido, o quien busca un marketplace que le traiga clientes solo."],
 ["Autoridad / prueba social","Micaela Jairedin: +17 años en RR.HH./recruiting, ex Amazon, +800 procesos de selección en Europa y LATAM, coach ontológica certificada, bilingüe ES/EN."],
 ["Resultados candidato","Promedio en 4-6 semanas: +3 entrevistas, 5× más respuestas en LinkedIn/aplicaciones, 90+ score CV ATS. Reembolso 7 días."],
 ["CTAs","Coach: «Empezá 14 días gratis, tu perfil activo en 5 min» / «Mirá la demo de 11 min sin agendar». Candidato: «Agendá tu diagnóstico gratis de 30 min, sin compromiso». Contacto: hi@pathwaycareercoach.com · WhatsApp +34 611 256 224."]
];

function leadText(){var l=getLead();if(!l)return"";
  return [l.tipo,l.canal,l.herramientas,l.contexto,l.proximo].concat(l.notas.map(function(n){return n.text;})).join(" ").toLowerCase();}

function renderSug(){
  var box=document.getElementById("sug");if(!box)return;
  var txt=leadText();var l=getLead();
  var hits=KB.filter(function(k){return k.kw.some(function(w){return txt.indexOf(w)>=0;});});
  if(l&&l.tipo==="Candidato"&&hits.indexOf(KB.filter(function(k){return k.id==="candidato";})[0])<0)
    hits.unshift(KB.filter(function(k){return k.id==="candidato";})[0]);
  if(!hits.length){box.innerHTML='<p class="hint">Anotá herramientas que usa, su situación o lo que te dice. Acá te voy mostrando respuestas sugeridas según las palabras clave que detecte (ej.: «caro», «Notion», «comisión», «cancelar», «inglés»…).</p>';return;}
  box.innerHTML='<p class="hint" style="margin-bottom:8px">Sugerencias detectadas en tus notas (tocá «Copiar» y pegá en el chat):</p>'+
   hits.map(function(k){
    return '<div class="sug"><div class="h">'+esc(k.t)+'<button class="tiny" onclick="copy(this,'+JSON.stringify(k.r).replace(/"/g,"&quot;")+')">Copiar</button></div>'+
      '<div class="b">'+esc(k.r)+'</div></div>';
  }).join("");
}
function renderRef(){
  var box=document.getElementById("ref");if(!box)return;
  box.innerHTML='<p class="hint" style="margin-bottom:8px">Referencia completa del producto:</p>'+
   REF.map(function(r){
    return '<details class="acc"><summary>'+esc(r[0])+'<span>＋</span></summary><div class="ac">'+esc(r[1])+'</div></details>';
  }).join("");
}
function copy(btn,t){
  function done(){var o=btn.textContent;btn.textContent="✓ Copiado";setTimeout(function(){btn.textContent=o;},1400);}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,function(){fallback(t);done();});}
  else{fallback(t);done();}
}
function fallback(t){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");}catch(e){}document.body.removeChild(a);}

function exportData(){
  var blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="pathway-leads-"+new Date().toISOString().slice(0,10)+".json";a.click();
}
function importData(e){
  var f=e.target.files[0];if(!f)return;var rd=new FileReader();
  rd.onload=function(){
    try{var d=JSON.parse(rd.result);
      if(!d.leads)throw 0;
      if(!confirm("Importar "+d.leads.length+" leads. ¿Reemplazar lo actual? (Cancelar = fusionar)")){
        var ids={};DB.leads.forEach(function(l){ids[l.id]=1;});
        d.leads.forEach(function(l){if(!ids[l.id])DB.leads.push(l);});
      }else{DB=d;}
      save();current=null;renderList();renderMain();alert("Importado.");
    }catch(err){alert("Archivo inválido.");}
    e.target.value="";
  };
  rd.readAsText(f);
}

renderList();
</script>
</body>
</html>
