<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Sala de sesión · Pathway</title>
<link rel="icon" href="/favicon-app.svg?v=5" type="image/svg+xml">
<style>
  :root{
    --bg:#FCFBF8;--panel:#fff;--stage:#0F1D16;--bosque:#2D6A4F;--bosque-d:#245741;
    --sendero:#52B788;--amanecer:#E9C46A;--carbon:#1B2E26;--soft:#556158;--muted:#8A968E;
    --border:#ECE7DC;--niebla-2:#F8F5EF;--rose:#C0756E;--ok:#2E7D5B;
    --ser:Georgia,"Times New Roman",serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --sh:0 1px 2px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--carbon);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  .app{max-width:1180px;margin:0 auto;padding:16px 18px 24px;min-height:100vh;display:flex;flex-direction:column;gap:14px}
  .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .who{display:flex;align-items:center;gap:12px;flex:1;min-width:200px}
  .av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--bosque),var(--sendero));color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px;flex-shrink:0}
  .who h1{font-family:var(--ser);font-weight:600;font-size:19px;margin:0;line-height:1.1}
  .who .sub{font-size:12px;color:var(--soft);margin-top:2px}
  .pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:7px 12px;border-radius:100px;border:1px solid var(--border);background:var(--panel);color:var(--soft)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--sendero);display:inline-block}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--carbon)}
  .grid{display:grid;grid-template-columns:1.7fr 1fr;gap:14px;flex:1;min-height:0}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  /* Stage / JaaS */
  .stage{position:relative;background:radial-gradient(120% 120% at 30% 10%,#183328,var(--stage));border-radius:18px;overflow:hidden;min-height:440px;display:flex;flex-direction:column}
  #jaas{position:absolute;inset:0}
  #jaas iframe{border:0;width:100%;height:100%}
  .wait{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#DCEFE3;text-align:center;padding:24px}
  .wait img{width:120px;height:120px;object-fit:contain;filter:drop-shadow(0 6px 12px rgba(0,0,0,.4))}
  .wait .t{font-family:var(--ser);font-size:20px}
  .wait .s{font-size:13px;color:#9CC4AE;max-width:320px;line-height:1.5}
  .wait .err{color:#F3C9C4}
  .btn{border:none;cursor:pointer;font-family:var(--sans);font-weight:700;border-radius:10px;transition:transform .15s,background .15s}
  .btn:hover{transform:translateY(-1px)}
  .btn-p{background:var(--bosque);color:#fff;font-size:13px;padding:10px 16px}.btn-p:hover{background:var(--bosque-d)}
  .btn-g{background:var(--niebla-2);color:var(--bosque);font-size:12px;padding:8px 13px;border:1px solid var(--border)}
  /* Panel */
  .col{display:flex;flex-direction:column;gap:12px;min-height:0}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--sh)}
  .ch{display:flex;align-items:center;justify-content:space-between;padding:12px 15px 8px}
  .ch h2{font-family:var(--ser);font-weight:600;font-size:15px;margin:0}
  .ey{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
  .cb{padding:0 15px 14px}
  .row{display:flex;align-items:flex-start;gap:10px;padding:6px 0;cursor:pointer}
  .chk{width:19px;height:19px;border-radius:6px;border:1.8px solid #DDD6C8;flex-shrink:0;margin-top:1px;display:grid;place-items:center}
  .row.done .chk{background:var(--bosque);border-color:var(--bosque)}
  .chk svg{width:11px;height:11px;stroke:#fff;stroke-width:3.4;opacity:0}.row.done .chk svg{opacity:1}
  .row .tx{font-size:13px}.row.done .tx{color:var(--muted);text-decoration:line-through}
  textarea{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;font-family:var(--sans);font-size:13px;background:var(--niebla-2);resize:vertical;min-height:80px;outline:none;line-height:1.5}
  textarea:focus{border-color:var(--bosque)}
  .saved{font-size:11px;color:var(--ok);font-weight:600}
  .addrow{display:flex;gap:8px;margin-bottom:8px}
  .addrow input{flex:1;border:1.5px solid var(--border);border-radius:9px;padding:8px 11px;font-size:13px;background:var(--niebla-2);outline:none;font-family:var(--sans)}
  .addrow input:focus{border-color:var(--bosque)}
  .out{display:flex;gap:8px;flex-wrap:wrap}
  .out .btn{flex:1;min-width:96px}
  .out .ok{background:var(--sendero);color:#0f2b1f}
  .out .mid{background:var(--amanecer);color:#5a4611}
  .out .no{background:var(--niebla-2);color:var(--soft);border:1px solid var(--border)}
  :where(button,input,textarea,.row):focus-visible{outline:2px solid var(--bosque);outline-offset:2px;border-radius:8px}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="who"><div class="av" id="who-av">?</div>
      <div><h1 id="who-name">Sala de sesión</h1><div class="sub" id="who-sub">Conectando…</div></div></div>
    <span class="pill"><span class="dot"></span> <span id="estado">En sala</span></span>
    <span class="pill"><span class="timer" id="timer">00:00</span></span>
  </header>

  <div class="grid">
    <section class="stage">
      <div id="jaas"></div>
      <div class="wait" id="wait">
        <img src="assets/cabra/frente.gif" alt="" onerror="this.style.display='none'">
        <div class="t" id="wait-t">Preparando la sala…</div>
        <div class="s" id="wait-s">Un momento — cargamos tu videollamada dentro de Pathway.</div>
      </div>
    </section>

    <aside class="col">
      <div class="card"><div class="ch"><h2>Objetivos</h2><span class="ey" id="obj-c">0/0</span></div>
        <div class="cb" id="objetivos"><div style="font-size:12.5px;color:var(--muted);padding:4px 0">Los objetivos de la sesión aparecen acá.</div></div></div>

      <div class="card"><div class="ch"><h2>Notas</h2><span class="saved" id="saved"></span></div>
        <div class="cb"><textarea id="notas" placeholder="Anotá lo que va saliendo…"></textarea></div></div>

      <div class="card"><div class="ch"><h2>Tareas</h2><span class="ey">en vivo</span></div>
        <div class="cb"><div class="addrow"><input id="tin" placeholder="Nueva tarea… (Enter)"><button class="btn btn-p" id="tadd">+</button></div>
          <div id="tareas"></div></div></div>

      <div class="card"><div class="ch"><h2>¿Cómo fue?</h2><span class="ey">al terminar</span></div>
        <div class="cb"><div class="out">
          <button class="btn ok" data-res="convirtio">✅ Convirtió</button>
          <button class="btn mid" data-res="seguimiento">🟡 Seguir</button>
          <button class="btn no" data-res="perdido">⚪ No</button>
        </div><div id="out-msg" style="font-size:11.5px;color:var(--soft);margin-top:9px"></div></div></div>
    </aside>
  </div>
</div>

<script>
"use strict";
var SB='https://api.pathwaycareercoach.com';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkeG5yc25qZHZ0cWh4dW54bndqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNDk5MzksImV4cCI6MjA5MDcyNTkzOX0.t82X1x-PDgFDGYhKC7YXoRKhga9I8Hjet60QUYvtZLU';
function qp(k){ try{ return new URLSearchParams(location.search).get(k)||''; }catch(e){ return ''; } }

// Contexto de la sala (viene por la URL de la reserva / el panel)
var ROOM = qp('room') || ('Pathway-demo-'+Math.floor(Date.now()/60000)); // fallback determinístico por minuto
var NAME = qp('name') || 'Invitado';
var EMAIL= qp('email') || '';
var MOD  = qp('mod')==='1' || qp('mod')==='true';   // 1 = coach (moderador)
var CITA = qp('cita') || '';
var WHO  = qp('con') || '';                          // nombre del otro (para el header)

document.getElementById('who-name').textContent = WHO ? ('Sesión con '+WHO) : 'Sala de sesión';
document.getElementById('who-sub').textContent = MOD ? 'Sos el anfitrión' : ('Entrás como '+NAME);
document.getElementById('who-av').textContent = (WHO||NAME||'?').trim().charAt(0).toUpperCase();

function waitState(t,s,isErr){ var w=document.getElementById('wait'); if(!w) return;
  w.style.display='flex'; document.getElementById('wait-t').textContent=t;
  var se=document.getElementById('wait-s'); se.textContent=s; se.className='s'+(isErr?' err':''); }
function hideWait(){ var w=document.getElementById('wait'); if(w) w.style.display='none'; }

// 1) Pedir el JWT a jaas-token (el server firma; nunca vemos la clave)
function getToken(){
  return fetch(SB+'/functions/v1/jaas-token',{method:'POST',
    headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+KEY},
    body:JSON.stringify({room:ROOM,name:NAME,email:EMAIL,moderator:MOD})
  }).then(function(r){ return r.json().then(function(j){ if(!r.ok) throw j; return j; }); });
}

// 2) Cargar el script de JaaS (incluye el App ID) y arrancar la videollamada
function loadScript(src){ return new Promise(function(res,rej){ var s=document.createElement('script'); s.src=src; s.async=true; s.onload=res; s.onerror=function(){ rej(new Error('no_script')); }; document.head.appendChild(s); }); }

var api=null, TSTART=0, tInt=null;
function startTimer(){ TSTART=Date.now(); var el=document.getElementById('timer'); tInt=setInterval(function(){ var s=Math.floor((Date.now()-TSTART)/1000); el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); },1000); }

function boot(){
  waitState('Preparando la sala…','Cargamos tu videollamada dentro de Pathway.');
  getToken().then(function(tok){
    if(!tok || !tok.jwt || !tok.appId) throw new Error('token_incompleto');
    var appId = tok.appId;
    return loadScript('https://8x8.vc/'+appId+'/external_api.js').then(function(){
      /* global JitsiMeetExternalAPI */
      if(typeof JitsiMeetExternalAPI==='undefined') throw new Error('no_api');
      api = new JitsiMeetExternalAPI('8x8.vc',{
        roomName: appId+'/'+tok.room,
        jwt: tok.jwt,
        parentNode: document.getElementById('jaas'),
        configOverwrite:{ prejoinPageEnabled:false, disableDeepLinking:true },
        userInfo:{ displayName:NAME, email:EMAIL }
      });
      // Entré yo → sala lista. Si estoy solo, muestro la espera con la cabra.
      api.addListener('videoConferenceJoined', function(){
        startTimer();
        var n = api.getNumberOfParticipants ? api.getNumberOfParticipants() : 1;
        if(n>1){ hideWait(); document.getElementById('estado').textContent='En llamada'; }
        else { waitState('Esperando a que se una '+(WHO||'la otra persona')+'…','Mientras tanto, jugá con la cabra 🐐 (próximamente) — no es tiempo muerto.'); document.getElementById('estado').textContent='Esperando'; }
      });
      api.addListener('participantJoined', function(){ hideWait(); document.getElementById('estado').textContent='En llamada'; });
      api.addListener('participantLeft', function(){ document.getElementById('estado').textContent='Solo en sala'; });
      api.addListener('readyToClose', function(){ document.getElementById('estado').textContent='Llamada terminada'; hideWait(); });
    });
  }).catch(function(e){
    var code=(e && (e.error||e.message))||'error';
    if(code==='jaas_secrets_missing') waitState('Falta configurar JaaS','Cargá JAAS_APP_ID / JAAS_KID / JAAS_PRIVATE_KEY en los Secrets de Supabase y deployá jaas-token.',true);
    else if(code==='no_script'||code==='no_api') waitState('No cargó el video','No se pudo cargar JaaS (revisá el App ID / conexión).',true);
    else waitState('No pudimos abrir la sala','Deployá la función jaas-token (supabase functions deploy jaas-token --no-verify-jwt) y reintentá. Detalle: '+code,true);
    try{ console.error('[sala]',e); }catch(_e){}
  });
}
boot();

// ── Panel: notas (best-effort a la cita), tareas, objetivos, resultado ──
var notas=document.getElementById('notas'), saved=document.getElementById('saved'), sT;
try{ notas.value=localStorage.getItem('pw_sala_notas_'+ROOM)||''; }catch(e){}
notas.addEventListener('input',function(){ try{ localStorage.setItem('pw_sala_notas_'+ROOM,notas.value); }catch(e){}
  clearTimeout(sT); sT=setTimeout(function(){ saved.textContent='Guardado ✓'; setTimeout(function(){ saved.textContent=''; },1500); },500); });

var tin=document.getElementById('tin'), tlist=document.getElementById('tareas');
function addTask(t){ t=(t||'').trim(); if(!t) return;
  var r=document.createElement('div'); r.className='row';
  r.innerHTML='<span class="chk"><svg viewBox="0 0 24 24" fill="none"><polyline points="20 6 9 17 4 12"/></svg></span><span class="tx"></span>';
  r.querySelector('.tx').textContent=t; r.onclick=function(){ r.classList.toggle('done'); };
  tlist.appendChild(r); tin.value=''; }
document.getElementById('tadd').onclick=function(){ addTask(tin.value); tin.focus(); };
tin.addEventListener('keydown',function(e){ if(e.key==='Enter') addTask(tin.value); });

// Resultado de la llamada → se intenta guardar en la cita (para que salga en el
// calendario/agenda). Best-effort: si la columna no existe, no rompe.
document.querySelectorAll('.out .btn').forEach(function(b){
  b.onclick=function(){
    var res=b.getAttribute('data-res'), msg=document.getElementById('out-msg');
    msg.textContent='Guardando cómo fue…';
    try{ localStorage.setItem('pw_sala_res_'+ROOM,res); }catch(e){}
    if(!CITA){ msg.textContent='Registrado ✓ (sin cita vinculada)'; return; }
    fetch(SB+'/rest/v1/citas?id=eq.'+encodeURIComponent(CITA),{method:'PATCH',
      headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+KEY,Prefer:'return=minimal'},
      body:JSON.stringify({resultado:res,notas_llamada:notas.value})
    }).then(function(r){ msg.textContent=r.ok?'✓ Guardado en la cita — sale en tu calendario':'Registrado (la cita necesita las columnas resultado/notas_llamada)'; })
      .catch(function(){ msg.textContent='Registrado local (sin conexión)'; });
  };
});
</script>
</body>
</html>
