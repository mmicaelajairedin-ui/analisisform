<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon-app.svg?v=7" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pathway</title>
<script>
/* GitHub Pages sirve este archivo para cualquier ruta sin archivo físico.
   El dominio está en GitHub Pages (hay CNAME), que NO soporta _redirects,
   así que la URL bonita /coach/<slug> caía en este 404. Acá la atrapamos y
   la mandamos a /coach.html?slug=<slug>, que coach.html ya sabe leer. */
(function () {
  var m = location.pathname.match(/^\/coach\/([a-z0-9][a-z0-9-]{0,80})\/?$/i);
  if (m) {
    var extra = location.search ? "&" + location.search.slice(1) : "";
    location.replace("/coach.html?slug=" + encodeURIComponent(m[1]) + extra + location.hash);
  }
}());
</script>
<style>
  body { font-family: Inter, -apple-system, system-ui, sans-serif; background: #FAFDF9; color: #1B2E26; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
  .box { max-width: 420px; }
  h1 { font-family: Fraunces, Georgia, serif; font-size: 28px; margin: 0 0 10px; }
  p { color: #5A6A60; line-height: 1.6; font-size: 15px; }
  a { color: #2D6A4F; font-weight: 600; text-decoration: none; }
</style>
</head>

  </div>
</body>
</html>
