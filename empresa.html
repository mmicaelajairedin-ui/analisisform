<!doctype html>
<html lang="es">
<head>
<script src="pw-observe.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<style>html{color-scheme:light;scrollbar-gutter:stable;overflow-x:hidden;max-width:100%;}</style>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Pathway para Empresas</title>
<link rel="icon" href="/favicon-app.svg?v=6" type="image/svg+xml">
<meta name="theme-color" content="#2D6A4F">
<style>
@import url("https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600;700;800&display=swap");

:root{
  --pw-bosque:#2D6A4F; --pw-bosque-dark:#1B4332; --pw-sendero:#52B788;
  --pw-amanecer:#E9C46A; --pw-carbon:#1B2E26;
  --pw-niebla:#F7FAF6; --pw-bg-card:#FFFFFF; --pw-field:#F1F5EF;
  --pw-text:var(--pw-carbon); --pw-text-soft:#5A6560; --pw-text-muted:#8A948E;
  --pw-border:rgba(45,106,79,.12); --pw-border-strong:rgba(45,106,79,.22);
  --pw-warn:#B7791F;
  --pw-shadow-xs:0 1px 2px rgba(45,106,79,.06);
  --pw-shadow-sm:0 4px 14px rgba(45,106,79,.08);
  --pw-shadow-md:0 6px 20px rgba(45,106,79,.10);
  --pw-shadow-lg:0 16px 34px rgba(45,106,79,.12);
  --pw-serif:"Fraunces","Georgia","Times New Roman",serif;
  --pw-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --pw-ease:cubic-bezier(.16,1,.3,1);
  /* Acento por nicho — el layout es el mismo, se re-tematiza segun el area */
  --a1:var(--pw-bosque); --a2:var(--pw-sendero); --at:rgba(82,183,136,.15); --aink:#1B4332;
}
:root[data-niche="fitness"]{ --a1:#2D6A4F; --a2:#52B788; --at:rgba(82,183,136,.15); --aink:#1B4332; }
:root[data-niche="carrera"]{ --a1:#2E7587; --a2:#4FA6BA; --at:rgba(79,166,186,.16); --aink:#1C4A55; }
:root[data-niche="finanzas"]{ --a1:#B7791F; --a2:#E9C46A; --at:rgba(233,196,106,.22); --aink:#7A4E12; }

*{box-sizing:border-box}
body{margin:0;font-family:var(--pw-sans);background:var(--pw-niebla);color:var(--pw-text);
  -webkit-font-smoothing:antialiased;padding:0 20px 80px}
.emo{filter:grayscale(1);font-style:normal}

/* top bar */
.topbar{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:14px;
  padding:20px 4px 18px;border-bottom:1px solid var(--pw-border)}
.brand{display:flex;align-items:center;gap:11px;font-weight:600}
.brand .logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:var(--a1);color:#fff;font-family:var(--pw-serif);font-size:18px;box-shadow:var(--pw-shadow-xs);
  transition:background .35s var(--pw-ease)}
.brand .co{font-size:15px}
.brand .co small{display:block;color:var(--pw-text-muted);font-size:11px;font-weight:500}
.topbar .spacer{flex:1}
.plan{font-size:12px;font-weight:600;color:var(--aink);background:var(--at);
  border:1px solid var(--pw-border);padding:6px 12px;border-radius:999px}

.wrap{max-width:1120px;margin:0 auto}
.view{display:none;animation:fade .4s var(--pw-ease) both}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view.on{animation:none}*{transition:none!important}}

.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--pw-text-muted)}
h1.page{font-family:var(--pw-serif);font-weight:500;letter-spacing:-.02em;
  font-size:clamp(30px,4vw,42px);margin:6px 0 4px;text-wrap:balance}
h1.page .dot{color:var(--a2)}
.lead{color:var(--pw-text-soft);font-size:15px;margin:0}
.head-row{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
  padding:34px 4px 22px;flex-wrap:wrap}
.btn{font-family:var(--pw-sans);font-size:13px;font-weight:600;cursor:pointer;border-radius:11px;
  padding:11px 16px;border:1px solid transparent;display:inline-flex;align-items:center;gap:8px;
  background:var(--a1);color:#fff;box-shadow:var(--pw-shadow-md);transition:transform .15s,filter .2s,background .35s}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}

/* AREAS overview */
.areas{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
@media(max-width:860px){.areas{grid-template-columns:1fr}}
.area{background:var(--pw-bg-card);border:1px solid var(--pw-border);border-radius:20px;padding:22px 22px 8px;
  box-shadow:var(--pw-shadow-xs);cursor:pointer;transition:transform .18s,box-shadow .25s,border-color .2s;
  display:flex;flex-direction:column;position:relative;overflow:hidden}
.area::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c2);opacity:.9}
.area:hover{transform:translateY(-3px);box-shadow:var(--pw-shadow-lg);border-color:var(--pw-border-strong)}
.area .a-hd{display:flex;align-items:center;gap:13px}
.area .a-ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:22px;
  background:var(--ct);border:1px solid var(--pw-border)}
.area h3{font-family:var(--pw-serif);font-weight:500;font-size:22px;margin:0;letter-spacing:-.01em}
.area .a-sub{color:var(--pw-text-muted);font-size:12.5px;margin-top:2px}
.area .rate{margin-left:auto;align-self:flex-start;font-size:12px;font-weight:600;color:var(--pw-text);
  background:var(--pw-field);border:1px solid var(--pw-border);border-radius:999px;padding:4px 10px;white-space:nowrap}
.area .rate b{color:var(--c1)}
.goal{margin:20px 0 4px}
.goal .grow{display:flex;justify-content:space-between;font-size:12.5px;color:var(--pw-text-soft);margin-bottom:7px}
.goal .grow b{color:var(--pw-text);font-variant-numeric:tabular-nums}
.track{height:8px;border-radius:99px;background:var(--pw-field);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--c2),var(--c1));
  transition:width 1s var(--pw-ease)}
.a-stats{display:flex;gap:26px;padding:20px 0 16px}
.a-stats .n{font-family:var(--pw-serif);font-weight:500;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.a-stats .k{font-size:11.5px;color:var(--pw-text-muted);margin-top:6px}
.a-coaches{border-top:1px solid var(--pw-border);padding:14px 0 6px;display:flex;flex-direction:column;gap:11px}
.a-coach{display:flex;align-items:center;gap:11px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;
  color:var(--c1);background:var(--ct);flex:none}
.a-coach .nm{font-size:13px;font-weight:600}
.a-coach .rl{font-size:11px;color:var(--pw-text-muted);margin-top:1px}
.a-coach .sm{margin-left:auto;text-align:right;font-size:12px;color:var(--pw-text-soft)}
.a-coach .sm b{display:block;font-size:14px;color:var(--pw-text);font-variant-numeric:tabular-nums}
.a-open{padding:12px 0 16px;color:var(--c1);font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px}

/* TEAM view */
.back{background:none;border:none;color:var(--pw-text-soft);font-size:13px;font-weight:600;cursor:pointer;
  padding:0;display:inline-flex;align-items:center;gap:6px;margin-bottom:4px}
.back:hover{color:var(--a1)}
.coaches{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:820px){.coaches{grid-template-columns:1fr}}
.coach{background:var(--pw-bg-card);border:1px solid var(--pw-border);border-radius:20px;padding:20px 22px;
  box-shadow:var(--pw-shadow-xs);transition:box-shadow .25s,border-color .2s}
.coach:hover{box-shadow:var(--pw-shadow-md);border-color:var(--pw-border-strong)}
.c-hd{display:flex;align-items:center;gap:13px}
.c-hd .av{width:44px;height:44px;font-size:14px;color:var(--a1);background:var(--at)}
.c-hd h3{font-family:var(--pw-serif);font-weight:500;font-size:19px;margin:0;letter-spacing:-.01em}
.c-hd .rl{font-size:12.5px;color:var(--pw-text-muted);margin-top:2px}
.c-hd .rate{margin-left:auto;font-size:12px;font-weight:600;background:var(--pw-field);
  border:1px solid var(--pw-border);border-radius:999px;padding:4px 10px;white-space:nowrap}
.c-hd .rate b{color:var(--a1)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0 14px}
.tile{background:var(--pw-field);border-radius:14px;padding:14px 14px}
.tile .n{font-family:var(--pw-serif);font-weight:500;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.tile .k{font-size:11px;color:var(--pw-text-muted);margin-top:6px}
.c-top{border-top:1px solid var(--pw-border);padding-top:13px;display:flex;align-items:center;gap:8px;
  font-size:12.5px;color:var(--pw-text-soft);cursor:pointer}
.c-top .medal{color:var(--pw-warn)}
.c-top b{color:var(--pw-text)}
.c-top .pts{margin-left:auto;color:var(--pw-text-muted)}
.c-top .chev{transition:transform .25s;color:var(--pw-text-muted)}
.coach.open .c-top .chev{transform:rotate(90deg)}
.emps{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s var(--pw-ease)}
.coach.open .emps{grid-template-rows:1fr}
.emps-in{overflow:hidden}
.emp{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--pw-border)}
.emp:first-child{border-top:none;margin-top:6px}
.emp .rk{width:20px;text-align:center;font-weight:700;font-size:12px;color:var(--pw-text-muted);font-variant-numeric:tabular-nums}
.emp .av{width:28px;height:28px;font-size:10px}
.emp .en{font-size:13px;font-weight:600}
.emp .eg{font-size:11px;color:var(--pw-text-muted);margin-top:1px}
.emp .bar{margin-left:auto;width:120px}
.emp .bar .t{height:6px;border-radius:99px;background:var(--pw-field);overflow:hidden}
.emp .bar i{display:block;height:100%;background:var(--a2);border-radius:99px}
.emp .ep{font-size:12px;font-weight:700;color:var(--pw-text);width:52px;text-align:right;font-variant-numeric:tabular-nums}

.foot{max-width:1120px;margin:34px auto 0;color:var(--pw-text-muted);font-size:12px;text-align:center;
  padding-top:20px;border-top:1px solid var(--pw-border)}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="logo" id="logo">P</div>
    <div class="co">Grupo Vitalis <small>Bienestar 360 · 68 colaboradores</small></div>
  </div>
  <div class="spacer"></div>
  <span class="plan"><span class="emo">🏢</span> Plan Empresas</span>
</div>

<!-- OVERVIEW -->
<section class="view on wrap" id="v-overview">
  <div class="head-row">
    <div>
      <div class="eyebrow">Un coach experto por área</div>
      <h1 class="page">Áreas de bienestar<span class="dot">.</span></h1>
      <p class="lead">Cada área tiene su equipo de coaches acompañando a tus colaboradores.</p>
    </div>
  </div>
  <div class="areas" id="areas"></div>
</section>

<!-- TEAM -->
<section class="view wrap" id="v-team">
  <div class="head-row">
    <div>
      <button class="back" id="back">‹ Áreas de bienestar</button>
      <div class="eyebrow" id="t-eyebrow">Equipo</div>
      <h1 class="page">Coaches<span class="dot">.</span></h1>
      <p class="lead" id="t-lead"></p>
    </div>
    <button class="btn" id="addCoach"><span class="emo">＋</span> Agregar coach</button>
  </div>
  <div class="coaches" id="coaches"></div>
</section>

<div class="foot">Prototipo · Pathway para Empresas · datos de ejemplo (sin conectar todavía)</div>

<script>
(function(){
  // ── Datos de ejemplo (mock). TODO: reemplazar por Supabase cuando definamos
  //    el modelo (empresa → areas → coaches → colaboradores). Ver CLAUDE.md.
  var NICHES = {
    fitness:{ team:"Gym Fitness 19",        icon:"🏋️", name:"Fitness",  rate:"4.8", goal:78, ses:62, emp:34 },
    carrera:{ team:"Desarrollo & Carrera",  icon:"💼", name:"Carrera",  rate:"4.7", goal:64, ses:41, emp:22 },
    finanzas:{team:"Salud Financiera",      icon:"💰", name:"Finanzas", rate:"4.9", goal:71, ses:25, emp:12 }
  };
  var COACHES = {
    fitness:[
      {i:"MA",n:"Martín Aguirre",r:"Entrenador personal",rate:"4.9",cli:18,ses:36,pts:756,top:"Andrés Molina",tpts:982,
        emps:[["Andrés Molina","Operaciones",982],["Sofía Duarte","Ventas",870],["Nicolás Paz","Soporte",610]]},
      {i:"LF",n:"Lucía Ferreyra",r:"Coach de hábitos",rate:"4.7",cli:16,ses:26,pts:666,top:"Marina Vega",tpts:915,
        emps:[["Marina Vega","Marketing",915],["Julián Ríos","Finanzas",640],["Paula Sena","RRHH",520]]}
    ],
    carrera:[
      {i:"DS",n:"Diego Sosa",r:"Coach de carrera",rate:"4.6",cli:12,ses:24,pts:641,top:"Bruno Salas",tpts:812,
        emps:[["Bruno Salas","Producto",812],["Elena Cabrera","Diseño",700],["Iván Torres","Datos",560]]},
      {i:"CO",n:"Camila Ortiz",r:"Mentora de liderazgo",rate:"4.8",cli:10,ses:17,pts:562,top:"Tomás Ruiz",tpts:705,
        emps:[["Tomás Ruiz","Ingeniería",705],["Valeria Gómez","PMO",590],["Lucas Ferro","Comercial",470]]}
    ],
    finanzas:[
      {i:"VR",n:"Valentina Ríos",r:"Asesora financiera",rate:"4.9",cli:12,ses:25,pts:690,top:"Clara Ledesma",tpts:840,
        emps:[["Clara Ledesma","Legales",840],["Mateo Vidal","Operaciones",620],["Rocío Ayala","Ventas",540]]}
    ]
  };
  // acento por nicho para las cards del overview (cada card lleva el suyo)
  var ACC = { fitness:["#2D6A4F","#52B788","rgba(82,183,136,.15)"],
              carrera:["#2E7587","#4FA6BA","rgba(79,166,186,.16)"],
              finanzas:["#B7791F","#E9C46A","rgba(233,196,106,.22)"] };

  var root=document.documentElement;
  function initials(name){ return name.split(" ").map(function(w){return w[0];}).join("").slice(0,2); }
  function esc(s){ var d=document.createElement("div"); d.textContent=s==null?"":String(s); return d.innerHTML; }

  function areaCard(key){
    var d=NICHES[key], cs=COACHES[key], a=ACC[key];
    var coachRows=cs.map(function(c){
      return '<div class="a-coach"><div class="av">'+esc(c.i)+'</div>'+
        '<div><div class="nm">'+esc(c.n)+'</div><div class="rl">'+esc(c.r)+'</div></div>'+
        '<div class="sm"><b>'+c.ses+'</b>ses/mes</div></div>';
    }).join("");
    return '<article class="area" data-go="'+key+'" tabindex="0" role="button" '+
      'style="--c1:'+a[0]+';--c2:'+a[1]+';--ct:'+a[2]+'">'+
      '<div class="a-hd"><div class="a-ico">'+d.icon+'</div>'+
      '<div><h3>'+esc(d.name)+'</h3><div class="a-sub">'+cs.length+' coaches · '+d.emp+' colaboradores</div></div>'+
      '<span class="rate"><span class="emo">★</span> <b>'+d.rate+'</b></span></div>'+
      '<div class="goal"><div class="grow"><span>Objetivos cumplidos</span><b>'+d.goal+'%</b></div>'+
      '<div class="track"><i style="width:'+d.goal+'%"></i></div></div>'+
      '<div class="a-stats"><div><div class="n">'+d.ses+'</div><div class="k">Sesiones/mes</div></div>'+
      '<div><div class="n">'+d.emp+'</div><div class="k">Colaboradores</div></div></div>'+
      '<div class="a-coaches">'+coachRows+'</div>'+
      '<div class="a-open">Ver equipo <span aria-hidden="true">→</span></div></article>';
  }
  document.getElementById("areas").innerHTML = Object.keys(NICHES).map(areaCard).join("");

  function coachCard(c,idx){
    var max=c.emps[0][2];
    var emps=c.emps.map(function(e,i){
      return '<div class="emp"><div class="rk">'+(i+1)+'</div><div class="av">'+esc(initials(e[0]))+'</div>'+
        '<div><div class="en">'+esc(e[0])+'</div><div class="eg">'+esc(e[1])+'</div></div>'+
        '<div class="bar"><div class="t"><i style="width:'+Math.round(e[2]/max*100)+'%"></i></div></div>'+
        '<div class="ep">'+e[2]+'</div></div>';
    }).join("");
    return '<article class="coach" data-c="'+idx+'">'+
      '<div class="c-hd"><div class="av">'+esc(c.i)+'</div>'+
      '<div><h3>'+esc(c.n)+'</h3><div class="rl">'+esc(c.r)+'</div></div>'+
      '<span class="rate"><span class="emo">★</span> <b>'+c.rate+'</b></span></div>'+
      '<div class="tiles">'+
      '<div class="tile"><div class="n">'+c.cli+'</div><div class="k">Colaboradores</div></div>'+
      '<div class="tile"><div class="n">'+c.ses+'</div><div class="k">Ses/mes</div></div>'+
      '<div class="tile"><div class="n">'+c.pts+'</div><div class="k">Pts prom.</div></div></div>'+
      '<div class="c-top" role="button" tabindex="0"><span class="medal emo">🏆</span> Top: <b>'+esc(c.top)+'</b>'+
      '<span class="pts">'+c.tpts+' pts</span> <span class="chev" aria-hidden="true">›</span></div>'+
      '<div class="emps"><div class="emps-in">'+emps+'</div></div></article>';
  }

  function openTeam(key){
    root.setAttribute("data-niche",key);
    var d=NICHES[key], cs=COACHES[key];
    document.getElementById("t-eyebrow").textContent="Equipo · "+d.team;
    document.getElementById("t-lead").textContent=cs.length+" coaches acompañando a "+d.emp+" colaboradores.";
    document.getElementById("coaches").innerHTML=cs.map(coachCard).join("");
    show("team");
  }
  function show(v){
    document.getElementById("v-overview").classList.toggle("on",v==="overview");
    document.getElementById("v-team").classList.toggle("on",v==="team");
    window.scrollTo(0,0);
  }

  document.body.addEventListener("click",function(e){
    var area=e.target.closest("[data-go]");
    if(area){ openTeam(area.getAttribute("data-go")); return; }
    if(e.target.closest("#back")){ root.removeAttribute("data-niche"); show("overview"); return; }
    var top=e.target.closest(".c-top");
    if(top){ top.closest(".coach").classList.toggle("open"); return; }
  });
  document.body.addEventListener("keydown",function(e){
    if(e.key!=="Enter" && e.key!==" ") return;
    var area=e.target.closest("[data-go]"); if(area){ e.preventDefault(); openTeam(area.getAttribute("data-go")); return; }
    var top=e.target.closest(".c-top"); if(top){ e.preventDefault(); top.closest(".coach").classList.toggle("open"); }
  });
})();
</script>
</body>
</html>
