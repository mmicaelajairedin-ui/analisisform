<!doctype html>
<html lang="es">
<head>
<script src="pw-observe.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<style>html{color-scheme:light;}</style>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Pathway · Panel de la empresa</title>
<link rel="icon" href="/favicon-app.svg?v=3" type="image/svg+xml">
<meta name="theme-color" content="#2D6A4F">
<link rel="stylesheet" href="pathway-panel.css?v=1">
<style>
  /* ── extra empresa (encima del design system reciclado) ── */
  body{margin:0}
  .cp-scroll{overflow-y:auto;height:100vh;padding:26px 30px 70px}
  .cp-topbar{margin-bottom:22px}
  /* identidad empresa en el sidebar (reusa las clases .cp-side-*) */
  .cp-side-emblem{width:80px;height:80px;border-radius:50%;display:grid;place-items:center;font-family:var(--pw-serif);
    font-size:34px;color:#fff;background:rgba(255,255,255,.14);border:3px solid rgba(255,255,255,.78);margin-bottom:7px}
  /* stat row */
  .st-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
  @media(max-width:820px){.st-row{grid-template-columns:1fr 1fr}}
  .st{background:#fff;border:1px solid var(--pw-border);border-radius:14px;box-shadow:var(--pw-shadow-xs);padding:15px 16px}
  .st .n{font-family:var(--pw-serif);font-weight:500;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
  .st .k{font-size:11.5px;color:var(--pw-text-muted);margin-top:6px}
  /* areas */
  .areas{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  @media(max-width:900px){.areas{grid-template-columns:1fr}}
  .area{background:#fff;border:1px solid var(--pw-border);border-radius:16px;padding:18px 18px 6px;box-shadow:var(--pw-shadow-xs);
    cursor:pointer;transition:transform .16s,box-shadow .22s,border-color .2s;position:relative;overflow:hidden}
  .area::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c2)}
  .area:hover{transform:translateY(-2px);box-shadow:var(--pw-shadow-md);border-color:var(--pw-border-strong)}
  .a-hd{display:flex;align-items:center;gap:11px}
  .a-ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--ct);border:1px solid var(--pw-border)}
  .a-hd h3{font-family:var(--pw-serif);font-weight:500;font-size:19px;margin:0}
  .a-sub{font-size:12px;color:var(--pw-text-muted);margin-top:1px}
  .a-rate{margin-left:auto;font-size:12px;font-weight:600;background:var(--pw-niebla-2);border:1px solid var(--pw-border);border-radius:99px;padding:3px 9px}
  .a-rate b{color:var(--c1)}
  .goal{margin:16px 0 4px}
  .goal .g{display:flex;justify-content:space-between;font-size:12px;color:var(--pw-text-soft);margin-bottom:6px}
  .goal .g b{color:var(--pw-carbon);font-variant-numeric:tabular-nums}
  .trk{height:8px;border-radius:99px;background:var(--pw-niebla-3);overflow:hidden}
  .trk i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--c2),var(--c1))}
  .a-foot{border-top:1px solid var(--pw-border);margin-top:16px;padding:12px 0 8px;display:flex;flex-direction:column;gap:9px}
  .a-coach{display:flex;align-items:center;gap:10px;font-size:12.5px}
  .a-coach .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--c1);background:var(--ct)}
  .a-coach .r{color:var(--pw-text-muted);font-size:11px}
  .a-coach .s{margin-left:auto;color:var(--pw-text-soft)}
  .n-fitness{--c1:#2D6A4F;--c2:#52B788;--ct:rgba(82,183,136,.15)}
  .n-carrera{--c1:#2E7587;--c2:#4FA6BA;--ct:rgba(79,166,186,.16)}
  .n-finanzas{--c1:#B7791F;--c2:#E9C46A;--ct:rgba(233,196,106,.22)}
  /* colaboradores table */
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .fchip{font-size:12.5px;font-weight:600;cursor:pointer;border:1px solid var(--pw-border);background:#fff;color:var(--pw-text-soft);border-radius:99px;padding:6px 12px}
  .fchip.on{background:var(--pw-bosque);color:#fff;border-color:var(--pw-bosque)}
  .tbl{width:100%;border-collapse:collapse;font-size:13.5px}
  .tbl thead th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--pw-text-muted);
    padding:12px 16px;border-bottom:1px solid var(--pw-border);background:var(--pw-niebla-2)}
  .tbl td{padding:12px 16px;border-bottom:1px solid var(--pw-border)}
  .tbl tr:last-child td{border-bottom:none}
  .person{display:flex;align-items:center;gap:10px}
  .person .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--c1);background:var(--ct)}
  .person .em{font-size:11px;color:var(--pw-text-muted)}
  .abadge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--c1);background:var(--ct);border-radius:99px;padding:3px 9px}
  .csel{font-family:var(--pw-sans);font-size:12.5px;background:#fff;border:1px solid var(--pw-border);border-radius:8px;padding:6px 8px;cursor:pointer;max-width:160px}
  .csel.un{border-color:var(--pw-warning,#C99A2E);color:var(--pw-warning,#C99A2E);font-weight:600}
  .prog{display:flex;align-items:center;gap:8px;min-width:110px}
  .prog .t{flex:1;height:6px;border-radius:99px;background:var(--pw-niebla-3);overflow:hidden}
  .prog .t i{display:block;height:100%;background:var(--c2)}
  .prog .v{font-size:12px;font-weight:700;width:32px;text-align:right;font-variant-numeric:tabular-nums}
  .pill{font-size:11px;font-weight:700;border-radius:99px;padding:3px 9px;white-space:nowrap}
  .pill.activo{color:var(--pw-bosque);background:var(--pw-success-bg)}
  .pill.invitado{color:var(--pw-warning,#C99A2E);background:var(--pw-warning-bg)}
  /* config sub-panel reuse */
  .subdom{display:flex;align-items:center;background:#fff;border:1.5px solid var(--pw-border-input);border-radius:10px;overflow:hidden}
  .subdom input{border:none;background:none;padding:11px 13px;font-size:14px;font-family:inherit;flex:1;min-width:0}
  .subdom input:focus{outline:none}.subdom .suf{padding:0 12px;color:var(--pw-text-muted);font-size:13px;white-space:nowrap}
  .swatch{width:44px;height:44px;border-radius:11px;border:1px solid var(--pw-border);padding:0;cursor:pointer;background:none}
  .color-row{display:flex;align-items:center;gap:11px}
  .tgl{position:relative;width:44px;height:25px;border-radius:99px;background:var(--pw-border-strong);border:none;cursor:pointer;transition:.2s;flex:none}
  .tgl::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.2s}
  .tgl.on{background:var(--pw-bosque)}.tgl.on::after{left:22px}
  .rowb{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
  .muted{font-size:12.5px;color:var(--pw-text-soft);margin-top:3px;line-height:1.5}
  .code{background:var(--pw-niebla-3);border-radius:5px;padding:1px 6px;font-size:12px}
  .hr{height:1px;background:var(--pw-border);border:none;margin:2px 0}
  .res-row{display:grid;grid-template-columns:1fr 1.3fr auto;gap:9px;align-items:center}
  .res-x{width:34px;height:38px;border:1px solid var(--pw-border);border-radius:9px;background:#fff;color:var(--pw-danger);cursor:pointer}
  .brand-grid{display:grid;grid-template-columns:1fr 280px;gap:20px}
  @media(max-width:820px){.brand-grid{grid-template-columns:1fr}}
  .portal{border:1px solid var(--pw-border);border-radius:14px;overflow:hidden;box-shadow:var(--pw-shadow-sm)}
  .portal .p-hd{background:var(--brand,#2D6A4F);color:#fff;padding:14px 15px;display:flex;align-items:center;gap:9px;transition:background .3s}
  .portal .p-logo{width:26px;height:26px;border-radius:7px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-family:var(--pw-serif);font-size:14px}
  .portal .p-nm{font-weight:600;font-size:13px}.portal .p-nm small{display:block;opacity:.85;font-size:10px;font-weight:400}
  .portal .p-body{padding:14px}.portal .p-c{border:1px solid var(--pw-border);border-radius:10px;padding:11px;margin-bottom:10px}
  .portal .p-c .t{font-size:12px;font-weight:600;margin-bottom:7px}
  .portal .p-bar{height:8px;border-radius:99px;background:var(--pw-niebla-3);overflow:hidden}
  .portal .p-bar i{display:block;height:100%;width:64%;background:var(--brand,#2D6A4F);border-radius:99px;transition:background .3s}
  .portal .p-btn{display:inline-block;background:var(--brand,#2D6A4F);color:#fff;font-size:12px;font-weight:600;padding:8px 13px;border-radius:8px;transition:background .3s}
  .plan-box{background:var(--pw-niebla-2);border:1px solid var(--pw-border);border-radius:12px;padding:15px 17px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .danger{border:1px solid var(--pw-danger-bg);background:var(--pw-danger-bg);border-radius:12px;padding:15px 17px}
  .cp-link{color:var(--pw-bosque);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:5px;cursor:pointer}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--pw-bosque-dark);color:#fff;font-size:13px;font-weight:600;
    padding:11px 18px;border-radius:12px;box-shadow:var(--pw-shadow-lg);opacity:0;pointer-events:none;transition:.25s;z-index:50}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
  @media(max-width:900px){.cp-scroll{padding:18px 16px 80px}}
</style>
</head>
<body>
<div class="cp-app">
  <!-- ═══ SIDEBAR reciclado del coach — identidad = EMPRESA ═══ -->
  <aside class="cp-side">
    <a href="#" class="cp-side-brand" data-nav="resumen">
      <svg width="24" height="24" viewBox="0 0 100 100" aria-hidden="true"><polygon points="10,82 32,52 54,82" fill="var(--pw-sendero)"/><polygon points="34,82 58,28 82,82" fill="#FAFDF9"/><circle cx="58" cy="22" r="5" fill="#E9C46A"/></svg>
      <span class="cp-side-brand-word">pathway<span style="color:var(--pw-sendero)">.</span></span>
    </a>
    <div class="cp-side-coach">
      <div class="cp-side-emblem" id="emLogo">G</div>
      <div class="cp-side-coach-name">Grupo Vitalis</div>
      <div class="cp-side-coach-role">Plan Bienestar 360 <span class="cp-side-plan">Empresa</span></div>
      <div class="cp-side-medal-info" title="Puntos de bienestar de la empresa">
        <div class="cp-side-medal-info-line">🏆 4.820 puntos</div>
        <div class="cp-side-medal-info-bar"><span style="width:64%"></span></div>
      </div>
    </div>
    <nav class="cp-side-nav cp-nav-app" id="nav">
      <div class="cp-side-nav-wrap"><button class="cp-side-nav-item is-active" data-nav="resumen">
        <span class="cp-side-nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span><span>Resumen</span></button></div>
      <div class="cp-side-nav-wrap"><button class="cp-side-nav-item" data-nav="clientes">
        <span class="cp-side-nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></span><span>Clientes</span></button></div>
      <div class="cp-side-nav-wrap"><button class="cp-side-nav-item" data-nav="config">
        <span class="cp-side-nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span><span>Configuración</span></button></div>
    </nav>
    <div class="cp-side-foot">
      <button class="cp-side-cta" data-nav="clientes"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> Sumar colaborador</button>
    </div>
  </aside>

  <!-- ═══ MAIN ═══ -->
  <main class="cp-main"><div class="cp-scroll" id="scroll"></div></main>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  function esc(s){var d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML;}
  function ini(n){return n.split(" ").map(function(w){return w[0];}).join("").slice(0,2).toUpperCase();}
  function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("on");setTimeout(function(){t.classList.remove("on");},1900);}

  var NICHES={ fitness:{team:"Fitness",ico:"🏋️",rate:"4.8",goal:78,ses:62,emp:34}, carrera:{team:"Carrera",ico:"💼",rate:"4.7",goal:64,ses:41,emp:22}, finanzas:{team:"Finanzas",ico:"💰",rate:"4.9",goal:71,ses:25,emp:12} };
  var COACHES={ fitness:["Martín Aguirre","Lucía Ferreyra"], carrera:["Diego Sosa","Camila Ortiz"], finanzas:["Valentina Ríos"] };
  var COACHMETA={ fitness:[["MA","Martín Aguirre","Entrenador personal",36],["LF","Lucía Ferreyra","Coach de hábitos",26]],
                  carrera:[["DS","Diego Sosa","Coach de carrera",24],["CO","Camila Ortiz","Mentora de liderazgo",17]],
                  finanzas:[["VR","Valentina Ríos","Asesora financiera",25]] };
  var COL=[
    {n:"Andrés Molina",e:"andres.molina@vitalis.com",area:"fitness",coach:"Martín Aguirre",prog:88,estado:"activo"},
    {n:"Marina Vega",e:"marina.vega@vitalis.com",area:"fitness",coach:"Lucía Ferreyra",prog:74,estado:"activo"},
    {n:"Nicolás Paz",e:"nicolas.paz@vitalis.com",area:"fitness",coach:"Martín Aguirre",prog:41,estado:"activo"},
    {n:"Bruno Salas",e:"bruno.salas@vitalis.com",area:"carrera",coach:"Diego Sosa",prog:66,estado:"activo"},
    {n:"Valeria Gómez",e:"valeria.gomez@vitalis.com",area:"carrera",coach:"Camila Ortiz",prog:59,estado:"activo"},
    {n:"Tomás Ruiz",e:"tomas.ruiz@vitalis.com",area:"carrera",coach:"",prog:0,estado:"invitado"},
    {n:"Clara Ledesma",e:"clara.ledesma@vitalis.com",area:"finanzas",coach:"Valentina Ríos",prog:80,estado:"activo"},
    {n:"Mateo Vidal",e:"mateo.vidal@vitalis.com",area:"finanzas",coach:"Valentina Ríos",prog:33,estado:"activo"}
  ];
  var RES=[{t:"Guía de onboarding de bienestar",u:"https://…/onboarding.pdf"},{t:"Política de días de bienestar",u:"https://…/politica.pdf"}];
  var BRAND={color:"#2D6A4F",nombre:"Bienestar Vitalis",sub:"vitalis"};
  var sec="resumen", filter="todas";

  // ── RESUMEN (áreas) ──
  function topbar(h,s){ return "<header class='cp-topbar'><div><h1 class='cp-h1'>"+h+"<span class='dot'>.</span></h1><div class='cp-sub'>"+s+"</div></div></header>"; }
  function vResumen(){
    var cols=COL.length, coaches=5, obj=71;
    var stats="<div class='st-row'>"+
      "<div class='st'><div class='n'>3</div><div class='k'>Áreas de bienestar</div></div>"+
      "<div class='st'><div class='n'>"+coaches+"</div><div class='k'>Coaches</div></div>"+
      "<div class='st'><div class='n'>"+cols+"</div><div class='k'>Colaboradores</div></div>"+
      "<div class='st'><div class='n'>"+obj+"%</div><div class='k'>Objetivos cumplidos</div></div></div>";
    var cards=Object.keys(NICHES).map(function(k){
      var d=NICHES[k];
      var coachRows=COACHMETA[k].map(function(c){
        return "<div class='a-coach'><div class='av'>"+c[0]+"</div><div><div style='font-weight:600'>"+esc(c[1])+"</div><div class='r'>"+esc(c[2])+"</div></div><div class='s'>"+c[3]+" ses/mes</div></div>";
      }).join("");
      return "<div class='area n-"+k+"' data-area='"+k+"'>"+
        "<div class='a-hd'><div class='a-ico'>"+d.ico+"</div><div><h3>"+d.team+"</h3><div class='a-sub'>"+COACHMETA[k].length+" coaches · "+d.emp+" colaboradores</div></div><span class='a-rate'>★ <b>"+d.rate+"</b></span></div>"+
        "<div class='goal'><div class='g'><span>Objetivos cumplidos</span><b>"+d.goal+"%</b></div><div class='trk'><i style='width:"+d.goal+"%'></i></div></div>"+
        "<div class='a-foot'>"+coachRows+"</div></div>";
    }).join("");
    return topbar("Resumen","Cómo va el bienestar de tu equipo, por área.")+stats+"<div class='areas'>"+cards+"</div>";
  }

  // ── CLIENTES (colaboradores) ──
  function vClientes(){
    var chips="<div class='chips'>"+["todas","fitness","carrera","finanzas"].map(function(f){
      return "<button class='fchip"+(filter===f?" on":"")+"' data-f='"+f+"'>"+(f==="todas"?"Todas las áreas":NICHES[f].team)+"</button>";
    }).join("")+"</div>";
    var shown=COL.map(function(r,i){return {r:r,i:i};}).filter(function(o){return filter==="todas"||o.r.area===filter;});
    var rows=shown.map(function(o){
      var r=o.r, d=NICHES[r.area];
      var opts="<option value=''>Sin asignar</option>"+COACHES[r.area].map(function(c){return "<option"+(c===r.coach?" selected":"")+">"+esc(c)+"</option>";}).join("");
      var prog=r.estado==="invitado"?"<span style='color:var(--pw-text-muted);font-size:12px'>Pendiente</span>"
        :"<div class='prog'><div class='t'><i style='width:"+r.prog+"%'></i></div><div class='v'>"+r.prog+"%</div></div>";
      return "<tr class='n-"+r.area+"'><td><div class='person'><div class='av'>"+ini(r.n)+"</div><div><div style='font-weight:600'>"+esc(r.n)+"</div><div class='em'>"+esc(r.e)+"</div></div></div></td>"+
        "<td><span class='abadge'>"+d.ico+" "+d.team+"</span></td>"+
        "<td><select class='csel"+(r.coach?"":" un")+"' data-assign='"+o.i+"'>"+opts+"</select></td>"+
        "<td>"+prog+"</td><td><span class='pill "+r.estado+"'>"+(r.estado==="activo"?"Activo":"Invitado")+"</span></td></tr>";
    }).join("");
    return topbar("Colaboradores","Sumá gente, asignales coach por área y seguí su progreso.")+
      "<div style='display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap'>"+chips+
        "<button class='cp-btn cp-btn-primary' data-add>+ Agregar colaborador</button></div>"+
      "<div class='cp-card'><table class='tbl'><thead><tr><th>Colaborador</th><th>Área</th><th>Coach asignado</th><th>Progreso</th><th>Estado</th></tr></thead><tbody>"+rows+"</tbody></table>"+
      (shown.length?"":"<div style='padding:26px;text-align:center;color:var(--pw-text-muted);font-size:13px'>No hay colaboradores en esta área.</div>")+"</div>";
  }

  // ── CONFIGURACIÓN (Perfil · Recursos · Marca propia · Mi cuenta) ──
  var cfg="perfil";
  function vConfig(){
    var navItems=[["perfil","Perfil"],["recursos","Recursos"],["marca","Marca propia"],["cuenta","Mi cuenta"]];
    var nav=navItems.map(function(s){return "<button class='cp-cfg-nav-item "+(cfg===s[0]?"is-on":"")+"' data-cfg='"+s[0]+"'><span>"+s[1]+"</span></button>";}).join("");
    return topbar("Configuración","El perfil de tu empresa, recursos, marca e integraciones.")+
      "<div class='cp-cfg-layout'><nav class='cp-cfg-nav'>"+nav+"</nav><div class='cp-cfg-panel'>"+cfgBody()+"</div></div>";
  }
  function cfgBody(){
    if(cfg==="recursos"){
      var rows=RES.map(function(r,i){return "<div class='res-row' data-r='"+i+"'><input class='cp-form-input' data-f='t' value='"+esc(r.t)+"'><input class='cp-form-input' data-f='u' value='"+esc(r.u)+"'><button class='res-x' data-del='"+i+"'>✕</button></div>";}).join("");
      return "<div class='cp-card'><div class='cp-card-hd'><h3 class='cp-card-title'>Recursos del portal<span class='dot'>.</span></h3></div><div style='padding:20px' class='cp-form-stack'>"+
        "<p class='muted' style='margin:0'>Aparecen en la sección <strong>Recursos</strong> del portal de tus colaboradores.</p>"+rows+
        "<div style='display:flex;gap:10px;margin-top:6px'><button class='cp-btn cp-btn-ghost' data-addres>+ Agregar recurso</button><button class='cp-btn cp-btn-primary' data-save>Guardar recursos</button></div></div></div>";
    }
    if(cfg==="marca"){
      return "<div class='cp-card'><div class='cp-card-hd'><h3 class='cp-card-title'>Marca propia<span class='dot'>.</span></h3><span class='pill activo'>Incluida en Empresas</span></div>"+
        "<div style='padding:20px'><div class='brand-grid'><div class='cp-form-stack'>"+
          "<div class='cp-form-row'><label class='cp-form-label'>Nombre visible</label><input class='cp-form-input' id='bNombre' value='"+esc(BRAND.nombre)+"'></div>"+
          "<div class='cp-form-row'><label class='cp-form-label'>Color de marca</label><div class='color-row'><input type='color' class='swatch' id='bColor' value='"+BRAND.color+"'><input class='cp-form-input' id='bHex' style='max-width:120px' value='"+BRAND.color.toUpperCase()+"'></div></div>"+
          "<div class='cp-form-row'><label class='cp-form-label'>Subdominio propio</label><div class='subdom'><input id='bSub' value='"+esc(BRAND.sub)+"'><span class='suf'>.pathwaycareercoach.com</span></div></div>"+
          "<div><button class='cp-btn cp-btn-primary' data-savebrand>Guardar marca</button></div>"+
          "<p class='cp-form-hint' style='margin:0'>Se aplica a todos los coaches y colaboradores de la empresa.</p></div>"+
          "<div><div class='cp-form-hint' style='margin-bottom:7px'>Así lo ve tu gente</div><div class='portal'><div class='p-hd'><div class='p-logo'>G</div><div class='p-nm' id='pvN'>"+esc(BRAND.nombre)+"<small>Tu espacio de bienestar</small></div></div><div class='p-body'><div class='p-c'><div class='t'>Plan de la semana</div><div class='p-bar'><i></i></div></div><div class='p-c'><div class='t'>Próxima sesión</div><span class='p-btn'>Agendar</span></div></div></div></div>"+
        "</div></div></div>";
    }
    if(cfg==="cuenta"){
      return "<div class='cp-card'><div class='cp-card-hd'><h3 class='cp-card-title'>Mi cuenta<span class='dot'>.</span></h3></div><div style='padding:20px' class='cp-form-stack'>"+
        "<div class='cp-form-row'><label class='cp-form-label'>Email de acceso</label><input class='cp-form-input' value='sofia@vitalis.com' readonly></div>"+
        "<div class='cp-form-row-2'><div class='cp-form-row'><label class='cp-form-label'>Nueva contraseña</label><input class='cp-form-input' type='password' placeholder='••••••••'></div><div class='cp-form-row'><label class='cp-form-label'>Repetir</label><input class='cp-form-input' type='password' placeholder='••••••••'></div></div>"+
        "<div><button class='cp-btn cp-btn-ghost' data-save>Cambiar contraseña</button></div><hr class='hr'>"+
        "<div><div class='cp-form-label' style='margin-bottom:8px'>Plan</div><div class='plan-box'><span class='pill activo'>Bienestar 360</span><span class='muted' style='margin:0'>Hasta 6 coaches · 80 colaboradores · 3 áreas</span><button class='cp-btn cp-btn-ghost' style='margin-left:auto'>Gestionar plan</button></div></div><hr class='hr'>"+
        "<div class='rowb'><div><div style='font-weight:600;font-size:14px'>Notificaciones push</div><div class='muted'>Avisos cuando un coach o colaborador te escribe.</div></div><button class='tgl on' data-tgl></button></div><hr class='hr'>"+
        "<div class='danger'><div style='font-weight:600;font-size:14px;color:var(--pw-danger)'>Zona de peligro</div><div class='muted'>Cerrar sesión o eliminar la cuenta.</div><div style='display:flex;gap:10px;margin-top:11px'><button class='cp-btn cp-btn-ghost'>Cerrar sesión</button><button class='cp-btn cp-btn-ghost' style='color:var(--pw-danger)'>Eliminar cuenta</button></div></div></div></div>";
    }
    // perfil
    return "<div class='cp-card'><div class='cp-card-hd'><h3 class='cp-card-title'>Perfil de la empresa<span class='dot'>.</span></h3><span class='cp-link'>Ver página pública ↗</span></div><div style='padding:20px' class='cp-form-stack'>"+
      "<div class='rowb'><div><div style='font-weight:600;font-size:14px'>Página pública de la empresa</div><div class='muted'>Aparece en <span class='code'>pathwaycareercoach.com/empresa/vitalis</span> y en el directorio.</div></div><button class='tgl on' data-tgl></button></div><hr class='hr'>"+
      "<div class='cp-form-row'><label class='cp-form-label'>Nombre de la empresa</label><input class='cp-form-input' value='Grupo Vitalis'></div>"+
      "<div class='cp-form-row'><label class='cp-form-label'>URL pública (slug)</label><input class='cp-form-input' value='vitalis'><span class='cp-form-hint'>Tu link: <span class='code'>pathwaycareercoach.com/empresa/vitalis</span></span></div>"+
      "<div class='cp-form-row-2'><div class='cp-form-row'><label class='cp-form-label'>Rubro</label><input class='cp-form-input' value='Tecnología · 68 personas'></div><div class='cp-form-row'><label class='cp-form-label'>Responsable</label><input class='cp-form-input' value='Sofía Núñez'></div></div>"+
      "<div class='cp-form-row'><label class='cp-form-label'>Descripción</label><textarea class='cp-form-textarea' rows='3' placeholder='Breve descripción de tu programa de bienestar…'></textarea><span class='cp-form-hint'>Aparece en tu página pública.</span></div>"+
      "<div><button class='cp-btn cp-btn-primary' data-save>Guardar cambios</button></div></div></div>";
  }

  var VIEWS={resumen:vResumen,clientes:vClientes,config:vConfig};
  function render(){
    document.getElementById("scroll").innerHTML=(VIEWS[sec]||vResumen)();
    if(sec==="config"&&cfg==="marca") wireMarca();
  }
  function wireMarca(){
    var color=document.getElementById("bColor"),hex=document.getElementById("bHex"),scroll=document.getElementById("scroll");
    scroll.style.setProperty("--brand",BRAND.color);
    function set(c){if(!/^#[0-9a-fA-F]{6}$/.test(c))return;BRAND.color=c;scroll.style.setProperty("--brand",c);color.value=c;hex.value=c.toUpperCase();}
    color.addEventListener("input",function(){set(color.value);});
    hex.addEventListener("input",function(){set(hex.value.trim());});
    document.getElementById("bNombre").addEventListener("input",function(){BRAND.nombre=this.value||"Tu empresa";document.getElementById("pvN").innerHTML=esc(BRAND.nombre)+"<small>Tu espacio de bienestar</small>";});
    document.getElementById("bSub").addEventListener("input",function(){BRAND.sub=this.value;});
  }

  // nav (sidebar)
  document.querySelectorAll("[data-nav]").forEach(function(el){
    el.addEventListener("click",function(e){
      e.preventDefault(); sec=el.getAttribute("data-nav");
      document.querySelectorAll(".cp-side-nav-item").forEach(function(x){x.classList.toggle("is-active",x.getAttribute("data-nav")===sec);});
      render();
    });
  });

  // delegated interactions in content
  document.getElementById("scroll").addEventListener("click",function(e){
    var area=e.target.closest("[data-area]"); if(area){ filter=area.getAttribute("data-area"); sec="clientes";
      document.querySelectorAll(".cp-side-nav-item").forEach(function(x){x.classList.toggle("is-active",x.getAttribute("data-nav")==="clientes");}); render(); return; }
    var cf=e.target.closest("[data-cfg]"); if(cf){ cfg=cf.getAttribute("data-cfg"); render(); return; }
    var fc=e.target.closest("[data-f]"); if(fc){ filter=fc.getAttribute("data-f"); render(); return; }
    if(e.target.closest("[data-add]")){ toast("Formulario de alta (demo)"); return; }
    if(e.target.closest("[data-save]")){ toast("Configuración guardada ✓"); return; }
    if(e.target.closest("[data-savebrand]")){ toast("Marca guardada ✓ — se aplica a todos"); return; }
    var del=e.target.closest("[data-del]"); if(del){ RES.splice(+del.getAttribute("data-del"),1); render(); return; }
    if(e.target.closest("[data-addres]")){ readRes(); RES.push({t:"",u:""}); render(); return; }
    var tg=e.target.closest("[data-tgl]"); if(tg){ tg.classList.toggle("on"); return; }
  });
  document.getElementById("scroll").addEventListener("change",function(e){
    var s=e.target.closest("[data-assign]"); if(!s) return;
    var i=+s.getAttribute("data-assign"); COL[i].coach=s.value;
    if(s.value&&COL[i].estado==="activo"&&COL[i].prog===0) COL[i].prog=5;
    toast(s.value?("Coach asignado: "+s.value):"Sin asignar"); render();
  });
  function readRes(){ document.querySelectorAll(".res-row").forEach(function(row){var i=+row.getAttribute("data-r"); if(RES[i]){RES[i].t=row.querySelector("[data-f=t]").value;RES[i].u=row.querySelector("[data-f=u]").value;}}); }

  render();
})();
</script>
</body>
</html>
